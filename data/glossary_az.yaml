  batch_processing: "batch processing (paket emalı)"
  stream_processing: "stream processing / event streaming (axın emalı)"
  idempotency: "idempotency / idempotent (təkrar icrada eyni nəticə verən)"
  oltp: "OLTP (Online Transaction Processing)"
  olap: "OLAP (Online Analytical Processing)"
  dwh: "Data Warehouse (DWH)"
  data_lake: "Data Lake"
  data_lakehouse: "Data Lakehouse"
  star_schema: "Star schema (Star sxemi)"
  snowflake_schema: "Snowflake schema (Snowflake sxemi)"
  fact_table: "Fact table (Fakt cədvəli)"
  dimension_table: "Dimension table (Ölçü cədvəli)"
  grain: "Grain (detallıq səviyyəsi)"
  scd: "Slowly Changing Dimensions (SCD Type 0, 1, 2, 3)"
  medallion_architecture: "Medallion Architecture (Bronze, Silver, Gold qatları)"
  etl_elt: "ETL / ELT (Extract, Transform, Load)"
  schema_on_write: "schema-on-write"
  schema_on_read: "schema-on-read"
  columnar_storage: "columnar storage (sütunlu saxlanc)"
  column_pruning: "Column Pruning (lazımsız sütunların oxunmaması)"
  predicate_pushdown: "Predicate Pushdown (filtrin saxlanc səviyyəsinə endirilməsi)"
  partitioning: "Partitioning / Partition"
  bucketing: "Bucketing (Hash Bucketing)"
  z_order: "Z-Order (Z-Ordering)"
  data_skipping: "Data Skipping"
  open_table_formats: "Delta Lake / Apache Iceberg / Apache Hudi"
  acid: "ACID tranzaksiyaları"
  time_travel: "Time Travel"
  data_lineage: "Data Lineage"
  data_governance: "Data Governance"
  cdc: "Change Data Capture (CDC)"

  # --- SQL & Python ---
  window_functions: "Window Functions (OVER, PARTITION BY, ROW_NUMBER, RANK, DENSE_RANK, LAG, LEAD)"
  cte: "CTE (Common Table Expression — WITH bloku)"
  subquery: "Subquery (alt sorğu)"
  coalesce_nullif: "COALESCE / NULLIF / CASE WHEN"
  mutable_default_argument: "Mutable Default Argument tələsi"
  comprehensions: "List / Dict Comprehension"
  generator: "Generator (yield)"
  context_manager: "Context Manager (with bloku)"
  dlq: "Dead-Letter Queue (DLQ)"

  # --- Apache Spark ---
  spark_components: "Driver, Executor, Worker, Cluster Manager"
  dag: "DAG (Directed Acyclic Graph)"
  lazy_evaluation: "Lazy Evaluation (icranın action çağırılana qədər təxirə salınması)"
  transformations_actions: "Narrow / Wide Transformation və Action"
  shuffle: "Shuffle (executor-lar arası şəbəkə üzərindən data mübadiləsi)"
  broadcast_join: "Broadcast Hash Join (BHJ)"
  sort_merge_join: "Sort Merge Join (SMJ)"
  repartition_coalesce: "repartition() və coalesce()"
  cache_persist: "cache() və persist()"
  oom: "Out Of Memory (OOM)"
  data_skew: "Data Skew (datanın partisiya/açar üzrə qeyri-bərabər paylanması)"
  key_salting: "Key Salting"
  catalyst_tungsten: "Catalyst Optimizer və Tungsten"

  # --- Apache Kafka ---
  kafka_core: "Broker, Topic, Partition, Offset, Commit Log"
  kraft: "KRaft (Kafka Raft metadata rejimi)"
  zero_copy: "Zero-Copy"
  producer_consumer: "Producer, Consumer, Consumer Group, Partitioner"
  acks: "acks (acks=0, acks=1, acks=all / -1)"
  isr: "ISR (In-Sync Replicas), Leader və Follower Replica"
  rebalance: "Consumer Rebalance (Cooperative Sticky / Eager)"
  offset_commit: "Offset Commit (auto-commit vs manual commit)"
  delivery_semantics: "Delivery Semantics (At-Most-Once, At-Least-Once, Exactly-Once / EOS)"
  log_compaction: "Log Compaction və Tombstone"
  consumer_lag: "Consumer Lag"

  # --- Apache Airflow ---
  airflow_components: "API Server (Webserver), Scheduler, Worker, Executor, Metadata DB"
  operators_tasks: "Operator, Task, Sensor, Hook, Connection"
  taskflow_api: "TaskFlow API (@dag, @task)"
  xcom: "XCom (Cross-Communication)"
  logical_date: "logical_date və Data Interval"
  catchup_backfill: "Catchup və Backfill"
  branching_trigger_rules: "Branching (@task.branch) və Trigger Rules"
  deferrable_operators: "Deferrable Operators və Sensor Modes (poke vs reschedule)"
  dynamic_task_mapping: "Dynamic Task Mapping (.expand(), .partial())"
  task_group_pool: "TaskGroup və Pool"
  sla_callbacks: "SLA və Callbacks (on_failure_callback)"

  # --- dbt & DevOps ---
  dbt_layers: "Staging (stg_), Intermediate (int_), Marts (fct_, dim_)"
  materializations: "Materializations (view, table, incremental, ephemeral)"
  dbt_features: "ref(), source(), dbt snapshot, dbt seed, generic/singular tests"
  docker_core: "Container, Docker image, Dockerfile, Layer, Multi-Stage Build"
  docker_storage_net: "Named Volume, Bind Mount, Custom Bridge Network, Service Discovery, Docker Compose"
  cicd_k8s: "CI/CD Pipeline, GitHub Actions, Kubernetes Pod / Deployment"

