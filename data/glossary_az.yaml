# ==============================================================================
# Data Engineering Platforması — Azərbaycan Dili Terminologiya və Orfoqrafiya Standartı
# ==============================================================================
# QAYDA:
# 1. Tərcümə edildikdə mənası dəyişən, süni səslənən və ya real müsahibələrdə
#    ingiliscə soruşulan terminlər ingilis dilində saxlanılır (`keep_english`).
#    İlk istifadədə mötərizədə qısa izah verilə bilər.
# 2. Azərbaycan dilində təbii və dəqiq qarşılığı olan ümumi anlayışlar `terms`
#    bölməsindəki kimi işlədilir.
# 3. `forbidden_literal_translations` bölməsindəki hərfi tərcümələrin və
#    orfoqrafik səhvlərin istifadəsi qəti qadağandır.
# ==============================================================================

terms:
  database: "Verilənlər Bazası"
  query: "Sorğu"
  schema: "Sxem"
  table: "Cədvəl"
  row: "Sətir"
  column: "Sütun"
  primary_key: "İlkin Açar (Primary Key)"
  foreign_key: "Xarici Açar (Foreign Key)"
  index: "İndeks"
  aggregation: "Aqreqasiya"
  join: "Birləşdirmə (JOIN)"
  memory_management: "Yaddaşın İdarə Edilməsi"
  query_optimization: "Sorğunun Optimallaşdırılması"
  error_handling: "Xətaların İdarə Edilməsi"
  concurrency: "Paralellik (Concurrency)"
  latency: "Gecikmə (Latency)"
  throughput: "Buraxılış Qabiliyyəti (Throughput)"
  compression: "Sıxılma (Compression)"
  replication: "Replikasiya"
  orchestration: "Orkestrasiya"
  fault_tolerance: "Xətalara Davamlılıq (Fault Tolerance)"
  scalability: "Miqyaslanma (Scalability)"
  deduplication: "Dublikatların Təmizlənməsi (Deduplication)"
  serialization: "Serializasiya"
  encryption: "Şifrələmə"
  authentication: "Autentifikasiya"
  authorization: "Avtorizasiya"

keep_english:
