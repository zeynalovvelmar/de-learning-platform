  "ulduz sxemi": "Star schema (Star sxemi)"
  "yavaş dəyişən ölçülər": "Slowly Changing Dimensions (SCD)"
  "tənbəl hesablama": "Lazy Evaluation"
  "məlumat əyriliyi": "Data Skew"
  "çatdırılma semantikası": "Delivery Semantics"
  "dinamik task xəritələnməsi / tapşırıq xəritələnməsi": "Dynamic Task Mapping"
  "pəncərə funksiyaları": "Window Functions"
  "səbət / səbətləmə": "Bucketing (Hash Bucketing)"
  "icraçılar / işçilər": "Executors / Workers"
  "axın şini": "Event Streaming / Streaming Platform"
  "imic / imiclər": "Docker image / image-lər"
  "laylar": "layer-lər (və ya qatlar)"
