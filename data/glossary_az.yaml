    DAG: "DAG-ın, DAG-da, DAG-lar"
    API: "API-nin, API-dən, API-yə"
    XCom: "XCom-un, XCom-da"
    pipeline: "pipeline-ın, pipeline-da, pipeline-lar"
    partition: "partition-ın, partition-da, partition-lar"
