what_it_does:
  en: "Demonstrates Exactly-Once Semantics (EOS) using Kafka Transactional Producers, explaining two-phase commit and transactional abort handling."
  az: "Kafka Transactional Producer vasitəsilə Exactly-Once (EOS) modelini, iki-fazalı tranzaksiyanı və xəta zamanı abort mexanizmini nümayiş etdirir."
real_world_use:
  en: "Kafka Streams, Flink, and Spark Structured Streaming engines use transactional producers under the hood to achieve end-to-end exactly-once stream transformations."
  az: "Kafka Streams, Apache Flink və Spark Structured Streaming mühərrikləri axın emalında dəqiq bir dəfə (EOS) nəticə almaq üçün bu mexanizmdən istifadə edirlər."
common_mistakes:
  en: |
    - **Consuming without `isolation.level = 'read_committed'`**: Transactional consumers default to `read_uncommitted`, meaning they will read aborted/rolled-back transactions! Always set `isolation.level = 'read_committed'`.
    - **Assuming Kafka transactions extend to external relational databases**: Kafka transactions cannot commit PostgreSQL rows. Use idempotent DB upserts instead.
    - **Setting static `transactional.id` across multiple concurrent worker instances**: Each concurrent producer must have a unique `transactional.id` (e.g. `tx-worker-1`, `tx-worker-2`).
  az: |
    - **İstehlakçıda `isolation.level = 'read_committed'` təyin etməyi unutmaq**: Susmaya görə consumer-lər hələ ləğv edilmiş (abort olmuş) tranzaksiyaları da oxuyur! Tranzaksiyalı sistemlərdə mütləq `read_committed` qoyulmalıdır.
    - **Kafkanın tranzaksiyasının xarici bazaları da əhatə etdiyini zənn etmək**: Kafkanın commit-i PostgreSQL sətirlərini idarə edə bilməz. Bunun üçün idempotent açarlar tətbiq edilməlidir.
    - **Eyni anda işləyən bir neçə producer-ə eyni `transactional.id` vermək**: Bir-birini qovacaqlar (fencing); hər bir işçinin unikal id-si olmalıdır (`worker-1-tx`, `worker-2-tx`).
interview_question:
  question:
    en: "What are the three message delivery semantics in Apache Kafka, how is Exactly-Once Semantics (EOS) achieved, and why is 'At-Least-Once + Idempotent Consumer' widely preferred in enterprise data engineering?"
    az: "Apache Kafka-da üç əsas çatdırılma semantikası hansılardır, Exactly-Once (EOS) necə əldə edilir və nə üçün real data mühəndisliyində 'At-Least-Once + İdempotent İstehlakçı' modeli üstün tutulur?"
  answer:
    en: |
      1. **The Three Semantics**:
         - **At-Most-Once**: The consumer commits the offset *before* persisting data to the sink. If processing crashes, the offset is already advanced; the message is **lost forever**, but **never duplicated**.
         - **At-Least-Once**: The consumer commits the offset *after* persisting data to the sink. If the consumer crashes after writing to the DB but before committing to Kafka, the message is re-read on restart. **Zero data loss**, but risks **duplicated writes**.
         - **Exactly-Once (EOS)**: Guarantees every record impacts the destination state exactly once with **zero loss and zero duplicates**.
      2. **How Kafka Achieves EOS**:
         - Within Kafka-to-Kafka pipelines (`consume-transform-produce`), EOS is achieved using **Transactional Producers** (`transactional.id`, `init_transactions`, `begin_transaction`, `commit_transaction`).
         - Offsets committed to `__consumer_offsets` and output records are committed inside a unified atomic Two-Phase Commit transaction. Downstream consumers configure `isolation.level = 'read_committed'`.
      3. **Why 'At-Least-Once + Idempotent Consumer' Dominates Real Architectures**:
         - In 90% of Data Engineering, the target sink is **external** (PostgreSQL, Snowflake, Delta Lake, S3). Kafka's two-phase commit cannot span external databases without heavy distributed XA transaction locks.
         - By configuring **At-Least-Once** in Kafka and implementing **Idempotent Upserts** (`INSERT ... ON CONFLICT DO UPDATE`, or deduplicating by Primary Key in Spark/Delta Lake), the pipeline guarantees zero loss, while the database naturally discards duplicate replays. This achieves the business effect of Exactly-Once with maximum throughput and zero distributed locking overhead.
    az: |
      1. **Üç Çatdırılma Semantikası**:
         - **At-Most-Once (Ən çoxu bir dəfə)**: İstehlakçı offset-i məlumatı bazaya yazmazdan *əvvəl* commit edir. Proqram çöksə, offset irəli getdiyi üçün mesaj **birdəfəlik itir**, amma **heç vaxt dublikat olmur**.
         - **At-Least-Once (Ən azı bir dəfə)**: İstehlakçı offset-i məlumatı bazaya uğurla yazdıqdan *sonra* commit edir. Əgər bazaya yazandan sonra, amma Kafkaya commit etməmiş çöküş baş versə, mesaj təkrar oxunur. **Data itkisi sıfırdır**, amma **dublikat riski yaranır**.
         - **Exactly-Once (Dəqiq bir dəfə)**: Mesajın həm itməməsinə, həm də heç vaxt dublikat olmamasına zəmanət verir.
      2. **Kafkada EOS Necə Əldə Edilir?**:
         - Kafka daxilində axın emalında (`consume-transform-produce`) EOS **Transactional Producer** (`transactional.id`) vasitəsilə əldə edilir.
         - Çıxış mesajları və `__consumer_offsets`-ə yazılan əlfəcin İki-Fazalı Atomar Tranzaksiya ilə təsdiqlənir. İstehlakçılar isə `isolation.level = 'read_committed'` ilə yalnız təsdiqlənmişləri oxuyurlar.
      3. **Niyə 'At-Least-Once + İdempotent İstehlakçı' Ən Populyardır?**:
         - Data mühəndisliyində məlumatlar ən çox **kənar bazalara** (PostgreSQL, Snowflake, Delta Lake) yazılır. Kafkanın daxili tranzaksiyası kənar bazaları əhatə edə bilməz.
         - Buna görə də kəmərdə **At-Least-Once** təmin edilir (itki olmasın deyə), bazada isə **İdempotent Yazılma** (məs. `ON CONFLICT DO UPDATE` və ya Spark-da `MERGE INTO`) tətbiq olunur. Nəticədə şəbəkə xətasında təkrar gələn mesaj baza tərəfindən rədd edilir və heç bir ağır tranzaksiya kilitləri olmadan təbii yolla Exactly-Once nəticəsi alınır.
  interviewer_tips:
    en: "Senior candidates separate Kafka-to-Kafka EOS (transactional coordinator) from Kafka-to-External-Sink EOS. Clearly explain how 'At-Least-Once + Idempotent Upserts' achieves effective exactly-once processing in DWH/Lakehouse pipelines."
    az: "Müsahibədə senior səviyyə göstərmək üçün Kafka daxili EOS (Tranzaksiyalar) ilə Kənar Baza EOS fərqini ayırın və 'At-Least-Once + Idempotent Upsert' kombinasiyasının DWH və Lakehouse layihələrində niyə ən optimal seçim olduğunu əsaslandırın."
flashcards:
  - front:
      en: "What is At-Most-Once delivery and when does data loss occur?"
      az: "At-Most-Once çatdırılma nədir və data itkisi nə vaxt baş verir?"
    back:
      en: "Offsets are committed before processing; if the consumer crashes mid-process, the unhandled record is lost forever."
      az: "Offset məlumat emal edilməzdən əvvəl commit olunur; əgər emal zamanı çöküş olsa, həmin mesaj birdəfəlik itir."
  - front:
      en: "Why is At-Least-Once delivery the industry default in Data Engineering?"
      az: "Data Mühəndisliyində nə üçün At-Least-Once çatdırılma sənaye standartı hesab edilir?"
    back:
      en: "It guarantees zero data loss by committing offsets only after successful downstream persistence."
      az: "Offset-i yalnız məlumat hədəf anbara uğurla yazıldıqdan sonra commit edərək sıfır data itkisinə zəmanət verdiyi üçün."
  - front:
      en: "What configuration enables Transactional Exactly-Once publishing on a producer?"
      az: "Producer-də Tranzaksiyalı Exactly-Once nəşrini hansı parametr aktivləşdirir?"
    back:
      en: "Configuring a unique `transactional.id` alongside `enable.idempotence=true`."
      az: "Unikal `transactional.id` parametrini `enable.idempotence=true` ilə birlikdə təyin etmək."
  - front:
      en: "What isolation level must consumers configure to ignore aborted/rolled-back transactions?"
      az: "Ləğv edilmiş (abort olmuş) tranzaksiyaları oxumamaq üçün istehlakçı hansı izolyasiya səviyyəsini seçməlidir?"
    back:
      en: "`isolation.level = 'read_committed'` (the default is `read_uncommitted`)."
      az: "`isolation.level = 'read_committed'` (susmaya görə `read_uncommitted` olur)."
  - front:
      en: "How do you achieve Exactly-Once semantics when writing to external databases (e.g. Postgres, Snowflake)?"
      az: "Kənar bazalara (Postgres, Snowflake) yazarkən Exactly-Once semantikasını necə əldə edirsiniz?"
    back:
      en: "Combine At-Least-Once consumption with an Idempotent Consumer (e.g. SQL UPSERT or deduplication by Primary Key)."
      az: "At-Least-Once oxumanı İdempotent İstehlakçı (məsələn SQL UPSERT və ya Əsas Açar üzrə deduplikasiya) ilə birləşdirməklə."
