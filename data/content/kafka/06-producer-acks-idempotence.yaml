what_it_does:
  en: "Configures enterprise-grade producer reliability, showing how to eliminate data loss and prevent duplicate records caused by transient network timeouts."
  az: "İstehsalat səviyyəsində etibarlı producer qurur, data itkisinin qarşısını almaq və şəbəkə fasilələrində dublikatların yaranmasını önləmək yollarını göstərir."
real_world_use:
  en: "Standard configuration in banking, stock trading, and transactional billing where a single lost or duplicated event represents catastrophic financial discrepancies."
  az: "Bank, ödəniş sistemləri və birja platformalarında hər bir hadisənin dəqiq bir dəfə çatdırılması və heç vaxt itməməsi üçün tətbiq olunur."
common_mistakes:
  en: |
    - **Using `acks=all` with `min.insync.replicas=1`**: Defeats the purpose of `acks=all`. If 2 replicas crash, Kafka still acknowledges writes with only 1 surviving broker!
    - **Setting `min.insync.replicas` equal to `replication.factor` (e.g. 3 out of 3)**: If a single broker reboots for maintenance, the entire topic stops accepting ANY new writes, causing a total outage! Keep it at `RF - 1` (e.g. RF=3, min.isr=2).
    - **Disabling idempotence to save trivial CPU cycles**: Risks severe data duplication during normal network jitter.
  az: |
    - **`acks=all` ilə yanaşı `min.insync.replicas=1` saxlamaq**: `acks=all`-ın mənasını itirir. İki replika sönsə belə, Kafka təkcə 1 brokerlə təsdiq verəcək və data itə bilər!
    - **`min.insync.replicas`-ı `replication.factor`-a bərabər etmək (məs. 3-dən 3)**: Tək bir broker profilaktikaya getsə, bütün topic yeni mesaj qəbulunu dərhal dayandıracaq və sistem iflic olacaq! Həmişə `RF - 1` (RF=3 olduqda min.isr=2) qoyulmalıdır.
    - **Cüzi CPU qənaəti üçün idempotentliyi söndürmək**: Şəbəkənin adi titrəməsində məlumatların təkrarlanmasına və dublikatlara yol açır.
interview_question:
  question:
    en: "Does setting `acks=all` alone guarantee zero data loss in Kafka? How do `min.insync.replicas` and `enable.idempotence` interact to provide enterprise-grade durability?"
    az: "Yalnız `acks=all` təyin etmək Kafkada sıfır data itkisinə təkbaşına zəmanət verirmi? `min.insync.replicas` və `enable.idempotence` parametrləri bu zəmanəti necə tamamlayır?"
  answer:
    en: |
      1. **The `acks=all` Limitation**:
         - **No**, `acks=all` alone does **NOT** guarantee zero data loss!
         - `acks=all` only instructs the leader to wait for all currently alive **In-Sync Replicas (ISR)**. If two brokers in a 3-broker cluster crash, the ISR shrinks to just 1 broker (the leader). `acks=all` will successfully acknowledge writes with only that single leader! If that last leader's drive fails, data is lost permanently.
      2. **The Enforcement of `min.insync.replicas`**:
         - To guarantee true cluster durability, the topic/broker must be configured with `min.insync.replicas = 2` (with `replication.factor = 3`).
         - If the ISR drops below 2, the leader will **reject** new produce requests with a `NotEnoughReplicasException`, guaranteeing that data is never accepted without multi-node redundancy.
      3. **The Role of `enable.idempotence=true`**:
         - Retrying failed writes when network packets drop can introduce duplicated records.
         - Idempotence assigns an internal 64-bit Producer ID (PID) and sequence numbers to every batch. If the broker already committed sequence number $N$, it rejects duplicate sequence numbers while acknowledging success to the producer, achieving true **At-Least-Once Delivery without Duplication**.
    az: |
      1. **Yalnız `acks=all` Niyə Kifayət Etmir?**:
         - **Xeyr**, təkcə `acks=all` yazmaq sıfır data itkisinə **zəmanət vermir**!
         - `acks=all` sadəcə Liderə deyir ki: "Hazırda salamat qalan bütün **In-Sync Replicas (ISR)** üzvləri yazana qədər gözlə". Əgər 3 brokerdən 2-si yanıb kül olubsa, ISR siyahısında cəmi 1 broker (Liderin özü) qalır. `acks=all` tək bircə maşınla uğurlu cavab qaytaracaq! Əgər həmin sonuncu maşın da çöksə, bütün məlumat birdəfəlik itir.
      2. **`min.insync.replicas`-ın Həlledici Rolu**:
         - Həqiqi təhlükəsizlik üçün mütləq `min.insync.replicas = 2` (Replication Factor = 3 olduqda) təyin edilməlidir.
         - Əgər salamat qalan nüsxələrin sayı 2-dən az olarsa, Lider yeni mesajları qəbul etməyəcək və `NotEnoughReplicasException` xətası atacaq. Beləliklə, məlumatın ən azı 2 fərqli fiziki serverə yazılacağına 100% zəmanət verilir.
      3. **`enable.idempotence=true` Rolu**:
         - Şəbəkə kəsildikdə producer mesajı təkrar göndərdikdə dublikatların yaranmasının qarşısını alır.
         - Hər mesaja Producer ID və artan ardıcıllıq nömrəsi vurulur; broker eyni nömrəli hadisəni ikinci dəfə qəbul etmir və dublikatsız etibarlı çatdırılma təmin edilir.
  interviewer_tips:
    en: "Explain the exact catastrophic scenario where acks=all fails if min.insync.replicas is left at 1. Recite the industry triad: 'RF=3, acks=all, min.insync.replicas=2, enable.idempotence=true'."
    az: "Müsahibədə `min.insync.replicas=1` olduqda və brokerlər çökdükdə `acks=all`-ın necə tək maşınla data itkisinə səbəb olduğunu izah edin və sənaye qızıl standartını sadalayın: 'RF=3, acks=all, min.insync.replicas=2, enable.idempotence=true'."
flashcards:
  - front:
      en: "What does `acks=all` (or `acks=-1`) mean in Apache Kafka?"
      az: "Apache Kafka-da `acks=all` (və ya `acks=-1`) nə deməkdir?"
    back:
      en: "The producer waits until both the leader and all current in-sync replicas (ISR) commit the message to disk."
      az: "Producer mesajın həm lider, həm də bütün aktiv sinxron nüsxələr (ISR) tərəfindən diskə yazılmasını gözləyir."
  - front:
      en: "Why is setting `min.insync.replicas=1` alongside `acks=all` dangerous?"
      az: "`acks=all` ilə yanaşı `min.insync.replicas=1` qoymaq nə üçün təhlükəlidir?"
    back:
      en: "Because if all follower replicas die, the leader still acknowledges writes with only 1 copy, risking data loss."
      az: "Çünki bütün follower serverlər ölsə belə, lider cəmi 1 nüsxə ilə təsdiq verəcək və həmin lider də çöksə data itəcək."
  - front:
      en: "What is the recommended production setting for `min.insync.replicas` when `replication.factor=3`?"
      az: "`replication.factor=3` olduqda `min.insync.replicas` üçün tövsiyə olunan ən ideal dəyər neçədir?"
    back:
      en: "2 (guarantees at least 2 physical copies while allowing 1 broker to be down for maintenance)."
      az: "2 (ən azı 2 fiziki nüsxəyə zəmanət verir və 1 brokerin təmir üçün söndürülməsinə icazə verir)."
  - front:
      en: "What problem does an Idempotent Producer (`enable.idempotence=true`) solve?"
      az: "İdempotent Producer (`enable.idempotence=true`) hansı problemi həll edir?"
    back:
      en: "Prevents duplicate records in the log caused by network retries when acknowledgment packets drop."
      az: "Brokerin təsdiq (ACK) cavabı şəbəkədə itdiyi zaman təkrar göndərmə nəticəsində logda dublikatların yaranmasını önləyir."
  - front:
      en: "How does the Kafka broker identify a duplicate message from an idempotent producer?"
      az: "Kafka brokeri idempotent producer-dən gələn mesajın dublikat olduğunu necə tanıyır?"
    back:
      en: "By tracking the unique Producer ID (PID) and monotonically increasing Sequence Number stamped on each batch."
      az: "Hər paketə vurulan unikal Producer ID (PID) və artan Sıra Nömrəsini (Sequence Number) yoxlamaqla."
