  az: "Compacted topic-in yaradılmasını və tombstone mesajı ilə açarın diskdən tamamilə təmizlənməsini göstərən terminal loqu."
what_it_does:
  en: "Demonstrates Log Compaction configuration, illustrates key state updates, and shows how to permanently delete records using Tombstones."
  az: "Log Compaction sazlamasını, açarların son vəziyyətinin yenilənməsini və Tombstone vasitəsilə daimi silinməni nümayiş etdirir."
real_world_use:
  en: "Underpins Change Data Capture (CDC) architectures with Debezium. When a row is deleted in PostgreSQL (`DELETE FROM users WHERE id=402`), Debezium emits a Tombstone to Kafka to delete it from downstream caches."
  az: "Debezium CDC arxitekturasının təməlidir. PostgreSQL-də sətir silindikdə (`DELETE`), Debezium Kafkaya Tombstone atır və analitik anbarlarda həmin sətir avtomatik təmizlənir."
common_mistakes:
  en: |
    - **Publishing null-key messages to compacted topics**: Log compaction REQUIRES a non-null key to identify records. Null keys cannot be compacted!
    - **Setting `delete.retention.ms` too short**: If consumers are offline when a tombstone is written and the grace period expires before they catch up, they will miss the delete notification entirely!
    - **Confusing `cleanup.policy=compact` with zero-storage growth**: New writes still append to the active log segment; compaction only runs on closed segments.
  az: |
    - **Compacted topic-ə açarsız (`key=None`) mesaj atmaq**: Log Compaction mütləq Açar tələb edir; açarsız mesajları heç vaxt compact etmək olmur!
    - **`delete.retention.ms` müddətini həddən artıq qısa qoymaq**: Əgər istehlakçı bir neçə saatlıq sönülü olarsa və Tombstone tez silinərsə, istehlakçı həmin sətrin silindiyindən xəbərsiz qalacaq!
    - **Compacted topic-in heç vaxt diskdə böyüməyəcəyini zənn etmək**: Təmizləmə yalnız bağlanmış köhnə seqmentlərdə gedir; aktiv seqment həmişə böyüyür.
interview_question:
  question:
    en: "What is Log Compaction in Apache Kafka, how does it differ from standard Log Deletion, and what is a Tombstone record?"
    az: "Apache Kafka-da Log Compaction nədir, standart Log Deletion-dan nə ilə fərqlənir və Tombstone (Qəbir Daşı) qeydi nədir?"
  answer:
    en: |
      1. **Log Deletion vs Log Compaction**:
         - **Log Deletion (`cleanup.policy = delete`)**: The default policy. Log segments older than `log.retention.hours` (e.g. 7 days) or exceeding `log.retention.bytes` are completely discarded from disk. Entire chunks of time are wiped out.
         - **Log Compaction (`cleanup.policy = compact`)**: Retains the **latest known value for every single message key indefinitely**. As long as a key is not deleted, its most recent state will survive forever. The background Log Cleaner thread scans closed segments and removes older obsolete records sharing the same key.
      2. **Primary Use Cases**:
         - Change Data Capture (CDC) streams representing database tables.
         - Restoring in-memory state stores for Kafka Streams / Flink KTables after a crash.
      3. **What is a Tombstone Record?**:
         - In a compacted topic, publishing a message with `key = K` and `value = null` is called a **Tombstone**.
         - It serves as a deletion marker. Downstream consumers see the `null` value and know to delete key $K$ from their local databases.
         - The Kafka log cleaner preserves the tombstone for `delete.retention.ms` (giving consumers time to observe the deletion), and then permanently purges both the tombstone and all historical occurrences of key $K$ from disk.
    az: |
      1. **Log Deletion vs Log Compaction**:
         - **Log Deletion (`cleanup.policy = delete`)**: Standart siyasətdir. Müəyyən edilmiş vaxtdan (`log.retention.hours`, məs. 7 gün) və ya həcmdən böyük olan köhnə seqment faylları bütövlükdə diskdən silinir.
         - **Log Compaction (`cleanup.policy = compact`)**: Hər bir unikal mesaj açarı üçün **ən son məlum olan dəyəri daimi saxlayır**. Açar silinmədiyi müddətcə onun cari vəziyyəti heç vaxt itmir. Arxa plandakı Log Cleaner prosesi köhnəlmiş aralıq nüsxələri təmizləyərək diskdə yer boşaldır.
      2. **Əsas İstifadə Sahələri**:
         - Verilənlər bazasının sətirlərini əks etdirən CDC (Change Data Capture) axınları.
         - Çöküşdən sonra axın mühərriklərinin (Kafka Streams / Flink KTable) yaddaş bazasını sıfırdan bərpa etmək.
      3. **Tombstone (Qəbir Daşı) Qeydi Nədir?**:
         - Compacted topic-də açarı olan, lakin dəyəri `null` olan (`key = K`, `value = null`) mesaj **Tombstone** adlanır.
         - Bu, silinmə xəbərdarlığıdır. İstehlakçılar `null` dəyəri görəndə həmin açarı öz daxili bazalarından silirlər.
         - Kafka brokeri bu qəbir daşını `delete.retention.ms` müddətində saxlayır (bütün istehlakçılar silinməni görsün deyə), sonra isə $K$ açarını bütün keçmişi ilə birlikdə diskdən birdəfəlik məhv edir.
  interviewer_tips:
    en: "Explain that log compaction transforms Kafka from a transient queue into an immutable changelog for state stores. Define Tombstones as 'a key with a null value used as a deletion marker'."
    az: "Müsahibədə izah edin ki, Log Compaction Kafkanı sadə növbədən çıxarıb vəziyyət saxlayan canlı bazaya (KTable changelog) çevirir və Tombstone-un 'dəyəri null olan silinmə bayrağı' olduğunu vurğulayın."
flashcards:
  - front:
      en: "What is Log Compaction in Apache Kafka?"
      az: "Apache Kafka-da Log Compaction nədir?"
    back:
      en: "A retention policy that guarantees Kafka retains at least the last known value for each message key."
      az: "Hər bir mesaj açarı üçün ən azı ən sonuncu cari dəyərin daimi saxlanmasına zəmanət verən siyasətdir."
  - front:
      en: "What is a Tombstone record in Apache Kafka?"
      az: "Apache Kafka-da Tombstone qeydi nədir?"
    back:
      en: "A record with a valid key and a NULL payload, used to trigger the permanent deletion of that key in compacted topics."
      az: "Compacted topic-lərdə açarın birdəfəlik silinməsini başlatmaq üçün göndərilən və dəyəri NULL olan mesajdır."
  - front:
      en: "What happens if you publish a message with a NULL key to a compacted topic?"
      az: "Compacted topic-ə Açarı NULL olan mesaj göndərdikdə nə baş verir?"
    back:
      en: "Compaction fails for that record because compaction strictly requires a key to identify unique state."
      az: "Həmin mesaj üçün compaction işləmir, çünki compaction vəziyyəti izləmək üçün mütləq açar tələb edir."
  - front:
      en: "What configuration defines how long a Tombstone is preserved before being purged?"
      az: "Tombstone-un diskdən silinməzdən əvvəl nə qədər saxlanacağını hansı parametr təyin edir?"
    back:
      en: "`delete.retention.ms` (gives offline consumers time to observe the deletion event)."
      az: "`delete.retention.ms` (sönülü olan consumer-lərin silinmə hadisəsini görməsinə vaxt tanıyır)."
  - front:
      en: "Does Log Compaction run immediately on the active log segment currently being written to?"
      az: "Log Compaction hazırda yeni mesajların yazıldığı aktiv seqmentdə dərhal işləyirmi?"
    back:
      en: "No. Compaction only cleans closed (non-active) historical log segments."
      az: "Xeyr. Compaction yalnız bağlanmış (aktiv olmayan) köhnə seqment fayllarında təmizləmə aparır."
