output_description:
  en: "Terminal execution proving sequential in-order delivery of user_101's operations within Partition 0 from offset 0 to 2."
  az: "Partition 0 daxilində user_101-ə aid əməliyyatların 0-dan 2-yə qədər dəqiq ardıcıllıqla necə oxunduğunu göstərən terminal loqu."
what_it_does:
  en: "Demonstrates how Kafka assigns monotonic offsets, illustrates offset seeking (event replay), and shows synchronous position commits."
  az: "Kafka-nın artan offset təyin etməsini, keçmişə qayıtmağı (seek) və mövqenin yadda saxlanmasını (commit) nümayiş etdirir."
real_world_use:
  en: "Critical for audit logging and bug mitigation. If a data pipeline calculates faulty currency conversions on Tuesday, engineers fix the bug and seek the consumer back to Tuesday's offsets to recalculate."
  az: "Audit və xətaların bərpası üçün həyatidir. Əgər data pipeline-ında məzənnə səhv hesablanıbsa, baq düzəldilir və consumer-in offset-i həmin günə geri çəkilərək məlumatlar yenidən səhvsiz hesablanır."
common_mistakes:
  en: |
    - **Assuming global ordering across all partitions**: Expecting events across Partition 0 and Partition 1 to be read in absolute timestamp order without custom sorting.
    - **Using `auto.offset.reset = 'latest'` when full data recovery is required**: Skips all unread historical data if a brand-new consumer group ID is deployed.
    - **Committing offsets before processing data**: If the consumer crashes during processing, the unhandled message is permanently skipped on restart (At-Most-Once bug!).
  az: |
    - **Bütün topic boyu qlobal ardıcıllıq gözləmək**: Fərqli partisiya mesajlarının heç bir xüsusi açar olmadan xronoloji oxunacağını düşünmək.
    - **Tarixi məlumat lazım olduğu halda `auto.offset.reset = 'latest'` seçmək**: Yeni bir consumer qrupu yaradıldıqda bütün keçmiş məlumatları oxumadan atlayır.
    - **Məlumatı bazaya yazmamışdan əvvəl offset-i commit etmək**: Əgər proqram məlumatı emal edərkən çöksə, təzədən işə düşəndə həmin mesaj bir daha oxunmur və itir (At-Most-Once xətası!).
interview_question:
  question:
    en: "Does Apache Kafka guarantee total message ordering across an entire topic? If not, how do Data Engineers guarantee strict chronological ordering for business entities?"
    az: "Apache Kafka bütün topic üzrə ümumi (qlobal) ardıcıllığa zəmanət verirmi? Əgər vermirsə, Data Mühəndisləri biznes obyektləri üçün dəqiq ardıcıllığı necə təmin edirlər?"
  answer:
    en: |
      1. **The Partition-Level Ordering Boundary**:
         - **No**, Kafka does **NOT** guarantee global ordering across a topic with multiple partitions.
         - Each partition is an independent, append-only commit log with its own independent sequence of offsets. Different consumer threads process different partitions in parallel, meaning Partition 1 may be read faster than Partition 0.
      2. **How to Guarantee Strict Chronological Order**:
         - To enforce strict ordering for a specific business entity (e.g. all transactions for `user_id = 402` or IoT sensor readings for `sensor_id = 99`), producers must supply that entity ID as the **Message Key**.
         - Kafka's default partitioner hashes the key (`murmur2_hash(key) % num_partitions`), guaranteeing that all messages with the identical key are **always routed to the exact same partition**.
         - Inside that partition, messages are strictly serialized and consumed in the exact order they were produced.
      3. **What if Global Ordering Across Everything is Mandatory?**:
         - The only way to achieve 100% global topic-wide ordering is to configure the topic with **exactly 1 partition**.
         - However, this completely eliminates consumer horizontal parallelism and bottlenecks total pipeline throughput to a single consumer instance.
    az: |
      1. **Sıralamanın Partisiya Sərhədi**:
         - **Xeyr**, Kafka çoxpartisiyalı bir topic daxilində qlobal ümumi ardıcıllığa **zəmanət vermir**.
         - Hər bir partisiya öz müstəqil offset sayğacına malik ayrıca bir jurnal faylıdır. Fərqli istehlakçılar fərqli partisiyaları paralel oxuduğu üçün 1-ci partisiya 0-cı partisiyadan daha tez oxuna bilər.
      2. **Biznes Obyektləri Üçün Ardıcıllıq Necə Təmin Edilir?**:
         - Müəyyən bir biznes obyekti (məsələn, eyni `user_id`-nin bank əməliyyatları və ya eyni `sensor_id`-nin ölçmələri) üçün ciddi ardıcıllıq tələb olunursa, Producer mesajı göndərərkən həmin ID-ni **Mesaj Açarı (Message Key)** kimi təyin etməlidir.
         - Kafka-nın standart heşləmə alqoritmi (`hash(key) % num_partitions`) eyni açara sahib bütün hadisələri **həmişə eyni partisiyaya** yönləndirir.
         - Partisiya daxilində isə ardıcıllıq 100% zəmanətlidir və istehlakçı hadisələri daxilolma sırası ilə emal edir.
      3. **Əgər Bütün Topic Üzrə 100% Qlobal Ardıcıllıq Vacibdirsə?**:
         - Bunun yeganə yolu Topic-i cəmi **1 partisiya** ilə yaratmaqdır.
         - Lakin bu, sistemin bütün paralelliyini və miqyaslanma gücünü öldürür; bütün sistem tək bir consumer-in sürətinə möhtac qalır.
  interviewer_tips:
    en: "Never hesitate: say immediately 'Ordering is only guaranteed within a partition, NOT across the topic'. Explain how hashing the Message Key ensures per-entity ordering, and note that a 1-partition topic gives global ordering at the cost of zero parallelism."
    az: "Müsahibədə dərhal 'Xeyr, Kafka yalnız partisiya daxilində ardıcıllığa zəmanət verir' deyin. Sonra 'Message Key' vasitəsilə eyni obyektin eyni partisiyaya necə düşdüyünü və 1 partisiyanın qlobal ardıcıllıq versə də paralelliyi öldürdüyünü izah edin."
flashcards:
  - front:
      en: "What is an Offset in Apache Kafka?"
      az: "Apache Kafka-da Offset nədir?"
    back:
      en: "A unique, sequential integer assigned to each record within a partition, representing its exact commit position."
      az: "Partisiya daxilində hər bir mesaja verilən və onun dəqiq ardıcıl yerini bildirən unikal tam ədəddir."
  - front:
      en: "Across which boundary does Kafka guarantee strict message ordering?"
      az: "Kafka ciddi mesaj ardıcıllığına hansı sərhəd daxilində zəmanət verir?"
    back:
      en: "Strictly within a single partition. There is no global ordering across multiple partitions."
      az: "Yalnız və yalnız tək bir partisiya daxilində. Çoxlu partisiyalar arasında ümumi qlobal ardıcıllıq yoxdur."
  - front:
      en: "Where does Kafka store the committed offsets of consumer groups?"
      az: "Kafka istehlakçı qruplarının təsdiq olunmuş (commit) offset-lərini harada saxlayır?"
    back:
      en: "In the internal, replicated system topic named `__consumer_offsets`."
      az: "`__consumer_offsets` adlı daxili və etibarlı sistem topikində saxlayır."
  - front:
      en: "How can a Data Engineer guarantee that all events for a specific user arrive in order?"
      az: "Data Mühəndisi müəyyən bir istifadəçiyə aid hadisələrin ardıcıl çatmasına necə zəmanət verə bilər?"
    back:
      en: "By setting the user ID as the Message Key so the partitioner routes all their records to the same partition."
      az: "İstifadəçi ID-sini Mesaj Açarı (Key) kimi təyin etməklə; bu halda heş alqoritmi bütün qeydləri eyni partisiyaya yönləndirir."
  - front:
      en: "What is the difference between `auto.offset.reset = 'earliest'` and `'latest'`?"
      az: "`auto.offset.reset = 'earliest'` ilə `'latest'` arasındakı fərq nədir?"
    back:
      en: "'earliest' starts reading from the oldest available message; 'latest' skips history and listens only for newly produced events."
      az: "'earliest' diskdəki ən qədim mesajdan oxumağa başlayır; 'latest' isə keçmişi buraxaraq yalnız yeni gələcək hadisələri dinləyir."
