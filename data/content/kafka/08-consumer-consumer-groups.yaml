output_description:
  en: "Terminal output showing a consumer joining a group and receiving dynamic ownership of Partitions 0, 1, and 2 out of a 6-partition topic."
  az: "İstehlakçının qrupa qoşulduğunu və 6 partisiyalı topic-in ilk 3 partisiyasının (0, 1 və 2) ona təyin edildiyini göstərən terminal loqu."
what_it_does:
  en: "Demonstrates how Kafka dynamically balances partitions across consumer instances sharing a group.id and exposes partition assignment events."
  az: "Kafka-nın partisiyaları eyni group.id-yə sahib üzvlər arasında necə dinamik böldüyünü və təyinat mexanizmini nümayiş etdirir."
real_world_use:
  en: "Used in microservices and Kubernetes pods (Deployments). If data volume surges, DevOps scales pod replicas from 2 to 4 to distribute processing."
  az: "Kubernetes mühitində məlumat axını gücləndikdə pod sayını 2-dən 4-ə qaldıraraq emal gücünü ikiqat artırmaq üçün istifadə edilir."
common_mistakes:
  en: |
    - **Adding more consumers than partitions**: Running 10 Kubernetes pods for a topic with only 3 partitions wastes money; 7 pods sit 100% idle!
    - **Using the same `group.id` across unrelated microservices**: The two services will split the partitions instead of both receiving all records, causing catastrophic data omission in both services!
    - **Forgetting `consumer.close()` on shutdown**: Forces the cluster to wait for the heartbeat timeout (up to 45 seconds) before reassigning partitions to surviving members.
  az: |
    - **Partisiya sayından çox consumer işə salmaq**: 3 partisiya olan topic üçün 10 pod qaldırmaq resurs israfıdır; 7 pod heç bir iş görmədən boş oturacaq!
    - **Bir-biri ilə əlaqəsiz fərqli xidmətlərə eyni `group.id` vermək**: Hər iki xidmət məlumatı bütöv oxumaq əvəzinə partisiyaları aralarında yarı-yarıya böləcək və hər iki sistem yarımçıq qalacaq!
    - **Proqramı bağlayarkən `consumer.close()` çağırmamaq**: Broker həmin consumer-in öldüyünü yalnız 45 saniyəlik timeout-dan sonra anlayacaq və bu müddətdə həmin partisiyanın oxunması dayanacaq.
interview_question:
  question:
    en: "If a topic has 4 partitions and you launch 6 consumer instances within the same consumer group, how are the partitions assigned, and how can you increase consumer throughput?"
    az: "Əgər bir topic-də 4 partisiya varsa və eyni consumer qrupu daxilində 6 consumer işə salsanız, partisiyalar necə paylanacaq və oxuma sürətini necə artıra bilərsiniz?"
  answer:
    en: |
      1. **Partition Assignment Rules**:
         - In Kafka, **a single partition can be consumed by at most ONE consumer instance within the same consumer group**.
         - With 4 partitions and 6 consumers in Group A:
           - 4 consumers will each be assigned exactly **1 partition**.
           - The remaining **2 consumers will sit completely IDLE** (assigned 0 partitions). They will do zero work and consume zero data.
         - The only benefit of those 2 idle consumers is hot standby failover: if one active consumer crashes, an idle consumer takes over immediately without provisioning a new server.
      2. **How to Increase Consumer Read Throughput**:
         - Simply adding more consumer machines **will NOT increase throughput** because the partition limit has been hit.
         - The **ONLY** architectural way to scale throughput is to **increase the number of partitions** on the topic (e.g. from 4 to 12). Once expanded, the idle consumers (plus new ones) will be assigned partitions, multiplying throughput.
    az: |
      1. **Partisiyaların Paylanması**:
         - Kafka-da **eyni consumer qrupu daxilində tək bir partisiya yalnız BİR consumer tərəfindən oxuna bilər**.
         - 4 partisiya və 6 consumer olduqda:
           - 4 consumer-in hərəsinə **1 partisiya** veriləcək.
           - Qalan **2 consumer TAMAMİLƏ BOŞ OTURACAQ** (onlara 0 partisiya ayrılacaq) və heç bir məlumat oxumayacaq.
           - Bu 2 boş consumer-in yeganə faydası "isti ehtiyat" (hot standby) olmasıdır: əgər aktivlərdən biri ölsə, boş olan dərhal onun yerini alacaq.
      2. **Oxuma Sürətini Artırmağın Yeganə Yolu**:
         - Qrupa yeni consumer əlavə etmək **sürəti əsla artırmayacaq**, çünki partisiya limiti dolub.
         - Sürəti artırmağın **YEGANƏ** memarlıq yolu Topic-in **partisiya sayını artırmaqdır** (məs. 4-dən 12-yə qaldırmaq). Partisiya sayı artan kimi boş oturan consumer-lər dərhal işə qoşulacaq və paralel oxuma sürəti 3 dəfə artacaq.
  interviewer_tips:
    en: "Directly declare: '4 consumers get 1 partition each; 2 consumers remain completely idle'. Emphasize that the partition count is the hard upper ceiling of consumer group parallelism."
    az: "Müsahibədə heç düşünmədən cavab verin: '4 consumer 1 partisiya götürəcək, 2-si isə tam boş oturacaq'. Partisiya sayının qrup paralelliyinin ən son sərhədi olduğunu qeyd edin."
flashcards:
  - front:
      en: "What is the Golden Rule of Kafka Consumer Groups?"
      az: "Kafka Consumer Qruplarının Qızıl Qaydası nədir?"
    back:
      en: "Within a single consumer group, each partition is consumed by at most one consumer instance."
      az: "Eyni consumer qrupu daxilində hər partisiya ən çoxu bir consumer tərəfindən oxuna bilər."
  - front:
      en: "What happens if a consumer group has more consumer instances than the topic has partitions?"
      az: "Consumer qrupundakı istehlakçıların sayı topic-in partisiya sayından çox olduqda nə baş verir?"
    back:
      en: "The surplus consumers remain completely IDLE with zero assigned partitions."
      az: "Artıq qalan consumer-lər heç bir partisiya almayaraq tam boş otururlar (idle qalırlar)."
  - front:
      en: "Can two different consumer groups read from the exact same partition at the same time?"
      az: "İki fərqli consumer qrupu eyni vaxtda eyni partisiyanı oxuya bilərmi?"
    back:
      en: "Yes! Different consumer groups have completely independent offset pointers and do not interfere."
      az: "Bəli! Fərqli qrupların müstəqil offset nöqtələri var və bir-birinə heç bir maneə yaratmırlar."
  - front:
      en: "How do you increase read throughput when all partitions are already assigned to consumers?"
      az: "Bütün partisiyalar artıq consumer-lərə təyin olunduqda oxuma sürətini necə artıra bilərsiniz?"
    back:
      en: "You must increase the number of partitions on the topic, then add matching consumers."
      az: "Topic-in partisiya sayını artırmalı, sonra qrupa yeni consumer-lər əlavə etməlisiniz."
  - front:
      en: "Why is gracefully calling `consumer.close()` important when stopping a service?"
      az: "Xidməti dayandırarkən `consumer.close()` çağırmaq nə üçün vacibdir?"
    back:
      en: "It immediately notifies the coordinator broker to rebalance, preventing a 30-45s timeout delay."
      az: "Brokerə qrupdan çıxdığını dərhal xəbər verir və 30-45 saniyəlik timeout fasiləsinin qarşısını alaraq rebalance-ı başladır."
