id: "03-topics-partitions-log"
order: 3
level: "junior"
title:
  en: "Topics & Partitions: The Distributed Commit Log & Zero-Copy"
  az: "Topic və Partisiyalar: Paylanmış Log Strukturu və Zero-Copy"
infographic:
  en: |
    ```text
    ┌────────────────────────────────────────────────────────────────────────┐
    │  TOPIC: 'ecommerce-orders' (Split into 3 Partitions across Brokers)    │
    │                                                                        │
    │  Partition 0 (On Broker 1): [Offset 0][Offset 1][Offset 2]... ──► Disk │
    │  Partition 1 (On Broker 2): [Offset 0][Offset 1][Offset 2]... ──► Disk │
    │  Partition 2 (On Broker 3): [Offset 0][Offset 1][Offset 2]... ──► Disk │
    │                                                                        │
    │  • Parallelism: 3 distinct consumers read 3 partitions concurrently!   │
    │  • Scalability: 1 Topic can span 50 disks across 20 distinct servers.  │
    └────────────────────────────────────────────────────────────────────────┘
                                    VS
    ┌────────────────────────────────────────────────────────────────────────┐
    │  ZERO-COPY NETWORK TRANSFER (Why Kafka is so Insanely Fast!)           │
    │  Traditional OS Read:                                                  │
    │  [Disk] ──► (Kernel PageCache) ──► (User JVM RAM) ──► (Socket Buffer)   │
    │  (4 Context Switches + 3 Data Copies = High CPU overhead)              │
    │                                                                        │
    │  Kafka Zero-Copy (Linux `sendfile` syscall):                           │
    │  [Disk] ──► (Kernel PageCache) ───────────────────────► [NIC Socket]   │
    │  (0 JVM copies, 0 CPU bottlenecks. Maximum hardware wire speed!)       │
    └────────────────────────────────────────────────────────────────────────┘
    ```
  az: |
    ```text
    ┌────────────────────────────────────────────────────────────────────────┐
    │  TOPIC: 'ecommerce-orders' (3 Broker Üzrə 3 Partisiyaya Bölünüb)       │
    │                                                                        │
    │  Partisiya 0 (Broker 1-də): [Offset 0][Offset 1][Offset 2]... ──► Disk │
    │  Partisiya 1 (Broker 2-də): [Offset 0][Offset 1][Offset 2]... ──► Disk │
    │  Partisiya 2 (Broker 3-də): [Offset 0][Offset 1][Offset 2]... ──► Disk │
    │                                                                        │
    │  • Paralellik: 3 fərqli istehlakçı 3 partisiyanı eyni anda oxuyur!     │
    │  • Miqyaslanma: 1 Topic 20 fərqli serverin 50 diskinə yayıla bilər.    │
    └────────────────────────────────────────────────────────────────────────┘
                                    VS
    ┌────────────────────────────────────────────────────────────────────────┐
    │  ZERO-COPY ŞƏBƏKƏ ÖTÜRÜLMƏSİ (Kafka Niyə Ağlasığmaz Dərəcədə Sürətlidir?)│
    │  Ənənəvi Oxuma Modeli:                                                 │
    │  [Disk] ──► (ƏS PageCache) ──► (JVM Proqram RAM) ──► (Şəbəkə Soketi)  │
    │  (4 Kontekst Dəyişməsi + 3 Dəfə Yaddaş Nüsxələməsi = Yüksək CPU yükü)   │
    │                                                                        │
    │  Kafka Zero-Copy Modeli (Linux `sendfile` sistemi):                    │
    │  [Disk] ──► (ƏS PageCache) ─────────────────────────► [Şəbəkə Kartı]  │
    │  (JVM-ə heç nə köçürülmür, CPU yorulmur. Şəbəkə kabelinin son həddi!)  │
    └────────────────────────────────────────────────────────────────────────┘
    ```
explanation:
  en: |
    Think of a busy multi-lane highway system:
    - **Topic**: The highway destination itself (e.g. "Airport Highway"). It is a logical category name where producers publish events.
    - **Partition**: The physical lanes on that highway.
      - If an airport highway had only 1 lane, 10,000 cars would create a catastrophic traffic jam.
      - By dividing the topic into **8 lanes (Partitions)**, 8 cars can travel side-by-side simultaneously.
      - Partitions are Kafka's fundamental unit of parallelism and physical storage. Each partition is a physical folder on a broker's hard drive containing `.log` segment files.
    - **Sequential Disk Writes (Append-Only)**: When Kafka writes a message, it never searches around the disk to update an existing record (which causes random disk seek delays of ~10ms). Instead, it appends the bytes directly to the very end of the file. Sequential write speed on modern NVMe drives exceeds 3 GB/s!
    - **Zero-Copy Optimization**: Traditional software reads data from disk into kernel memory, copies it into application JVM memory, and then copies it back into network socket memory. Kafka uses the Linux `sendfile` system call, transmitting bytes directly from the Operating System Page Cache straight into the Network Interface Card (NIC), bypassing user space completely!

    ### Rules of Kafka Partitions:
    1. A topic can have 1 to thousands of partitions.
    2. Partitions can be spread across different brokers in the cluster.
    3. Partitions can ONLY be increased, NEVER decreased (reducing partitions would destroy historical data).
  az: |
    Çoxzolaqlı müasir magistral avtomobil yolunu təsəvvür edin:
    - **Topic**: Yolun özünün təyinatıdır (məsələn: "Hava Limanı Şossesi"). Hadisələrin göndərildiyi məntiqi kateqoriya və kanal adıdır.
    - **Partisiya (Partition)**: Həmin şossedəki fiziki hərəkət zolaqlarıdır.
      - Əgər hava limanı yolu cəmi 1 zolaqlı olsaydı, arxadan gələn 10,000 avtomobil nəhəng tıxac yaradardı.
      - Topic **8 zolağa (Partisiyaya)** bölündükdə isə, 8 avtomobil eyni anda yanaşı sürətlə hərəkət edə bilər.
      - Partisiya — Kafka-da paralelliyin və miqyaslanmanın fiziki təməl vahididir. Hər partisiya brokerin sərt diskində yerləşən ayrıca qovluq və ardıcıl `.log` seqment faylıdır.
    - **Ardıcıl Disk Yazılması (Sequential I/O - Append-Only)**: Kafka diskdəki köhnə sətirləri heç vaxt axtarıb yeniləmir (bu, diskin başlığını ora-bura hərəkət etdirərək saniyələrlə gecikmə yaradır). O, yeni gələn baytları birbaşa faylın ən sonuna yapışdırır. Ardıcıl yazma zamanı hətta mexaniki disklər belə inanılmaz sürət verir.
    - **Zero-Copy Möcüzəsi**: Ənənəvi proqramlar məlumatı diskdən əməliyyat sisteminə, oradan Java yaddaşına (JVM), oradan da şəbəkə kartına nüsxələyir. Kafka isə Linux-un `sendfile` əmrindən istifadə edir: məlumat birbaşa ƏS-in Page Cache yaddaşından heç bir ara nüsxələmə olmadan şəbəkə kartına (NIC) ötürülür!

    ### Partisiyaların Qızıl Qaydaları:
    1. Bir topic 1-dən minlərlə partisiyaya qədər bölünə bilər.
    2. Partisiyalar klasterdəki fərqli brokerlərin disklərinə paylanır.
    3. Partisiya sayını sonradan yalnız ARTIRMAQ olar, heç vaxt AZALTMAQ olmaz (partisiyanı silmək həmin fayldakı məlumatların itməsi deməkdir).
quick_recap:
  en: "A Topic is divided into Partitions, which are the fundamental unit of parallelism and scale in Kafka. Kafka achieves extreme performance by writing sequentially to append-only disk files and streaming data via Zero-Copy (`sendfile`)."
  az: "Topic partisiyalara bölünür; partisiya Kafka-da fiziki saxlancın və paralelliyin təməl vahididir. Kafka yüksək sürətini disklərə yalnız ardıcıl (append-only) yazması və məlumatı Zero-Copy (`sendfile`) ilə birbaşa şəbəkəyə ötürməsi sayəsində qazanır."
code: |
  # Production Topic Creation Blueprint with Custom Partitions & Retention
  from confluent_kafka.admin import AdminClient, NewTopic

  admin_conf = {'bootstrap.servers': 'localhost:9092'}
  admin = AdminClient(admin_conf)

  # Define production-grade Topic configuration
  topic_name = "telemetry-iot-events"
  num_partitions = 6          # 6 parallel lanes for 6 consumers
  replication_factor = 3      # 3 copies across 3 distinct brokers

  custom_configs = {
      'retention.ms': '604800000',       # 7 days retention (in ms)
      'segment.bytes': '1073741824',     # 1 GB segment file size
      'compression.type': 'lz4'          # High-speed streaming compression
  }

  new_topic = NewTopic(
      topic=topic_name,
      num_partitions=num_partitions,
      replication_factor=replication_factor,
      config=custom_configs
  )

  print(f"=== Creating Partitioned Topic: '{topic_name}' ===")
  futures = admin.create_topics([new_topic])

  for t_name, future in futures.items():
      try:
          future.result()  # Blocks until broker acknowledges creation
          print(f"✅ Topic '{t_name}' created successfully with {num_partitions} partitions (RF={replication_factor})")
      except Exception as e:
          print(f"⚠️ Topic creation status for '{t_name}': {e}")
code_explanation:
  en: |
    - `NewTopic`: Declarative schema object specifying topic name, partition count, replication factor, and broker configs.
    - `num_partitions=6`: Enables up to 6 consumers in a single consumer group to process incoming events in parallel.
    - `retention.ms`: Specifies how long log segments remain on disk before being safely cleaned up by the log cleaner thread.
    - `compression.type='lz4'`: Minimizes network bandwidth and disk footprint while keeping CPU overhead minimal.
  az: |
    - `NewTopic`: Topic-in adını, partisiya sayını, nüsxə sayını (RF) və xüsusi sazlamalarını təyin edən parametr obyektidir.
    - `num_partitions=6`: Eyni anda 6 istehlakçının paralel oxumasına şərait yaradır.
    - `retention.ms`: Məlumatların diskdə neçə gün (burada 7 gün = 604,800,000 ms) saxlanacağını təyin edir.
    - `compression.type='lz4'`: Şəbəkə ötürücülüyünü qorumaq üçün CPU-nu yormayan ən sürətli sıxılma alqoritmidir.
