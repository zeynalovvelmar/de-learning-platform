what_it_does:
  en: "Demonstrates programmatic topic creation, establishing partition parallelism, replication factor safety, and retention lifecycle rules."
  az: "Kod vasitəsilə yeni topic yaradılmasını, partisiya paralelliyini, replikasiya dözümlülüyünü və məlumat saxlama müddətini nümayiş etdirir."
real_world_use:
  en: "Automated provisioning in infrastructure-as-code (Terraform / CI-CD) pipelines where topics are sized according to anticipated gigabytes-per-second ingestion volume."
  az: "Production-da daxil olacaq məlumat həcminə (MB/s) uyğun olaraq partisiya sayının əvvəlcədən düzgün hesablanaraq avtomatik yaradılmasında istifadə olunur."
common_mistakes:
  en: |
    - **Creating topics with only 1 partition**: Completely disables consumer parallelism. Only 1 consumer can ever process data from that topic, bottlenecking your pipeline.
    - **Attempting to reduce partition count**: Kafka does not allow decreasing partitions. If you mistakenly create 100 partitions, you must delete and recreate the topic.
    - **Creating too many partitions (e.g. 5,000 partitions on a small 1-broker machine)**: Each partition has open file descriptors and memory buffers, leading to file handle exhaustion.
  az: |
    - **Cəmi 1 partisiyalı topic yaratmaq**: Bütün paralelliyi məhv edir. Həmin topic-dən eyni anda yalnız 1 consumer oxuya biləcək və böyük axınlarda tıxac yaranacaq.
    - **Partisiya sayını azaltmağa cəhd etmək**: Kafka partisiya sayını azaltmağa icazə vermir. Əgər səhvən çox partisiya açmısınızsa, topic-i silib yenidən yaratmalısınız.
    - **Həddindən artıq çox partisiya açmaq (məs. balaca serverdə 5,000 partisiya)**: Hər partisiya diskdə açıq fayl göstəricisi (file descriptor) deməkdir və serverin resurslarını tükədə bilər.
interview_question:
  question:
    en: "How does Apache Kafka achieve extreme throughput and low latency while persisting all data to disk, and what role does Zero-Copy play?"
    az: "Bütün məlumatları diskə yazmasına baxmayaraq Apache Kafka necə inanılmaz dərəcədə yüksək ötürücülük və aşağı gecikmə əldə edir və burada Zero-Copy hansı rolu oynayır?"
  answer:
    en: |
      1. **Sequential Disk Writes (Append-Only Log)**:
         - Random disk I/O requires physical drive heads to seek tracks, taking 10-15ms per operation.
         - Kafka only appends bytes sequentially to the end of partition segment files ($O(1)$ complexity). Sequential disk access on modern drives is as fast as network or RAM bandwidth (exceeding hundreds of megabytes per second).
      2. **Operating System Page Cache**:
         - Rather than caching objects inside the JVM heap (which triggers heavy Garbage Collection pauses), Kafka leaves caching entirely to the OS Kernel Page Cache. All recently produced messages live directly in OS RAM.
      3. **Zero-Copy Network Data Transfer (`sendfile`)**:
         - In traditional data movement, data undergoes 4 context switches and 3 buffer copies: Disk ──► OS Buffer ──► Application JVM Memory ──► Socket Buffer ──► NIC.
         - Kafka uses the Linux `sendfile` system call. The OS transfers data directly from the Page Cache into the Network Interface Card (NIC) buffer, completely bypassing user space (JVM). This yields zero CPU memory copying and maximum wire-speed throughput.
    az: |
      1. **Ardıcıl Disk Yazılması (Sequential Append-Only)**:
         - Diskdə təsadüfi (random) axtarış mexaniki başlıqların yerini dəyişməsini tələb edir və hər əməliyyat üçün 10-15 ms vaxt aparır.
         - Kafka isə məlumatları yalnız və yalnız faylın ən sonuna ardıcıl əlavə edir ($O(1)$ mürəkkəblik). Müasir disklərdə ardıcıl yazma sürəti şəbəkə və ya RAM sürəti qədər yüksəkdir (saniyədə yüzlərlə meqabayt).
      2. **Əməliyyat Sisteminin Page Cache Yaddaşı**:
         - Kafka mesajları JVM yaddaşında keşləmir (bu nəhəng Garbage Collection fasilələri yaradardı); bütün keşləməni Əməliyyat Sisteminin Page Cache-inə həvalə edir. Yeni yazılmış bütün hadisələr birbaşa ƏS-in RAM yaddaşında qalır.
      3. **Zero-Copy Şəbəkə Ötürülməsi (`sendfile`)**:
         - Ənənəvi arxitekturalarda məlumat Diskdən Əməliyyat Sisteminə, oradan Java yaddaşına, oradan Şəbəkə Soketinə köçürülür (4 kontekst dəyişməsi və 3 dəfə yaddaş nüsxələnməsi).
         - Kafka Linux-un `sendfile` sistem çağırışından istifadə edir: Məlumat birbaşa Page Cache yaddaşından heç bir JVM nüsxələnməsi olmadan birbaşa Şəbəkə Kartına (NIC) ötürülür. CPU boş yerə yüklənmir və şəbəkə kartının maksimum fiziki ötürücülük gücü əldə edilir.
  interviewer_tips:
    en: "Explicitly contrast 'Random vs Sequential Disk I/O' and walk through the 4 context switches avoided by Linux 'sendfile' syscall (Zero-Copy). Emphasize that Kafka relies on the OS Page Cache rather than JVM heap memory."
    az: "Müsahibədə mütləq 'Təsadüfi və Ardıcıl Disk I/O fərqi'ni, Linux 'sendfile' sistem çağırışı ilə həyata keçirilən 'Zero-Copy' prinsipini və JVM yerinə Əməliyyat Sisteminin 'Page Cache' yaddaşından istifadə edildiyini qeyd edin."
flashcards:
  - front:
      en: "What is a Partition in Apache Kafka?"
      az: "Apache Kafka-da Partisiya (Partition) nədir?"
    back:
      en: "The atomic unit of physical parallelism, storage, and replication within a Topic."
      az: "Topic daxilində fiziki saxlancın, paralelliyin və replikasiyanın təməl bölünmə vahididir."
  - front:
      en: "Can you decrease the number of partitions of an existing Kafka topic?"
      az: "Mövcud Kafka topic-inin partisiya sayını azaltmaq olarmı?"
    back:
      en: "No. Kafka only allows increasing partition counts. Decreasing partitions is strictly prohibited."
      az: "Xeyr. Kafka partisiya sayını yalnız artırmağa icazə verir. Mövcud partisiya sayını azaltmaq qadağandır."
  - front:
      en: "Why does Kafka write messages sequentially instead of using random disk writes?"
      az: "Kafka nə üçün disklərə təsadüfi deyil, yalnız ardıcıl (sequential) yazır?"
    back:
      en: "Sequential disk access achieves O(1) complexity and avoids expensive mechanical seek times, matching RAM speeds."
      az: "Ardıcıl yazılma O(1) sürəti verir, diskin axtarış gecikmələrini aradan qaldırır və RAM sürətinə yaxın performans təmin edir."
  - front:
      en: "What is the 'Zero-Copy' optimization in Apache Kafka?"
      az: "Apache Kafka-da 'Zero-Copy' optimallaşdırması nədir?"
    back:
      en: "Transferring data from OS PageCache directly to the network socket using Linux `sendfile`, bypassing user JVM space."
      az: "Məlumatı Java (JVM) yaddaşına köçürmədən, Linux `sendfile` vasitəsilə birbaşa PageCache-dən şəbəkə kartına ötürmək texnikasıdır."
  - front:
      en: "Why does Kafka avoid caching messages in the Java JVM Heap?"
      az: "Kafka nə üçün mesajları Java JVM yaddaşında keşləməkdən çəkinir?"
    back:
      en: "To prevent massive Garbage Collection (GC) pauses and leverage the OS Kernel PageCache directly."
      az: "Nəhəng Garbage Collection (GC) dondurmalarının qarşısını almaq və Əməliyyat Sisteminin öz Page Cache yaddaşından faydalanmaq üçün."
