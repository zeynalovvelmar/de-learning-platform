output_description:
  en: "Terminal diagnosis displaying a healthy 3-broker production cluster with KRaft active controller coordination and partition counts."
  az: "KRaft aktiv controller nəzarəti altında 3 aktiv brokerdən ibarət production klasterinin və daxili topic-lərinin sağlam vəziyyətini göstərən diaqnostika çıxışı."
what_it_does:
  en: "Interrogates cluster metadata dynamically, identifying alive broker nodes, controller presence, and topic distribution across nodes."
  az: "Klasterin vəziyyətini dinamik sorğulayaraq aktiv brokerləri, controller varlığını və topic-lərin serverlər üzrə paylanmasını nümayiş etdirir."
real_world_use:
  en: "Used in Kubernetes (Strimzi Operator) and cloud infrastructure health-checks to ensure high-availability quorum is maintained before triggering deployment rollouts."
  az: "Kubernetes mühitində (Strimzi) və bulud klasterlərində tətbiqin işə düşməsindən əvvəl bütün brokerlərin və kvorumun sağlam olduğunu yoxlamaq üçün tətbiq edilir."
common_mistakes:
  en: |
    - **Listing only 1 broker in `bootstrap.servers`**: If that single broker is rebooting, your client fails to connect even if the other 10 brokers are completely healthy! Always provide at least 2 or 3 broker addresses (e.g. `'host1:9092,host2:9092,host3:9092'`).
    - **Running an even number of KRaft controllers**: Quorum consensus algorithms (Raft) require an odd number (3 or 5) to prevent split-brain ties.
    - **Treating `__consumer_offsets` as a regular topic**: Attempting to manually delete or write to this internal topic will break cluster consumer group tracking.
  az: |
    - **`bootstrap.servers` parametrinə cəmi 1 broker yazmaq**: Əgər həmin tək server profilaktikaya gedibsə, digər 10 broker işləsə belə tətbiqiniz klasterə qoşula bilməyəcək! Həmişə vergüllə ən az 2-3 broker ünvanı yazılmalıdır (`'broker1:9092,broker2:9092'`).
    - **Cüt sayda Controller server saxlamaq**: Raft konsensus mexanizmi səsvermə zamanı heç-heçə (split-brain) olmaması üçün həmişə tək sayda (3 və ya 5) nəzarətçi tələb edir.
    - **`__consumer_offsets` topikinə adi topic kimi yanaşmaq**: Bu daxili sistem topikinə əl ilə nəsə yazmaq və ya onu silməyə cəhd etmək bütün istehlakçıların işini iflic edər.
interview_question:
  question:
    en: "What is the role of the Kafka Controller broker, and why did Apache Kafka migrate from Apache ZooKeeper to KRaft (Kafka Raft Metadata mode)?"
    az: "Kafka Controller broker-in rolu nədir və nə üçün Apache Kafka ZooKeeper-dən imtina edərək KRaft (Kafka Raft Metadata) rejiminə keçdi?"
  answer:
    en: |
      1. **Role of the Controller Broker**:
         - One broker in the cluster is elected as the **Controller**. It is the cluster's brain: it tracks broker heartbeats, manages partition leader elections during broker failures, and propagates metadata updates to all follower brokers.
      2. **Why ZooKeeper Was Eliminated (The 3 Bottlenecks)**:
         - **Metadata Desynchronization**: In ZooKeeper mode, metadata lived externally in ZK nodes and had to be continually synced into the Controller's RAM. If the Controller crashed, a new Controller had to read millions of ZK z-nodes, taking minutes to recover.
         - **Partition Scalability Limits**: ZooKeeper could practically manage up to ~200,000 partitions per cluster before watch storm latency degraded the cluster.
         - **Operational Complexity**: DevOps teams had to configure, monitor, patch, and secure two completely different distributed JVM systems (ZooKeeper + Kafka).
      3. **The KRaft Revolution (Kafka Raft)**:
         - Metadata is now stored natively inside an internal, immutable, replicated event log (`__cluster_metadata`).
         - Uses the Raft consensus algorithm. Controller failover takes **milliseconds** instead of minutes, and a single cluster can effortlessly support tens of millions of partitions. *(Note: ZooKeeper support was completely removed in Apache Kafka 4.0).*
    az: |
      1. **Controller Broker-in Rolu**:
         - Klasterdəki brokerlərdən biri **Controller** seçilir. O, klasterin beynidir: digər brokerlərin sağlamlığını izləyir, hansısa broker sıradan çıxdıqda dərhal yeni partisiya Liderlərini seçir və yenilikləri bütün digər brokerlərə çatdırır.
      2. **ZooKeeper Niyə Ləğv Edildi? (3 Əsas Darboğaz)**:
         - **Metadata Sinxronizasiya Gecikməsi**: ZooKeeper-də məlumatlar xaricdə saxlanılırdı və Controller-in yaddaşına daşınmalı idi. Controller öldükdə yeni Controller-in bütün ZooKeeper qovluqlarını oxuması dəqiqələrlə vaxt aparırdı.
         - **Partisiya Sayı Məhdudiyyəti**: ZooKeeper bir klasterdə maksimum ~200,000 partisiya saxlaya bilirdi; daha çox partisiya olduqda şəbəkə kilidlənirdi.
         - **İdarəetmənin Mürəkkəbliyi**: Mühəndislər iki tamamilə fərqli paylanmış sistemi (ZooKeeper və Kafka) ayrı-ayrılıqda quraşdırmalı, sazlamalı və qorumalı idilər.
      3. **KRaft Üstünlüyü**:
         - Artıq bütün klaster metadatası Kafka-nın öz daxili `__cluster_metadata` adlı replikasiyalı jurnalında saxlanılır.
         - Raft konsensus protokolundan istifadə edilir. Controller dəyişməsi dəqiqələr deyil, **milli-saniyələr** çəkir və klaster milyonlarla partisiyanı asanlıqla idarə edir. *(Qeyd: Apache Kafka 4.0 versiyasında ZooKeeper tamamilə silinmişdir).*
  interviewer_tips:
    en: "Focus on 'instant controller failover', 'elimination of metadata dual-state desynchronization', and 'scaling from 200k to millions of partitions'. Stating that modern Kafka 3.0+ runs KRaft in production is a strong senior signal."
    az: "Müsahibədə 'Controller bərpasının millisaniyələrə enməsi', 'iki ayrı sistemdə metadata uyğunsuzluğunun yox olması' və 'partisiya limitinin milyonlara qalxması' arqumentlərini vurğulayın."
flashcards:
  - front:
      en: "What is a Kafka Broker?"
      az: "Kafka Broker nədir?"
    back:
      en: "An individual server node in a Kafka cluster responsible for receiving, appending, storing, and serving partition log segments."
      az: "Kafka klasterində mesajları qəbul edən, diskdəki log fayllarına yazan, saxlayan və oxuculara ötürən fərdi server qovşağıdır."
  - front:
      en: "What is the primary responsibility of the Kafka Controller Broker?"
      az: "Kafka Controller Broker-in ən əsas vəzifəsi nədir?"
    back:
      en: "Managing cluster metadata, monitoring broker heartbeats, and electing new partition leaders when brokers fail."
      az: "Klasterin metadatasını idarə etmək, brokerlərin sağlamlığını izləmək və broker çökdükdə dərhal yeni partisiya Liderlərini seçməkdir."
  - front:
      en: "What does KRaft stand for in Apache Kafka?"
      az: "Apache Kafka-da KRaft nə deməkdir?"
    back:
      en: "Kafka Raft Metadata mode — the built-in consensus mechanism that replaces ZooKeeper."
      az: "Kafka Raft Metadata rejimi — ZooKeeper-i əvəz edən və Kafka-nın daxili konsensus təmin edən arxitekturasıdır."
  - front:
      en: "Why is an odd number of KRaft controllers (e.g. 3 or 5) strictly required?"
      az: "KRaft nəzarətçilərinin sayının mütləq tək ədəd (3 və ya 5) olması nə üçün vacibdir?"
    back:
      en: "To guarantee a strict majority quorum (`(N/2) + 1`) during leader elections, preventing split-brain ties."
      az: "Lider seçimi zamanı səsvermədə dəqiq səs çoxluğunu (`(N/2) + 1`) təmin etmək və heç-heçə (split-brain) vəziyyətinin qarşısını almaq üçün."
  - front:
      en: "Why should you always supply multiple broker hostnames in `bootstrap.servers`?"
      az: "`bootstrap.servers` konfiqurasiyasına nə üçün həmişə bir neçə broker ünvanı yazılmalıdır?"
    back:
      en: "To ensure the client can connect even if the first broker in the list is temporarily down or rebooting."
      az: "Siyahıdakı ilk broker müvəqqəti sönülü və ya təmirdə olduqda belə müştərinin digər sağlam broker vasitəsilə klasterə qoşula bilməsi üçün."
