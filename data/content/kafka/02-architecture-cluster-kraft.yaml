id: "02-architecture-cluster-kraft"
order: 2
level: "junior"
title:
  en: "Kafka Cluster Architecture: Brokers, KRaft & ZooKeeper"
  az: "Kafka Klaster Arxitekturası: Brokerlər, ZooKeeper və KRaft"
infographic:
  en: |
    ```text
    ┌────────────────────────────────────────────────────────────────────────┐
    │  LEGACY KAFKA ARCHITECTURE: Dependent on Apache ZooKeeper             │
    │  [ZooKeeper Ensemble (Quorum: 3 or 5 Nodes)]                           │
    │     ▲                    ▲                    ▲                        │
    │     │ Metadata & Sync    │ Heartbeats         │ Leader Election        │
    │  [Broker 1] ────────► [Broker 2 (Controller)] ────────► [Broker 3]     │
    │  Drawback: Split-brain risks, slow restarts, limited to ~200k parts.  │
    └────────────────────────────────────────────────────────────────────────┘
                                    VS
    ┌────────────────────────────────────────────────────────────────────────┐
    │  MODERN KAFKA (KRaft Mode - Kafka Raft Metadata): Self-Managed (3.0+)  │
    │  [Broker 1 (Broker Role)]    [Broker 2 (Broker Role)]                  │
    │               ▲                                 ▲                      │
    │               │ Internal __cluster_metadata     │ (Raft Consensus)     │
    │               ▼                                 ▼                      │
    │  [Broker 3 (Combined: Broker + KRaft Active Controller Leader)]        │
    │  [Broker 4 (KRaft Follower)]           [Broker 5 (KRaft Follower)]     │
    │  Superpower: Millions of partitions, instant recovery, 1 engine to run!│
    └────────────────────────────────────────────────────────────────────────┘
    ```
  az: |
    ```text
    ┌────────────────────────────────────────────────────────────────────────┐
    │  KÖHNƏ KAFKA MODELİ: Xarici Apache ZooKeeper-dən Asılılıq              │
    │  [ZooKeeper Klasteri (Kvorum: 3 və ya 5 Server)]                       │
    │     ▲                    ▲                    ▲                        │
    │     │ Metadata Sinxronu  │ Ürək döyüntüləri   │ Lider Seçimləri        │
    │  [Broker 1] ────────► [Broker 2 (Controller)] ────────► [Broker 3]     │
    │  Çatışmazlıq: 2 ayrı sistemi saxlamaq əzabı, yavaş bərpa, partisiya   │
    │               məhdudiyyəti (~200 min partisiya).                       │
    └────────────────────────────────────────────────────────────────────────┘
                                    VS
    ┌────────────────────────────────────────────────────────────────────────┐
    │  MÜASİR KAFKA (KRaft Rejimi - ZooKeeper-siz Kafka 3.0+): Daxili Konsensus│
    │  [Broker 1 (İşçi Broker)]    [Broker 2 (İşçi Broker)]                  │
    │               ▲                                 ▲                      │
    │               │ Daxili __cluster_metadata       │ (Raft Protokolu)     │
    │               ▼                                 ▼                      │
    │  [Broker 3 (Həm İşçi, Həm də KRaft Aktiv Controller Lideri)]           │
    │  [Broker 4 (KRaft İzləyicisi)]         [Broker 5 (KRaft İzləyicisi)]   │
    │  Üstünlük: Milyonlarla partisiya, anında bərpa, vahid sadə arxitektura!│
    └────────────────────────────────────────────────────────────────────────┘
    ```
explanation:
  en: |
    Think of managing a massive international cargo shipping port:
    - **A Broker**: An individual warehouse building. Each broker is an independent server running the Kafka software, storing message logs on its physical hard drives, and serving client requests.
    - **The Cluster**: A group of brokers working together under a unified cluster ID. Even if Warehouse #2 catches fire, Warehouses #1 and #3 keep shipping containers without interruption (**High Availability**).
    - **The Old ZooKeeper Model**: An external, foreign government agency with their own private office building down the street (ZooKeeper). Every time a warehouse added a new shelf or changed a manager, they had to telephone ZooKeeper and wait for approval. It was clumsy, duplicated state, and struggled when the port grew to millions of containers.
    - **The Modern KRaft Model (Kafka Raft)**: The port managers elect their own internal Chief Harbor Master (**KRaft Controller Leader**) directly from among the warehouse captains. Cluster metadata is stored directly inside an ultra-fast internal Kafka topic (`__cluster_metadata`). Startup is instantaneous and can scale to millions of partitions! *(Note: In Apache Kafka 4.0 (2025), ZooKeeper support was completely removed and KRaft is now the sole metadata consensus engine).*

    ### Key Responsibilities of the Controller Broker:
    1. Monitors broker health via heartbeats.
    2. Elects new partition leaders when an active broker crashes.
    3. Manages topic creation, deletion, and partition reassignment.
  az: |
    Böyük bir beynəlxalq dəniz limanının idarə olunmasını təsəvvür edin:
    - **Broker**: Limandakı fərdi bir anbar binasıdır. Hər bir broker Kafka proqramını işlədən, mesajları öz fiziki disklərində saxlayan və müştərilərə xidmət edən müstəqil serverdir.
    - **Klaster**: Vahid identifikator altında birləşmiş brokerlər şəbəkəsidir. 2 nömrəli anbarda nasazlıq yaransa belə, 1 və 3 nömrəli anbarlar işi dərhal öz üzərinə götürür və pipeline dayanmır (**Yüksək Əlçatanlıq - High Availability**).
    - **Köhnə ZooKeeper Modeli**: Küçənin o biri başında yerləşən tamamilə kənar bir dövlət agentliyi kimidir. Limanda hər dəfə yeni rəf tikildikdə və ya menecer dəyişdikdə ZooKeeper agentliyinə zəng edib təsdiq gözləməli olurdular. İki fərqli sistemi idarə etmək çətin idi və klaster böyüdükcə ZooKeeper darboğaza çevrilirdi.
    - **Müasir KRaft Modeli (Kafka Raft)**: Liman kapitanları öz aralarından bir Baş Dispetçer (**KRaft Controller Leader**) seçirlər. Klasterin bütün metadatasını (kim haradadır, hansı partisiya kimdədir) birbaşa daxili `__cluster_metadata` adlı super-sürətli Kafka topiki idarə edir. ZooKeeper-ə ehtiyac qalmır, klaster saniyələr içində açılır və milyonlarla partisiyanı idarə edə bilir! *(Qeyd: Apache Kafka 4.0 (2025) versiyasından etibarən ZooKeeper dəstəyi tamamilə silinmişdir və KRaft yeganə metadata konsensus mühərrikidir).*

    ### Controller Broker-in Əsas Vəzifələri:
    1. Bütün brokerlərin nəbzini (heartbeat) yoxlayaraq sağlamlığını izləyir.
    2. Bir broker öldükdə həmin serverdəki partisiyalar üçün dərhal yeni Lider seçir.
    3. Yeni Topic-lərin yaradılması və ləğv edilməsini klaster boyu koordinasiya edir.
quick_recap:
  en: "A Kafka cluster is composed of multiple Broker nodes. The Controller broker coordinates cluster state. Modern Kafka uses KRaft (Kafka Raft) to manage consensus and metadata natively inside Kafka, fully eliminating external ZooKeeper dependency."
  az: "Kafka klasteri çoxsaylı Broker serverlərindən ibarətdir. Controller broker bütün klasterin vəziyyətini idarə edir. Müasir Kafka (3.0+) ZooKeeper asılılığını tam aradan qaldıraraq öz daxili KRaft (Raft konsensus) arxitekturasından istifadə edir."
code: |
  # Inspecting Kafka Cluster Topology & Broker Metadata via AdminClient
  from confluent_kafka.admin import AdminClient

  admin_conf = {'bootstrap.servers': 'localhost:9092'}
  admin = AdminClient(admin_conf)

  print("=== Querying Kafka Cluster Topology ===")
  # Fetch cluster metadata (timeout: 10s)
  cluster_metadata = admin.list_topics(timeout=10)

  print(f"Originating Broker ID : {cluster_metadata.orig_broker_id}")
  print(f"Originating Broker Name: {cluster_metadata.orig_broker_name}")
  print(f"Cluster Active Brokers Count: {len(cluster_metadata.brokers)}")

  print("\n--- Active Brokers in Cluster ---")
  for broker_id, broker in cluster_metadata.brokers.items():
      print(f"  • Broker ID: {broker_id} ──► Host: {broker.host}:{broker.port}")

  print("\n--- Existing Cluster Topics Sample ---")
  for topic_name, topic_meta in list(cluster_metadata.topics.items())[:3]:
      print(f"  • Topic: '{topic_name}' | Partitions: {len(topic_meta.partitions)}")
code_explanation:
  en: |
    - `AdminClient`: Administrative interface for cluster inspection, dynamic configuration, and topic lifecycle management.
    - `list_topics()`: Contacts the bootstrap broker to retrieve full cluster topology (broker list, rack awareness, topic partition counts, and leader brokers).
    - `cluster_metadata.brokers`: Dictionary mapping broker IDs to host socket addresses.
  az: |
    - `AdminClient`: Klasterin idarə edilməsi, topologiyanın öyrənilməsi və topic parametrlərinin dinamik tənzimlənməsi üçün inzibati interfeysdir.
    - `list_topics()`: Klasterə sorğu göndərərək bütün aktiv brokerlərin ünvanlarını, mövcud topic-ləri və onların partisiya liderlərini gətirir.
    - `cluster_metadata.brokers`: Broker ID-lərini onların IP/port ünvanları ilə əlaqələndirən xəritədir.
