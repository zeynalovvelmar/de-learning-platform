output_description:
  en: "Terminal execution proving deterministic partition stickiness for keys: all cust_A events land on partition 2, cust_B on partition 0, and null-key batching on partition 1."
  az: "Açarların riyazi qanunauyğunluğunu sübut edən terminal çıxışı: cust_A üçün bütün hadisələr 2-ci partisiyaya, cust_B üçün 0-cıya, açarsız mesajlar isə 1-ci partisiyaya qruplaşdırılır."
what_it_does:
  en: "Shows the mechanics of partition assignment, comparing deterministic key hashing against null-key sticky micro-batching."
  az: "Partisiya təyinatının iş prinsiplərini, açarlı deterministik heşləmə ilə açarsız Sticky Partitioner fərqini nümayiş etdirir."
real_world_use:
  en: "Indispensable in financial CDC (Debezium) pipelines. Setting the Primary Key (e.g. `order_id`) as the Kafka message key guarantees that INSERT, UPDATE, and DELETE events are consumed in the exact sequence they happened."
  az: "CDC (Change Data Capture) pipeline-larında əsas açarı (Primary Key) Kafka mesaj açarı etməklə bazadakı INSERT, UPDATE və DELETE əmrlərinin ardıcıllıqla emal olunmasını təmin etmək üçün istifadə olunur."
common_mistakes:
  en: |
    - **Increasing partition counts on keyed topics without a migration strategy**: Breaks key-to-partition mapping immediately.
    - **Creating severe Data Skewness**: Using low-cardinality keys like `country` where 95% of events have `key="US"`. All 95% overwhelm a single partition while other partitions sit idle!
    - **Passing complex non-deterministic objects as keys**: Random dictionaries or floats whose byte serialization varies will scatter the same entity across multiple partitions.
  az: |
    - **Açarlı topic-lərdə düşünmədən partisiya sayını artırmaq**: Bütün keçmiş açar-partisiya xəritəsini dərhal pozur.
    - **Data Skew (Data Skewness — məlumat əyriliyi) yaratmaq**: Cəmi bir neçə fərqli dəyəri olan açarlardan istifadə etmək (məs. ölkə üzrə, bütün hadisələrin 95%-i "AZ" açarı ilə). Nəticədə tək bir partisiya şişir, digərləri boş qalır.
    - **Açar kimi hər dəfə fərqli serializasiya olunan dəyişkən obyektlər ötürmək**: Eyni obyektin fərqli partisiyalara səpələnməsinə səbəb olur.
interview_question:
  question:
    en: "How does the Kafka Producer partitioner assign records to partitions, and what catastrophic issue occurs if you increase partitions on an existing keyed topic?"
    az: "Kafka Producer partitioner mesajları partisiyalara necə bölüşdürür və mövcud açarlı topic-də partisiya sayını artırdıqda hansı fəlakətli problem yaranır?"
  answer:
    en: |
      1. **Partition Assignment Rules**:
         - **Key is Present**: The producer executes a deterministic 32-bit Murmur2 hash on the serialized key bytes: `abs(murmur2(key)) % num_partitions`. As long as `num_partitions` remains constant, records with the identical key will **always** map to the same partition.
         - **Key is Null**: The producer invokes the **Sticky Partitioner** (introduced in Kafka 2.4). It pins records to a single partition until the batch buffer (`batch.size` or `linger.ms`) fills and dispatches, maximizing network throughput and reducing socket calls.
      2. **The Catastrophic Partition Expansion Issue**:
         - The mathematical mapping of keys depends directly on the modulo operator `% num_partitions`.
         - Suppose a topic has 3 partitions and `hash("order_12") = 10`. The modulo calculation is `10 % 3 = 1` (Partition 1).
         - If an engineer expands the topic to 4 partitions, `10 % 4 = 2` (Partition 2!).
         - **Consequence**: All subsequent events for `"order_12"` are now written to Partition 2, while the initial creation event sits in Partition 1. Because Kafka has **no cross-partition ordering guarantees**, a downstream consumer can process an `UPDATE` event from Partition 2 **before** the `INSERT` event from Partition 1!
    az: |
      1. **Bölüşdürmə Qaydaları**:
         - **Açar Varsa**: Producer açarın baytları üzərində deterministik 32-bit Murmur2 heş funksiyasını hesablayır: `abs(murmur2(key)) % num_partitions`. Partisiya sayı sabit qaldığı müddətcə eyni açar **istisnasız həmişə** eyni partisiyaya düşür.
         - **Açar Yoxdursa (Null)**: Producer **Sticky Partitioner** alqoritmini işə salır. O, şəbəkə paketi (`batch.size` və ya `linger.ms`) dolana qədər mesajları tək bir partisiyaya doldurur və sonra digərinə keçir.
      2. **Partisiya Sayı Artırıldıqda Baş Verən Fəlakət**:
         - Açarların təyinatı birbaşa `% num_partitions` qalığından asılıdır.
         - Fərz edək ki, topic 3 partisiyadan ibarətdir və `hash("order_12") = 10`-dur. Düstur: `10 % 3 = 1` (Partisiya 1).
         - Əgər mühəndis partisiya sayını 4-ə qaldırarsa, düstur: `10 % 4 = 2` (Partisiya 2!).
         - **Nəticə**: `"order_12"` üçün bundan sonra gələn bütün hadisələr 2-ci partisiyaya yazılacaq, amma onun ilkin yaradılma hadisəsi 1-ci partisiyada qalıb. Partisiyalararası qlobal ardıcıllıq olmadığı üçün istehlakçı 2-ci partisiyadakı `UPDATE` əmrini 1-ci partisiyadakı `INSERT`-dən **əvvəl** oxuyacaq və sistem çökəcək!
  interviewer_tips:
    en: "Mention the 'Murmur2 hash modulo formula', explain the 'Sticky Partitioner' for null keys, and give the concrete mathematical example showing how changing the modulo divisor breaks per-key sequentiality."
    az: "Müsahibədə 'Murmur2 heş alqoritmi', açarsız mesajlar üçün 'Sticky Partitioner' və partisiya sayı artdıqda riyazi qalığın dəyişməsi nəticəsində eyni obyektin ardıcıllığının necə pozulduğunu rəqəmlərlə nümunə göstərin."
flashcards:
  - front:
      en: "How does Kafka route a message to a partition when the Key is NULL?"
      az: "Mesajın Açarı (Key) NULL olduqda Kafka onu partisiyaya necə yönləndirir?"
    back:
      en: "Via the Sticky Partitioner, which batches records to a single partition until full before rotating."
      az: "Sticky Partitioner vasitəsilə; paket dolana qədər bütün ardıcıl mesajları tək bir partisiyaya doldurur, sonra növbətiyə keçir."
  - front:
      en: "What algorithm does Kafka use to assign keyed messages to partitions?"
      az: "Kafka açarlı mesajları partisiyalara bölmək üçün hansı alqoritmdən istifadə edir?"
    back:
      en: "`abs(murmur2(key)) % num_partitions` (deterministic 32-bit Murmur2 hashing)."
      az: "`abs(murmur2(key)) % num_partitions` (deterministik 32-bit Murmur2 heşləməsi)."
  - front:
      en: "What happens to key-to-partition mapping if you increase the number of partitions on a topic?"
      az: "Topic-in partisiya sayını artırdıqda açar-partisiya xəritəsinə nə olur?"
    back:
      en: "The modulo divisor changes, causing future messages for the same key to hash to different partitions, breaking ordering."
      az: "Riyazi qalıq böləni dəyişir və eyni açara aid yeni mesajlar başqa partisiyalara düşərək ardıcıllığı pozur."
  - front:
      en: "What is Data Skewness in Apache Kafka?"
      az: "Apache Kafka-da Data Skew (Data Skewness — məlumat əyriliyi) nədir?"
    back:
      en: "When an overwhelmingly large volume of messages share the same key, flooding one partition while others sit underutilized."
      az: "Həddindən artıq çox mesajın eyni açara sahib olması nəticəsində tək bir partisiyanın şişməsi, digərlərinin isə boş qalmasıdır."
  - front:
      en: "What are Kafka Message Headers used for?"
      az: "Kafka Mesaj Başlıqları (Headers) nə üçün istifadə olunur?"
    back:
      en: "Carrying optional routing or metadata key-value pairs (e.g. tracing IDs, schemas) without modifying the payload."
      az: "Əsas məlumat gövdəsini (payload) dəyişmədən audit, izləmə (tracing) və ya sxem metadatasını daşımaq üçün."
