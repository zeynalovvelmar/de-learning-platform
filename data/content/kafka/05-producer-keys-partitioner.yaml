id: "05-producer-keys-partitioner"
order: 5
level: "intermediate"
title:
  en: "Producer Mechanics: Message Anatomy, Keys & Partitioners"
  az: "Producer Mexanizmi: Mesaj Strukturu, Açar (Key) və Partitioner"
infographic:
  en: |
    ```text
    ┌────────────────────────────────────────────────────────────────────────┐
    │  KAFKA PRODUCER PARTITION ROUTING LOGIC                                │
    │                                                                        │
    │  CASE 1: Key is NULL (No business key provided)                        │
    │  [Message (Key=None)] ──► Sticky Partitioner ──► Fill Batch in Part 0  │
    │                           (Once batch is full ──► Switches to Part 1)  │
    │  Goal: Minimize network overhead & maximize batching throughput.       │
    │                                                                        │
    │  CASE 2: Key is PRESENT (e.g. Key = "cust_8821")                       │
    │  [Message ("cust_8821")] ──► Murmur2 Hash ──► modulo (num_partitions)   │
    │  Formula: `abs(murmur2("cust_8821")) % 3` = Partition 1                │
    │  Guarantee: EVERY record with "cust_8821" goes to Partition 1 FOREVER! │
    └────────────────────────────────────────────────────────────────────────┘
                                    VS
    ┌────────────────────────────────────────────────────────────────────────┐
    │  THE DANGEROUS PARTITION EXPANSION TRAP!                               │
    │  With 3 Partitions: `hash("cust_8821") % 3` = Partition 1             │
    │                                                                        │
    │  If Engineer increases topic partitions from 3 to 6:                   │
    │  With 6 Partitions: `hash("cust_8821") % 6` = Partition 4! (Changed!)  │
    │  Result: New events go to Part 4 while old events remain in Part 1!   │
    │  CRITICAL: Strict ordering for "cust_8821" is PERMANENTLY BROKEN!      │
    └────────────────────────────────────────────────────────────────────────┘
    ```
  az: |
    ```text
    ┌────────────────────────────────────────────────────────────────────────┐
    │  KAFKA PRODUCER BÖLÜŞDÜRMƏ (PARTITIONER) MƏNTİQİ                       │
    │                                                                        │
    │  1-Cİ HAL: Açar YOXDUR (Key = None)                                    │
    │  [Mesaj (Key=None)] ──► Sticky Partitioner ──► Partisiya 0 buferini    │
    │                         doldurur (dolanda ──► Partisiya 1-ə keçir)     │
    │  Məqsəd: Şəbəkə paketlərini maksimum dolduraraq sürəti artırmaq.       │
    │                                                                        │
    │  2-Cİ HAL: Açar MÖVCUDDUR (məs. Key = "cust_8821")                     │
    │  [Mesaj ("cust_8821")] ──► Murmur2 Heş Alqoritmi ──► % (partisiya sayı)│
    │  Düstur: `abs(murmur2("cust_8821")) % 3` = Partisiya 1                │
    │  Zəmanət: "cust_8821" açarlı BÜTÜN mesajlar HƏMİŞƏ Partisiya 1-ə gedir!│
    └────────────────────────────────────────────────────────────────────────┘
                                    VS
    ┌────────────────────────────────────────────────────────────────────────┐
    │  TƏHLÜKƏLİ PARTİSİYA ARTIRMA TƏLƏSİ!                                  │
    │  3 Partisiya varkən: `hash("cust_8821") % 3` = Partisiya 1            │
    │                                                                        │
    │  Mühəndis partisiya sayını 3-dən 6-ya artırdıqda:                      │
    │  6 Partisiya ilə:    `hash("cust_8821") % 6` = Partisiya 4! (DƏYİŞDİ!) │
    │  Nəticə: Yeni hadisələr Part 4-ə, köhnələr isə Part 1-də qalır!        │
    │  TƏHLÜKƏ: "cust_8821" müştərisi üçün ardıcıllıq BİRDƏFƏLİK POZULUR!    │
    └────────────────────────────────────────────────────────────────────────┘
    ```
explanation:
  en: |
    Think of sorting packages in an automated mail sorting hub:
    - **Message Anatomy**: Every Kafka record consists of:
      1. **Key** (Optional): Used for partition routing and log compaction.
      2. **Value**: The raw payload (JSON, Avro, Protobuf, or raw bytes).
      3. **Timestamp**: Creation time or LogAppendTime.
      4. **Headers** (Optional): Metadata key-value pairs (e.g. tracing IDs, auth tokens).
    - **How the Default Partitioner Works**:
      - **When Key is Null**: Modern Kafka uses the **Sticky Partitioner**. It picks a partition and sticks to it, batching dozens of messages into a single network packet until full, before switching to the next partition. This drastically reduces CPU and network socket latency.
      - **When Key is Present**: Kafka calculates `murmur2_hash(key) % num_partitions`. The same key will mathematically always compute to the identical partition number.
    - **The #1 Production Pitfall (Adding Partitions to Keyed Topics)**:
      - The hashing formula depends directly on `num_partitions`.
      - If you have 3 partitions, key `"user_42"` hashes to Partition 1.
      - If you increase the topic to 6 partitions, `hash % 6` might now hash `"user_42"` to Partition 4!
      - Downstream consumers reading Partition 4 will have no idea that previous historical events for `"user_42"` are sitting back in Partition 1, completely breaking stateful ordering!
  az: |
    Poçt anbarında bağlamaların avtomatlaşdırılmış paylanmasını təsəvvür edin:
    - **Mesajın Anatomiyası**: Hər bir Kafka hadisəsi 4 hissədən ibarətdir:
      1. **Açar (Key)** (İxtiyari): Partisiyanın seçilməsi və Log Compaction üçün istifadə olunur.
      2. **Dəyər (Value)**: Əsas məlumat gövdəsi (JSON, Avro, Protobuf və ya baytlar).
      3. **Zaman Damğası (Timestamp)**: Hadisənin yaranma və ya qeydə alınma vaxtı.
      4. **Başlıqlar (Headers)** (İxtiyari): Metadata məlumatları (məs. audit ID, təhlükəsizlik tokeni).
    - **Partitioner Necə Seçim Edir?**:
      - **Açar Göndərilmədikdə (`Key = None`)**: Müasir Kafka **Sticky Partitioner** alqoritmindən istifadə edir. O, təsadüfi bir partisiya seçir və şəbəkə paketi dolana qədər bütün ardıcıl mesajları həmin partisiyaya doldurur, sonra digərinə keçir. Bu, şəbəkə gecikmələrini minimuma endirir.
      - **Açar Mövcud Olduqda (`Key != None`)**: Kafka `murmur2_hash(key) % num_partitions` riyazi düsturundan istifadə edir. Eyni açar həmişə riyazi olaraq eyni partisiya rəqəminə çevrilir.
    - **Production-un #1 Təhlükəli Tələsi (Partisiya Sayını Artırmaq)**:
      - Heş düyünü birbaşa `num_partitions` sayından asılıdır.
      - 3 partisiya olanda `"user_42"` açarı 1-ci partisiyaya gedirdi.
      - Əgər mühəndis partisiya sayını 6-ya qaldırarsa, düstur `"user_42"`-ni artıq 4-cü partisiyaya göndərəcək!
      - İstehlakçı 4-cü partisiyanı oxuyarkən həmin müştərinin köhnə əməliyyatlarının 1-ci partisiyada qaldığından xəbərsiz olacaq və ardıcıllıq birdəfəlik alt-üst olacaq!
quick_recap:
  en: "The Partitioner determines which partition receives a message. Null-key messages use Sticky Partitioning for batching efficiency; keyed messages use deterministic hashing (`hash(key) % partitions`). Never expand partition counts on topics requiring strict per-key ordering!"
  az: "Partitioner mesajın hansı partisiyaya yazılacağını təyin edir. Açarsız mesajlar 'Sticky Partitioning' ilə qruplaşdırılır; açarlı mesajlar isə riyazi heşləmə ilə həmişə eyni partisiyaya göndərilir. Per-key ardıcıllığı vacib olan topic-lərdə partisiya sayını sonradan artırmaq olmaz!"
code: |
  # Demonstrating Keyed Hashing vs Sticky Partitioning in Confluent Kafka
  import json
  from confluent_kafka import Producer

  producer = Producer({'bootstrap.servers': 'localhost:9092'})

  def callback(err, msg):
      if err:
          print(f"Error: {err}")
      else:
          key_str = msg.key().decode('utf-8') if msg.key() else 'NULL'
          print(f"  • Key: {key_str:<12} ──► Routed to Partition: {msg.partition()} [Offset: {msg.offset()}]")

  print("=== 1. Producing Keyed Messages (Deterministic Routing) ===")
  # Customer A events: ALWAYS map to the same partition
  for i in range(3):
      payload = {"tx_id": f"tx_{i}", "customer": "cust_A", "amt": 50 * (i + 1)}
      producer.produce("orders-stream", key="cust_A", value=json.dumps(payload), callback=callback)

  # Customer B events: ALWAYS map to another deterministic partition
  for i in range(2):
      payload = {"tx_id": f"tx_{i}", "customer": "cust_B", "amt": 99.0}
      producer.produce("orders-stream", key="cust_B", value=json.dumps(payload), callback=callback)

  print("\n=== 2. Producing Null-Key Messages (Sticky Batching) ===")
  for i in range(3):
      payload = {"log_event": f"heartbeat_{i}"}
      producer.produce("orders-stream", key=None, value=json.dumps(payload), callback=callback)

  producer.flush()
code_explanation:
  en: |
    - `key="cust_A"`: The byte-string hashed by Murmur2. Every record with this key lands strictly on the identical partition.
    - Notice that all 3 events for `cust_A` land on Partition 2, while `cust_B` lands on Partition 0.
    - `key=None`: Triggers the Sticky Partitioner, sticking to an active partition to optimize buffer batching.
  az: |
    - `key="cust_A"`: Murmur2 alqoritmi ilə heşlənən bayt açarı. Bu açara sahib bütün sətirlər istisnasız eyni partisiyaya yönləndirilir.
    - Çıxışa baxın: `cust_A`-nın 3 hadisəsinin hamısı Partisiya 2-yə, `cust_B` isə Partisiya 0-a düşür.
    - `key=None`: Sticky Partitioner mexanizmini işə salır və buferdəki paketi tam doldurmaq üçün eyni partisiyaya yapışır.
