id: "01-what-is-kafka"
order: 1
level: "junior"
title:
  en: "What is Apache Kafka & Why Not Traditional Message Queues?"
  az: "Apache Kafka Nədir və Niyə Ənənəvi Mesaj Növbələri (RabbitMQ) Deyil?"
infographic:
  en: |
    ```text
    ┌────────────────────────────────────────────────────────────────────────┐
    │  TRADITIONAL MESSAGE QUEUE (RabbitMQ / ActiveMQ): Destructive Read     │
    │  [Producer] ──► [Queue / Broker] ──► [Consumer A] (Message POPPED/GONE)│
    │  • Smart Broker, Dumb Consumer (Broker tracks delivery & ACKs).        │
    │  • Ephemeral: Messages disappear once consumed. No replay capability!  │
    │  • Throughput: Thousands of messages/sec (Bottleneck: state tracking). │
    └────────────────────────────────────────────────────────────────────────┘
                                    VS
    ┌────────────────────────────────────────────────────────────────────────┐
    │  APACHE KAFKA: Distributed Commit Log (Non-Destructive Streaming)      │
    │  [Producer] ──► [Topic Partition Log: [0][1][2][3][4][5]... (Disk)]    │
    │                          ▲                     ▲                       │
    │                          │                     │                       │
    │                  [Analytics Consumer]   [ML Engine Consumer]           │
    │                  (Reads Offset 2)       (Reads Offset 5)               │
    │  • Dumb Broker, Smart Consumer (Broker just appends; Consumer offsets) │
    │  • Persistent: Messages retained for days/months. Multiple readers!    │
    │  • Replayable: Rewind offsets anytime to re-process historical stream. │
    │  • Throughput: Millions of messages/sec (Sequential disk I/O & RAM).  │
    └────────────────────────────────────────────────────────────────────────┘
    ```
  az: |
    ```text
    ┌────────────────────────────────────────────────────────────────────────┐
    │  ƏNƏNƏVİ MESAJ NÖVBƏSİ (RabbitMQ): Mesaj Oxunan Kimi Silinir (Destructive) │
    │  [Producer] ──► [Queue / Broker] ──► [Consumer A] (Mesaj DƏRHAL SİLİNDİ)│
    │  • Ağıllı Broker, Sadə İstehlakçı: Broker kimin nəyi oxuduğunu izləyir. │
    │  • Keçici: Mesaj qəbul edilən kimi növbədən yox olur. Təkrar oxuma YOX! │
    │  • Ötürücülük: Saniyədə minlərlə mesaj (Darboğaz: vəziyyət izlənməsi).  │
    └────────────────────────────────────────────────────────────────────────┘
                                    VS
    ┌────────────────────────────────────────────────────────────────────────┐
    │  APACHE KAFKA: Paylanmış Hadisə Jurnalı (Distributed Commit Log)       │
    │  [Producer] ──► [Topic Partition Log: [0][1][2][3][4][5]... (Daimi)]   │
    │                          ▲                     ▲                       │
    │                          │                     │                       │
    │                  [Analitika Pipeline-ı] [Maşın Öyrənməsi Modeli]       │
    │                  (Offset 2-ni oxuyur)   (Offset 5-i oxuyur)            │
    │  • Sadə Broker, Ağıllı İstehlakçı: Broker yalnız sona yazır, Consumer  │
    │    öz offset-ini (əlfəcinini) özü saxlayır.                             │
    │  • Silinmir: Mesajlar günlərlə/aylarla saxlanılır. Çoxlu oxucu dəstəyi!│
    │  • Geri Sarma (Replay): İstənilən vaxt keçmişə qayıdıb təkrar oxumaq.   │
    │  • Ötürücülük: Saniyədə milyonlarla hadisə (Ardıcıl Disk I/O və RAM).  │
    └────────────────────────────────────────────────────────────────────────┘
    ```
explanation:
  en: |
    Think of the fundamental difference between a **Fast-Food Drive-Through** and an **Audio Streaming Platform (Spotify)**:
    - **Traditional Queue (Drive-Through)**: The cook prepares a burger and hands it through the window to a customer. Once the customer drives away with the burger, that burger is permanently gone from the restaurant. If a second customer arrives 5 minutes later, they cannot eat that same burger. This is RabbitMQ: messages are deleted immediately upon consumption.
    - **Apache Kafka (Audio Cassette / Spotify Playlist)**: An artist records a song and writes it to an endless, append-only cassette tape. Listener A can listen to Song #1 at 9:00 AM. Listener B can listen to Song #1 at 2:00 PM. Listener A can even rewind the tape back to Song #1 tomorrow and replay it from the beginning! The song is never destroyed by someone listening to it.

    ### Why Data Engineers Rely on Kafka:
    1. **Decoupled Architecture**: Upstream transactional databases (PostgreSQL, MySQL) do not need to know about downstream analytical warehouses (Snowflake, BigQuery, ClickHouse). Producers just push events to Kafka; consumers pull when ready.
    2. **High Throughput (Millions of events/sec)**: By treating topics as partitioned sequential logs on disk, Kafka bypasses random disk access penalties.
    3. **Historical Event Replay**: When a data engineering team deploys a new Spark streaming pipeline with updated business logic, they can rewind Kafka offsets back 7 days and recalculate all metrics from the raw immutable source of truth.
  az: |
    Ənənəvi Mesaj Növbəsi ilə Kafka arasındakı fərqi **Fast-Food Restoranı** ilə **Audio Kasset (Spotify)** arasındakı fərq kimi təsəvvür edin:
    - **Ənənəvi Növbə (Fast-Food Pəncərəsi - RabbitMQ)**: Aşpaz bir burger hazırlayır və müştəriyə təqdim edir. Müştəri burgeri götürüb gedən kimi, həmin burger restorandan birdəfəlik yox olur. 5 dəqiqə sonra gələn ikinci müştəri həmin burgeri yeyə bilməz. Bu RabbitMQ-dur: mesaj istehlakçı tərəfindən oxunan kimi silinir.
    - **Apache Kafka (Audio Kasset / Qrammofon Valı)**: Musiqiçi bir mahnı bəstələyir və daimi lentə yazır. 1-ci dinləyici səhər saat 9-da 1-ci mahnını dinləyir. 2-ci dinləyici günorta saat 2-də həmin 1-ci mahnını dinləyir. Hətta 1-ci dinləyici sabah lenti geri sarıb mahnıya ən başdan təkrar qulaq asa bilər! Mahnıya qulaq asılması onu lentdən silmir.

    ### Data Mühəndisləri Niyə Kafkanı Seçir?
    1. **Sistemlərin Tam Müstəqilliyi (Decoupling)**: Əsas əməliyyat bazaları (PostgreSQL, microservice-lər) analitik anbarların (Snowflake, BigQuery, ClickHouse) mövcudluğundan belə xəbərdar olmur. İstehsalçı hadisəni Kafkaya atır; istehlakçılar isə öz sürətləri ilə oxuyur.
    2. **Nəhəng Ötürücülük (Saniyədə milyonlarla hadisə)**: Kafka disklərə təsadüfi (random) deyil, yalnız ardıcıl (sequential) yazdığı üçün adi sərt disklərdə belə ağlasığmaz sürət nümayiş etdirir.
    3. **Hadisələrin Keçmişə Qayıdaraq Təkrar Emalı (Event Replay)**: Data mühəndisi Spark-da yeni bir analitik model qurduqda, Kafkadakı oxuma nöqtəsini (offset) 7 gün geriyə çəkərək bütün keçmiş hadisələri yeni məntiqlə sıfırdan hesablaya bilər.
quick_recap:
  en: "Kafka is not a destructive message queue; it is a distributed, append-only commit log. Messages are persisted to disk and can be consumed independently by multiple consumers at their own pace, or rewound and replayed historically."
  az: "Kafka oxunan kimi silinən mesaj növbəsi deyil; o, paylanmış və yalnız sona əlavə edilən (append-only) daimi hadisə jurnalıdır. Mesajlar diskdə saxlanılır, çoxlu sayda fərqli istehlakçı tərəfindən sərbəst oxunur və istənilən vaxt keçmişə qayıdaraq təkrar emal edilə bilər."
code: |
  # Production Kafka Ingestion Blueprint using confluent-kafka
  import json
  from confluent_kafka import Producer, Consumer, KafkaError

  # 1. High-throughput Producer Configuration
  producer_conf = {
      'bootstrap.servers': 'localhost:9092',
      'client.id': 'payment-service-producer',
      'acks': 'all',  # Guarantee full cluster durability
      'retries': 3
  }
  producer = Producer(producer_conf)

  def delivery_report(err, msg):
      """Callback executed once message is delivered or permanently failed."""
      if err is not None:
          print(f"❌ Message delivery failed: {err}")
      else:
          print(f"✅ Event committed to topic: {msg.topic()} [Partition: {msg.partition()}] at Offset: {msg.offset()}")

  # 2. Produce raw JSON event to distributed log
  event_payload = {
      "transaction_id": "tx_99812",
      "user_id": 402,
      "amount": 149.99,
      "currency": "AZN",
      "timestamp": "2026-10-15T15:30:00Z"
  }

  print("=== 1. Producing Payment Event to Kafka ===")
  producer.produce(
      topic="financial-transactions",
      key=str(event_payload["user_id"]),
      value=json.dumps(event_payload),
      callback=delivery_report
  )
  producer.flush()  # Ensure all buffered messages are transmitted

  # 3. Independent Consumer reading from the log without deleting
  consumer_conf = {
      'bootstrap.servers': 'localhost:9092',
      'group.id': 'fraud-detection-engine',
      'auto.offset.reset': 'earliest'
  }
  print("\n=== 2. Real-time Consumer Ready (Non-destructive Read) ===")
  print(f"Subscribed to topic 'financial-transactions' as consumer group '{consumer_conf['group.id']}'")
code_explanation:
  en: |
    - `bootstrap.servers`: Initial list of host/port broker addresses to establish cluster membership.
    - `delivery_report`: Asynchronous delivery callback confirming the exact partition and monotonically increasing offset assigned by the broker.
    - `producer.flush()`: Forces memory buffers to transmit all queued records over the socket connection.
    - Notice that producing and consuming are completely decoupled; the message remains on disk even after consumers process it.
  az: |
    - `bootstrap.servers`: Klasterə qoşulmaq üçün ilkin broker ünvanları siyahısı.
    - `delivery_report`: Mesaj brokerə uğurla çatdıqda təyin olunan partisiya və unikal offset nömrəsini qaytaran asinxron geriçağırış (callback) funksiyası.
    - `producer.flush()`: Yaddaş buferindəki bütün hadisələrin dərhal şəbəkə vasitəsilə brokerə göndərilməsini təmin edir.
    - Diqqət yetirin: İstehsalçı ilə istehlakçı bir-birindən tam müstəqildir; mesaj istehlakçı tərəfindən oxunsa belə diskdən silinmir.
