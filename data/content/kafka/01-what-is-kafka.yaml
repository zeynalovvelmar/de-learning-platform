output_description:
  en: "Terminal execution demonstrating the producer writing to partition 1 at offset 1042, followed by a consumer reading the event while leaving it persisted in the commit log."
  az: "Producer-in hadisəni 1-ci partisiyaya 1042 nömrəli offset olaraq yazmasını və Consumer-in mesajı silmədən oxuduğunu göstərən terminal loqu."
what_it_does:
  en: "Establishes a foundational end-to-end event production flow, demonstrating asynchronous callbacks, partition delivery, and non-destructive log reading."
  az: "Kafka-nın təməl hadisə istehsalı axınını qurur, asinxron təsdiqi, partisiya təyinatını və mesajın silinmədən oxunmasını nümayiş etdirir."
real_world_use:
  en: "Used in real-time fintech architectures where every payment swipe must be simultaneously read by Fraud Detection, Notification Service, and the Data Warehouse Lakehouse without contention."
  az: "Bank və maliyyə sistemlərində hər bir kart ödənişinin eyni anda həm Fırıldaqçılıq Aşkarlama (Fraud), həm SMS Bildiriş, həm də Data Lake anbarı tərəfindən bir-birinə mane olmadan oxunmasında istifadə olunur."
common_mistakes:
  en: |
    - **Treating Kafka like a database**: Kafka is an event log, not a query engine. You cannot run random `SELECT * WHERE user_id = 402` queries across historical logs without reading the stream.
    - **Forgetting `producer.flush()`**: confluent-kafka buffers messages in RAM for micro-batching. If your script exits without `.flush()`, buffered events are lost in memory before transmission!
    - **Assuming messages disappear after being read**: Beginners familiar with RabbitMQ often mistakenly assume consumers delete messages.
  az: |
    - **Kafkaya relyasion baza kimi yanaşmaq**: Kafka axtarış bazası deyil, hadisə jurnalıdır. Bütün axını oxumadan təsadüfi `SELECT * WHERE user_id = 402` sorğusu icra etmək olmaz.
    - **`producer.flush()` çağırmağı unutmaq**: `confluent-kafka` şəbəkə yükünü azaltmaq üçün mesajları RAM-da qruplaşdırır (batching). `.flush()` çağırılmasa, proqram bağlandıqda yaddaşdakı mesajlar göndərilmədən itir!
    - **Mesajın oxunduqdan sonra silindiyini zənn etmək**: RabbitMQ təcrübəsi olanlar tez-tez mesajın oxunan kimi bazadan silindiyini düşünürlər.
interview_question:
  question:
    en: "What are the core architectural differences between Apache Kafka and traditional message brokers like RabbitMQ, and why is Kafka preferred for Big Data pipelines?"
    az: "Apache Kafka ilə ənənəvi mesaj növbələri (məsələn RabbitMQ) arasındakı əsas memarlıq fərqləri nədir və nə üçün Big Data pipeline-larında Kafka seçilir?"
  answer:
    en: |
      1. **Log Architecture vs Message Queue**:
         - **RabbitMQ**: Employs a destructive message queue model. Once a consumer acknowledges a message, the broker actively deletes it from the queue. State management (who received what) is handled by the **broker**.
         - **Kafka**: Employs an immutable, distributed **Append-Only Commit Log**. Messages are written sequentially to disk and retained regardless of consumption. State management is handled by the **consumer** tracking its own `offset`.
      2. **Multiple Independent Consumers & Replayability**:
         - In RabbitMQ, fan-out requires routing messages into separate physical queues, duplicating storage.
         - In Kafka, 10 different consumer applications (e.g. Real-time Flink, Spark Streaming, Elasticsearch Ingestion) read the exact same physical partition at different offsets without interference or data duplication. Consumers can rewind offsets to re-process historical data.
      3. **Throughput & Storage**:
         - RabbitMQ stores messages in RAM and degrades as queues grow large.
         - Kafka is built around sequential disk I/O and the OS Page Cache, easily achieving millions of messages per second with multi-terabyte retention.
    az: |
      1. **Hadisə Jurnalı vs Mesaj Növbəsi**:
         - **RabbitMQ**: Dağıdıcı (destructive) növbə modelindən istifadə edir. İstehlakçı mesajı oxuyub təsdiqləyən (ACK) kimi broker onu dərhal silir. "Kimin nəyi oxuduğu" vəziyyətini **broker** öz yaddaşında saxlayır (Ağıllı Broker).
         - **Kafka**: Dəyişməz və yalnız sona yazılan (Append-Only) **Commit Log** modelindən istifadə edir. Mesajlar diskdə saxlanılır və oxunduqda silinmir. Hansı mesajda olduğunu hər bir **istehlakçı (consumer)** öz `offset` göstəricisi ilə özü izləyir (Sadə Broker, Ağıllı İstehlakçı).
      2. **Çoxlu İstehlakçı və Keçmişə Qayıtmaq (Replayability)**:
         - RabbitMQ-da eyni mesajı 5 fərqli xidmətə göndərmək üçün 5 ayrı fiziki növbə yaradılmalı və məlumat 5 dəfə dublikasiya olunmalıdır.
         - Kafkada isə 10 fərqli sistem (məs. Spark Streaming, Flink, DWH anbarı) eyni fiziki partisiya faylını heç bir nüsxələmə olmadan öz sürəti ilə oxuyur və istənilən vaxt offset-i geriyə çəkib keçmiş hadisələri təkrar hesablaya bilir.
      3. **Ötürücülük və Saxlanma Həcmi**:
         - RabbitMQ mesajları RAM-da saxlayır və növbə böyüdükcə sürəti kəskin düşür.
         - Kafka ardıcıl disk I/O və Əməliyyat Sisteminin Page Cache mexanizminə söykəndiyi üçün çoxterabaytlıq məlumatlarda belə saniyədə milyonlarla hadisə sürətini qoruyub saxlayır.
  interviewer_tips:
    en: "Mention these three decisive keywords: 'Append-Only Commit Log', 'Smart Consumer vs Dumb Broker', and 'Offset Replayability'. This instantly demonstrates senior architectural understanding."
    az: "Müsahibəçiyə bu üç qızıl ifadəni mütləq deyin: 'Append-Only Commit Log', 'Smart Consumer vs Dumb Broker (Sadə Broker, Ağıllı İstehlakçı)' və 'Offset Replayability (Hadisələrin keçmişə qayıdaraq təkrar emalı)'."
flashcards:
  - front:
      en: "What is the primary architectural model of Apache Kafka?"
      az: "Apache Kafka-nın əsas memarlıq modeli nədir?"
    back:
      en: "A distributed, horizontally scalable, append-only commit log."
      az: "Paylanmış, horizontal miqyaslana bilən və yalnız sona əlavə edilən (append-only) hadisə jurnalı (commit log)."
  - front:
      en: "What happens to a message in Kafka after a consumer successfully reads it?"
      az: "Kafkada bir istehlakçı mesajı uğurla oxuduqdan sonra həmin mesaja nə olur?"
    back:
      en: "Nothing! The message remains on disk until its retention period expires. It is NOT deleted."
      az: "Heç nə olmur! Mesaj diskdə qalır və silinmir; təyin olunmuş saxlama müddəti (retention) bitənə qədər digər oxucular üçün əlçatan qalır."
  - front:
      en: "What does the concept of 'Smart Consumer, Dumb Broker' mean in Kafka?"
      az: "Kafka-da 'Ağıllı İstehlakçı, Sadə Broker' (Smart Consumer, Dumb Broker) nə deməkdir?"
    back:
      en: "The broker only appends and serves raw logs; each consumer tracks its own reading position (offset)."
      az: "Broker sadəcə məlumatı diskə yazır və təqdim edir; kimin hansı mesajı oxuduğunu isə hər bir istehlakçı öz offset göstəricisi ilə özü idarə edir."
  - front:
      en: "Why is Kafka capable of processing millions of messages per second on standard hard drives?"
      az: "Kafka standart sərt disklərdə belə necə saniyədə milyonlarla mesaj emal edə bilir?"
    back:
      en: "It leverages Sequential Disk Writes (O(1)), OS Page Cache, and Zero-Copy network transfer."
      az: "Ardıcıl disk yazılmasından (Sequential I/O - O(1)), Əməliyyat Sisteminin Page Cache yaddaşından və Zero-Copy şəbəkə ötürülməsindən istifadə edir."
  - front:
      en: "What is 'Event Replay' and why is it critical for Data Engineering?"
      az: "'Event Replay' nədir və Data Mühəndisliyi üçün nə üçün həyati əhəmiyyət daşıyır?"
    back:
      en: "The ability to reset consumer offsets backwards to re-process historical raw data with new logic or fix pipeline bugs."
      az: "Data pipeline-ında xəta olduqda və ya yeni məntiq tətbiq edildikdə, offset-i geriyə çəkərək xammal məlumatları keçmişdən bəri sıfırdan təkrar hesablamaq imkanıdır."
