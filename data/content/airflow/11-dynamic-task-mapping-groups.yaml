interview_question:
  question:
    en: "What is Dynamic Task Mapping in Airflow, and how does `.partial()` differ from `.expand()`? How do Pools prevent dynamic tasks from crashing target databases?"
    az: "Airflow-da Dynamic Task Mapping nədir və `.partial()` ilə `.expand()` arasındakı fərq nədir? Pool-lar dinamik task-ların hədəf bazanı çökdürməsinin qarşısını necə alır?"
  answer:
    en: "Introduced in Airflow 2.3, Dynamic Task Mapping is Airflow's native Map-Reduce feature allowing tasks to spawn dynamically at runtime based on upstream list outputs. `.partial()` supplies parameters that remain static across all mapped instances (e.g. table names, environment), while `.expand()` accepts an iterable and generates one task instance per element. Because `.expand()` can generate hundreds of concurrent tasks, target databases can be overwhelmed with connections. Airflow Pools solve this by assigning tasks to a named pool with a fixed slot capacity (e.g. 5 slots). Even if 200 mapped tasks are ready, only 5 run concurrently while 195 wait in the queue, preventing connection exhaustion."
    az: "Airflow 2.3-də təqdim olunan Dynamic Task Mapping runtime zamanı əvvəlki task-ın qaytardığı siyahıya əsasən dinamik sayda task nüsxəsi yaratmağa imkan verən xüsusiyyətdir. `.partial()` bütün yaranacaq task-lar üçün sabit qalan dəyərləri (məsələn, cədvəl adı, mühit) ötürür, `.expand()` isə siyahı qəbul edərək hər bir element üçün 1 task nüsxəsi yaradır. `.expand()` eyni anda yüzlərlə task yarada bildiyi üçün hədəf verilənlər bazası qoşulma limiti səbəbindən çökə bilər. Airflow Pool-ları buna nəzarət edir: task-a müəyyən slot sayı olan Pool (məsələn: 5 slot) təyin etdikdə, 200 task yaransa belə eyni anda yalnız 5-i bazaya sorğu göndərir, qalan 195-i isə növbədə gözləyir."
  interviewer_tips:
    en: "Clearly explain the Map-Reduce pattern: `.expand()` is the Map phase and the downstream collecting task is the Reduce phase. Mentioning Pools highlights real-world operational maturity."
    az: "Map-Reduce modelini aydın izah edin: `.expand()` Map mərhələsidir, nəticələri toplayan task isə Reduce. Pool-ları qeyd etmək real istehsalat təcrübənizi göstərir."
flashcards:
  - front:
      en: "What Airflow feature allows tasks to be generated dynamically at runtime based on data?"
      az: "Məlumat əsasında runtime zamanı task-ların dinamik yaranmasına hansı Airflow xüsusiyyəti imkan verir?"
    back:
      en: "Dynamic Task Mapping (introduced in Airflow 2.3)."
      az: "Dynamic Task Mapping (Airflow 2.3 versiyasında əlavə olunub)."
  - front:
      en: "In Dynamic Task Mapping, what is the difference between `.partial()` and `.expand()`?"
      az: "Dynamic Task Mapping-də `.partial()` ilə `.expand()` arasındakı fərq nədir?"
    back:
      en: "`.partial()` supplies static arguments shared by all instances, while `.expand()` iterates over a collection to spawn one instance per item."
      az: "`.partial()` bütün nüsxələr üçün ortaq sabit arqumentləri ötürür, `.expand()` isə siyahı üzrə hər elementə 1 task nüsxəsi yaradır."
  - front:
      en: "Why were SubDAGs deprecated in favor of TaskGroups?"
      az: "SubDAG-lar niyə ləğv edildi və TaskGroup-lar ilə əvəzləndi?"
    back:
      en: "SubDAGs used separate DAG runs causing scheduler deadlocks and resource hogging; TaskGroups are lightweight, UI-only grouping constructs."
      az: "SubDAG-lar ayrıca DAG icrası kimi işləyərək scheduler-i kilitləyirdi; TaskGroup isə yalnız UI üçün yüngül və təhlükəsiz qruplaşdırmadır."
  - front:
      en: "What is an Airflow Pool?"
      az: "Airflow Pool nədir?"
    back:
      en: "A concurrency management tool that limits the number of tasks that can run simultaneously against a shared resource or database."
      az: "Ortaq resursa və ya bazaya eyni anda müraciət edə biləcək paralel task-ların sayını məhdudlaşdıran idarəetmə alətidir."
  - front:
      en: "How are dynamically mapped task instances indexed in Airflow logs and UI?"
      az: "Dinamik xəritələnmiş task nüsxələri Airflow loqlarında və interfeysində necə indekslənir?"
    back:
      en: "Zero-based bracket notation: `task_name[0]`, `task_name[1]`, `task_name[2]`, etc."
      az: "Sıfırdan başlayan mötərizə indeksi ilə: `task_adı[0]`, `task_adı[1]`, `task_adı[2]` və s."
