what_it_does:
  en: "Builds a production multi-branch DAG topology, illustrating how bitshift syntax orchestrates concurrent task fan-out and synchronization fan-in."
  az: "Çoxşaxəli paralel DAG quruluşunu nümayiş etdirir, bitshift sintaksisi ilə paralel işləməni və yekun birləşməni tənzimləyir."
real_world_use:
  en: "Standard pattern in nightly corporate ETL where separate fact and dimension tables are extracted and transformed concurrently to fit within tight batch processing SLA windows."
  az: "Gecə ETL pipeline-larında fakt və ölçü (dimension) cədvəllərinin vaxta qənaət etmək üçün paralel emal olunub birgə yüklənməsində tətbiq edilir."
common_mistakes:
  en: |
    - **Using `task_a > task_b` instead of `>>`**: Single greater-than causes a Python syntax error. Always use double bitshift `>>`.
    - **Attempting circular dependencies**: Writing `t1 >> t2 >> t3 >> t1` raises `AirflowDagCycleException` immediately upon file parsing.
    - **Chaining lists directly to lists**: Syntax like `[t1, t2] >> [t3, t4]` is invalid in older Airflow versions; use `airflow.models.baseoperator.chain()` instead.
  az: |
    - **`>>` yerinə tək `>` yazmaq**: Python sintaksis xətası verir. Həmişə qoşa bitshift `>>` yazılmalıdır.
    - **Dövrə yaratmağa cəhd etmək**: `t1 >> t2 >> t3 >> t1` yazmaq Airflow-da qəti qadağandır və dərhal `AirflowDagCycleException` xətası atır.
    - **Siyahını birbaşa siyahıya bağlamaq**: `[t1, t2] >> [t3, t4]` köhnə versiyalarda xəta verir; bunun üçün `chain()` funksiyasından istifadə olunmalıdır.
interview_question:
  question:
    en: "What is the precise object-oriented difference between an Operator, a Task, and a TaskInstance, and how does Airflow handle parallel branch execution?"
    az: "Operator, Task və TaskInstance arasındakı obyekt-yönümlü dəqiq fərq nədir və Airflow paralel şaxələnməni necə idarə edir?"
  answer:
    en: |
      1. **The OOP Relationship**:
         - **Operator**: A Python class defining template logic (e.g. `PythonOperator` knows how to invoke a callable; `BashOperator` executes a subprocess).
         - **Task**: An instantiated object of an Operator assigned a `task_id` inside a DAG context (`extract_task = BashOperator(task_id='extract')`). It is a static blueprint node in the DAG graph.
         - **TaskInstance**: The concrete runtime execution of a Task for a specific `logical_date` (execution interval). It holds dynamic state (`running`, `success`, `failed`, `try_number`, `duration`, `xcom_data`).
      2. **Parallel Branch Execution (Fan-Out / Fan-In)**:
         - Airflow supports parallel branching natively using Python lists and bitshift operators: `t1 >> [t2, t3] >> t4`.
         - When `t1` completes with `success`, the Scheduler sets both `t2` and `t3` to `scheduled` state simultaneously.
         - If worker slots are available in the Executor pool (Celery/K8s), `t2` and `t3` execute concurrently on separate cores or nodes.
         - `t4` evaluates its `trigger_rule` (default: `all_success`). It waits until both `t2` and `t3` reach terminal `success` state before transitioning to `scheduled`.
    az: |
      1. **Obyekt-Yönümlü Fərq**:
         - **Operator**: Görüləcək işin şablon sinfidir (`PythonOperator` funksiya çağırmağı, `BashOperator` isə terminal əmrini icra etməyi bilir).
         - **Task**: Həmin operator sinfindən yaradılmış konkret obyekt və DAG qrafındakı statik qovşaqdır (`t1 = BashOperator(task_id='extract')`).
         - **TaskInstance**: Həmin Task-ın müəyyən bir tarix və vaxt üçün real dinamik icrasıdır. O, cari vəziyyəti (`running`, `success`, `failed`, icra müddəti və loqları) özündə saxlayır.
      2. **Paralel Şaxələnmənin İdarə Edilməsi**:
         - Airflow siyahı və bitshift ilə paralel işləməni dəstəkləyir: `t1 >> [t2, t3] >> t4`.
         - `t1` uğurla bitən kimi Scheduler `t2` və `t3` tapşırıqlarını eyni anda növbəyə qoyur.
         - Əgər klasterdə boş worker yuvası varsa, `t2` və `t3` tamamilə müstəqil serverlərdə paralel icra edilir.
         - `t4` isə öz `trigger_rule` (susmaya görə `all_success`) qaydasına baxır və həm `t2`, həm də `t3` uğurla bitdikdən sonra işə düşür.
  interviewer_tips:
    en: "Define the trio clearly: 'Operator is the Class, Task is the Object, TaskInstance is the Specific Run with State'. Explain that `[t2, t3]` instructs the scheduler to queue both downstream tasks concurrently."
    az: "Müsahibədə üçlüyü aydın ifadə edin: 'Operator Sinifdir, Task Obyektdir, TaskInstance isə konkret vaxtdakı İcradır'. Siyahı formatının (`[t2, t3]`) scheduler-ə eyni anda hər iki işi paralel başlatmaq əmri verdiyini qeyd edin."
flashcards:
  - front:
      en: "What is the difference between an Operator and a Task in Apache Airflow?"
      az: "Apache Airflow-da Operator ilə Task arasındakı fərq nədir?"
    back:
      en: "An Operator is the template class; a Task is an instantiated node configured inside a DAG."
      az: "Operator şablon Python sinfidir; Task isə həmin sinifdən DAG daxilində yaradılmış konkret tapşırıq qovşağıdır."
  - front:
      en: "What does the bitshift expression `t1 >> [t2, t3] >> t4` accomplish?"
      az: "`t1 >> [t2, t3] >> t4` bitshift ifadəsi nəyi həyata keçirir?"
    back:
      en: "`t1` executes first; once complete, `t2` and `t3` run concurrently in parallel, joining back before `t4`."
      az: "`t1` bitdikdən sonra `t2` və `t3` paralel işləyir; hər ikisi tamamlandıqda `t4` başlayır."
  - front:
      en: "What is an `EmptyOperator` used for in production DAGs?"
      az: "Production DAG-larında `EmptyOperator` nə üçün istifadə olunur?"
    back:
      en: "As a visual anchor node to cleanly organize start/end fan-outs without running any code."
      az: "Heç bir kod işlətmədən qrafın başlanğıc və ya son qovşaqlarını vizual birləşdirmək üçün."
  - front:
      en: "What exception is raised if tasks are chained in an infinite circular loop?"
      az: "Tapşırıqlar sonsuz dövrə şəklində bağlandıqda hansı xəta baş verir?"
    back:
      en: "`AirflowDagCycleException` (Airflow strictly forbids cycles in Directed Acyclic Graphs)."
      az: "`AirflowDagCycleException` (Airflow dövrsüz qraflarda dövrələri qəti qadağan edir)."
  - front:
      en: "Where do `retries` and `retry_delay` configurations come from if not set on the task itself?"
      az: "Tapşırığın özündə qeyd edilmədikdə `retries` və `retry_delay` parametrləri haradan götürülür?"
    back:
      en: "They are inherited automatically from the DAG's `default_args` dictionary."
      az: "DAG-ın `default_args` lüğətindən avtomatik miras alınır."
