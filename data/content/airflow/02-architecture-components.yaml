common_mistakes:
  en: |
    - **Using SQLite in production**: SQLite locks the whole file on writes. Airflow becomes strictly single-threaded with zero parallelism. Always use PostgreSQL or MySQL.
    - **Panicking when the Webserver restarts**: Thinking that restarting the Webserver kills running jobs. Workers communicate with the Metadata DB, not the Webserver!
    - **Neglecting Metadata DB cleanup**: Storing millions of task logs and xcoms without running `airflow db clean` causes the metadata database to bloat and slow down the scheduler.
  az: |
    - **İstehsalatda SQLite istifadə etmək**: SQLite hər yazılmada bütün faylı kilidləyir və paralellik sıfıra enir. İstehsalatda mütləq PostgreSQL istifadə edilməlidir.
    - **Webserver sönəndə işlərin dayandığını düşünmək**: Webserver sadəcə ekrandır; worker-lər Webserver-lə deyil, birbaşa Metadata Bazası ilə danışır.
    - **Metadata Bazasını təmizləməmək**: İllərlə yığılan milyonlarla loq və xcom bazanı şişirdir; mütləq vaxtaşırı `airflow db clean` işlədilməlidir.
interview_question:
  question:
    en: "What are the core components of Apache Airflow architecture, what happens if the Metadata Database fails, and what is the lifecycle of a TaskInstance?"
    az: "Apache Airflow arxitekturasının əsas komponentləri hansılardır, Metadata Bazası sıradan çıxarsa nə baş verər və TaskInstance-ın həyat dövrü necədir?"
  answer:
    en: |
      1. **The 5 Core Architectural Components**:
         - **Metadata Database**: The single source of truth (PostgreSQL/MySQL). Stores all DAG definitions, run histories, variables, connections, and task states.
         - **Scheduler**: The heartbeat engine. Continuously parses DAG files from disk, evaluates scheduling intervals, monitors upstream dependencies, and enqueues ready tasks into the Executor.
         - **Webserver**: The user presentation layer. Renders the UI, visualizes DAG graphs, and serves the REST API. Stateless and completely decoupled from task execution.
         - **Workers**: The execution agents. Pick up queued tasks and execute user Python/Bash code inside isolated processes or Kubernetes pods.
         - **Triggerer**: The async event monitor. Uses Python `asyncio` to monitor deferred tasks (sensors) with near-zero worker resource footprint.
      2. **What Happens if the Metadata DB Fails?**:
         - **Complete Platform Paralysis**: The entire Airflow cluster halts immediately. The Scheduler cannot advance states, the Webserver throws 500 errors, and Workers cannot commit task exit codes. This is why production Airflow mandates High-Availability (HA) managed database instances (e.g. AWS Aurora PostgreSQL or GCP Cloud SQL).
      3. **TaskInstance Lifecycle Progression**:
         - `None`: Initial uninstantiated state.
         - `Scheduled`: Dependencies are satisfied, and execution slot is allocated by the scheduler.
         - `Queued`: Dispatched to the executor's message queue (Celery/K8s).
         - `Running`: Actively executing on a worker node.
         - `Success / Failed / Upstream_Failed / Skipped`: Final terminal state written back to the DB.
    az: |
      1. **5 Əsas Arxitektur Komponent**:
         - **Metadata Verilənlər Bazası**: Tək həqiqət mərkəzidir (PostgreSQL). Bütün DAG-ların, icra tarixlərinin, parolların və tapşırıq vəziyyətlərinin saxlandığı yerdir.
         - **Scheduler**: Mərkəzi ürəkdir. Diskdəki DAG fayllarını fasiləsiz oxuyur, vaxtı və asılılıqları yoxlayır və hazır tapşırıqları icra üçün növbəyə atır.
         - **Webserver**: İstifadəçi interfeysidir (UI). Qrafikləri və loqları göstərir. Tapşırıqların icrası ilə heç bir əlaqəsi yoxdur; sönsə belə kəmərlər dayanmır.
         - **Worker-lər**: Fəhlələrdir. Növbədəki tapşırıqları götürüb Python/Bash kodunu fiziki maşında və ya K8s podunda icra edir.
         - **Triggerer**: Asinxron gözləyicidir. Sensorları worker yuvalarını məşğul etmədən `asyncio` ilə arxa planda yüngül şəkildə izləyir.
      2. **Metadata Bazası Sıradan Çıxarsa Nə Baş Verər?**:
         - **Bütün Sistem Tamamilə Donur**: Scheduler heç bir vəziyyəti yeniləyə bilmir, Webserver 500 xətası verir, Worker-lər nəticəni yaza bilmir. Buna görə də istehsalatda mütləq High-Availability (HA) PostgreSQL klasteri (məs. AWS Aurora) tələb olunur.
      3. **TaskInstance Həyat Dövrü**:
         - `None` ──► `Scheduled` (Vaxt çatıb, növbə gözləyir) ──► `Queued` (İcraçıya göndərildi) ──► `Running` (Worker-də işləyir) ──► `Success` (Uğurlu) və ya `Failed` (Uğursuz).
  interviewer_tips:
    en: "Explicitly highlight that the Webserver is purely cosmetic: if the webserver crashes, tasks keep running! State that the Metadata Database is the single point of failure (SPOF) requiring HA replication."
    az: "Müsahibədə Webserver-in sadəcə vizual qat olduğunu (sönsə belə kəmərlərin işlədiyini), əsas kritik darboğazın (SPOF) isə Metadata Bazası olduğunu qeyd edin."
flashcards:
  - front:
      en: "What is the single source of truth for all state in Apache Airflow?"
      az: "Apache Airflow-da bütün vəziyyətlərin yeganə həqiqət mənbəyi nədir?"
    back:
      en: "The Metadata Database (typically PostgreSQL or MySQL)."
      az: "Metadata Verilənlər Bazası (adətən PostgreSQL və ya MySQL)."
  - front:
      en: "What happens to currently running pipeline tasks if the Airflow Webserver crashes?"
      az: "Airflow Webserver-i qəzaya uğrayıb sönsə, hazırda işləyən kəmərlərə nə olar?"
    back:
      en: "Nothing! Running tasks continue completely unaffected because Workers interact with the Metadata DB, not the Webserver."
      az: "Heç nə olmaz! İşlər fasiləsiz davam edir, çünki Worker-lər Webserver-lə deyil, birbaşa Metadata Bazası ilə işləyir."
  - front:
      en: "What component continuously parses DAG files and schedules tasks whose dependencies are met?"
      az: "DAG fayllarını fasiləsiz analiz edən və asılılıqları ödənən tapşırıqları planlayan komponent hansıdır?"
    back:
      en: "The Airflow Scheduler."
      az: "Airflow Scheduler (Planlayıcı)."
  - front:
      en: "What is the difference between a Task and a TaskInstance in Airflow?"
      az: "Airflow-da Task ilə TaskInstance arasındakı fərq nədir?"
    back:
      en: "A Task is the conceptual definition in code; a TaskInstance is a specific execution of that task for a specific point in time."
      az: "Task kodda yazılmış konseptual tərifdir; TaskInstance isə həmin tapşırığın müəyyən bir tarix və vaxt üçün real icrasıdır."
  - front:
      en: "What problem does the Airflow Triggerer solve?"
      az: "Airflow Triggerer komponenti hansı problemi həll edir?"
    back:
      en: "It runs asynchronous event-driven checks (deferrable sensors) without consuming expensive worker slots."
      az: "Sensorların kənar hadisələri gözləməsini bahalı worker yuvalarını kilidləmədən asinxron (asyncio) şəkildə təmin edir."
