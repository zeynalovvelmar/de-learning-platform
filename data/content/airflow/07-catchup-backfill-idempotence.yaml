interview_question:
  question:
    en: "What is an idempotent pipeline? How do you ensure your Airflow DAGs are idempotent, and why does this matter during task retries or backfills?"
    az: "İdempotent boru kəməri nədir? Airflow DAG-larınızın idempotent olmasını necə təmin edirsiniz və bunun təkrar icralarda (retries/backfill) əhəmiyyəti nədir?"
  answer:
    en: "An idempotent pipeline guarantees that executing the same task multiple times with the same input parameters (e.g. for logical_date '2026-10-10') always produces the exact same end state without side effects or duplicates. We achieve idempotency by: (1) using partition overwrites (`INSERT OVERWRITE` in Spark/Hive/Snowflake) instead of naive `INSERT INTO`, (2) performing a transaction with `DELETE FROM table WHERE partition_date = '{{ ds }}'` before inserting, or (3) using UPSERT/MERGE with unique keys. This is critical because distributed systems inevitably fail; when Airflow automatically retries a failed task or an engineer triggers a backfill, idempotence guarantees business numbers never get duplicated."
    az: "İdempotent boru kəməri eyni parametr və eyni tarix üçün (`logical_date`) bir neçə dəfə icra edildikdə belə, yekunda eyni nəticəni verən və heç bir dublikat yaratmayan sistemdir. Biz bunu 3 üsulla təmin edirik: (1) adi `INSERT INTO` əvəzinə `INSERT OVERWRITE PARTITION` istifadə edərək, (2) məlumatı yazmazdan əvvəl həmin günün köhnə məlumatını silən (`DELETE WHERE date = '{{ ds }}'`) tranzaksiya quraraq, (3) unikal açarlar üzrə `MERGE` (Upsert) tətbiq edərək. Bu ona görə həyati əhəmiyyət daşıyır ki, paylanmış sistemlərdə xətalar qaçılmazdır; Airflow xətadan sonra task-ı təkrar işə saldıqda və ya biz keçmişi yenidən hesabladıqda (backfill), idempotentlik maliyyə və biznes göstəricilərinin ikiqat artmasının qarşısını alır."
  interviewer_tips:
    en: "Distinguish between 'INSERT OVERWRITE' and naive 'INSERT INTO'. Explaining that naive inserts cause dashboard duplication during retries is one of the quickest ways to convince an interviewer of your production readiness."
    az: "'INSERT OVERWRITE' ilə adi 'INSERT INTO' arasındakı fərqi izah etmək və dublikatların hesabatları korlamasını qeyd etmək istehsalat təcrübənizi sübut edən ən güclü arqumentdir."
flashcards:
  - front:
      en: "What happens if a DAG has `start_date` set to 1 year ago and `catchup=True`?"
      az: "Əgər DAG-ın `start_date`-i 1 il əvvələ qoyulsa və `catchup=True` olarsa, nə baş verər?"
    back:
      en: "Airflow immediately triggers 365 DAG runs at once, overwhelming workers, queues, and external databases."
      az: "Airflow dərhal eyni anda 365 DAG icrası başladır, worker-ləri, növbələri və xarici bazaları kilitləyir."
  - front:
      en: "What is the recommended setting for `catchup` in production DAGs?"
      az: "İstehsalat DAG-larında `catchup` parametri üçün tövsiyə olunan dəyər nədir?"
    back:
      en: "`catchup=False`. Historical runs should be performed deliberately using the CLI `airflow dags backfill` command."
      az: "`catchup=False`. Keçmiş icralar yalnız ehtiyac olduqda CLI `airflow dags backfill` əmri ilə idarə olunmalıdır."
  - front:
      en: "What is the definition of an idempotent task in data engineering?"
      az: "Data mühəndisliyində idempotent task-ın tərifi nədir?"
    back:
      en: "A task that produces the exact same outcome whether it is executed once or multiple times for the same input."
      az: "Eyni giriş məlumatı üçün 1 dəfə və ya dəfələrlə icra olunmasından asılı olmayaraq tamamilə eyni yekun nəticəni verən task."
  - front:
      en: "Why is a naive `INSERT INTO` SQL statement dangerous during Airflow task retries?"
      az: "Airflow task təkrar icralarında (retries) adi `INSERT INTO` SQL əmri niyə təhlükəlidir?"
    back:
      en: "It appends rows again on every retry, leading to duplicate records and inaccurate analytics."
      az: "Hər təkrar icrada məlumatı yenidən əlavə edərək dublikat sətirlər yaradır və analitikanı korlayır."
  - front:
      en: "Name two SQL techniques used to make a data warehouse loading task idempotent."
      az: "Verilənlər anbarına məlumat yazma task-ını idempotent etmək üçün istifadə olunan iki SQL texnikası hansıdır?"
    back:
      en: "1) `INSERT OVERWRITE PARTITION`, and 2) `DELETE WHERE partition_key = '...'` followed by `INSERT` (or `MERGE` / Upsert)."
      az: "1) `INSERT OVERWRITE PARTITION`, və 2) `DELETE WHERE partition_key = '...'` etdikdən sonra `INSERT` (və ya `MERGE` / Upsert)."
