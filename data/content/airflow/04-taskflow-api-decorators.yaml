common_mistakes:
  en: |
    - **Returning huge objects from `@task` functions**: Returning a 500 MB Pandas DataFrame writes 500 MB directly into the PostgreSQL Metadata DB, degrading cluster performance!
    - **Forgetting to invoke the decorated DAG function**: Writing `@dag def my_dag(): ...` without calling `my_dag()` at the bottom leaves the DAG unregistered!
    - **Mixing decorated task calls with uncalled references**: Passing the function name `validate_and_transform` instead of calling it `validate_and_transform(data)`.
  az: |
    - **`@task` funksiyasından nəhəng obyektlər return etmək**: Funksiyadan 500 MB-lıq DataFrame qaytarmaq həmin 500 MB-ı birbaşa PostgreSQL metadata bazasına doldurur və sistemi iflic edir!
    - **Dekorasiya edilmiş DAG funksiyasını çağırmağı unutmaq**: Faylın sonunda `pipeline_instance = taskflow_pipeline()` çağırılmazsa, Airflow DAG-ı görməyəcək.
    - **Funksiyanı çağırmaq əvəzinə sadəcə adını ötürmək**: Mötərizəsiz `validate_and_transform` yazmaq tapşırığı işə salmır.
interview_question:
  question:
    en: "What is the TaskFlow API in Apache Airflow 2.x, how does it simplify DAG authoring compared to classic operators, and how are task dependencies inferred?"
    az: "Apache Airflow 2.x-də TaskFlow API nədir, klassik operatorlarla müqayisədə DAG yazılışını necə sadələşdirir və tapşırıq asılılıqları necə müəyyən olunur?"
  answer:
    en: |
      1. **Definition of TaskFlow API**:
         - Introduced in Airflow 2.0 (AIP-31), the TaskFlow API allows data engineers to author DAGs and Tasks using native Python decorators (`@dag`, `@task`).
         - It eliminates the boilerplate of `PythonOperator`, `op_args`, `op_kwargs`, and manual XCom method calls.
      2. **Key Simplifications over Classic Operators**:
         - **Automated XCom Handling**: Any value returned by a `@task` function is automatically serialized and pushed to XCom. When passed into another `@task` function, Airflow automatically pulls and deserializes it.
         - **Implicit Graph Dependency Deduction**: Calling `task_b(task_a())` implicitly declares an upstream/downstream dependency (`task_a >> task_b`). Airflow infers the DAG structure from the data flow without requiring manual bitshift operators.
      3. **Interoperability & Custom Decorators**:
         - TaskFlow is not exclusive: classic operators (like `BashOperator` or `KubernetesPodOperator`) and TaskFlow tasks can be chained together freely using `>>`.
         - It also includes specialized decorators like `@task.branch`, `@task.docker`, `@task.kubernetes`, and `@task.sensor`.
    az: |
      1. **TaskFlow API-nin Tərifi**:
         - Airflow 2.0 ilə gələn TaskFlow API, DAG və tapşırıqları birbaşa doğma Python dekoratorları (`@dag`, `@task`) vasitəsilə yazmağa imkan verən müasir paradiqmadır.
         - O, `PythonOperator`, `op_kwargs` və əl ilə yazılan mürəkkəb XCom kodlarını aradan qaldırır.
      2. **Klassik Operatorlardan Üstünlükləri**:
         - **Avtomatlaşdırılmış XCom**: `@task` funksiyasının `return` etdiyi hər bir dəyər avtomatik olaraq XCom-a yazılır və növbəti funksiyaya ötürüldükdə avtomatik oxunur.
         - **Avtomatik Asılılıq Çıxarışı**: `b(a())` yazdıqda Airflow data axınından anlayır ki, `a` tapşırığı `b`-dən əvvəl işləməlidir (`a >> b`) və qrafı özü qurur.
      3. **Hibrid Dəstək və Xüsusi Dekoratorlar**:
         - TaskFlow klassik operatorları kənara atmır: `BashOperator` və ya `KubernetesPodOperator` ilə TaskFlow funksiyaları `>>` vasitəsilə asanlıqla bir-birinə bağlanır.
         - Eyni zamanda `@task.branch`, `@task.docker` və `@task.kubernetes` kimi ixtisaslaşmış dekoratorlar təqdim edir.
  interviewer_tips:
    en: "Demonstrate modern knowledge by calling TaskFlow 'the idiomatic Pythonic standard for Airflow 2.x'. Explain that returning a value automatically pushes to XCom, while input arguments automatically pull from XCom."
    az: "Müsahibədə TaskFlow-u 'Airflow 2.x üçün sənaye standartı olan Pythonic yanaşma' adlandırın və `return` dəyərinin avtomatik XCom-a yazıldığını, arqumentin isə avtomatik XCom-dan oxunduğunu vurğulayın."
flashcards:
  - front:
      en: "What decorator turns a Python function into an Airflow task in Airflow 2.x?"
      az: "Airflow 2.x-də hansı dekorator Python funksiyasını Airflow tapşırığına çevirir?"
    back:
      en: "The `@task` decorator from `airflow.decorators`."
      az: "`airflow.decorators` modulundan `@task` dekoratoru."
  - front:
      en: "How are XCom values handled automatically within TaskFlow API functions?"
      az: "TaskFlow API funksiyalarında XCom dəyərləri avtomatik necə idarə olunur?"
    back:
      en: "Function return values are automatically pushed to XCom; input parameters automatically pull from XCom."
      az: "Funksiyanın return dəyəri avtomatik XCom-a yazılır; giriş arqumentləri isə avtomatik XCom-dan oxunur."
  - front:
      en: "How does Airflow infer dependencies between two `@task` functions without bitshift operators?"
      az: "Airflow bitshift operatoru olmadan iki `@task` funksiyası arasındakı asılılığı necə müəyyən edir?"
    back:
      en: "By analyzing function calls where the output of one task is passed as an argument to another (`task_b(task_a())`)."
      az: "Bir tapşırığın nəticəsinin digərinə arqument kimi ötürüldüyünü analiz edərək (`task_b(task_a())`)."
  - front:
      en: "Can you combine TaskFlow decorated tasks with classic operators (e.g. `BashOperator`) in the same DAG?"
      az: "Eyni DAG daxilində TaskFlow tapşırıqları ilə klassik operatorları (`BashOperator`) birləşdirmək olarmı?"
    back:
      en: "Yes! They can be chained together seamlessly using standard bitshift operators (`>>` and `<<`)."
      az: "Bəli! Onlar standart bitshift (`>>` və `<<`) operatorları ilə asanlıqla bir-birinə bağlana bilir."
  - front:
      en: "What decorator is used in TaskFlow API to define conditional branching logic?"
      az: "TaskFlow API-də şərti budaqlanma məntiqini yazmaq üçün hansı dekoratordan istifadə olunur?"
    back:
      en: "The `@task.branch` decorator."
      az: "`@task.branch` dekoratoru."
