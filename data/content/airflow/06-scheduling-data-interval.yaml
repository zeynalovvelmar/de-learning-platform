output_description:
  en: "Demonstrates that a task executing on October 16th at 01:00 UTC actually processes the data window covering October 15th 01:00 to October 16th 01:00."
  az: "16 Oktyabr saat 01:00-da icra olunan task-ın əslində 15 Oktyabr saat 01:00 ilə 16 Oktyabr saat 01:00 arasındakı məlumat pəncərəsini emal etdiyini sübut edir."
interview_question:
  question:
    en: "Explain the difference between `logical_date` (formerly `execution_date`) and the physical time a task runs. Why does Airflow trigger a DAG after the data interval ends?"
    az: "`logical_date` (əvvəllər `execution_date`) ilə task-ın fiziki icra vaxtı arasındakı fərqi izah edin. Niyə Airflow DAG-ı interval bitdikdən sonra işə salır?"
  answer:
    en: "In Airflow, `logical_date` represents the start of the data period being processed, not the wall-clock execution time. Because batch pipelines aggregate data over a fixed time period (e.g., daily from 00:00 to 23:59), the pipeline cannot execute until that period is 100% complete. Therefore, a daily DAG for October 1st physically triggers at the end of the interval, which is October 2nd 00:00 UTC."
    az: "Airflow-da `logical_date` task-ın fiziki işlədiyi saatı deyil, emal olunan məlumat pəncərəsinin başlanğıc anını təmsil edir. Çünki batch pipeline-ları müəyyən zaman aralığının məlumatını yığır (məsələn, 00:00-dan 23:59-a qədər). Həmin zaman aralığı 100% başa çatmadan onu emal etmək olmaz. Buna görə də 1 Oktyabr üçün nəzərdə tutulan gündəlik DAG fiziki olaraq yalnız interval bitdikdə — yəni 2 Oktyabr saat 00:00-da işə düşür."
  interviewer_tips:
    en: "Clarifying that `execution_date` was renamed to `logical_date` in Airflow 2.2 (and completely removed in Airflow 3.0) to prevent semantic confusion shows the interviewer you are up to date with modern Airflow architecture."
    az: "Airflow 2.2 versiyasında çaşqınlığı aradan qaldırmaq üçün `execution_date`-in `logical_date` olaraq dəyişdirildiyini (və Airflow 3.0-da tamamilə silindiyini) qeyd etmək müasir Airflow biliklərinizi sübut edir."
flashcards:
  - front:
      en: "When does Airflow physically trigger a scheduled DAG run?"
      az: "Airflow qrafik üzrə təyin edilmiş DAG-ı fiziki olaraq nə vaxt işə salır?"
    back:
      en: "At the END of its data interval (`data_interval_end`), not at the beginning."
      az: "Məlumat intervalının başlanğıcında deyil, SONUNDA (`data_interval_end`)."
  - front:
      en: "What does `logical_date` represent in Airflow?"
      az: "Airflow-da `logical_date` nəyi təmsil edir?"
    back:
      en: "The start timestamp of the data interval that the DAG run is responsible for processing."
      az: "DAG icrasının emal etməli olduğu məlumat intervalının başlanğıc zaman damğasını."
  - front:
      en: "What was `logical_date` formerly known as in Airflow 1.x?"
      az: "Airflow 1.x-də `logical_date` əvvəllər necə adlanırdı?"
    back:
      en: "`execution_date`, which was renamed in Airflow 2.2 (and removed in Airflow 3.0) because it caused confusion with actual execution time."
      az: "`execution_date`. Fiziki icra saatı ilə qarışdırıldığı üçün Airflow 2.2-də adı dəyişdirildi (və Airflow 3.0-da silindi)."
  - front:
      en: "Why should you avoid using Python's `datetime.now()` in your DAG extraction queries?"
      az: "DAG daxilindəki SQL sorğularında niyə Python-un `datetime.now()` funksiyasından qaçınmaq lazımdır?"
    back:
      en: "It makes runs non-deterministic, making backfills or re-runs of historical dates impossible."
      az: "Bu icranı qeyri-müəyyən (non-deterministic) edir və keçmiş tarixlər üçün backfill etməyi mümkünsüz edir."
  - front:
      en: "Which Airflow context variables define the exact boundaries of a run's time window?"
      az: "DAG icrasının zaman pəncərəsinin dəqiq sərhədlərini hansı Airflow context dəyişənləri müəyyən edir?"
    back:
      en: "`data_interval_start` and `data_interval_end`."
      az: "`data_interval_start` və `data_interval_end`."
