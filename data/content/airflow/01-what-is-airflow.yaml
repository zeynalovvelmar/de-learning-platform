  az: "3 tapşırığın hər birinin yaşıl (uğurlu) rənglə başa çatdığını göstərən Airflow UI Grid görünüşü və terminal icra loqları."
what_it_does:
  en: "Demonstrates core DAG definition, default task argument inheritance, operator instantiation, and linear graph dependency chaining."
  az: "Təməl DAG tərifini, ortaq parametr ötürülməsini, operatorların yaradılmasını və `>>` ilə asılılıq zəncirinin qurulmasını nümayiş etdirir."
real_world_use:
  en: "The standard backbone of production data platforms. Daily pipelines coordinate ingestion, Spark transformations, dbt validation, and BI dashboard caching."
  az: "Production data platformalarının əsasıdır. Hər gecə məlumatların çəkilməsi, Spark-da emalı və analitik panellərə yüklənməsi bu cür DAG-larla koordinasiya olunur."
common_mistakes:
  en: |
    - **Processing heavy data inside Airflow**: Reading a 5 GB CSV with `pandas.read_csv()` inside `PythonOperator` consumes all worker memory, killing the host.
    - **Creating dynamic `start_date = datetime.now()`**: Changes every time the scheduler parses the file, preventing tasks from ever scheduling cleanly! Always use a fixed historical date (e.g. `datetime(2026, 1, 1)`).
    - **Forgetting `catchup=False`**: If `start_date` is 1 year ago and `catchup` is omitted (defaults to True), Airflow immediately fires 365 simultaneous runs, overwhelming your database.
  az: |
    - **Ağır məlumatı birbaşa Airflow daxilində emal etmək**: `PythonOperator` daxilində `pandas.read_csv()` ilə 5 GB fayl oxumaq worker-in yaddaşını partladır və Airflow-u çökdürür.
    - **`start_date = datetime.now()` yazmaq**: Scheduler faylı hər oxuyanda vaxt dəyişir və Airflow heç vaxt işi başlada bilmir! Həmişə sabit keçmiş tarix yazılmalıdır (`datetime(2026, 1, 1)`).
    - **`catchup=False` yazmağı unutmaq**: Əgər `start_date` 1 il əvvəldirsə, Airflow keçmiş 365 günün hər biri üçün eyni anda yüzlərlə iş qaldıraraq verilənlər bazasını donduracaq.
interview_question:
  question:
    en: "What is Apache Airflow, what is the fundamental difference between Orchestration and Computation, and why shouldn't you process Big Data inside Airflow workers?"
    az: "Apache Airflow nədir, Orkestrasiya ilə Hesablama arasındakı fundamental fərq nədir və nə üçün Böyük Məlumatları (Big Data) birbaşa Airflow worker-ləri daxilində emal etmək olmaz?"
  answer:
    en: |
      1. **Definition of Apache Airflow**:
         - Airflow is an open-source platform programmatically authoring, scheduling, and monitoring workflows as **Directed Acyclic Graphs (DAGs)**.
         - It is a **workflow orchestrator**, coordinating when, where, and in what order tasks run across external systems.
      2. **Orchestration vs Computation**:
         - **Orchestration**: The control plane. Tracking dependencies, retries, schedules, failure alerting, and SLAs. It is the "Conductor of the Orchestra".
         - **Computation**: The data plane. The actual heavy lifting of processing gigabytes/terabytes of data (filtering, joining, aggregating). The "Musicians in the Orchestra".
      3. **Why Big Data Belongs Outside Airflow**:
         - Airflow worker processes are lightweight Python environments meant for coordination, not distributed computing.
         - If an engineer runs `pd.read_csv()` on multi-gigabyte datasets inside an Airflow worker, it triggers excessive CPU consumption, JVM Garbage Collection freezes, and fatal Out-Of-Memory (OOM) operating system kills.
         - **Production Standard**: Airflow should trigger external distributed engines (e.g. submitting a PySpark job to Databricks/EMR, executing SQL in Snowflake, or triggering dbt models) and merely monitor the job to completion.
    az: |
      1. **Apache Airflow-un Tərifi**:
         - Airflow pipeline-ları proqramlaşdırılmış **Birtərəfli Dövrsüz Qraflar (DAG)** şəklində quran, planlayan və monitorinq edən açıq mənbəli orkestrasiya platformasıdır.
         - O, tapşırıqların hansı ardıcıllıqla və nə vaxt işləyəcəyini tənzimləyən **orkestrator (baş menecer)** rolunu oynayır.
      2. **Orkestrasiya vs Hesablama Fərqi**:
         - **Orkestrasiya (İdarəetmə Müstəvisi)**: Tapşırıqların asılılıqlarını izləmək, xətada təkrar başlatmaq, vaxt cədvəlini saxlamaq və bildiriş göndərməkdir. "Orkestrin Dirijorudur".
         - **Hesablama (Məlumat Müstəvisi)**: Terabaytlarla datanı oxumaq, süzgəcdən keçirmək və aqreqasiya etməkdir. "Orkestrdəki Musiqiçilərdir".
      3. **Böyük Məlumat Niyə Airflow Daxilində Emal Edilə Bilməz?**:
         - Airflow worker-ləri sadəcə koordinasiya üçün nəzərdə tutulmuş yüngül Python prosesləridir; onlar paylanmış hesablama klasteri deyildir.
         - Əgər mühəndis worker daxilində Pandas ilə böyük faylları emal etməyə çalışarsa, serverin yaddaşı tükənər və Əməliyyat Sistemi Airflow prosesini OOM (Out Of Memory) ilə məhv edər.
         - **Production Qaydası**: Airflow işi kənar paylanmış güclü mühərriklərə həvalə etməlidir (məs. Spark işini Databricks klasterinə göndərmək, Snowflake-də SQL başlatmaq və ya dbt modelini tətikləmək) və sadəcə onların uğurla bitməsini gözləməlidir.
  interviewer_tips:
    en: "Strictly emphasize the mantra 'Airflow is an orchestrator, not an execution engine'. Mention that Airflow workers delegate heavy data lifting to external distributed systems like Spark, Trino, or Snowflake."
    az: "Müsahibədə qətiyyətlə deyin: 'Airflow orkestratordur, hesablama mühərriki deyil'. Airflow-un sadəcə xarici hesablama mühərriklərini (Spark, Snowflake, dbt) kənardan idarə etdiyini vurğulayın."
flashcards:
  - front:
      en: "What does DAG stand for in Apache Airflow?"
      az: "Apache Airflow-da DAG nə deməkdir?"
    back:
      en: "Directed Acyclic Graph — a mathematical graph of tasks connected by directional edges without circular loops."
      az: "Birtərəfli Dövrsüz Qraf (Directed Acyclic Graph) — dövrələri olmayan və istiqamətlənmiş oxlarla bağlanan tapşırıqlar şəbəkəsidir."
  - front:
      en: "What is the core distinction between an Orchestrator and an Execution Engine?"
      az: "Orkestrator ilə Hesablama Mühərriki arasındakı əsas fərq nədir?"
    back:
      en: "An orchestrator coordinates schedules and task dependencies; an execution engine (like Spark) performs the heavy data processing."
      az: "Orkestrator işlərin cədvəlini və asılılıqlarını koordinasiya edir; hesablama mühərriki (Spark kimi) isə xammal məlumatları emal edir."
  - front:
      en: "Why should you never use `datetime.now()` for a DAG's `start_date`?"
      az: "DAG-ın `start_date` parametrinə nə üçün heç vaxt `datetime.now()` yazmaq olmaz?"
    back:
      en: "Because `datetime.now()` evaluates dynamically on every scheduler parsing cycle, preventing tasks from ever triggering."
      az: "Çünki `datetime.now()` scheduler faylı hər yoxlayanda cari vaxta dəyişir və tapşırıqlar heç vaxt icra olunmur."
  - front:
      en: "What does `catchup = False` prevent when deploying a new DAG?"
      az: "Yeni DAG yerləşdirərkən `catchup = False` nəyin qarşısını alır?"
    back:
      en: "Prevents Airflow from triggering hundreds of backfill runs for all historical execution intervals between `start_date` and today."
      az: "`start_date`-dən bu günə qədər olan keçmiş günlərin yüzlərlə tarixi işinin eyni anda işə düşməsinin qarşısını alır."
  - front:
      en: "Why is processing large datasets inside PythonOperator considered an antipattern?"
      az: "`PythonOperator` daxilində böyük məlumatları emal etmək nə üçün antipattern hesab olunur?"
    back:
      en: "It exhausts worker memory, triggering Out-Of-Memory (OOM) operating system kills and destabilizing Airflow."
      az: "Worker-in yaddaşını dolduraraq Əməliyyat Sisteminin OOM (Out Of Memory) çöküşünə səbəb olur və Airflow-u sıradan çıxarır."
