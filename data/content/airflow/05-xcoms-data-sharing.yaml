output_description:
  en: "Shows the lightweight 142-byte XCom record stored in Airflow's metadata table and the downstream task successfully consuming the S3 reference."
  az: "Metadata DB-də saxlanılan cəmi 142 baytlıq yüngül XCom qeydini və növbəti task-ın bu S3 ünvanını uğurla oxuduğunu göstərir."
interview_question:
  question:
    en: "Can we pass a 10 GB Pandas DataFrame directly between two Airflow tasks using XCom? Why or why not, and what is the best practice?"
    az: "İki Airflow task-ı arasında XCom vasitəsilə 10 GB-lıq Pandas DataFrame-i birbaşa ötürmək olarmı? Niyə və bu halda ən yaxşı təcrübə (best practice) nədir?"
  answer:
    en: "No, never pass 10 GB through XCom. XCom values are serialized and stored in Airflow's central Metadata Database (PostgreSQL/MySQL), which has strict row/cell size constraints and will crash or lock under large payloads. The industry best practice is the Claim-Check Pattern: write the 10 GB payload to an external object store (Amazon S3, Google Cloud Storage, or ADLS) and pass only the S3 URI/metadata string through XCom."
    az: "Xeyr, qətiyyən olmaz! XCom məlumatları Airflow-un mərkəzi Metadata Verilənlər Bazasında (PostgreSQL/MySQL) saxlanılır. Baza cədvəlləri böyük həcmli data üçün nəzərdə tutulmayıb; bu bazanı kilitləyər, yaddaşı doldurar və bütün sistemi çökdürər. Ən düzgün həll 'Claim-Check Pattern'-dir: 10 GB məlumatı birbaşa obyekt anbarına (S3, GCS, ADLS) yazmaq, XCom ilə isə yalnız həmin faylın ünvanını (S3 URI) və sətir sayını ötürməkdir."
  interviewer_tips:
    en: "Senior interviewers ask this to test if you understand Airflow's boundary between orchestration and data storage. Mentioning the 'Claim-Check pattern' and 'Metadata DB explosion' instantly gives you a top score."
    az: "Müsahibə götürənlər bu sualı sizin orkestrasiya ilə data saxlama arasındakı sərhədi anlayıb-anlamadığınızı yoxlamaq üçün verirlər. 'Claim-Check pattern' və 'Metadata DB-nin şişməsi' terminlərini vurğulamaq sizə ən yüksək xalı qazandıracaq."
flashcards:
  - front:
      en: "What does XCom stand for in Apache Airflow?"
      az: "Apache Airflow-da XCom abreviaturası nə deməkdir?"
    back:
      en: "Cross-Communication. It is Airflow's built-in mechanism for passing small pieces of metadata between tasks."
      az: "Cross-Communication (çarpaz əlaqə). Task-lar arasında kiçik həcmli metadata ötürmək üçün quraşdırılmış mexanizmdir."
  - front:
      en: "Where are XCom values physically stored in Airflow?"
      az: "XCom məlumatları Airflow-da fiziki olaraq harada saxlanılır?"
    back:
      en: "In the `xcom` table of Airflow's central Metadata Database (PostgreSQL / MySQL)."
      az: "Airflow-un mərkəzi Metadata Verilənlər Bazasının (PostgreSQL / MySQL) `xcom` cədvəlində."
  - front:
      en: "Why is passing large datasets (e.g., 5GB CSV) through XCom considered a severe anti-pattern?"
      az: "Böyük həcmli məlumatı (məsələn: 5GB CSV) XCom ilə ötürmək niyə ciddi anti-pattern hesab olunur?"
    back:
      en: "It bloats and locks the Metadata Database, degrades scheduler performance, and causes Out-Of-Memory (OOM) crashes across workers."
      az: "Metadata DB-ni doldurub kilitləyir, scheduler-in sürətini salır və worker-lərdə OOM (yaddaş çatışmazlığı) xətalarına səbəb olur."
  - front:
      en: "What is the recommended design pattern for transferring large files between tasks?"
      az: "Task-lar arasında böyük faylları ötürmək üçün tövsiyə olunan dizayn şablonu hansıdır?"
    back:
      en: "The Claim-Check Pattern: write the data to S3/GCS object storage and pass only the storage URI/path through XCom."
      az: "Claim-Check Pattern: məlumatı S3/GCS obyekt anbarına yazmaq və XCom ilə yalnız faylın ünvanını (URI) ötürmək."
  - front:
      en: "In TaskFlow API, how does a task automatically push and pull XCom values?"
      az: "TaskFlow API-də task XCom məlumatını necə avtomatik göndərir və qəbul edir?"
    back:
      en: "A Python function's `return` value is automatically pushed to XCom, and passing that returned variable into another task's parameter automatically pulls it."
      az: "Python funksiyasının `return` dəyəri avtomatik XCom-a yazılır, növbəti task-a arqument kimi ötürüldükdə isə avtomatik oxunur."
