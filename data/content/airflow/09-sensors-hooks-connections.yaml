output_description:
  en: "Shows the sensor checking for a file, releasing its worker slot to UP_FOR_RESCHEDULE, and resuming cleanly 60 seconds later when the file arrives."
  az: "Sensorun faylı tapmadıqda worker slotunu UP_FOR_RESCHEDULE ilə dərhal azad etdiyini və 60 saniyə sonra fayl gəldikdə uğurla davam etdiyini göstərir."
interview_question:
  question:
    en: "What is the difference between `mode='poke'` and `mode='reschedule'` in Airflow Sensors? What catastrophic failure can occur if you use the wrong mode?"
    az: "Airflow Sensorlarında `mode='poke'` ilə `mode='reschedule'` arasındakı fərq nədir? Yanlış rejim seçildikdə hansı fəlakətli problem yarana bilər?"
  answer:
    en: "In `mode='poke'`, the sensor holds onto its worker slot and thread continuously, even while sleeping between checks (`poke_interval`). In `mode='reschedule'`, if the condition is not met, the sensor yields its worker slot, transitions to state `UP_FOR_RESCHEDULE`, and frees the thread for other tasks until the next check. If you have many sensors running in `poke` mode waiting for hours, they consume 100% of the worker slots, causing worker pool starvation and a total cluster deadlock where no other DAGs in the entire company can execute."
    az: "`mode='poke'` rejimində sensor yoxlamalar arasındakı gözləmə (yuxu) vaxtında belə worker slotunu və yaddaşı əlində saxlayır və buraxmır. `mode='reschedule'` rejimində isə şərt ödənmədikdə sensor dərhal worker slotunu azad edir, `UP_FOR_RESCHEDULE` statusuna keçir və növbəti yoxlamaya qədər resursu digər task-ların istifadəsinə verir. Əgər çoxlu sayda sensor `poke` rejimində saatlarla gözləyərsə, klasterdəki bütün worker slotları tutulur, resurs tükənməsi (starvation) və klaster miqyasında ümumi kilitlənmə (deadlock) yaranır; nəticədə şirkətdə heç bir digər pipeline işləyə bilmir."
  interviewer_tips:
    en: "Mention the exact state name `UP_FOR_RESCHEDULE` and explain worker pool starvation. Senior interviewers look for this operational experience."
    az: "`UP_FOR_RESCHEDULE` statusunun adını çəkmək və worker slotlarının tükənməsini (pool starvation) izah etmək dərin təcrübənizi nümayiş etdirir."
flashcards:
  - front:
      en: "What is an Airflow Sensor?"
      az: "Airflow Sensor-u nədir?"
    back:
      en: "A special operator designed to wait for an external state, condition, or file before letting downstream tasks run."
      az: "Növbəti task-ların işləməsinə icazə verməzdən əvvəl xarici bir hadisənin və ya faylın gəlməsini gözləyən xüsusi operator."
  - front:
      en: "What is the danger of running sensors with `mode='poke'`?"
      az: "Sensorları `mode='poke'` rejimində işlətməyin təhlükəsi nədir?"
    back:
      en: "It continuously holds worker slots while sleeping, potentially causing worker pool starvation and cluster deadlocks."
      az: "Gözləmə müddətində worker slotlarını buraxmır, nəticədə bütün slotları doldurub klasterdə deadlock yarada bilər."
  - front:
      en: "How does `mode='reschedule'` solve the sensor slot starvation problem?"
      az: "`mode='reschedule'` sensorun slot tükənməsi problemini necə həll edir?"
    back:
      en: "It releases the worker slot immediately after a failed check, entering `UP_FOR_RESCHEDULE` until the next check."
      az: "Şərt ödənmədikdə worker slotunu dərhal azad edir və növbəti yoxlamaya qədər `UP_FOR_RESCHEDULE` statusunda gözləyir."
  - front:
      en: "What is an Airflow Connection?"
      az: "Airflow Connection nədir?"
    back:
      en: "A centrally stored and encrypted set of credentials (host, login, password, port) for accessing external systems."
      az: "Xarici sistemlərə qoşulmaq üçün mərkəzi şəkildə şifrələnmiş giriş məlumatları toplusudur (host, login, şifrə, port)."
  - front:
      en: "What is an Airflow Hook?"
      az: "Airflow Hook nədir?"
    back:
      en: "A Python interface that retrieves connection details and manages communication with external platforms (e.g., Postgres, S3, Snowflake)."
      az: "Connection məlumatlarını oxuyan və xarici platformalarla (Postgres, S3, Snowflake) əlaqəni idarə edən Python interfeysidir."
