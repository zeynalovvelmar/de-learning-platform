output_description:
  en: "Visualizes grid view states where the unselected branch is SKIPPED (pink/yellow) while the downstream join task succeeds (green) thanks to the custom trigger rule."
  az: "Seçilməyən qolun SKIPPED, birləşmə task-ının isə trigger qaydası sayəsində uğurla (yaşıl / SUCCESS) tamamlandığını göstərən Grid görüntüsü."
interview_question:
  question:
    en: "What happens when you use a BranchPythonOperator to select one of two downstream tasks, and both tasks feed into a final join task with the default trigger rule? How do you resolve it?"
    az: "BranchPythonOperator istifadə edərək iki qoldan birini seçdikdə və hər iki qol standart trigger qaydası olan yekun birləşmə task-ına bağlandıqda nə baş verir? Bunu necə həll edirsiniz?"
  answer:
    en: "With the default trigger rule `all_success`, the final join task will be marked as SKIPPED because one of its upstream parents was skipped during branching. In Airflow, `all_success` requires 100% of direct upstream tasks to succeed. To fix this, change the join task's trigger rule to `none_failed_min_one_success` (or `one_success`). This tells Airflow that as long as no upstream branch failed and at least one succeeded, the join task should proceed."
    az: "Standart trigger qaydası `all_success` olduqda, yekun birləşmə task-ı da SKIPPED olacaq və icra olunmayacaq. Çünki `all_success` bütün əvvəlki task-ların mütləq SUCCESS olmasını tələb edir, lakin budaqlanmada qollardan biri skip edilmişdi. Bu problemi həll etmək üçün birləşmə task-ının trigger qaydasını `none_failed_min_one_success` (və ya `one_success`) olaraq dəyişmək lazımdır. Bu, Airflow-a heç bir xəta olmadığı və ən azı bir qol uğurla gəldiyi halda task-ı icra etməyi tapşırır."
  interviewer_tips:
    en: "Mentioning the exact trigger rule name `none_failed_min_one_success` proves to the interviewer that you have resolved real DAG join issues in production."
    az: "Dəqiq parametr adı olan `none_failed_min_one_success`-i qeyd etmək müsahibə götürənə real layihələrdə budaqlanma problemlərini həll etdiyinizi sübut edir."
flashcards:
  - front:
      en: "What does the `@task.branch` decorator return?"
      az: "`@task.branch` dekoratoru nə qaytarmalıdır?"
    back:
      en: "The `task_id` (string) or list of `task_id`s that should be executed next."
      az: "Növbəti icra olunmalı task-ın ID-sini (string) və ya `task_id` siyahısını."
  - front:
      en: "What state do tasks on the unchosen branch transition to?"
      az: "Budaqlanmada seçilməyən qoldakı task-lar hansı statusa keçir?"
    back:
      en: "They are marked as `SKIPPED`."
      az: "`SKIPPED` (ötürülmüş) statusuna keçir."
  - front:
      en: "What is the default `trigger_rule` for Airflow tasks?"
      az: "Airflow task-ları üçün standart (default) `trigger_rule` hansıdır?"
    back:
      en: "`all_success`, meaning all direct parent tasks must succeed."
      az: "`all_success`. Bu, bütün birbaşa əvvəlki task-ların uğurla tamamlanmasını tələb edir."
  - front:
      en: "Why does a join task with `all_success` fail to run after a branch?"
      az: "Budaqlanmadan sonra `all_success` olan birləşmə task-ı niyə icra olunmur?"
    back:
      en: "Because one of its parents was SKIPPED, failing the `all_success` requirement and triggering a skip cascade."
      az: "Çünki qollardan biri SKIPPED olub və bu `all_success` şərtini pozaraq task-ı da skip edir."
  - front:
      en: "Which trigger rule should you use on a task that merges branched workflows?"
      az: "Budaqlanmış qolları birləşdirən task-da hansı trigger qaydası istifadə edilməlidir?"
    back:
      en: "`none_failed_min_one_success` (or `one_success`)."
      az: "`none_failed_min_one_success` (və ya `one_success`)."
