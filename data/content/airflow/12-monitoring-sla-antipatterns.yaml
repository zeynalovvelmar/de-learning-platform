interview_question:
  question:
    en: "What is the 'Top-Level Code' anti-pattern in Airflow DAG files, why does it degrade cluster performance, and how do you prevent it?"
    az: "Airflow DAG fayllarında 'Top-Level Kod' anti-patterni nədir, klaster performansını niyə aşağı salır və bunun qarşısını necə alırsınız?"
  answer:
    en: "The Airflow Scheduler continuously re-parses every Python file in the `dags/` folder on a loop (every 30 seconds by default) to detect changes and calculate execution dates. The top-level anti-pattern happens when developers write dynamic code—such as database connections (`psycopg2.connect`), API requests (`requests.get`), or heavy file I/O—outside of task functions at the global file scope. When this happens, the Scheduler itself executes those queries hundreds of times every minute, driving CPU to 100%, causing database connection pool leaks, and blocking the scheduling loop so no tasks can be triggered. We prevent it by strictly restricting the top-level scope to library imports and DAG/Operator instantiations, ensuring all business logic and external I/O exist only inside task callables or Hooks."
    az: "Airflow Scheduler dəyişiklikləri tapmaq üçün `dags/` qovluğundakı bütün Python fayllarını hər 30 saniyədən bir başdan-ayağa təkrar oxuyur (parse edir). 'Top-Level Kod' anti-patterni o zaman baş verir ki, tərtibatçı task funksiyalarından kənarda, faylın birbaşa içində verilənlər bazasına qoşulma, API sorğusu və ya ağır hesablama yazır. Bu zaman Scheduler-in özü həmin sorğuları hər dəqiqə yüzlərlə dəfə icra etməyə başlayır. Nəticədə Scheduler CPU-su 100%-ə çatır, bazanın qoşulma limitləri dolur və bütün orkestrasiya sistemi donur. Bunun qarşısını almaq üçün faylın əsas hissəsində yalnız kitabxana importları və DAG təyini saxlanılır; bütün xarici əlaqələr və sorğular isə yalnız və yalnız `@task` funksiyalarının daxilində yazılır."
  interviewer_tips:
    en: "Explain that the Scheduler parses files, NOT the workers. Junior engineers often believe DAG code only runs when a worker executes a task; distinguishing Scheduler parsing from Worker execution is a massive plus."
    az: "Faylları worker-lərin deyil, Scheduler-in oxuduğunu izah edin. Yeni başlayanlar elə bilir ki, kod yalnız task işləyəndə icra olunur; Scheduler parsing-i Worker icrasından fərqləndirmək müsahibədə böyük üstünlükdür."
flashcards:
  - front:
      en: "How often does the Airflow Scheduler re-parse files in the `dags/` directory by default?"
      az: "Airflow Scheduler susmaya görə `dags/` qovluğundakı faylları nə qədər tezliklə təkrar oxuyur (parse edir)?"
    back:
      en: "Every few seconds (default `dag_dir_list_interval` is typically 30 seconds)."
      az: "Bir neçə saniyədən bir (susmaya görə `dag_dir_list_interval` adətən 30 saniyədir)."
  - front:
      en: "Why is putting a database query at the top-level of a DAG file considered a catastrophic anti-pattern?"
      az: "DAG faylının başında (top-level) baza sorğusu yazmaq niyə fəlakətli anti-pattern hesab olunur?"
    back:
      en: "The Scheduler executes that query every 30 seconds during parsing, spiking CPU, leaking connections, and freezing task scheduling."
      az: "Scheduler faylı hər oxuduqda (30s-dən bir) həmin sorğunu təkrar icra edir, prosessoru dondurur və bazanın əlaqə limitini doldurur."
  - front:
      en: "What should be the only contents of a DAG file outside task functions?"
      az: "DAG faylında task funksiyalarından kənarda yalnız nələr olmalıdır?"
    back:
      en: "Imports, DAG definitions, and operator instantiations with configuration arguments."
      az: "Yalnız import-lar, DAG təyini və operatorların konfiqurasiya arqumentləri."
  - front:
      en: "What callback parameter is used to trigger automatic alerts (e.g. Slack/PagerDuty) when a task fails?"
      az: "Task xəta verdikdə avtomatik bildiriş (Slack/PagerDuty) göndərmək üçün hansı callback parametri istifadə olunur?"
    back:
      en: "`on_failure_callback`."
      az: "`on_failure_callback`."
  - front:
      en: "What does SLA stand for in Airflow and what is its purpose?"
      az: "Airflow-da SLA nə deməkdir və məqsədi nədir?"
    back:
      en: "Service Level Agreement. It defines the maximum expected completion time for a task/DAG and alerts if execution is delayed."
      az: "Service Level Agreement (Xidmət Səviyyəsi Razılaşması). Task-ın bitməli olduğu maksimum vaxtı təyin edir və gecikmə olduqda xəbərdarlıq edir."
