output_description:
  en: "Shows Kubernetes dynamically spawning an isolated Pod with custom resources for the task and automatically deleting it upon completion."
  az: "Kubernetes-in task üçün xüsusi resurslu ayrıca Pod yaratdığını və iş bitən kimi onu avtomatik silərək sıfır xərc təmin etdiyini göstərir."
interview_question:
  question:
    en: "Compare CeleryExecutor and KubernetesExecutor. When would you choose one over the other in an enterprise production architecture?"
    az: "CeleryExecutor ilə KubernetesExecutor-u müqayisə edin. Müəssisə səviyyəli arxitekturada birini digərindən üstün tutmağınızın səbəbləri nə olar?"
  answer:
    en: "CeleryExecutor uses a pool of static worker VMs listening to a Redis/RabbitMQ queue. It offers very low task start latency (sub-second) and handles high volumes of frequent, short-lived tasks well. However, workers are always running (incurring idle costs) and tasks share the worker's Python environment, risking dependency conflicts. KubernetesExecutor launches a fresh Pod for every single TaskInstance via K8s API. It provides 100% dependency and resource isolation (different Docker images, RAM/CPU limits per task) and scales to zero when idle, saving significant cloud costs. However, Pod startup introduces a 5-10 second overhead. Choose CeleryExecutor for high-frequency micro-tasks, and KubernetesExecutor for modern cloud architectures with heterogeneous workloads, ML tasks, or strict cost optimization."
    az: "CeleryExecutor Redis/RabbitMQ növbəsini dinləyən statik worker serverlərindən istifadə edir. Task-ın dərhal (saniyədən az) başlamasını təmin edir və tez-tez işə düşən qısamüddətli işlər üçün əladır. Lakin worker serverləri daim açıq qalır (boş vaxtlarda da xərc yazır) və bütün task-lar eyni Python mühitini bölüşdüyü üçün versiya toqquşması riski yaranır. KubernetesExecutor isə hər bir task üçün Kubernetes üzərində sıfırdan ayrıca Pod yaradır. Bu, 100% asılılıq və resurs təcridi təmin edir (hər task fərqli Docker imicində və fərqli RAM/CPU ilə işləyə bilər) və iş olmadıqda sıfıra qədər kiçilərək (scale-to-zero) bulud xərclərinə kəskin qənaət edir. Mənfi cəhəti podun açılması üçün 5-10 saniyə gözləmə vaxtıdır. Əgər çox sürətli və qısa işlərdirsə Celery, müxtəlif kitabxanalar, ML modelləri və resurs qənaəti tələb olunursa müasir bulud standartı olan KubernetesExecutor seçilir."
  interviewer_tips:
    en: "Highlighting 'Scale-to-Zero' and 'Docker image dependency isolation' vs 'Pod startup latency' shows real-world architecture trade-off understanding."
    az: "'Scale-to-Zero' (sıfıra qədər kiçilmə) və 'asılılıqların Docker imicləri ilə təcrid olunması' amillərini vurğulamaq arxitektura səviyyəli biliklərinizi sübut edir."
flashcards:
  - front:
      en: "What is the primary role of an Airflow Executor?"
      az: "Airflow Executor-un əsas vəzifəsi nədir?"
    back:
      en: "It defines the mechanism, infrastructure, and runtime environment where task instances physically execute."
      az: "Task icralarının fiziki olaraq hansı infrastrukturda və necə icra olunacağını müəyyən edən mühərrikdir."
  - front:
      en: "Why is SequentialExecutor unsuitable for production environments?"
      az: "SequentialExecutor niyə istehsalat mühitləri üçün yararsızdır?"
    back:
      en: "It uses SQLite and is strictly single-threaded, meaning only one task in the entire cluster can run at any time."
      az: "SQLite bazasından istifadə edir və tək yivlidir; bütün sistemdə eyni anda yalnız 1 task işləyə bilər."
  - front:
      en: "What message brokers are typically used with CeleryExecutor?"
      az: "CeleryExecutor ilə adətən hansı mesaj brokerlərindən istifadə olunur?"
    back:
      en: "Redis or RabbitMQ."
      az: "Redis və ya RabbitMQ."
  - front:
      en: "What are the two biggest advantages of KubernetesExecutor?"
      az: "KubernetesExecutor-un ən böyük iki üstünlüyü nədir?"
    back:
      en: "1) Complete dependency isolation via custom Docker images/resources per task, and 2) Scale-to-zero cost savings."
      az: "1) Hər task üçün fərqli Docker imici və resursla tam asılılıq təcridi, və 2) Sıfıra qədər kiçilmə (scale-to-zero) ilə xərc qənaəti."
  - front:
      en: "What is the main trade-off (drawback) of KubernetesExecutor compared to CeleryExecutor?"
      az: "KubernetesExecutor-un CeleryExecutor ilə müqayisədə əsas mənfi cəhəti nədir?"
    back:
      en: "Pod startup and image pull latency (typically 5-15 seconds per task) before task code begins executing."
      az: "Task başlamazdan əvvəl Pod-un qalxması və imicin yüklənməsi üçün tələb olunan 5-15 saniyəlik gecikmə."
