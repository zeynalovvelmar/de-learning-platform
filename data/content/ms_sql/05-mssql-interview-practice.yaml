common_mistakes:
  az: '- Test edərkən real cədvəldə `UPDATE` edib geri almağı (ROLLBACK) unudaraq
    canlı datanı zibilləmək.

    - İndeksli sütunları `WHERE MONTH(date) = 10` kimi funksiyalara bürümək: Bu sorğunu
    50-100 dəfə yavaşladır.

    - Böyük həcmli datalar üçün `@TableVariable` istifadə etmək: Table variable-ın
    statistikası olmur, buna görə SQL Server həmişə 1 sətir təxmin edir və planı korlayır
    (10,000+ sətir üçün `#TempTable` seçilməlidir).'
  en: '- Test edərkən real cədvəldə `UPDATE` edib geri almağı (ROLLBACK) unudaraq
    canlı datanı zibilləmək.

    - İndeksli sütunları `WHERE MONTH(date) = 10` kimi funksiyalara bürümək: Bu sorğunu
    50-100 dəfə yavaşladır.

    - Böyük həcmli datalar üçün `@TableVariable` istifadə etmək: Table variable-ın
    statistikası olmur, buna görə SQL Server həmişə 1 sətir təxmin edir və planı korlayır
    (10,000+ sətir üçün `#TempTable` seçilməlidir).'
interview_question:
  question:
    az: Sizə bir Stored Procedure təhvil verilsə və onu test etməyiniz istənilsə,
      hansı addımlarla test edərsiniz? Həmçinin sorğu yazarkən S-ARG-able nə deməkdir?
    en: Sizə bir Stored Procedure təhvil verilsə və onu test etməyiniz istənilsə,
      hansı addımlarla test edərsiniz? Həmçinin sorğu yazarkən S-ARG-able nə deməkdir?
  answer:
    az: '"Stored Procedure-u test edərkən:

      1. Əvvəlcə prosedurun giriş və çıxış parametrlərini nəzərdən keçirərəm.

      2. Testi mütləq `BEGIN TRANSACTION` bloku daxilində başladaram ki, sınaq bitdikdən
      sonra `ROLLBACK TRANSACTION` ilə cədvəlləri əvvəlki ilkin vəziyyətinə qaytara
      bilim.

      3. Həm uğurlu (happy path), həm də sərhəd hallarını (boundary values: mənfi
      rəqəmlər, NULL qiymətlər, mövcud olmayan İD-lər) yoxlayaram.

      4. Nəticə çıxış parametrlərinin (`OUTPUT`) və `@@ROWCOUNT`-un gözlənilən kimi
      olub-olmadığını `SELECT` ilə təsdiqləyərəm.


      **S-ARG-able (Search Argumentable)** anlayışına gəldikdə: Bu, sorğunun `WHERE`
      bəndində indekslərdən səmərəli istifadə edə bilməsi qabiliyyətidir. Əgər biz
      sütunun özünü hər hansı funksiyanın içinə salsaq (məsələn, `WHERE YEAR(CreateDate)
      = 2026`), SQL Server bütün sətirləri tək-tək oxumalı olur (Index Scan). Düzgün
      forma sütunu təcrid etməkdir: `WHERE CreateDate >= ''2026-01-01'' AND CreateDate
      < ''2027-01-01''`. Bu zaman mühərrik birbaşa B-Tree indeksindən faydalanaraq
      sorğunu dərhal icra edir (Index Seek)."'
    en: '"Stored Procedure-u test edərkən:

      1. Əvvəlcə prosedurun giriş və çıxış parametrlərini nəzərdən keçirərəm.

      2. Testi mütləq `BEGIN TRANSACTION` bloku daxilində başladaram ki, sınaq bitdikdən
      sonra `ROLLBACK TRANSACTION` ilə cədvəlləri əvvəlki ilkin vəziyyətinə qaytara
      bilim.

      3. Həm uğurlu (happy path), həm də sərhəd hallarını (boundary values: mənfi
      rəqəmlər, NULL qiymətlər, mövcud olmayan İD-lər) yoxlayaram.

      4. Nəticə çıxış parametrlərinin (`OUTPUT`) və `@@ROWCOUNT`-un gözlənilən kimi
      olub-olmadığını `SELECT` ilə təsdiqləyərəm.


      **S-ARG-able (Search Argumentable)** anlayışına gəldikdə: Bu, sorğunun `WHERE`
      bəndində indekslərdən səmərəli istifadə edə bilməsi qabiliyyətidir. Əgər biz
      sütunun özünü hər hansı funksiyanın içinə salsaq (məsələn, `WHERE YEAR(CreateDate)
      = 2026`), SQL Server bütün sətirləri tək-tək oxumalı olur (Index Scan). Düzgün
      forma sütunu təcrid etməkdir: `WHERE CreateDate >= ''2026-01-01'' AND CreateDate
      < ''2027-01-01''`. Bu zaman mühərrik birbaşa B-Tree indeksindən faydalanaraq
      sorğunu dərhal icra edir (Index Seek)."'
  interviewer_tips:
    az: '- ROLLBACK ilə test yanaşmasını izah etdiyiniz an müsahibəçilər sizin istehsalat
      intizamına (production discipline) sahib olduğunuzu görəcəklər.

      - ''Index Scan vs Index Seek'' fərqini S-ARG-able ilə əlaqələndirmək intern
      səviyyəsi üçün ən yüksək bal toplayan məqamdır.'
    en: '- ROLLBACK ilə test yanaşmasını izah etdiyiniz an müsahibəçilər sizin istehsalat
      intizamına (production discipline) sahib olduğunuzu görəcəklər.

      - ''Index Scan vs Index Seek'' fərqini S-ARG-able ilə əlaqələndirmək intern
      səviyyəsi üçün ən yüksək bal toplayan məqamdır.'
