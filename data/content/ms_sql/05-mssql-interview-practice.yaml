code: "-- 1. Test Ssenarisi: Prosedurun təhlükəsiz sınaqdan keçirilməsi (ROLLBACK\
  \ ilə)\nBEGIN TRANSACTION;\n\n-- Test üçün nəticə dəyişəni\nDECLARE @TestMsg NVARCHAR(100);\n\
  \n-- Proseduru test edirik (ClaimID 101 üçün)\nEXEC [dbo].[usp_ApproveInsuranceClaim]\n\
  \    @ClaimID = 101,\n    @ApproverID = 999, -- Test mühəndis İD-si\n    @ApprovedPayout\
  \ = 1850.00,\n    @ResultStatus = @TestMsg OUTPUT;\n\n-- Nəticəni yoxlayırıq:\n\
  PRINT N'Test Mesajı: ' + @TestMsg;\n\n-- Cədvəlin cari vəziyyətini yoxlayırıq:\n\
  SELECT [ClaimID], [ClaimStatus], [ApprovedBy], [ApprovedAmount]\nFROM [dbo].[InsuranceClaims]\n\
  WHERE [ClaimID] = 101;\n\n-- Ən vacib addım: Bazanı əvvəlki təmiz vəziyyətinə qaytarırıq!\n\
  ROLLBACK TRANSACTION;\nPRINT N'Test tamamlandı. Bütün dəyişikliklər təhlükəsiz şəkildə\
  \ geri alındı (Rollback).';\n\n-- 2. Praktiki Analitik Sorğu: Hər filial üzrə ən\
  \ son 1 sığorta hadisəsi\nWITH LatestBranchClaims AS (\n    SELECT \n        c.[ClaimID],\n\
  \        c.[BranchName],\n        c.[CustomerName],\n        c.[ApprovedAmount],\n\
  \        c.[IncidentDate],\n        ROW_NUMBER() OVER (\n            PARTITION BY\
  \ c.[BranchName] \n            ORDER BY c.[IncidentDate] DESC\n        ) AS [ClaimRank]\n\
  \    FROM [dbo].[InsuranceClaims] c\n    WHERE c.[IncidentDate] >= '2026-01-01'\
  \ -- S-ARG-able indeks axtarışı\n)\nSELECT \n    [BranchName],\n    [ClaimID],\n\
  \    [CustomerName],\n    [ApprovedAmount],\n    [IncidentDate]\nFROM LatestBranchClaims\n\
  WHERE [ClaimRank] = 1\nORDER BY [ApprovedAmount] DESC;\n"
code_explanation:
  az: '* `BEGIN TRANSACTION ... ROLLBACK TRANSACTION`: Test mühitində ən təhlükəsiz
    test metodudur; prosedurun bütün məntiqləri real işləyir, amma heç bir qalıcı
    iz buraxmır.

    * `ROW_NUMBER() OVER (PARTITION BY ... ORDER BY ...)`: Hər filial üçün hadisələri
    tarixə görə sıralayır və ən yenisinə 1 nömrəsini verir.

    * `IncidentDate >= ''2026-01-01''`: Tarix sütunu funksiya daxilinə salınmayıb,
    buna görə MS SQL mövcud B-Tree indeksindən birbaşa istifadə edə bilir (`Index
    Seek`).

    '
  en: '* `BEGIN TRANSACTION ... ROLLBACK TRANSACTION`: Test mühitində ən təhlükəsiz
    test metodudur; prosedurun bütün məntiqləri real işləyir, amma heç bir qalıcı
    iz buraxmır.

    * `ROW_NUMBER() OVER (PARTITION BY ... ORDER BY ...)`: Hər filial üçün hadisələri
    tarixə görə sıralayır və ən yenisinə 1 nömrəsini verir.

    * `IncidentDate >= ''2026-01-01''`: Tarix sütunu funksiya daxilinə salınmayıb,
    buna görə MS SQL mövcud B-Tree indeksindən birbaşa istifadə edə bilir (`Index
    Seek`).

    '
