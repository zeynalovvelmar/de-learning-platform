infographic:
  az: '+----------------------------------------------------------------------------------------------------+

    |                                 T-SQL OPTİMİZASİYA VƏ TEST STANDARTI                               |

    |                                                                                                    |

    |  1. STORED PROCEDURE TƏHLÜKƏSİZ TEST STRUKTURU:                                                    |

    |     BEGIN TRANSACTION;                                                                             |

    |         EXEC dbo.usp_ApproveClaim @ClaimID = 9999, ...                                             |

    |         SELECT * FROM dbo.Claims WHERE ClaimID = 9999; -- Dəyişikliyi yoxla!                       |

    |     ROLLBACK TRANSACTION;  -- Heç bir real məlumat zədələnmədi! ✓                                  |

    |                                                                                                    |

    |  2. S-ARG-ABLE (İNDEKSLƏRİN DOSTU) QAYDASI:                                                        |

    |     [SƏHV]:   WHERE DATEDIFF(day, CreatedAt, GETDATE()) < 30   ---> Bütün cədvəli
    oxuyur (Scan)    |

    |     [DÜZ]:    WHERE CreatedAt >= DATEADD(day, -30, GETDATE())  ---> İndeksdən
    birbaşa tapır (Seek) |

    |                                                                                                    |

    |  3. WINDOW FUNCTION DƏRƏCƏLƏNDİRMƏSİ:                                                              |

    |     ROW_NUMBER() OVER (PARTITION BY CustomerID ORDER BY IncidentDate DESC)                         |

    |     rn = 1  ---> Hər müştərinin ən sonuncu zərəri!                                                 |

    +----------------------------------------------------------------------------------------------------+

    '
