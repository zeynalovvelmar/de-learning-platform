level: intermediate
title:
  az: MS SQL Müsahibə Təcrübəsi və Praktiki T-SQL Tapşırıqları
  en: MS SQL Müsahibə Təcrübəsi və Praktiki T-SQL Tapşırıqları
quick_recap:
  az: '- Bu dərs Böyük maliyyə, bank və sığorta şirkətlərinin Data Engineering Intern müsahibələrində
    verilən ən populyar MS SQL suallarını və praktiki ssenarilərini əhatə edir.

    - Stored Procedure necə test edilir? Datanı korlamadan tranzaksiya daxilində sınaqdan
    keçirmək və ROLLBACK etmək sənəti.

    - T-SQL Window Functions: Hər bir müştərinin ən son sığorta hadisəsini və ya ən
    böyük zərərini tapmaq (ROW_NUMBER və PARTITION BY).

    - S-ARG-able Sorğular (İndeks Dostu SQL): Niyə WHERE YEAR(Date) = 2026 yazmaq
    indeksi öldürür və onu necə düzəltmək lazımdır?

    - Müvəqqəti saxlanc: #TempTable (böyük həcm, indeks dəstəyi) vs @TableVariable
    (kiçik həcm, RAM).'
  en: '- Bu dərs Böyük maliyyə, bank və sığorta şirkətlərinin Data Engineering Intern müsahibələrində
    verilən ən populyar MS SQL suallarını və praktiki ssenarilərini əhatə edir.

    - Stored Procedure necə test edilir? Datanı korlamadan tranzaksiya daxilində sınaqdan
    keçirmək və ROLLBACK etmək sənəti.

    - T-SQL Window Functions: Hər bir müştərinin ən son sığorta hadisəsini və ya ən
    böyük zərərini tapmaq (ROW_NUMBER və PARTITION BY).

    - S-ARG-able Sorğular (İndeks Dostu SQL): Niyə WHERE YEAR(Date) = 2026 yazmaq
    indeksi öldürür və onu necə düzəltmək lazımdır?

    - Müvəqqəti saxlanc: #TempTable (böyük həcm, indeks dəstəyi) vs @TableVariable
    (kiçik həcm, RAM).'
explanation:
  az: "### İntern Müsahibəsində MS SQL-dən Sizdən Nə Gözlənilir?\nBöyük sığorta və maliyyə şirkətlərinin\
    \ vakansiya öhdəliklərində qeyd olunub:\n> *\"MS SQL Server və PostgreSQL məlumat\
    \ bazalarında SQL sorğularının hazırlanması... Stored Procedure və Function-ların\
    \ hazırlanması, test edilməsi və təkmilləşdirilməsinə dəstək göstərmək...\"*\n\
    \nMüsahibədə heç kim sizdən 15 illik daxili mühərrik (storage engine / lock escalation)\
    \ təfərrüatlarını soruşmayacaq. Komanda sizin:\n1. T-SQL-də təmiz və etibarlı\
    \ sorğu yazmağınızı,\n2. Yazılan Stored Procedure-u test etməyi bacarmağınızı,\n\
    3. Sadə performans xətalarına (məs. indeksləri sındıran funksiyalar) yol verməməyinizi\
    \ yoxlayacaq.\n\n---\n\n### 1. Praktiki Sual: \"Stored Procedure-u Necə Test Edirsiniz?\"\
    \nTəcrübəsiz namizədlər adətən belə cavab verir: *\"Sadəcə EXEC yazıb icra edirəm\"\
    *. Bu səhvdir, çünki əgər prosedur bazaya yanlış data yazsa və ya real müştərinin\
    \ statusunu korlasa, geriyə qayıtmaq çətin olar.\n\n**Peşəkar Təcrübəçi Yanaşması:**\n\
    * Proseduru test skripti daxilində **`BEGIN TRANSACTION`** ilə işə salırıq.\n\
    * Test üçün saxta (dummy) və ya nümunə parametrlər ötürürük.\n* Əməliyyatdan sonra\
    \ cədvəldə nəticəni `SELECT` edib gözlənilən nəticə ilə tutuşdururuq.\n* Ən sonda\
    \ mütləq **`ROLLBACK TRANSACTION`** edirik! Beləliklə, test tam aparılır, amma\
    \ bazada heç bir zibil data qalmır!\n\n---\n\n### 2. Window Functions: Ən Son\
    \ Sığorta Hadisələrinin Seçilməsi\nHər bir müştərinin ən son baş vermiş sığorta\
    \ müraciətini tapmaq üçün `ROW_NUMBER()` ən çox verilən tapşırıqdır:\n```sql\n\
    WITH RankedClaims AS (\n    SELECT \n        CustomerID,\n        ClaimID,\n \
    \       ClaimAmount,\n        IncidentDate,\n        ROW_NUMBER() OVER (\n   \
    \         PARTITION BY CustomerID \n            ORDER BY IncidentDate DESC\n \
    \       ) AS rn\n    FROM [dbo].[InsuranceClaims]\n)\nSELECT CustomerID, ClaimID,\
    \ ClaimAmount, IncidentDate\nFROM RankedClaims\nWHERE rn = 1; -- Yalnız hər müştərinin\
    \ ən son hadisəsi\n```\n\n---\n\n### 3. S-ARG-able Sorğular (Search Argumentable):\
    \ İndeksləri Sındırmayın!\nƏgər `[IncidentDate]` sütununda Non-Clustered Index\
    \ varsa, bu sorğu indeksi İŞLƏTMİR (Table / Index Scan edir, 100x yavaş işləyir):\n\
    ```sql\n-- SƏHV (Non-Sargable): Sütun funksiya daxilinə salınıb!\nSELECT * FROM\
    \ [dbo].[InsuranceClaims] \nWHERE YEAR(IncidentDate) = 2026;\n```\nÇünki SQL Server\
    \ hər bir sətri tək-tək oxuyub `YEAR()` funksiyasını hesablamalıdır.\n\n**DÜZGÜN\
    \ YANAŞMA (S-ARG-able - Index Seek edir):**\n```sql\n-- DÜZGÜN: Sütun sərbəstdir,\
    \ indeksdən dərhal aralıqla axtarır!\nSELECT * FROM [dbo].[InsuranceClaims] \n\
    WHERE IncidentDate >= '2026-01-01' \n  AND IncidentDate < '2027-01-01';\n```\n\
    \n---\n\n### 4. Müvəqqəti Cədvəllər: `#TempTable` vs `@TableVariable`\n* **`#TempTable`**:\
    \ `tempdb` bazasında yaranır, statistikası və indeksləri var. Böyük həcmli (10,000+\
    \ sətir) aralıq ETL dataları üçün idealdır.\n* **`@TableVariable`**: Yaddaşda\
    \ saxlanılır, tranzaksiyalardan təsirlənmir (`ROLLBACK` olsa belə dəyəri silinmir).\
    \ Çox kiçik (10-100 sətirlik) siyahılar üçün uyğundur.\n"
