    necə avtomatlaşdırdığını göstərir.

    - Parametrlər, OUTPUT dəyişənləri və tranzaksiya bütövlüyünü (ACID) addım-addım
    izah edir.

    - Əməliyyatdan əvvəl və sonrakı cədvəl dəyişikliklərini əyani şəkildə nümayiş
    etdirir.'
