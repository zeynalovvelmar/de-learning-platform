code: "-- 1. Sığorta hadisəsinin təsdiqlənməsi üçün Stored Procedure\nCREATE OR ALTER\
  \ PROCEDURE [dbo].[usp_ApproveInsuranceClaim]\n    @ClaimID INT,\n    @ApproverID\
  \ INT,\n    @ApprovedPayout DECIMAL(10, 2),\n    @ResultStatus NVARCHAR(100) OUTPUT\
  \  -- Nəticəni kənara qaytaran parametr\nAS\nBEGIN\n    -- Şəbəkəyə lazımsız \"\
  (1 row affected)\" mesajlarının getməməsi üçün:\n    SET NOCOUNT ON;\n\n    -- 1.\
  \ Biznes Qaydası Yoxlanışı: Məbləğ müsbət olmalıdır\n    IF @ApprovedPayout <= 0\n\
  \    BEGIN\n        SET @ResultStatus = N'XƏTA: Ödəniş məbləği 0-dan böyük olmalıdır!';\n\
  \        RETURN;\n    END\n\n    -- 2. Tranzaksiyanın başlanması (Hamısı icra olunmalı,\
  \ ya da heç biri)\n    BEGIN TRY\n        BEGIN TRANSACTION;\n\n        -- Addım\
  \ A: Claims cədvəlində statusu yeniləyirik\n        UPDATE [dbo].[InsuranceClaims]\n\
  \        SET \n            [ClaimStatus] = N'APPROVED',\n            [ApprovedBy]\
  \ = @ApproverID,\n            [ApprovedAmount] = @ApprovedPayout,\n            [UpdatedAt]\
  \ = SYSDATETIME()\n        WHERE [ClaimID] = @ClaimID\n          AND [ClaimStatus]\
  \ = N'PENDING'; -- Yalnız gözləmədə olanlar təsdiqlənə bilər\n\n        -- Əgər\
  \ heç bir sətir yenilənmədisə (məs. Claim tapılmadı və ya artıq təsdiqlənib)\n \
  \       IF @@ROWCOUNT = 0\n        BEGIN\n            SET @ResultStatus = N'XƏTA:\
  \ Zərər müraciəti tapılmadı və ya artıq təsdiqlənib!';\n            ROLLBACK TRANSACTION;\n\
  \            RETURN;\n        END\n\n        -- Addım B: Audit loq cədvəlinə qeyd\
  \ yazırıq\n        INSERT INTO [dbo].[ClaimAuditLogs] ([ClaimID], [ActionType],\
  \ [PerformedBy], [ActionDate])\n        VALUES (@ClaimID, N'CLAIM_APPROVED', @ApproverID,\
  \ SYSDATETIME());\n\n        -- Hər şey uğurludur: Dəyişiklikləri qalıcı edirik\n\
  \        COMMIT TRANSACTION;\n        SET @ResultStatus = N'UĞURLU: Zərər müraciəti\
  \ təsdiqləndi və ödənişə yönəldildi.';\n    END TRY\n    BEGIN CATCH\n        --\
  \ Gözlənilməz sistem xətası baş verərsə tranzaksiyanı geri alırıq\n        IF @@TRANCOUNT\
  \ > 0\n            ROLLBACK TRANSACTION;\n\n        SET @ResultStatus = N'SİSTEM\
  \ XƏTASI: ' + ERROR_MESSAGE();\n    END CATCH\nEND;\n"
code_explanation:
  az: '* `CREATE OR ALTER PROCEDURE`: Prosedur yoxdursa yaradır, varsa yeniləyir.

    * `SET NOCOUNT ON`: Performansı artırır, hər kiçik UPDATE üçün şəbəkəyə bildiriş
    göndərilmir.

    * `@ResultStatus ... OUTPUT`: Prosedur bitəndə çağıran tərəfə nəticə mesajını
    qaytarmaq üçün `OUTPUT` açar sözü istifadə olunur.

    * `BEGIN TRANSACTION` və `COMMIT`: Cədvəllər arasında tam bütövlüyü təmin edir.

    * `@@ROWCOUNT = 0`: Əgər axtarılan `ClaimID` tapılmayıbsa, boş yerə davam etmir,
    tranzaksiyanı `ROLLBACK` edir.

    * `BEGIN CATCH`: Əgər elektrik sönsə, disk dolsa və ya deadlock olsa, `ERROR_MESSAGE()`
    ilə xətanı tutur və sistemi təmiz saxlayır.

    '
  en: '* `CREATE OR ALTER PROCEDURE`: Prosedur yoxdursa yaradır, varsa yeniləyir.

    * `SET NOCOUNT ON`: Performansı artırır, hər kiçik UPDATE üçün şəbəkəyə bildiriş
    göndərilmir.

    * `@ResultStatus ... OUTPUT`: Prosedur bitəndə çağıran tərəfə nəticə mesajını
    qaytarmaq üçün `OUTPUT` açar sözü istifadə olunur.

    * `BEGIN TRANSACTION` və `COMMIT`: Cədvəllər arasında tam bütövlüyü təmin edir.

    * `@@ROWCOUNT = 0`: Əgər axtarılan `ClaimID` tapılmayıbsa, boş yerə davam etmir,
    tranzaksiyanı `ROLLBACK` edir.

    * `BEGIN CATCH`: Əgər elektrik sönsə, disk dolsa və ya deadlock olsa, `ERROR_MESSAGE()`
    ilə xətanı tutur və sistemi təmiz saxlayır.

    '
