common_mistakes:
  az: '- Stored Procedure daxilində `SET NOCOUNT ON` yazmamaq: Hər bir daxili əmr
    üçün şəbəkəyə təsir sətirləri göndərilir, bu isə tətbiqin sürətini aşağı salır.

    - Tranzaksiya açıb CATCH blokunda `ROLLBACK TRANSACTION` etməyi unutmaq: Xəta
    baş verdikdə cədvəllərdə lock (kilidlənmə) qalır və bütün baza donur.

    - Çıxış parametrini çağırarkən `OUTPUT` açar sözünü yazmamaq: Əgər `EXEC usp_Name
    @res` yazsanız, parametr dəyər almayacaq; mütləq `EXEC usp_Name @res OUTPUT` yazılmalıdır.'
  en: '- Stored Procedure daxilində `SET NOCOUNT ON` yazmamaq: Hər bir daxili əmr
    üçün şəbəkəyə təsir sətirləri göndərilir, bu isə tətbiqin sürətini aşağı salır.

    - Tranzaksiya açıb CATCH blokunda `ROLLBACK TRANSACTION` etməyi unutmaq: Xəta
    baş verdikdə cədvəllərdə lock (kilidlənmə) qalır və bütün baza donur.

    - Çıxış parametrini çağırarkən `OUTPUT` açar sözünü yazmamaq: Əgər `EXEC usp_Name
    @res` yazsanız, parametr dəyər almayacaq; mütləq `EXEC usp_Name @res OUTPUT` yazılmalıdır.'
interview_question:
  question:
    az: Stored Procedure nədir? Şirkətlər niyə birbaşa SQL sorğusu yazmaq əvəzinə
      Stored Procedure istifadə etməyə üstünlük verirlər?
    en: Stored Procedure nədir? Şirkətlər niyə birbaşa SQL sorğusu yazmaq əvəzinə
      Stored Procedure istifadə etməyə üstünlük verirlər?
  answer:
    az: '"Stored Procedure verilənlər bazası serverində saxlanılan və adı ilə çağırılan
      qabaqcadan kompilyasiya edilmiş T-SQL kod blokudur.


      Şirkətlərin Stored Procedure seçməsinin 4 əsas səbəbi var:

      1. **Təhlükəsizlik (Security)**: İstifadəçilərə və proqramçılara birbaşa cədvəllər
      üzərində SELECT/UPDATE hüququ vermirik. Onlara yalnız həmin proseduru icra etmək
      (`EXECUTE`) hüququ verilir. Bu həm də SQL Injection hücumlarının qarşısını tam
      alır.

      2. **Performans (Execution Plan Caching)**: İlk çağırışda sorğunun icra planı
      yaddaşda saxlanılır, növbəti dəfələrdə server sorğunu yenidən parse etmədən
      keşdən sürətlə icra edir.

      3. **Şəbəkə Yükünün Azaldılması**: 50 sətirlik mürəkkəb SQL kodunu şəbəkə ilə
      dəfələrlə göndərmək əvəzinə, sadəcə qısa bir prosedur adı və bir neçə parametr
      ötürülür.

      4. **Biznes Məntiqinin Mərkəzləşdirilməsi**: Sabah biznes qaydası dəyişərsə
      (məsələn, zərər limitləri), tətbiqləri yenidən deploy etməyə ehtiyac qalmır,
      yalnız bazadakı proseduru dəyişmək kifayətdir."'
    en: '"Stored Procedure verilənlər bazası serverində saxlanılan və adı ilə çağırılan
      qabaqcadan kompilyasiya edilmiş T-SQL kod blokudur.


      Şirkətlərin Stored Procedure seçməsinin 4 əsas səbəbi var:

      1. **Təhlükəsizlik (Security)**: İstifadəçilərə və proqramçılara birbaşa cədvəllər
      üzərində SELECT/UPDATE hüququ vermirik. Onlara yalnız həmin proseduru icra etmək
      (`EXECUTE`) hüququ verilir. Bu həm də SQL Injection hücumlarının qarşısını tam
      alır.

      2. **Performans (Execution Plan Caching)**: İlk çağırışda sorğunun icra planı
      yaddaşda saxlanılır, növbəti dəfələrdə server sorğunu yenidən parse etmədən
      keşdən sürətlə icra edir.

      3. **Şəbəkə Yükünün Azaldılması**: 50 sətirlik mürəkkəb SQL kodunu şəbəkə ilə
      dəfələrlə göndərmək əvəzinə, sadəcə qısa bir prosedur adı və bir neçə parametr
      ötürülür.

      4. **Biznes Məntiqinin Mərkəzləşdirilməsi**: Sabah biznes qaydası dəyişərsə
      (məsələn, zərər limitləri), tətbiqləri yenidən deploy etməyə ehtiyac qalmır,
      yalnız bazadakı proseduru dəyişmək kifayətdir."'
  interviewer_tips:
    az: '- Müsahibədə ''Execution Plan Caching'' və ''Security Privileges (GRANT EXECUTE)''
      terminlərini işlətmək sizin mövzunu dərindən başa düşdüyünüzü sübut edir.

      - İntern olaraq vakansiyada qeyd olunan ''Stored Procedure-ların hazırlanması
      və test edilməsi'' bəndini bu nümunədəki kimi ''TRY...CATCH və ROLLBACK ilə
      test edirəm'' deyə cavablandıra bilərsiniz.'
    en: '- Müsahibədə ''Execution Plan Caching'' və ''Security Privileges (GRANT EXECUTE)''
      terminlərini işlətmək sizin mövzunu dərindən başa düşdüyünüzü sübut edir.

      - İntern olaraq vakansiyada qeyd olunan ''Stored Procedure-ların hazırlanması
