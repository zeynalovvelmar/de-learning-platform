id: 03-stored-procedures
order: 3
level: intermediate
title:
  az: Stored Procedure Nədir? T-SQL ilə Saxlanılan Prosedurların Hazırlanması
  en: Stored Procedure Nədir? T-SQL ilə Saxlanılan Prosedurların Hazırlanması
quick_recap:
  az: '- Stored Procedure (Saxlanılan Prosedur) — verilənlər bazası serverində yadda
    saxlanılan və adı ilə çağırılan təkrar istifadə edilə bilən T-SQL kod blokudur.

    - Niyə istifadə olunur? Şəbəkə yükünü azaldır, icra planını keşləyərək performansı
    artırır və ən əsası bazanı kənar müdaxilələrdən qoruyur (Təhlükəsizlik).

    - CREATE OR ALTER PROCEDURE sintaksisi ilə yaradılır və EXEC (və ya EXECUTE) əmri
    ilə icra olunur.

    - Parametrlər: Giriş parametrləri (@id INT) və nəticəni geri qaytaran çıxış parametrləri
    (@status NVARCHAR(50) OUTPUT).

    - Tranzaksiyalar və Xətaların idarə edilməsi: BEGIN TRANSACTION, COMMIT və BEGIN
    CATCH daxilində ROLLBACK.'
  en: '- Stored Procedure (Saxlanılan Prosedur) — verilənlər bazası serverində yadda
    saxlanılan və adı ilə çağırılan təkrar istifadə edilə bilən T-SQL kod blokudur.

    - Niyə istifadə olunur? Şəbəkə yükünü azaldır, icra planını keşləyərək performansı
    artırır və ən əsası bazanı kənar müdaxilələrdən qoruyur (Təhlükəsizlik).

    - CREATE OR ALTER PROCEDURE sintaksisi ilə yaradılır və EXEC (və ya EXECUTE) əmri
    ilə icra olunur.

    - Parametrlər: Giriş parametrləri (@id INT) və nəticəni geri qaytaran çıxış parametrləri
    (@status NVARCHAR(50) OUTPUT).

    - Tranzaksiyalar və Xətaların idarə edilməsi: BEGIN TRANSACTION, COMMIT və BEGIN
    CATCH daxilində ROLLBACK.'
explanation:
  az: "### Stored Procedure Nədir? Sadə Bir Bənzətmə\nTəsəvvür edin ki, bir sığorta\
    \ hadisəsini (məsələn, avtomobil qəzasını) təsdiqləmək üçün siz hər dəfə bu 4\
    \ əməliyyatı ardıcıl etməlisiniz:\n1. Zərərlər cədvəlində statusu `APPROVED` etmək.\n\
    2. Təsdiq edən mühəndisin İD-sini və cari tarixi qeyd etmək.\n3. Maliyyə cədvəlində\
    \ ödəniş rezervini azaltmaq.\n4. Audit loq cədvəlinə kimin nə vaxt təsdiqlədiyini\
    \ yazmaq.\n\nƏgər bunu hər dəfə kənar tətbiqdən (Python, backend, veb sayt) 4\
    \ ayrı SQL sorğusu kimi göndərsəniz:\n* Şəbəkə ilə 4 dəfə sorğu gedib-gələcək.\n\
    * Əgər 3-cü addımda şəbəkə kəsilsə, data yarımçıq və ziddiyyətli qalacaq.\n* Hər\
    \ bir tərtibatçıya birbaşa maliyyə və zərərlər cədvəllərini dəyişmək (`UPDATE/DELETE`)\
    \ səlahiyyəti verməli olacaqsınız (böyük təhlükəsizlik riski!).\n\n**Həll:** Bu\
    \ 4 addımı bazanın daxilində tək bir paket halına salırsınız və ona ad verirsiniz:\
    \ `usp_ApproveInsuranceClaim`.\nİndi istifadəçi sadəcə bunu yazır:\n```sql\nEXEC\
    \ dbo.usp_ApproveInsuranceClaim @ClaimID = 101, @ApproverID = 405, @Payout = 2400.00;\n\
    ```\nVə bütün proses serverin daxilində mikrosaniyələr ərzində, atomik olaraq\
    \ baş verir!\n\n---\n\n### Niyə Banklar və Sığorta Şirkətləri Stored Procedure Tələb\
    \ Edir?\n1. **Təhlükəsizlik (Security & Privileges)**:\n   İstifadəçilərə və ya\
    \ təcrübəçilərə birbaşa `InsuranceClaims` cədvəlini yeniləmək hüququ VERİLMİR.\
    \ Onlara yalnız `GRANT EXECUTE ON usp_ApproveInsuranceClaim` hüququ verilir. İstifadəçi\
    \ cədvəlin içinə birbaşa müdaxilə edə bilməz, yalnız prosedur hansı qaydaları\
    \ icazə verirsə onu edə bilər.\n2. **Keşlənmiş İcra Planı (Execution Plan Caching)**:\n\
    \   Prosedur ilk dəfə yaradıldıqda və çağırıldıqda, MS SQL Server sorğunun ən\
    \ optimal necə icra olunacağını hesablayır və icra planını yaddaşda keşləyir.\
    \ Sonrakı hər çağırışda sorğunu yenidən analiz etmir, birbaşa hazır plandan istifadə\
    \ edir.\n3. **SQL Injection Mühafizəsi**:\n   Parametrlər ciddi tiplərə bağlandığı\
    \ üçün hakerlər SQL injection hücumu edə bilmir.\n\n---\n\n### Prosedurun Anatomiyası:\
    \ Parametrlər və OUTPUT\n* **Giriş Parametrləri**: Prosedura kənardan ötürülən\
    \ qiymətlər (`@ClaimID INT`).\n* **Default Parametrlər**: Əgər parametr verilməzsə\
    \ standart qiymət alır (`@Payout DECIMAL(10,2) = 0.00`).\n* **OUTPUT Parametrləri**:\
    \ Prosedurun icrası nəticəsində kənara qaytarılan dəyər (`@ResultMsg NVARCHAR(100)\
    \ OUTPUT`).\n\n---\n\n### Atomik Tranzaksiya və TRY...CATCH\nƏgər prosedur daxilində\
    \ hər hansı xəta baş verərsə (məsələn, zərər məbləği büdcədən çox olarsa), edilmiş\
    \ bütün dəyişikliklər ləğv edilməlidir (**ROLLBACK**).\nT-SQL-də bu `BEGIN TRY\
    \ ... BEGIN CATCH` blokları ilə idarə olunur.\n"
