      test edirəm'' deyə cavablandıra bilərsiniz.'
flashcards:
- front:
    az: Stored Procedure nədir?
    en: Stored Procedure nədir?
  back:
    az: Verilənlər bazası serverində qeyd olunan, əvvəlcədən tərtib edilmiş və təkrar-təkrar
      çağırıla bilən T-SQL kod paketidir.
    en: Verilənlər bazası serverində qeyd olunan, əvvəlcədən tərtib edilmiş və təkrar-təkrar
      çağırıla bilən T-SQL kod paketidir.
- front:
    az: Niyə Stored Procedure birbaşa cədvəli UPDATE etməkdən daha təhlükəsizdir?
    en: Niyə Stored Procedure birbaşa cədvəli UPDATE etməkdən daha təhlükəsizdir?
  back:
    az: Çünki istifadəçiyə cədvəllərə birbaşa toxunmaq hüququ verilmir, yalnız həmin
      proseduru icra etmək (EXECUTE) hüququ verilir; beləliklə istifadəçi qaydalardan
      kənar məlumatı korlaya bilmir.
    en: Çünki istifadəçiyə cədvəllərə birbaşa toxunmaq hüququ verilmir, yalnız həmin
      proseduru icra etmək (EXECUTE) hüququ verilir; beləliklə istifadəçi qaydalardan
      kənar məlumatı korlaya bilmir.
- front:
    az: Stored Procedure çağırılarkən hansı əmrdən istifadə olunur?
    en: Stored Procedure çağırılarkən hansı əmrdən istifadə olunur?
  back:
    az: 'EXEC və ya EXECUTE əmrindən istifadə olunur, məsələn: EXEC dbo.usp_ApproveClaim
      @ClaimID = 101;'
    en: 'EXEC və ya EXECUTE əmrindən istifadə olunur, məsələn: EXEC dbo.usp_ApproveClaim
      @ClaimID = 101;'
- front:
    az: Stored Procedure daxilində 'SET NOCOUNT ON' nə işə yarayır?
    en: Stored Procedure daxilində 'SET NOCOUNT ON' nə işə yarayır?
  back:
    az: Hər bir INSERT/UPDATE əmrindən sonra şəbəkəyə '(1 row affected)' məlumatının
      göndərilməsinin qarşısını alır və performansı artırır.
    en: Hər bir INSERT/UPDATE əmrindən sonra şəbəkəyə '(1 row affected)' məlumatının
      göndərilməsinin qarşısını alır və performansı artırır.
- front:
    az: OUTPUT parametri nə üçündür?
    en: OUTPUT parametri nə üçündür?
  back:
    az: Prosedur daxilində hesablanan və ya əldə edilən nəticəni çağıran xarici koda
      (və ya növbəti skriptə) geri qaytarmaq üçündür.
    en: Prosedur daxilində hesablanan və ya əldə edilən nəticəni çağıran xarici koda
      (və ya növbəti skriptə) geri qaytarmaq üçündür.
