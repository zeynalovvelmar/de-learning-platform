id: 04-user-defined-functions
order: 4
level: intermediate
title:
  az: 'User-Defined Functions (UDF): Scalar və Table-Valued Funksiyalar'
  en: 'User-Defined Functions (UDF): Scalar və Table-Valued Funksiyalar'
quick_recap:
  az: '- User-Defined Function (UDF) — T-SQL-də istifadəçinin özü tərəfindən yazılan
    və bir və ya bir neçə parametr qəbul edib mütləq bir nəticə qaytaran obyektdir.

    - İki əsas növü var: Scalar Functions (tək bir qiymət qaytarır) və Table-Valued
    Functions (nəticəni cədvəl kimi qaytarır).

    - ƏN VACİB FƏRQ: Funksiyalar cədvəldəki datanı dəyişə BİLMƏZ (INSERT/UPDATE/DELETE
    qadağandır, no side-effects). Stored Procedure isə datanı dəyişə bilər.

    - Funksiyaları birbaşa SELECT, WHERE və JOIN daxilində işlətmək olar: SELECT dbo.fn_GetDiscount(Premium)
    FROM Policies.

    - Müsahibələrin ən populyar sualı: ''Stored Procedure ilə Function arasındakı
    fərq nədir?'''
  en: '- User-Defined Function (UDF) — T-SQL-də istifadəçinin özü tərəfindən yazılan
    və bir və ya bir neçə parametr qəbul edib mütləq bir nəticə qaytaran obyektdir.

    - İki əsas növü var: Scalar Functions (tək bir qiymət qaytarır) və Table-Valued
    Functions (nəticəni cədvəl kimi qaytarır).

    - ƏN VACİB FƏRQ: Funksiyalar cədvəldəki datanı dəyişə BİLMƏZ (INSERT/UPDATE/DELETE
    qadağandır, no side-effects). Stored Procedure isə datanı dəyişə bilər.

    - Funksiyaları birbaşa SELECT, WHERE və JOIN daxilində işlətmək olar: SELECT dbo.fn_GetDiscount(Premium)
    FROM Policies.

    - Müsahibələrin ən populyar sualı: ''Stored Procedure ilə Function arasındakı
    fərq nədir?'''
explanation:
  az: "### Niyə Funksiyalara Ehtiyac Var?\nÖtən dərsdə gördük ki, **Stored Procedure**\
    \ biznes proseslərini icra etmək (məsələn, zərəri təsdiqləmək və cədvəlləri yeniləmək)\
    \ üçün idealdır. Lakin Stored Procedure-u birbaşa `SELECT` və ya `WHERE` daxilində\
    \ çağıra bilməzsiniz:\n`SELECT col1, EXEC usp_GetRate -- BU İŞLƏMİR!`\n\nƏgər\
    \ sizə hər bir sığorta polisi üçün xüsusi riyazi və ya məntiqi hesablama aparıb\
    \ sətirbəsətir göstərmək lazımdırsa, **User-Defined Function (UDF)** köməyə çatır.\n\
    \n---\n\n### 1. Scalar Functions (Skalyar Funksiyalar)\nTək bir dəyər (ədəd, mətn,\
    \ tarix) qaytaran funksiyalardır.\nMəsələn: Sığorta şirkətində ödənilən zərərlər\
    \ ilə toplanmış sığorta haqqı əsasında **Zərərlilik Dərəcəsini (Loss Ratio %)**\
    \ hesablayan funksiya:\n\n```sql\nCREATE OR ALTER FUNCTION [dbo].[fn_CalculateLossRatio]\
    \ (\n    @TotalClaimsPaid DECIMAL(12, 2),\n    @EarnedPremium DECIMAL(12, 2)\n\
    )\nRETURNS DECIMAL(5, 2)\nAS\nBEGIN\n    IF @EarnedPremium IS NULL OR @EarnedPremium\
    \ <= 0\n        RETURN 0.00;\n\n    -- Loss Ratio = (Zərərlər / Sığorta Haqqı)\
    \ * 100\n    RETURN ROUND((@TotalClaimsPaid / @EarnedPremium) * 100.0, 2);\nEND;\n\
    ```\nİstifadəsi:\n```sql\nSELECT \n    BranchOffice,\n    dbo.fn_CalculateLossRatio(TotalPaid,\
    \ TotalPremium) AS LossRatioPct\nFROM BranchSummary;\n```\n*(Diqqət: MS SQL-də\
    \ skalyar funksiyanı çağırarkən mütləq sxem adını yazmaq lazımdır: `dbo.fn_Name`).*\n\
    \n---\n\n### 2. Table-Valued Functions (Cədvəl Qaytaran Funksiyalar - TVF)\nBəzən\
    \ funksiyanın tək bir rəqəm yox, bütöv bir sətir və ya cədvəl qaytarması lazımdır.\
    \ Bunlara **Table-Valued Function (TVF)** deyilir.\n\nƏn sürətli növü **Inline\
    \ Table-Valued Function (iTVF)**-dir:\n```sql\nCREATE OR ALTER FUNCTION [dbo].[fn_GetActivePoliciesByBranch]\
    \ (\n    @BranchName NVARCHAR(50)\n)\nRETURNS TABLE\nAS\nRETURN (\n    SELECT\
    \ PolicyID, PolicyNumber, CustomerName, PremiumAZN\n    FROM [dbo].[InsurancePolicies]\n\
    \    WHERE BranchOffice = @BranchName AND IsActive = 1\n);\n```\nİstifadəsi: Cədvəl\
    \ kimi birbaşa `FROM` və ya `CROSS APPLY` daxilində işlədilir:\n```sql\nSELECT\
    \ * FROM dbo.fn_GetActivePoliciesByBranch(N'Bakı Mərkəz');\n```\n\n---\n\n###\
    \ MÜSAHİBƏ QIZIL STANDARTI: Stored Procedure vs Function\nBu cədvəli əzbər bilmək\
    \ hər bir Data Engineer intern-i üçün 100% zəruridir:\n\n| Meyar | Stored Procedure\
    \ (`PROCEDURE`) | User-Defined Function (`FUNCTION`) |\n| :--- | :--- | :--- |\n\
    | **Dəyər Qaytarma** | Məcburi deyil (0, 1 və ya OUTPUT parametrləri qaytara bilər)\
    \ | **MÜTLƏQDİR** (Scalar dəyər və ya `TABLE` qaytarmalıdır) |\n| **SELECT-də\
    \ istifadə** | `SELECT`, `WHERE`, `JOIN` daxilində istifadə **EDİLƏ BİLMƏZ** |\
    \ `SELECT`, `WHERE`, `JOIN`, `HAVING`-də birbaşa istifadə edilir |\n| **Datanı\
    \ Dəyişmək (DML)** | `INSERT`, `UPDATE`, `DELETE`, `DROP` edə **BİLƏR** | Bazadakı\
    \ məlumatı dəyişə **BİLMƏZ** (Side-effects qadağandır) |\n| **Tranzaksiya İdarəsi**\
    \ | `BEGIN TRANSACTION`, `COMMIT`, `ROLLBACK` dəstəkləyir | Tranzaksiya aça **BİLMƏZ**\
    \ |\n| **Xətaların İdarəsi** | `TRY...CATCH` blokları istifadə edə bilir | `TRY...CATCH`\
    \ istifadə edə **BİLMƏZ** |\n| **Çağırılma forması** | `EXEC procedure_name @param\
    \ = 1` | `SELECT dbo.function_name(@param)` |\n"
  en: "### Niyə Funksiyalara Ehtiyac Var?\nÖtən dərsdə gördük ki, **Stored Procedure**\
    \ biznes proseslərini icra etmək (məsələn, zərəri təsdiqləmək və cədvəlləri yeniləmək)\
