    \ hər bir Data Engineer intern-i üçün 100% zəruridir:\n\n| Meyar | Stored Procedure\
    \ (`PROCEDURE`) | User-Defined Function (`FUNCTION`) |\n| :--- | :--- | :--- |\n\
