code: "-- 1. Skalyar Funksiya: KASKO zərərlilik dərəcəsinə görə Risk Kateqoriyasını\
  \ təyin edir\nCREATE OR ALTER FUNCTION [dbo].[fn_GetRiskCategory] (\n    @LossRatio\
  \ DECIMAL(5, 2)\n)\nRETURNS NVARCHAR(30)\nAS\nBEGIN\n    DECLARE @RiskCategory NVARCHAR(30);\n\
  \n    IF @LossRatio IS NULL OR @LossRatio = 0.00\n        SET @RiskCategory = N'RİSKSİZ\
  \ (İdeal)';\n    ELSE IF @LossRatio < 50.00\n        SET @RiskCategory = N'AŞAĞI\
  \ RİSK (Gəlirli)';\n    ELSE IF @LossRatio BETWEEN 50.00 AND 80.00\n        SET\
  \ @RiskCategory = N'ORTA RİSK (Qəbulolunan)';\n    ELSE\n        SET @RiskCategory\
  \ = N'YÜKSƏK RİSK (Zərərli!)';\n\n    RETURN @RiskCategory;\nEND;\nGO\n\n-- 2. Table-Valued\
  \ Funksiya (iTVF): Müəyyən risk həddindən yuxarı olan filialları cədvəl kimi qaytarır\n\
  CREATE OR ALTER FUNCTION [dbo].[fn_GetHighRiskBranches] (\n    @MinLossRatio DECIMAL(5,\
  \ 2)\n)\nRETURNS TABLE\nAS\nRETURN (\n    SELECT \n        [BranchName],\n     \
  \   [TotalPremiumAZN],\n        [TotalPaidClaimsAZN],\n        ROUND(([TotalPaidClaimsAZN]\
  \ / NULLIF([TotalPremiumAZN], 0)) * 100.0, 2) AS [LossRatioPct]\n    FROM [dbo].[BranchFinancials]\n\
  \    WHERE ROUND(([TotalPaidClaimsAZN] / NULLIF([TotalPremiumAZN], 0)) * 100.0,\
  \ 2) >= @MinLossRatio\n);\nGO\n\n-- 3. Hər iki funksiyanın birlikdə tək bir hesabat\
  \ sorğusunda istifadəsi:\nSELECT \n    b.[BranchName],\n    b.[TotalPremiumAZN],\n\
  \    b.[TotalPaidClaimsAZN],\n    b.[LossRatioPct],\n    [dbo].[fn_GetRiskCategory](b.[LossRatioPct])\
  \ AS [RiskEvaluation]\nFROM [dbo].[fn_GetHighRiskBranches](60.00) b\nORDER BY b.[LossRatioPct]\
  \ DESC;\n"
code_explanation:
  az: '* `CREATE OR ALTER FUNCTION [dbo].[fn_GetRiskCategory]`: Gələn rəqəmə əsasən
    mətn (`NVARCHAR(30)`) qaytarır.

    * `dbo.`: Skalyar funksiyaları çağırarkən `dbo.` prefiksi mütləq yazılmalıdır,
    əks halda MS SQL onu daxili sistem funksiyası ilə qarışdırıb xəta verəcək.

    * `fn_GetHighRiskBranches`: `RETURNS TABLE` ilə cədvəl qaytarır və `FROM` bəndində
    sanki fiziki cədvəl kimi sorğulanır.

    * `NULLIF([TotalPremiumAZN], 0)`: Sıfıra bölünmə xətasının (`Divide by zero error`)
    qarşısını alır.

    '
  en: '* `CREATE OR ALTER FUNCTION [dbo].[fn_GetRiskCategory]`: Gələn rəqəmə əsasən
    mətn (`NVARCHAR(30)`) qaytarır.

    * `dbo.`: Skalyar funksiyaları çağırarkən `dbo.` prefiksi mütləq yazılmalıdır,
    əks halda MS SQL onu daxili sistem funksiyası ilə qarışdırıb xəta verəcək.

    * `fn_GetHighRiskBranches`: `RETURNS TABLE` ilə cədvəl qaytarır və `FROM` bəndində
    sanki fiziki cədvəl kimi sorğulanır.

    * `NULLIF([TotalPremiumAZN], 0)`: Sıfıra bölünmə xətasının (`Divide by zero error`)
