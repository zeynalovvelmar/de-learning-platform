    \ | **MÜTLƏQDİR** (Scalar dəyər və ya `TABLE` qaytarmalıdır) |\n| **SELECT-də\
    \ istifadə** | `SELECT`, `WHERE`, `JOIN` daxilində istifadə **EDİLƏ BİLMƏZ** |\
