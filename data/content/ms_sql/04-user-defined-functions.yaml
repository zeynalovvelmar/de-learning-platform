common_mistakes:
  az: '- Skalyar funksiyanı çağırarkən sxem adını (`dbo.`) yazmamaq: `SELECT fn_GetRisk(50)`
    yazsanız xəta alacaqsınız; mütləq `SELECT dbo.fn_GetRisk(50)` olmalıdır.

    - Funksiya daxilində cədvələ `UPDATE` və ya `INSERT` etməyə çalışmaq: MS SQL buna
    icazə vermir (`Invalid use of a side-effecting operator ''UPDATE'' within a function`).

    - Çox böyük cədvəllərdə (milyonlarla sətir) hər sətir üçün ağır skalyar funksiya
    çağırmaq: Bu ''row-by-row'' icraya gətirib çıxara bilər; belə hallarda Inline
    TVF və ya birbaşa JOIN daha sürətlidir.'
  en: '- Skalyar funksiyanı çağırarkən sxem adını (`dbo.`) yazmamaq: `SELECT fn_GetRisk(50)`
    yazsanız xəta alacaqsınız; mütləq `SELECT dbo.fn_GetRisk(50)` olmalıdır.

    - Funksiya daxilində cədvələ `UPDATE` və ya `INSERT` etməyə çalışmaq: MS SQL buna
    icazə vermir (`Invalid use of a side-effecting operator ''UPDATE'' within a function`).

    - Çox böyük cədvəllərdə (milyonlarla sətir) hər sətir üçün ağır skalyar funksiya
    çağırmaq: Bu ''row-by-row'' icraya gətirib çıxara bilər; belə hallarda Inline
    TVF və ya birbaşa JOIN daha sürətlidir.'
interview_question:
  question:
    az: MS SQL Server-də Stored Procedure ilə User-Defined Function (Funksiya) arasındakı
      əsas fərqlər hansılardır? Nə zaman hansını seçməliyik?
    en: MS SQL Server-də Stored Procedure ilə User-Defined Function (Funksiya) arasındakı
      əsas fərqlər hansılardır? Nə zaman hansını seçməliyik?
  answer:
    az: '"Əsas fərqlər bunlardır:

      1. **Datanı Dəyişmək (Side-effects)**: Stored Procedure bazadakı datanı dəyişə
      bilər (`INSERT`, `UPDATE`, `DELETE`). Funksiyalar isə datanı dəyişə BİLMƏZ,
      onlar yalnız oxuyub hesablama aparır.

      2. **İstifadə yeri**: Funksiyalar birbaşa `SELECT`, `WHERE`, `JOIN` daxilində
      digər sütunlarla yanaşı istifadə oluna bilər. Stored Procedure isə yalnız `EXEC`
      ilə ayrı bir əmr kimi işə salınır.

      3. **Nəticə qaytarma**: Funksiya mütləq bir dəyər (skalyar) və ya cədvəl (`TABLE`)
      qaytarmalıdır (`RETURNS`). Prosedur isə heç nə qaytarmaya da bilər və ya `OUTPUT`
      parametrləri işlədə bilər.

      4. **Tranzaksiyalar və Xətalar**: Stored Procedure daxilində `BEGIN TRANSACTION`,
      `COMMIT`, `ROLLBACK` və `TRY...CATCH` istifadə oluna bildiyi halda, Funksiya
      daxilində bunlar qadağandır.


      Qayda: Əgər məqsəd məlumatı dəyişmək və ya çoxmərhələli biznes əməliyyatını
      icra etməkdirsə — **Stored Procedure** seçilir. Əgər məqsəd təkrar istifadə
      olunan bir hesablamanı `SELECT` sorğularına daxil etməkdirsə — **Function**
      seçilir."'
    en: '"Əsas fərqlər bunlardır:

      1. **Datanı Dəyişmək (Side-effects)**: Stored Procedure bazadakı datanı dəyişə
      bilər (`INSERT`, `UPDATE`, `DELETE`). Funksiyalar isə datanı dəyişə BİLMƏZ,
      onlar yalnız oxuyub hesablama aparır.

      2. **İstifadə yeri**: Funksiyalar birbaşa `SELECT`, `WHERE`, `JOIN` daxilində
      digər sütunlarla yanaşı istifadə oluna bilər. Stored Procedure isə yalnız `EXEC`
      ilə ayrı bir əmr kimi işə salınır.

      3. **Nəticə qaytarma**: Funksiya mütləq bir dəyər (skalyar) və ya cədvəl (`TABLE`)
      qaytarmalıdır (`RETURNS`). Prosedur isə heç nə qaytarmaya da bilər və ya `OUTPUT`
      parametrləri işlədə bilər.

      4. **Tranzaksiyalar və Xətalar**: Stored Procedure daxilində `BEGIN TRANSACTION`,
      `COMMIT`, `ROLLBACK` və `TRY...CATCH` istifadə oluna bildiyi halda, Funksiya
      daxilində bunlar qadağandır.


      Qayda: Əgər məqsəd məlumatı dəyişmək və ya çoxmərhələli biznes əməliyyatını
      icra etməkdirsə — **Stored Procedure** seçilir. Əgər məqsəd təkrar istifadə
      olunan bir hesablamanı `SELECT` sorğularına daxil etməkdirsə — **Function**
      seçilir."'
  interviewer_tips:
    az: '- Müsahibədə ''Funksiyalarda side-effect (əks-təsir) qadağandır'' ifadəsini
      işlətsəniz, müsahibə götürən mühəndis sizin bazanın daxili fəlsəfəsini çox yaxşı
      bildiyinizi görəcək.'
    en: '- Müsahibədə ''Funksiyalarda side-effect (əks-təsir) qadağandır'' ifadəsini
      işlətsəniz, müsahibə götürən mühəndis sizin bazanın daxili fəlsəfəsini çox yaxşı
      bildiyinizi görəcək.'
flashcards:
- front:
    az: MS SQL-də Scalar Function və Table-Valued Function (TVF) arasındakı fərq nədir?
    en: MS SQL-də Scalar Function və Table-Valued Function (TVF) arasındakı fərq nədir?
  back:
    az: Scalar Function tək bir dəyər (ədəd, mətn, tarix) qaytarır; Table-Valued Function
      isə sətir və sütunlardan ibarət bütöv bir cədvəl qaytarır.
    en: Scalar Function tək bir dəyər (ədəd, mətn, tarix) qaytarır; Table-Valued Function
      isə sətir və sütunlardan ibarət bütöv bir cədvəl qaytarır.
- front:
    az: Funksiya daxilində INSERT, UPDATE və ya DELETE yazmaq olarmı?
    en: Funksiya daxilində INSERT, UPDATE və ya DELETE yazmaq olarmı?
  back:
    az: Xeyr! Funksiyalarda 'side-effects' (yan təsirlər) qadağandır; onlar bazadakı
      mövcud cədvəlləri dəyişə bilməz, yalnız oxuyub hesablaya bilər.
    en: Xeyr! Funksiyalarda 'side-effects' (yan təsirlər) qadağandır; onlar bazadakı
      mövcud cədvəlləri dəyişə bilməz, yalnız oxuyub hesablaya bilər.
- front:
    az: Skalyar funksiyanı çağırarkən hansı prefiks mütləq yazılmalıdır?
    en: Skalyar funksiyanı çağırarkən hansı prefiks mütləq yazılmalıdır?
  back:
    az: 'Mütləq sxem adı yazılmalıdır (məsələn: dbo.fn_Hesabla), əks halda sistem
      xəta verəcək.'
    en: 'Mütləq sxem adı yazılmalıdır (məsələn: dbo.fn_Hesabla), əks halda sistem
      xəta verəcək.'
- front:
    az: Nə üçün Stored Procedure SELECT daxilində çağırıla bilməz, amma Funksiya çağırıla
      bilər?
    en: Nə üçün Stored Procedure SELECT daxilində çağırıla bilməz, amma Funksiya çağırıla
      bilər?
  back:
    az: Çünki Stored Procedure tranzaksiya aça və cədvəlləri dəyişə bilər; SQL-in
      oxuma sorğuları (SELECT) isə deterministik və təhlükəsiz olmalıdır.
    en: Çünki Stored Procedure tranzaksiya aça və cədvəlləri dəyişə bilər; SQL-in
      oxuma sorğuları (SELECT) isə deterministik və təhlükəsiz olmalıdır.
- front:
    az: Funksiya daxilində TRY...CATCH və ya ROLLBACK TRANSACTION istifadə edilə bilərmi?
    en: Funksiya daxilində TRY...CATCH və ya ROLLBACK TRANSACTION istifadə edilə bilərmi?
  back:
    az: Xeyr, Funksiyalarda nə tranzaksiya idarəsinə (COMMIT/ROLLBACK), nə də TRY...CATCH
      xəta bloklarına icazə verilir.
    en: Xeyr, Funksiyalarda nə tranzaksiya idarəsinə (COMMIT/ROLLBACK), nə də TRY...CATCH
      xəta bloklarına icazə verilir.
