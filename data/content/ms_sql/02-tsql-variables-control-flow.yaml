code: "-- Ssenari: Müştərinin zərər tarixcəsi (claims) əsasında sığorta haqqının hesablanması\n\
  -- Müştəri İD: 501, Baza KASKO haqqı: 1000 AZN\n\nDECLARE @TargetCustomerId INT\
  \ = 501;\nDECLARE @BasePremium DECIMAL(10, 2) = 1000.00;\nDECLARE @TotalPastClaims\
  \ INT = 0;\nDECLARE @FinalPremium DECIMAL(10, 2);\nDECLARE @StatusMessage NVARCHAR(100);\n\
  \n-- 1. Müştərinin keçmiş təsdiqlənmiş qəza sayını bazadan sayırıq\nSELECT @TotalPastClaims\
  \ = COUNT(*)\nFROM [dbo].[InsuranceClaims]\nWHERE [CustomerID] = @TargetCustomerId\n\
  \  AND [ClaimStatus] = N'APPROVED';\n\n-- 2. IF...ELSE məntiqi ilə bonus-malus dərəcəsinin\
  \ təyini\nIF @TotalPastClaims = 0\nBEGIN\n    -- Müştərinin heç bir qəzası olmayıb:\
  \ 20% bonus endirimi!\n    SET @FinalPremium = @BasePremium * 0.80;\n    SET @StatusMessage\
  \ = N'Təhlükəsiz sürücü: 20% endirim tətbiq edildi.';\nEND\nELSE IF @TotalPastClaims\
  \ BETWEEN 1 AND 2\nBEGIN\n    -- 1 və ya 2 qəza: Standart baza tarifi\n    SET @FinalPremium\
  \ = @BasePremium;\n    SET @StatusMessage = N'Standart tarif tətbiq edildi.';\n\
  END\nELSE\nBEGIN\n    -- 3 və daha çox qəza: Yüksək risk cəriməsi (+40% artım)\n\
  \    SET @FinalPremium = @BasePremium * 1.40;\n    SET @StatusMessage = N'Yüksək\
  \ riskli sürücü: +40% əlavə haqq hesablandı.';\nEND\n\n-- 3. Yekun hesabatı təqdim\
  \ edirik\nSELECT \n    @TargetCustomerId AS [CustomerID],\n    @TotalPastClaims\
  \ AS [PastClaimsCount],\n    @BasePremium AS [BasePremiumAZN],\n    @FinalPremium\
  \ AS [FinalCalculatedPremiumAZN],\n    @StatusMessage AS [DecisionNote];\n"
code_explanation:
  az: '* `DECLARE`: `@TargetCustomerId`, `@BasePremium` və nəticə dəyişənləri dəqiq
    tiplərlə (`INT`, `DECIMAL(10,2)`, `NVARCHAR(100)`) elan olunur.

    * `SELECT @TotalPastClaims = COUNT(*)`: Birbaşa cədvəldən aqreqasiya nəticəsi
    dəyişənə yazılır.

    * `IF...ELSE IF...ELSE`: Sığorta şirkətinin Bonus-Malus biznes qaydası T-SQL daxilində
    yoxlanılır.

    * `BEGIN...END`: Hər şərtin daxilində həm qiymət hesablanır, həm də izahat mətni
    mənimsədilir.

    * Yekun `SELECT`: Yaddaşdakı dəyişənləri bir sətirlik cədvəl nəticəsi kimi qaytarır.

    '
  en: '* `DECLARE`: `@TargetCustomerId`, `@BasePremium` və nəticə dəyişənləri dəqiq
    tiplərlə (`INT`, `DECIMAL(10,2)`, `NVARCHAR(100)`) elan olunur.

    * `SELECT @TotalPastClaims = COUNT(*)`: Birbaşa cədvəldən aqreqasiya nəticəsi
    dəyişənə yazılır.

    * `IF...ELSE IF...ELSE`: Sığorta şirkətinin Bonus-Malus biznes qaydası T-SQL daxilində
    yoxlanılır.

    * `BEGIN...END`: Hər şərtin daxilində həm qiymət hesablanır, həm də izahat mətni
    mənimsədilir.

    * Yekun `SELECT`: Yaddaşdakı dəyişənləri bir sətirlik cədvəl nəticəsi kimi qaytarır.

    '
