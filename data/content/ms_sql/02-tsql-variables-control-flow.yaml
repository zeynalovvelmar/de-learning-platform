what_it_does:
  az: '- T-SQL dəyişənlərinin necə elan edildiyini və dəyərləndirildiyini nümayiş
    etdirir.

    - Biznes məntiqlərinin baza daxilində IF...ELSE və BEGIN...END ilə necə budaqlandığını
    göstərir.

    - Sistem dəyişənləri (məs. @@ROWCOUNT) ilə məlumat axınlarının necə idarə olunacağını
    izah edir.'
  en: '- T-SQL dəyişənlərinin necə elan edildiyini və dəyərləndirildiyini nümayiş
    etdirir.

    - Biznes məntiqlərinin baza daxilində IF...ELSE və BEGIN...END ilə necə budaqlandığını
    göstərir.

    - Sistem dəyişənləri (məs. @@ROWCOUNT) ilə məlumat axınlarının necə idarə olunacağını
    izah edir.'
