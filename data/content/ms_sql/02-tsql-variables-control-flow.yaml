common_mistakes:
  az: '- IF daxilində BEGIN...END yazmamaq: Əgər iki sətir kod yazsanız, ikinci sətir
    şərt ödənsə də, ödənməsə də hər zaman icra ediləcək və gizli biznes məntiq xətası
    yaradacaq.

    - Çoxsətirli sorğuda `SET @var = (SELECT ID FROM Table)` yazmaq: Əgər cədvəldə
    5 sətir varsa, sorğu xəta verəcək (`Subquery returned more than 1 value`). Belə
    halda `TOP (1)` və ya `WHERE` ilə tək sətirə filtrləmək lazımdır.

    - Sətirbəsətir əməliyyatlar üçün ehtiyac olmadan nəhəng WHILE dövrləri yazmaq:
    SQL cədvəl yönümlüdür (set-based); 100,000 sətirlik dövr bazanı dondura bilər,
    onu tək bir `UPDATE` sorğusu ilə etmək lazımdır.'
  en: '- IF daxilində BEGIN...END yazmamaq: Əgər iki sətir kod yazsanız, ikinci sətir
    şərt ödənsə də, ödənməsə də hər zaman icra ediləcək və gizli biznes məntiq xətası
    yaradacaq.

    - Çoxsətirli sorğuda `SET @var = (SELECT ID FROM Table)` yazmaq: Əgər cədvəldə
    5 sətir varsa, sorğu xəta verəcək (`Subquery returned more than 1 value`). Belə
    halda `TOP (1)` və ya `WHERE` ilə tək sətirə filtrləmək lazımdır.

    - Sətirbəsətir əməliyyatlar üçün ehtiyac olmadan nəhəng WHILE dövrləri yazmaq:
    SQL cədvəl yönümlüdür (set-based); 100,000 sətirlik dövr bazanı dondura bilər,
    onu tək bir `UPDATE` sorğusu ilə etmək lazımdır.'
interview_question:
  question:
    az: T-SQL-də dəyişənə qiymət mənimsədərkən `SET` və `SELECT` açar sözləri arasında
      hansı fərqlər var və nə zaman hansını seçməliyik?
    en: T-SQL-də dəyişənə qiymət mənimsədərkən `SET` və `SELECT` açar sözləri arasında
      hansı fərqlər var və nə zaman hansını seçməliyik?
  answer:
    az: '"T-SQL-də hər iki açar söz dəyişənə qiymət vermək üçün istifadə olunsa da,
      3 vacib fərq var:

      1. **Standartlıq**: `SET` ANSI standartına uyğundur və bir dəfəyə yalnız tək
      bir dəyişənə dəyər mənimsədir. `SELECT` isə bir sorğuda eyni anda bir neçə dəyişəni
      mənimsədə bilir (`SELECT @a = col1, @b = col2 FROM ...`).

      2. **Çoxsətirli nəticə davranışı**: Əgər sorğu birdən çox sətir qaytararsa,
      `SET @var = (SELECT col FROM table)` icra xətası verir (Error 512). Lakin `SELECT
      @var = col FROM table` heç bir xəta vermədən ən sonuncu oxunan sətrin dəyərini
      saxlayır, bu isə gözlənilməz nəticəyə gətirib çıxara bilər.

      3. **Boş nəticə (0 sətir)**: Əgər sorğu heç bir sətir tapmazsa, `SET` dəyişəni
      `NULL` edir; `SELECT` isə dəyişənin əvvəlki dəyərini olduğu kimi saxlayır.


      Qayda: Skalyar və təhlükəsiz hesablamalar üçün həmişə `SET` tövsiyə edilir."'
    en: '"T-SQL-də hər iki açar söz dəyişənə qiymət vermək üçün istifadə olunsa da,
      3 vacib fərq var:

      1. **Standartlıq**: `SET` ANSI standartına uyğundur və bir dəfəyə yalnız tək
      bir dəyişənə dəyər mənimsədir. `SELECT` isə bir sorğuda eyni anda bir neçə dəyişəni
      mənimsədə bilir (`SELECT @a = col1, @b = col2 FROM ...`).

      2. **Çoxsətirli nəticə davranışı**: Əgər sorğu birdən çox sətir qaytararsa,
      `SET @var = (SELECT col FROM table)` icra xətası verir (Error 512). Lakin `SELECT
      @var = col FROM table` heç bir xəta vermədən ən sonuncu oxunan sətrin dəyərini
      saxlayır, bu isə gözlənilməz nəticəyə gətirib çıxara bilər.

      3. **Boş nəticə (0 sətir)**: Əgər sorğu heç bir sətir tapmazsa, `SET` dəyişəni
      `NULL` edir; `SELECT` isə dəyişənin əvvəlki dəyərini olduğu kimi saxlayır.


      Qayda: Skalyar və təhlükəsiz hesablamalar üçün həmişə `SET` tövsiyə edilir."'
