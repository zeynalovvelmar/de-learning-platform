id: 02-tsql-variables-control-flow
order: 2
level: junior
title:
  az: T-SQL Dəyişənləri və İdarəetmə Blokları (Variables & Control Flow)
  en: T-SQL Dəyişənləri və İdarəetmə Blokları (Variables & Control Flow)
quick_recap:
  az: '- T-SQL-də bütün lokal dəyişənlər mütləq ''@'' simvolu ilə başlayır: DECLARE
    @Məbləğ DECIMAL(10,2) = 500.00;

    - Dəyər mənimsətmək üçün həm SET, həm də SELECT istifadə edilə bilər (SET tək
    bir skalyar dəyər üçün standartdır).

    - Məntiqi şərtlər: IF...ELSE. Əgər şərt daxilində birdən çox əmr varsa, mütləq
    BEGIN...END blokuna alınmalıdır (Python-dakı girintilər və ya C/Java-dakı { }
    mötərizələri kimi).

    - MS SQL-də FOR dövrü yoxdur — yeganə dövr mexanizmi WHILE...BEGIN...END strukturudur.

    - @@ROWCOUNT — sonuncu icra olunan SQL sorğusunun neçə sətirə təsir etdiyini bildirən
    ən vacib sistem dəyişənidir (ETL-də monitorinq üçün əvəzsizdir).'
  en: '- T-SQL-də bütün lokal dəyişənlər mütləq ''@'' simvolu ilə başlayır: DECLARE
    @Məbləğ DECIMAL(10,2) = 500.00;

    - Dəyər mənimsətmək üçün həm SET, həm də SELECT istifadə edilə bilər (SET tək
    bir skalyar dəyər üçün standartdır).

    - Məntiqi şərtlər: IF...ELSE. Əgər şərt daxilində birdən çox əmr varsa, mütləq
    BEGIN...END blokuna alınmalıdır (Python-dakı girintilər və ya C/Java-dakı { }
    mötərizələri kimi).

    - MS SQL-də FOR dövrü yoxdur — yeganə dövr mexanizmi WHILE...BEGIN...END strukturudur.

    - @@ROWCOUNT — sonuncu icra olunan SQL sorğusunun neçə sətirə təsir etdiyini bildirən
    ən vacib sistem dəyişənidir (ETL-də monitorinq üçün əvəzsizdir).'
explanation:
  az: "### T-SQL-də Dəyişənlər (Variables)\nMürəkkəb biznes hesablamalarında aralıq\
    \ nəticələri yaddaşda saxlamaq üçün dəyişənlərdən istifadə olunur. T-SQL-də qaydalar:\n\
    1. Hər bir lokal dəyişən adı **`@`** simvolu ilə başlamalıdır (`@CustomerID`,\
    \ `@TotalPayout`).\n2. Dəyişən **`DECLARE`** açar sözü və tipi ilə elan edilir.\n\
    3. Dəyər mənimsətmək üçün iki üsul var: **`SET`** və ya **`SELECT`**.\n\n```sql\n\
    DECLARE @BonusRate DECIMAL(4, 2) = 0.15;\nDECLARE @ActivePolicyCount INT;\n\n\
    -- 1. SET ilə mənimsətmə (tövsiyə olunan təkli dəyər üsulu):\nSET @ActivePolicyCount\
    \ = 120;\n\n-- 2. SELECT ilə cədvəldən mənimsətmə:\nSELECT @ActivePolicyCount\
    \ = COUNT(*) \nFROM [dbo].[InsurancePolicies] \nWHERE [IsActive] = 1;\n```\n\n\
    > [!NOTE]\n> **SET vs SELECT fərqi:** Əgər sorğu birdən çox sətir qaytararsa,\
    \ `SELECT @var = col` heç bir xəta vermədən ən sonuncu sətrin dəyərini mənimsədəcək.\
    \ `SET @var = (SELECT col ...)` isə çoxsətirli nəticə gördükdə xəta verib sizi\
    \ qoruyacaq! Buna görə təkli dəyərlər üçün həmişə `SET` tövsiyə edilir.\n\n---\n\
    \n### Şərti İdarəetmə: IF...ELSE və BEGIN...END Tələsi\nT-SQL-də şərt blokları\
    \ `IF` və `ELSE` vasitəsilə qurulur. Ən vacib qayda: **`BEGIN...END`**.\n\nƏgər\
    \ `BEGIN...END` yazmasanız, T-SQL yalnız növbəti **bircə sətir əmri** şərtə aid\
    \ hesab edəcək!\n```sql\nDECLARE @ClaimAmount DECIMAL(10, 2) = 8500.00;\n\nIF\
    \ @ClaimAmount > 5000.00\nBEGIN\n    PRINT N'Zərər məbləği böyükdür! Komissiya\
    \ təsdiqi tələb olunur.';\n    -- Digər əmrlər...\nEND\nELSE\nBEGIN\n    PRINT\
    \ N'Zərər standart qaydada avtomatik ödənilə bilər.';\nEND\n```\n\n---\n\n###\
    \ Dövrlər: WHILE Strukturu\nMS SQL-də `FOR` və ya `FOREACH` açar sözü yoxdur.\
    \ Əgər təkrarlanan əməliyyat aparmaq lazımdırsa, yalnız **`WHILE`** istifadə olunur:\n\
    ```sql\nDECLARE @Counter INT = 1;\n\nWHILE @Counter <= 3\nBEGIN\n    PRINT N'Dövr\
    \ addımı: ' + CAST(@Counter AS NVARCHAR(10));\n    SET @Counter = @Counter + 1;\n\
    \    -- Lazım gələrsə: BREAK (dövrdən çıxır) və ya CONTINUE (növbəti addıma keçir)\n\
    END\n```\n*(Qeyd: Data mühəndisliyində sətirbəsətir dövr qurmaq yerinə həmişə\
    \ cədvəl yönümlü - set-based SQL sorğularına üstünlük verilir).*\n\n---\n\n###\
    \ Data Mühəndisi üçün Ən Vacib Sistem Dəyişənləri\nETL proseslərində və boru xətlərində\
    \ T-SQL ilə işləyərkən bu qlobal dəyişənləri bilmək şərtdir:\n* **`@@ROWCOUNT`**:\
    \ Sonuncu əmrin (`SELECT`, `UPDATE`, `INSERT`, `DELETE`) təsir etdiyi sətir sayı.\
    \ Əgər `UPDATE` etdinizsə və `@@ROWCOUNT = 0` olarsa, deməli heç bir sətir tapılmayıb.\n\
    * **`SCOPE_IDENTITY()`**: Həmin əməliyyat daxilində sonuncu `INSERT` zamanı avtomatik\
    \ yaranmış `IDENTITY` (ID) nömrəsini qaytarır.\n* **`@@ERROR`**: Əgər son əmr\
    \ uğurlu olubsa `0`, xəta baş veribsə xətanın nömrəsini qaytarır.\n"
