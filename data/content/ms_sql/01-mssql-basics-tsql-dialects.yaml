id: 01-mssql-basics-tsql-dialects
order: 1
level: junior
title:
  az: MS SQL Server və T-SQL Nədir? PostgreSQL ilə Əsas Fərqlər
  en: MS SQL Server və T-SQL Nədir? PostgreSQL ilə Əsas Fərqlər
quick_recap:
  az: '- Microsoft SQL Server (MS SQL) korporativ səviyyəli, yüksək etibarlı əlaqəli
    verilənlər bazası idarəetmə sistemidir (RDBMS).

    - Bank, sığorta və telekom şirkətlərində (o cümlədən İri sığorta və maliyyə şirkətlərində) əsas əməliyyat
    (Core OLTP) sistemlərinin mərkəzində çox vaxt MS SQL dayanır.

    - T-SQL (Transact-SQL) — Microsoft-un standart ANSI SQL-ə əlavə etdiyi proqramlaşdırma
    dili uzantısıdır (dəyişənlər, şərtlər, dövrlər, prosedurlar).

    - PostgreSQL bilən bir tələbə üçün əsas fərqlər: LIMIT yerinə TOP, SERIAL yerinə
    IDENTITY, BOOLEAN yerinə BIT (0/1), NVARCHAR və N''metn'' prefiksi.'
  en: '- Microsoft SQL Server (MS SQL) korporativ səviyyəli, yüksək etibarlı əlaqəli
    verilənlər bazası idarəetmə sistemidir (RDBMS).

    - Bank, sığorta və telekom şirkətlərində (o cümlədən İri sığorta və maliyyə şirkətlərində) əsas əməliyyat
    (Core OLTP) sistemlərinin mərkəzində çox vaxt MS SQL dayanır.

    - T-SQL (Transact-SQL) — Microsoft-un standart ANSI SQL-ə əlavə etdiyi proqramlaşdırma
    dili uzantısıdır (dəyişənlər, şərtlər, dövrlər, prosedurlar).

    - PostgreSQL bilən bir tələbə üçün əsas fərqlər: LIMIT yerinə TOP, SERIAL yerinə
    IDENTITY, BOOLEAN yerinə BIT (0/1), NVARCHAR və N''metn'' prefiksi.'
explanation:
  az: "### MS SQL Server Nədir və Niyə Sığortada Geniş İstifadə Olunur?\n**Microsoft\
    \ SQL Server** dünyanın ən populyar relasion məlumat bazalarından biridir. Enterprise\
    \ Sığorta, banklar və dövlət müəssisələri illərdir əsas biznes əməliyyatlarını\
    \ (müqavilə bağlanması, müştəri qeydiyyatı, ödənişlər) MS SQL üzərində idarə edir.\
    \ \n\nSəbəbləri:\n1. **Yüksək Təhlükəsizlik və Əməliyyat Dəqiqliyi (ACID)**: Tranzaksiyaların\
    \ itməməsi, daimi ehtiyat nüsxələr (log backup).\n2. **Geniş Korporativ Ekosistem**:\
    \ Active Directory, Windows Server və Microsoft BI alətləri ilə qüsursuz inteqrasiya.\n\
    3. **T-SQL və Daxili Mexanizmlər**: Biznes məntiqlərinin birbaşa baza səviyyəsində\
    \ saxlanılan prosedurlar (Stored Procedures) vasitəsilə yüksək sürətlə icra olunması.\n\
    \nMəlumat bazasını idarə etmək üçün **SSMS (SQL Server Management Studio)** və\
    \ ya **Azure Data Studio** vizual alətlərindən istifadə olunur.\n\n---\n\n###\
    \ T-SQL Nədir?\nStandart SQL sadəcə datanı sorğulamaq (`SELECT`, `INSERT`, `UPDATE`,\
    \ `DELETE`) üçündür. Lakin real biznes prosesində sizə məntiq lazımdır: *\"Əgər\
    \ müştərinin borcu yoxdursa endirim et, əks halda xəta qaytar\"*.\n\nMicrosoft\
    \ standart SQL-in üzərinə proqramlaşdırma imkanları əlavə edərək onu **T-SQL (Transact-SQL)**\
    \ adlandırdı. T-SQL sizə dəyişən elan etmək (`DECLARE`), şərt yoxlamaq (`IF...ELSE`),\
    \ dövr qurmaq (`WHILE`) və xətaları tutmaq (`TRY...CATCH`) imkanı verir.\n\n---\n\
    \n### PostgreSQL və Standart SQL ilə Əsas T-SQL Fərqləri\nƏgər siz PostgreSQL\
    \ və ya ümumi SQL ilə tanışsınızsa, MS SQL-ə keçərkən ilk günlərdə qarşılaşacağınız\
    \ əsas fərqlər bunlardır:\n\n| Xüsusiyyət | PostgreSQL / Standart SQL | MS SQL\
    \ Server (T-SQL) | İzah və Nümunə |\n| :--- | :--- | :--- | :--- |\n| **Sətir\
    \ sayını məhdudlaşdırmaq** | `LIMIT 10` (sorğunun sonunda) | `SELECT TOP (10)\
    \ ...` (SELECT-dən dərhal sonra) | `SELECT TOP (5) * FROM Policies;` |\n| **Mətn\
    \ Tipləri** | `VARCHAR`, `TEXT` | `VARCHAR` (ASCII) və `NVARCHAR` (Unicode) |\
    \ Azərbaycan hərfləri (`ə, ö, ğ, ç, ş`) üçün mütləq `NVARCHAR` seçilməlidir! |\n\
    | **Unicode Mətn Sabitləri** | `'Əli'` | `N'Əli'` (Qarşısında **N** hərfi) | `WHERE\
    \ Name = N'Samirə Əliyeva'` (N qoyulmazsa '?' simvoluna çevrilə bilər) |\n| **Məntiqi\
    \ Tip (Boolean)** | `BOOLEAN` (`TRUE` / `FALSE`) | `BIT` (`1`, `0` və ya `NULL`)\
    \ | MS SQL-də `WHERE is_active = TRUE` yazmaq olmaz; `WHERE is_active = 1` yazılır!\
    \ |\n| **Avtomatik Artan Açar** | `SERIAL` və ya `IDENTITY` | `IDENTITY(1, 1)`\
    \ | `PolicyID INT IDENTITY(1,1) PRIMARY KEY` (1-dən başlayır, hər dəfə 1 artır)\
    \ |\n| **Tarix və Saat** | `TIMESTAMP`, `NOW()` | `DATETIME2`, `GETDATE()` / `SYSDATETIME()`\
    \ | `created_at DATETIME2 DEFAULT SYSDATETIME()` |\n| **NULL Yoxlanması** | `COALESCE(val,\
    \ 'N/A')` | `ISNULL(val, 'N/A')` və ya `COALESCE` | `ISNULL` yalnız 2 parametr\
    \ qəbul edir və T-SQL-ə xasdır. |\n| **Mətn Birləşdirmə** | `'A' \\|\\| 'B'` |\
    \ `'A' + 'B'` və ya `CONCAT('A', 'B')` | MS SQL-də `+` simvolu həm cəmləmə, həm\
    \ də mətn birləşdirmə edir. |\n| **Sxem və Obyekt Adları** | `\"public\".\"policies\"\
    ` | `[dbo].[Policies]` | MS SQL-də obyekt adları kvadrat mötərizə `[ ]` daxilində\
    \ yazılır. Standart sxem `dbo`-dur. |\n\n---\n\n### Təcrübəçi üçün Ən Kritik Nüans:\
    \ `NVARCHAR` və `N''` Prefiksi\nAzərbaycandakı layihələrdə ən çox rast gəlinən\
    \ səhvlərdən biri Unicode dəstəyidir.\nƏgər sütun `VARCHAR` olaraq yaradılsa və\
    \ ya sorğu yazarkən `WHERE Name = 'Əli'` yazsanız, MS SQL `Ə` hərfini tanıya bilməyib\
    \ bazaya `?li` olaraq qeyd edə bilər.\nHəmişə:\n* Sütun tipini `NVARCHAR(100)`\
    \ təyin edin.\n* Sorğularda mətnin önünə böyük **`N`** hərfi əlavə edin: `N'KASKO\
    \ Sığortası'`.\n"
