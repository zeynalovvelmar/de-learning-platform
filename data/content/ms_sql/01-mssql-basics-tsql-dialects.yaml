code: "-- MS SQL Server (T-SQL) Nümunəsi: Sığorta Polisləri Cədvəli\n-- 1. Cədvəlin\
  \ yaradılması (IDENTITY və NVARCHAR xüsusiyyətlərinə diqqət yetirin)\nCREATE TABLE\
  \ [dbo].[InsurancePolicies] (\n    [PolicyID] INT IDENTITY(1001, 1) PRIMARY KEY,\
  \ -- 1001-dən başlayır, 1-1 artır\n    [PolicyNumber] NVARCHAR(30) NOT NULL UNIQUE,\n\
  \    [CustomerName] NVARCHAR(100) NOT NULL,\n    [ProductType] NVARCHAR(50) NOT\
  \ NULL,\n    [PremiumAZN] DECIMAL(10, 2) NOT NULL,\n    [IsActive] BIT NOT NULL\
  \ DEFAULT 1,             -- 1 = Aktiv, 0 = Deaktiv\n    [AgentNote] NVARCHAR(255)\
  \ NULL,\n    [CreatedAt] DATETIME2 NOT NULL DEFAULT SYSDATETIME()\n);\n\n-- 2. Datanın\
  \ əlavə edilməsi (Unicode N prefiksinə diqqət edin)\nINSERT INTO [dbo].[InsurancePolicies]\
  \ \n    ([PolicyNumber], [CustomerName], [ProductType], [PremiumAZN], [IsActive],\
  \ [AgentNote])\nVALUES \n    (N'KASKO-2026-001', N'Fərid Məmmədov', N'KASKO', 1450.00,\
  \ 1, N'Tam paket endirimlə'),\n    (N'ICBARI-2026-002', N'Aygün Hüseynova', N'İcbari\
  \ Avto', 120.00, 1, NULL),\n    (N'KASKO-2026-003', N'Rəşad Quliyev', N'KASKO',\
  \ 2100.50, 0, N'Müştəri imtina etdi');\n\n-- 3. T-SQL Sorğusu: TOP 2, ISNULL və\
  \ Mətn birləşdirmə (+)\nSELECT TOP (2)\n    [PolicyNumber],\n    [CustomerName],\n\
  \    [ProductType] + N' (' + CAST([PremiumAZN] AS NVARCHAR(20)) + N' AZN)' AS [ProductSummary],\n\
  \    ISNULL([AgentNote], N'Qeyd yoxdur') AS [CleanNote],\n    CASE WHEN [IsActive]\
  \ = 1 THEN N'Aktiv' ELSE N'Passiv' END AS [StatusText]\nFROM [dbo].[InsurancePolicies]\n\
  WHERE [IsActive] = 1\nORDER BY [PremiumAZN] DESC;\n"
code_explanation:
  az: '* `IDENTITY(1001, 1)`: Birinci sətir üçün `PolicyID` 1001 olacaq, növbəti sətirlər
    1002, 1003 kimi avtomatik artacaq (`SERIAL` əvəzinə).

    * `NVARCHAR(100)` və `N''Fərid''`: `N` hərfi Unicode (Milli simvollar) olduğunu
    bildirir. Azərbaycan şriftləri üçün şərtdir.

    * `BIT`: `1` (Aktiv) və `0` (Passiv). T-SQL-də `TRUE/FALSE` açar sözləri əvəzinə
    rəqəmlər işlədilir.

    * `SELECT TOP (2)`: PostgreSQL-dəki `LIMIT 2` əmrinə bərabərdir, ən yüksək məbləğli
    ilk 2 polisi gətirir.

    * `ISNULL([AgentNote], N''Qeyd yoxdur'')`: Əgər qeyd `NULL`-dırsa, əvəzinə standart
    mətn qaytarır.

    * `+` operatoru: Mətnləri bir-birinə bağlayır (`CONCAT` da istifadə edilə bilər).

    '
  en: '* `IDENTITY(1001, 1)`: Birinci sətir üçün `PolicyID` 1001 olacaq, növbəti sətirlər
    1002, 1003 kimi avtomatik artacaq (`SERIAL` əvəzinə).

    * `NVARCHAR(100)` və `N''Fərid''`: `N` hərfi Unicode (Milli simvollar) olduğunu
    bildirir. Azərbaycan şriftləri üçün şərtdir.

    * `BIT`: `1` (Aktiv) və `0` (Passiv). T-SQL-də `TRUE/FALSE` açar sözləri əvəzinə
    rəqəmlər işlədilir.

    * `SELECT TOP (2)`: PostgreSQL-dəki `LIMIT 2` əmrinə bərabərdir, ən yüksək məbləğli
    ilk 2 polisi gətirir.

    * `ISNULL([AgentNote], N''Qeyd yoxdur'')`: Əgər qeyd `NULL`-dırsa, əvəzinə standart
    mətn qaytarır.

    * `+` operatoru: Mətnləri bir-birinə bağlayır (`CONCAT` da istifadə edilə bilər).

    '
