common_mistakes:
  az: '- MS SQL-də sorğunun sonuna `LIMIT 10` yazmaq: T-SQL sintaksis xətası verəcək
    (`Incorrect syntax near ''LIMIT''`). Həmişə `SELECT TOP (10)` yazılmalıdır.

    - Azərbaycan mətnlərində `N` hərfini unutmaq: `WHERE City = ''Gəncə''` yazdıqda,
    əgər collation fərqlidirsə, nəticə tapılmaya bilər; düzgünü `WHERE City = N''Gəncə''`-dir.

    - Məntiqi şərtlərdə `WHERE is_valid = TRUE` yazmaq: MS SQL-də `BIT` tipi üçün
    `WHERE is_valid = 1` yazılmalıdır.'
  en: '- MS SQL-də sorğunun sonuna `LIMIT 10` yazmaq: T-SQL sintaksis xətası verəcək
    (`Incorrect syntax near ''LIMIT''`). Həmişə `SELECT TOP (10)` yazılmalıdır.

    - Azərbaycan mətnlərində `N` hərfini unutmaq: `WHERE City = ''Gəncə''` yazdıqda,
    əgər collation fərqlidirsə, nəticə tapılmaya bilər; düzgünü `WHERE City = N''Gəncə''`-dir.

    - Məntiqi şərtlərdə `WHERE is_valid = TRUE` yazmaq: MS SQL-də `BIT` tipi üçün
    `WHERE is_valid = 1` yazılmalıdır.'
interview_question:
  question:
    az: PostgreSQL və ya standart SQL ilə MS SQL Server (T-SQL) arasında ən vacib
      4-5 sintaksis və tip fərqini izah edin.
    en: PostgreSQL və ya standart SQL ilə MS SQL Server (T-SQL) arasında ən vacib
      4-5 sintaksis və tip fərqini izah edin.
  answer:
    az: '"T-SQL Microsoft-un genişləndirilmiş SQL dialektidir. Əsas fərqlər bunlardır:

      1. **Nəticə sayının məhdudlaşdırılması**: PostgreSQL-də `LIMIT n` sorğunun sonunda
      yazıldığı halda, T-SQL-də `SELECT TOP (n)` başlanğıcda yazılır.

      2. **Mətn və Unicode**: T-SQL-də Unicode dəstəyi üçün `NVARCHAR` tipi və mətn
      sabitləri qarşısında `N` prefiksi (məsələn, `N''Sığorta''`) istifadə olunmalıdır.

      3. **Məntiqi tip (Boolean)**: T-SQL-də ayrıca `BOOLEAN` tipi yoxdur, onun əvəzinə
      `BIT` tipi (1, 0, NULL) işlədilir.

      4. **Avtomatik artan açarlar**: PostgreSQL `SERIAL` və ya `IDENTITY` işlədir,
      T-SQL isə cədvəl yaradılarkən sütuna `IDENTITY(başlanğıc, addım)` parametri
      əlavə edir.

      5. **Daxili funksiyalar**: PostgreSQL-dəki `NOW()` T-SQL-də `GETDATE()` və ya
      `SYSDATETIME()`, `COALESCE` ilə yanaşı T-SQL-ə xas `ISNULL(val, default)` funksiyası
      mövcuddur."'
    en: '"T-SQL Microsoft-un genişləndirilmiş SQL dialektidir. Əsas fərqlər bunlardır:

      1. **Nəticə sayının məhdudlaşdırılması**: PostgreSQL-də `LIMIT n` sorğunun sonunda
