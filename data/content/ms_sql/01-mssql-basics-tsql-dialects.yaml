      2. **Mətn və Unicode**: T-SQL-də Unicode dəstəyi üçün `NVARCHAR` tipi və mətn
      sabitləri qarşısında `N` prefiksi (məsələn, `N''Sığorta''`) istifadə olunmalıdır.

      3. **Məntiqi tip (Boolean)**: T-SQL-də ayrıca `BOOLEAN` tipi yoxdur, onun əvəzinə
      `BIT` tipi (1, 0, NULL) işlədilir.

      4. **Avtomatik artan açarlar**: PostgreSQL `SERIAL` və ya `IDENTITY` işlədir,
      T-SQL isə cədvəl yaradılarkən sütuna `IDENTITY(başlanğıc, addım)` parametri
      əlavə edir.

      5. **Daxili funksiyalar**: PostgreSQL-dəki `NOW()` T-SQL-də `GETDATE()` və ya
      `SYSDATETIME()`, `COALESCE` ilə yanaşı T-SQL-ə xas `ISNULL(val, default)` funksiyası
      mövcuddur."'
  interviewer_tips:
    az: '- Müsahibədə `NVARCHAR` və `N` prefiksini vurğulamaq yerli şirkətlərdə çox
      bəyənilir, çünki Azərbaycan hərflərinin bazada korlanması ən çox rast gəlinən
      real problemdir.

      - `SELECT TOP (n) WITH TIES` xüsusiyyətini bildiyinizi qeyd etsəniz, əla üstünlük
      qazanarsınız (eyni qiymətə malik sətirləri də gətirir).'
