what_it_does:
  az: '- MS SQL Server və T-SQL dialektinin fundamental prinsiplərini aydınlaşdırır.

    - PostgreSQL və ANSI SQL biliklərinizi dərhal MS SQL mühitinə uyğunlaşdırmağa
    kömək edir.

    - Azərbaycan dilindəki mətnlərin Unicode (NVARCHAR / N'''') düzgün saxlanmasını
    izah edir.'
