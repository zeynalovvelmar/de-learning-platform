flashcards:
- front:
    az: MS SQL Server-də T-SQL nədir?
    en: MS SQL Server-də T-SQL nədir?
  back:
    az: Transact-SQL — Microsoft-un standart ANSI SQL-ə əlavə etdiyi proqramlaşdırma
      dili uzantısıdır (dəyişənlər, şərtlər, dövrlər və prosedurlar təqdim edir).
    en: Transact-SQL — Microsoft-un standart ANSI SQL-ə əlavə etdiyi proqramlaşdırma
      dili uzantısıdır (dəyişənlər, şərtlər, dövrlər və prosedurlar təqdim edir).
- front:
    az: PostgreSQL-dəki LIMIT əmrinin T-SQL qarşılığı nədir?
    en: PostgreSQL-dəki LIMIT əmrinin T-SQL qarşılığı nədir?
  back:
    az: SELECT TOP (n) ... — sorğunun sonunda deyil, birbaşa SELECT sözündən dərhal
      sonra yazılır.
    en: SELECT TOP (n) ... — sorğunun sonunda deyil, birbaşa SELECT sözündən dərhal
      sonra yazılır.
- front:
    az: T-SQL-də VARCHAR və NVARCHAR arasındakı fərq nədir və N prefiksi nə üçündür?
    en: T-SQL-də VARCHAR və NVARCHAR arasındakı fərq nədir və N prefiksi nə üçündür?
  back:
    az: VARCHAR 1 baytlıq ASCII simvolları saxlayır, NVARCHAR isə 2 baytlıq Unicode
      simvolları (ə, ö, ğ və s.) saxlayır. Mətn sabitləri önünə N qoyulmasa (məs.
      N'Mətn'), simvollar '?' işarəsinə çevrilə bilər.
    en: VARCHAR 1 baytlıq ASCII simvolları saxlayır, NVARCHAR isə 2 baytlıq Unicode
      simvolları (ə, ö, ğ və s.) saxlayır. Mətn sabitləri önünə N qoyulmasa (məs.
      N'Mətn'), simvollar '?' işarəsinə çevrilə bilər.
- front:
    az: MS SQL-də Boolean (True/False) tipi necə təmsil olunur?
    en: MS SQL-də Boolean (True/False) tipi necə təmsil olunur?
  back:
    az: MS SQL-də ayrıca BOOLEAN tipi yoxdur; onun əvəzinə BIT tipi işlədilir (1 =
      True, 0 = False, NULL).
    en: MS SQL-də ayrıca BOOLEAN tipi yoxdur; onun əvəzinə BIT tipi işlədilir (1 =
      True, 0 = False, NULL).
- front:
    az: T-SQL-də cədvəldə avtomatik artan (auto-increment) ID necə yaradılır?
    en: T-SQL-də cədvəldə avtomatik artan (auto-increment) ID necə yaradılır?
  back:
    az: 'Sütun tərifində IDENTITY(seed, increment) yazılır, məsələn: PolicyID INT
      IDENTITY(1, 1) PRIMARY KEY.'
    en: 'Sütun tərifində IDENTITY(seed, increment) yazılır, məsələn: PolicyID INT
      IDENTITY(1, 1) PRIMARY KEY.'
