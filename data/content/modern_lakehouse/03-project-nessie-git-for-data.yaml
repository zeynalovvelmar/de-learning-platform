interview_question:
  question:
    en: What is Project Nessie, and how does it implement the Write-Audit-Publish
      (WAP) pattern for modern Data Lakehouses?
    az: Project Nessie nədir və müasir Data Lakehouse-da Yaz-Yoxla-Yayımla (Write-Audit-Publish
      — WAP) modelini necə həyata keçirir?
  answer:
    en: "1. **What is Nessie**: An open-source transactional catalog that brings Git-like\
      \ semantics (branches, tags, commits, and merges) to data lakehouse table formats\
      \ like Apache Iceberg.\n2. **The WAP Pattern**:\n   - **Write**: Instead of\
      \ writing batch data directly into production tables, an orchestrator (Airflow)\
      \ creates a temporary isolated branch in Nessie (e.g. `branch_20261031`). Spark\
      \ or dbt ingests and transforms data strictly within this branch.\n   - **Audit**:\
      \ Automated data quality tests (checking primary keys, null thresholds, schema\
      \ anomalies, and financial reconciliations) run against the working branch.\n\
      \   - **Publish**: If all audit tests pass, Nessie executes an atomic, zero-copy\
      \ merge from the working branch into `main`. If any test fails, the branch is\
      \ dropped without leaving dirty data behind.\n3. **Multi-Table Consistency**:\
      \ Unlike traditional lakehouses where tables are updated one by one, Nessie\
      \ enables multi-table transactions—updating `Customers`, `Policies`, and `Claims`\
      \ on a branch and committing all three simultaneously into production in a single\
      \ transaction.\n"
    az: "1. **Nessie Nədir**: Apache Iceberg cədvəlləri üçün Git-bənzəri idarəetmə\
      \ qaydalarını (budaqlanma, teqləmə, kommit və birləşdirmə) təmin edən açıq mənbəli\
      \ tranzaksional kataloqdur.\n2. **WAP Modeli**:\n   - **Yaz (Write)**: Məlumat\
      \ birbaşa canlı cədvəllərə deyil, Airflow tərəfindən Nessie-də açılan müvəqqəti\
      \ təcrid olunmuş işçi budağa (`branch_20261031`) yazılır.\n   - **Yoxla (Audit)**:\
      \ Həmin budaq üzərində avtomatik keyfiyyət testləri (NULL yoxlaması, dublikatlar,\
      \ maliyyə balanslarının uyğunluğu) aparılır.\n   - **Yayımla (Publish)**: Testlər\
      \ uğurla keçərsə, Nessie həmin budaqdakı dəyişiklikləri sıfır-kopyalama ilə\
      \ canlı `main` budağına **merge** edir. Xəta olarsa, budaq sadəcə silinir və\
      \ canlı sistemə zərrə qədər xələl gəlmir.\n3. **Çoxcədvəlli Ardıcıllıq**: Ənənəvi\
      \ sistemlərdə cədvəllər növbə ilə yenilənirdi və ortada qəza olanda baza korlanırdı.\
      \ Nessie ilə bir neçə əlaqəli cədvəl (`Müştərilər`, `Polislər`, `Hadisələr`)\
      \ eyni budaqda yenilənir və tək bir atomik kommitlə canlıya keçirilir.\n"
  interviewer_tips:
    en: 'Emphasize that Nessie branches are zero-copy: creating a branch creates lightweight
      metadata pointers, taking 1 millisecond and consuming zero extra S3 storage.'
    az: 'Nessie budaqlarının sıfır-kopyalama (zero-copy) olduğunu vurğulayın: yeni
      budaq açanda S3-dəki nəhəng fayllar kopyalanmır, yalnız yüngül metadata göstəriciləri
      yaranır.'
flashcards:
- front:
    en: What is Project Nessie?
    az: Project Nessie nədir?
  back:
    en: A transactional, Git-like catalog for Apache Iceberg that enables branching,
      tagging, and atomic multi-table commits.
    az: Apache Iceberg üçün budaqlanma, teqləmə və çoxcədvəlli atomik birləşdirməni
      təmin edən Git-bənzəri tranzaksional kataloqdur.
- front:
    en: What is the Write-Audit-Publish (WAP) pattern in data engineering?
    az: Data mühəndisliyində Yaz-Yoxla-Yayımla (WAP) modeli nədir?
  back:
    en: Writing data to an isolated branch, validating it with automated quality tests,
      and merging it to production only after tests succeed.
    az: Məlumatı təcrid olunmuş budağa yazmaq, avtomatik testlərlə keyfiyyətini yoxlamaq
      və yalnız testlər uğurlu olduqda canlı sistemə merge etmək.
- front:
    en: Does creating a Nessie branch duplicate the physical Parquet data files in
      S3?
    az: Nessie-də yeni budaq açanda S3-dəki fiziki Parquet faylları kopyalanırmı?
  back:
    en: No! Nessie branches are zero-copy metadata pointers; they take 1 millisecond
      to create and consume zero extra storage.
    az: Xeyr! Nessie budaqları sıfır-kopyalamadır (zero-copy); yaradılması 1 millisaniyə
      çəkir və əlavə disk yeri tutmur.
- front:
    en: 'What is the benefit of Nessie tags (e.g. tag: year_end_2026)?'
    az: 'Nessie teqlərinin (məsələn: tag: year_end_2026) faydası nədir?'
  back:
    en: They freeze an immutable snapshot of all tables at a specific milestone, enabling
      100% reproducible historical financial audits.
    az: Bütün cədvəllərin müəyyən andakı vəziyyətini dondurur, illər sonra belə həmin
      teq üzrə 100% eyni maliyyə auditini təkrarlamağa imkan verir.
- front:
    en: How does Nessie provide multi-table transactional consistency?
    az: Nessie çoxcədvəlli tranzaksional ardıcıllığı necə təmin edir?
  back:
    en: By allowing multiple related tables to be modified on the same branch and
      merged into main simultaneously in a single atomic commit.
    az: Bir neçə əlaqəli cədvəlin eyni budaqda yenilənməsinə və tək bir atomik kommitlə
      eyni anda canlıya birləşdirilməsinə imkan verərək.
