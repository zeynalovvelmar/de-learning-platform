id: 05-lakehouse-pipeline-flow
order: 5
level: intermediate
title:
  az: 'Bütöv Lakehouse İş Axını: Spark, Nessie, Iceberg, Trino və dbt'
  en: 'Bütöv Lakehouse İş Axını: Spark, Nessie, Iceberg, Trino və dbt'
quick_recap:
  az: '- Bu dərs öyrəndiyimiz bütün texnologiyaları vahid bir sığorta biznes ssenarisində
    birləşdirir (End-to-End Pipeline).

    - Memarlıq pillələri: Mənbə (MS SQL, Postgres) -> Spark (Ingestion) -> Nessie
    & Iceberg (ACID Saxlanc & WAP) -> Trino & dbt (Transformasiya & Keyfiyyət) ->
    Airflow (Orkestrasiya).

    - Write-Audit-Publish (WAP): Yeni data əvvəlcə Nessie branch-ına yazılır, dbt
    ilə yoxlanılır, yalnız hər şey düzdürsə main branch-a merge olunur.

    - Data Engineering Intern kimi əsas işiniz: Airflow-da bu axının icrasını izləmək,
    xətaları loqlardan tapmaq və dbt/SQL sorğularını təkmilləşdirməkdir.'
  en: '- Bu dərs öyrəndiyimiz bütün texnologiyaları vahid bir sığorta biznes ssenarisində
    birləşdirir (End-to-End Pipeline).

    - Memarlıq pillələri: Mənbə (MS SQL, Postgres) -> Spark (Ingestion) -> Nessie
    & Iceberg (ACID Saxlanc & WAP) -> Trino & dbt (Transformasiya & Keyfiyyət) ->
    Airflow (Orkestrasiya).

    - Write-Audit-Publish (WAP): Yeni data əvvəlcə Nessie branch-ına yazılır, dbt
    ilə yoxlanılır, yalnız hər şey düzdürsə main branch-a merge olunur.

    - Data Engineering Intern kimi əsas işiniz: Airflow-da bu axının icrasını izləmək,
    xətaları loqlardan tapmaq və dbt/SQL sorğularını təkmilləşdirməkdir.'
explanation:
  az: "### Sığorta Şirkətində 24 Saatlıq Real Data Həyat Dövrü\nGəlin təsəvvür edək\
    \ ki, **Enterprise Sığorta**-da gündəlik minlərlə yeni KASKO və İcbari avtomobil sığortası\
    \ bağlanır, yüzlərlə qəza müraciəti (claims) daxil olur. Şirkətin rəhbərliyi hər\
    \ səhər saat 08:30-da dünənki zərər-mənfəət nisbətini (Loss Ratio) Power BI dashboard-unda\
    \ görməlidir.\n\nBu nəticə necə əldə edilir? Bütün stack necə bir orkestr kimi\
    \ harmoniyada işləyir?\n\n---\n\n### Addım-addım Lakehouse Boru Xətti (Pipeline)\n\
    \n#### 1. Mənbə Sistemlər (OLTP)\nGünün sonunda bütün müqavilələr və qəza müraciətləri\
    \ operativ məlumat bazalarında qeyd olunur:\n* **MS SQL Server**: Sığorta polisləri,\
    \ agentliklər, ödəniş cədvəlləri (`dbo.Policies`, `dbo.Agents`).\n* **PostgreSQL**:\
    \ Müştəri mobil tətbiqi və CRM sorğuları (`crm.customer_profiles`).\n\n#### 2.\
    \ Orkestrasiya: Apache Airflow İşi Başladır\nGecə saat 02:00-da Apache Airflow-da\
    \ qurulmuş `daily_insurance_lakehouse_dag` avtomatik işə düşür. Airflow prosesi\
    \ addım-addım idarə edir.\n\n#### 3. Çıxarılma və İlkin Emal: Apache Spark\nAirflow\
    \ ilk task olaraq **Apache Spark** işini (`spark-submit`) işə salır:\n* Spark\
    \ JDBC vasitəsilə MS SQL və PostgreSQL-dən dünən dəyişən (incremental) sətirləri\
    \ oxuyur.\n* Məlumatı deduplikasiya edir, şəxsi məlumatları (FIN kod, telefon)\
    \ anonimləşdirir.\n* Hədəf: MinIO/S3 üzərindəki **Apache Iceberg** cədvəlləri!\n\
    \n#### 4. İcazəsiz Korlanmanın Qarşısını Almaq: Project Nessie Branching (WAP)\n\
    Spark datanı birbaşa `main` (istehsalat) cədvəlinə yazmır!\n* Əvvəlcə Nessie-də\
    \ `dev_daily_ingest_20261031` adlı təcrid olunmuş budaq (branch) açılır.\n* Spark\
    \ təmizlənmiş datanı bu budaqdakı Iceberg cədvəlinə yazır (`Write` mərhələsi).\n\
    * Əsas cədvələ heç bir zərər dəymir, canlı hesabatlar fasiləsiz işləyir.\n\n####\
    \ 5. Transformasiya və Testlər: dbt + Trino\nNövbəti task dbt-dir (`dbt run` və\
    \ `dbt test`):\n* dbt Trino vasitəsilə həmin Nessie budağına qoşulur.\n* dbt Data\
    \ Quality testləri icra edir (`Audit` mərhələsi):\n  - *Polis nömrəsi NULL deyil\
    \ ki?*\n  - *Zərər məbləği mənfi deyil ki?*\n  - *Polis tarixi bu gündən sonraya\
    \ aid deyil ki?*\n* Bütün testlər 100% keçərsə, Nessie budağı `main` budağına\
    \ **Fast-Forward Merge** olunur (`Publish` mərhələsi)!\n* Sonra dbt Trino-da Gold\
    \ Mart cədvəlini yeniləyir: `mart_daily_loss_ratio`.\n\n#### 6. İstehlakçılar:\
    \ Analitiklər və Rəhbərlik\nSəhər saat 08:00-da maliyyə analitikləri və rəhbərlik\
    \ Power BI-ı açır. Power BI birbaşa **Trino**-ya sorğu göndərir və saniyələr içində\
    \ ən son, keyfiyyəti yoxlanılmış hesabatı təqdim edir!\n\n---\n\n### Təcrübəçi\
    \ (Intern) Olaraq Sizin Gündəlik Rolunuz\nVakansiya elanındakı tələblərə baxsanız,\
    \ sizdən bütün bu arxitekturanı sıfırdan təkbaşına qurmaq tələb olunmur. Sizin\
    \ öhdəlikləriniz:\n1. **Airflow Monitorinqi**: Səhər ilk iş kimi Airflow UI-a\
    \ baxmaq: Bütün tasklar yaşıl rəngdədirmi? Qırmızı xəta varsa (məsələn dbt test\
    \ fail olub və ya Spark yaddaş çatışmazlığı verib), loqları açıb səbəbi komandaya\
    \ bildirmək.\n2. **SQL və T-SQL Dəstəyi**: MS SQL bazasında yeni sığorta məhsulu\
    \ üçün Stored Procedure-ları sınaqdan keçirmək və Trino üçün zəruri SQL sorğularını\
    \ hazırlamaq.\n3. **dbt Modellərinin Təkmilləşdirilməsi**: Analitiklərin istədiyi\
    \ yeni metrikanın (məsələn: *filiallar üzrə orta təmir xərci*) dbt modelinə əlavə\
    \ edilməsi.\n"
