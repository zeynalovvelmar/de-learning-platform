    olur (Fail) və növbəti addım icra edilmir!

    * `merge_to_main`: Yalnız testlər yaşıl olduqda Nessie branch-ı main-ə birləşdirilir
    (Write-Audit-Publish bitir).

    * `build_gold_marts`: Trino üzərindən dbt vasitəsilə ən son analitik hesabatlar
    yenilənir.

    '
