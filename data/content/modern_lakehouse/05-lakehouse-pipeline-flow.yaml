interview_question:
  question:
    az: Siz İri sığorta və maliyyə şirkətlərində Data Engineering intern-i olaraq işə başlasanız və səhər
      tezdən gəldiyinizdə Airflow-da gecəlik lakehouse pipeline-ın qırmızı olduğunu
      (fail etdiyini) görsəniz, problemin araşdırılması üçün hansı addımları atarsınız?
    en: Siz İri sığorta və maliyyə şirkətlərində Data Engineering intern-i olaraq işə başlasanız və səhər
      tezdən gəldiyinizdə Airflow-da gecəlik lakehouse pipeline-ın qırmızı olduğunu
      (fail etdiyini) görsəniz, problemin araşdırılması üçün hansı addımları atarsınız?
  answer:
    az: '"İlk növbədə təşvişə düşmədən Airflow UI-da qırmızı rəngdə olan dəqiq tapşırığı
      (Task ID) müəyyən edərəm:

      1. Əgər **Spark Ingestion** taskı fail olubsa: Spark loqlarını açaram. Səbəb
      MS SQL Server-ə qoşulma xətası (timeout/şəbəkə), yoxsa schema dəyişikliyi (source
      bazada yeni sütun əlavə olunub) olub-olmadığını yoxlayaram.

      2. Əgər **dbt Audit / Data Quality** taskı fail olubsa: Deməli, mənbədən kirli
      data gəlib (məsələn, vacib sütun NULL gəlib və ya duplikat var). Burada Nessie-nin
      WAP üstünlüyünü xatırladaram: çünki data dev branch-da saxlanılıb və hələ `main`
      istehsalat cədvəlinə merge olunmayıb. Buna görə də Power BI hesabatları və istifadəçilər
      zərər görməyib!

      3. Xətanın növünü və konkret sətirləri sənədləşdirib komandaya / mentoruma bildirərəm,
      zəruri düzəlişdən sonra həmin taskı Airflow-dan yenidən işə (Clear/Retry) salaram."'
    en: '"İlk növbədə təşvişə düşmədən Airflow UI-da qırmızı rəngdə olan dəqiq tapşırığı
      (Task ID) müəyyən edərəm:

      1. Əgər **Spark Ingestion** taskı fail olubsa: Spark loqlarını açaram. Səbəb
      MS SQL Server-ə qoşulma xətası (timeout/şəbəkə), yoxsa schema dəyişikliyi (source
      bazada yeni sütun əlavə olunub) olub-olmadığını yoxlayaram.

      2. Əgər **dbt Audit / Data Quality** taskı fail olubsa: Deməli, mənbədən kirli
      data gəlib (məsələn, vacib sütun NULL gəlib və ya duplikat var). Burada Nessie-nin
      WAP üstünlüyünü xatırladaram: çünki data dev branch-da saxlanılıb və hələ `main`
      istehsalat cədvəlinə merge olunmayıb. Buna görə də Power BI hesabatları və istifadəçilər
      zərər görməyib!

      3. Xətanın növünü və konkret sətirləri sənədləşdirib komandaya / mentoruma bildirərəm,
      zəruri düzəlişdən sonra həmin taskı Airflow-dan yenidən işə (Clear/Retry) salaram."'
  interviewer_tips:
    az: '- Bu cavab müsahibə götürən komandaya dərhal göstərir ki, siz təkcə nəzəriyyə
      bilmirsiniz, real istehsalat problemlərini necə addım-addım debug etməyi başa
      düşürsünüz.

      - Nessie-nin Write-Audit-Publish mexanizminin istehsalatı necə qoruduğunu vurğulamaq
      əla təsir bağışlayır.'
    en: '- Bu cavab müsahibə götürən komandaya dərhal göstərir ki, siz təkcə nəzəriyyə
      bilmirsiniz, real istehsalat problemlərini necə addım-addım debug etməyi başa
      düşürsünüz.

      - Nessie-nin Write-Audit-Publish mexanizminin istehsalatı necə qoruduğunu vurğulamaq
      əla təsir bağışlayır.'
flashcards:
- front:
    az: Müasir Data Lakehouse boru xəttində (pipeline) Apache Airflow-un rolu nədir?
    en: Müasir Data Lakehouse boru xəttində (pipeline) Apache Airflow-un rolu nədir?
  back:
    az: Airflow bütöv prosesin dirijorudur (Orchestrator). O, datanı özündə saxlamır
      və emal etmir; təyin olunmuş cədvəllə Spark, Nessie, dbt və Trino tapşırıqlarını
      ardıcıl icra edir və xətaları monitorinq edir.
    en: Airflow bütöv prosesin dirijorudur (Orchestrator). O, datanı özündə saxlamır
      və emal etmir; təyin olunmuş cədvəllə Spark, Nessie, dbt və Trino tapşırıqlarını
      ardıcıl icra edir və xətaları monitorinq edir.
- front:
    az: Lakehouse axınında niyə həm Spark, həm də Trino birgə işlədilir?
    en: Lakehouse axınında niyə həm Spark, həm də Trino birgə işlədilir?
  back:
    az: Spark mənbələrdən (MS SQL) böyük həcmli xam datanı çıxarıb təmizləyərək Iceberg-ə
      yazmaq (ingestion/heavy ETL) üçün, Trino isə dbt testləri və yüksək sürətli
      analitik sorğular üçün istifadə olunur.
    en: Spark mənbələrdən (MS SQL) böyük həcmli xam datanı çıxarıb təmizləyərək Iceberg-ə
      yazmaq (ingestion/heavy ETL) üçün, Trino isə dbt testləri və yüksək sürətli
      analitik sorğular üçün istifadə olunur.
- front:
    az: dbt bu boru xəttində hansı vəzifəni yerinə yetirir?
    en: dbt bu boru xəttində hansı vəzifəni yerinə yetirir?
  back:
    az: dbt təmizlənmiş cədvəllərdən biznes yönümlü Data Marts (Gold Layer) modellərini
      qurur və məlumatların düzgünlüyünü Data Quality testləri (Not Null, Unique və
      s.) ilə yoxlayır.
    en: dbt təmizlənmiş cədvəllərdən biznes yönümlü Data Marts (Gold Layer) modellərini
      qurur və məlumatların düzgünlüyünü Data Quality testləri (Not Null, Unique və
      s.) ilə yoxlayır.
- front:
    az: Write-Audit-Publish (WAP) axını xətaların qarşısını necə alır?
    en: Write-Audit-Publish (WAP) axını xətaların qarşısını necə alır?
  back:
    az: Yeni məlumat birbaşa main cədvələ deyil, Nessie-nin müvəqqəti budağına yazılır.
      dbt testləri uğurla keçdikdən sonra main-ə birləşdirilir (merge). Xəta olarsa,
      heç kim kirli datanı görmür.
    en: Yeni məlumat birbaşa main cədvələ deyil, Nessie-nin müvəqqəti budağına yazılır.
      dbt testləri uğurla keçdikdən sonra main-ə birləşdirilir (merge). Xəta olarsa,
      heç kim kirli datanı görmür.
- front:
    az: İntern olaraq Airflow-da task fail olduqda ilk nə etməlisiniz?
    en: İntern olaraq Airflow-da task fail olduqda ilk nə etməlisiniz?
  back:
    az: Fail olan taskın loqlarını (Logs) açmalı, xətanın tipini (əlaqə kəsilməsi,
      schema dəyişməsi, yoxsa data quality testi) tapmalı və WAP budağında qalan datanın
      vəziyyətini yoxlamalıyıq.
    en: Fail olan taskın loqlarını (Logs) açmalı, xətanın tipini (əlaqə kəsilməsi,
      schema dəyişməsi, yoxsa data quality testi) tapmalı və WAP budağında qalan datanın
      vəziyyətini yoxlamalıyıq.
