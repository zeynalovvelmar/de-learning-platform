code: "# 1. Apache Airflow DAG-da ardıcıllığın təyin edilməsi (Python)\nwith DAG(\n\
  \    dag_id='insurance_lakehouse_daily_pipeline',\n    schedule_interval='0 2 *\
  \ * *',\n    catchup=False\n) as dag:\n\n    # Task 1: Nessie-də gündəlik branch\
  \ yaratmaq\n    create_branch = BashOperator(\n        task_id='nessie_create_branch',\n\
  \        bash_command='nessie branch create dev_ingest_$(date +%Y%m%d) main'\n \
  \   )\n\n    # Task 2: Spark ilə MS SQL-dən datanı çəkib həmin branch-dakı Iceberg-ə\
  \ yazmaq\n    ingest_spark = SparkSubmitOperator(\n        task_id='spark_ingest_mssql_to_iceberg',\n\
  \        application='/opt/spark/jobs/ingest_insurance_policies.py',\n        application_args=['--target-branch',\
  \ 'dev_ingest_$(date +%Y%m%d)']\n    )\n\n    # Task 3: dbt testləri ilə həmin branch-dakı\
  \ datanı audit etmək\n    audit_data = BashOperator(\n        task_id='dbt_audit_nessie_branch',\n\
  \        bash_command='dbt test --target trino_dev'\n    )\n\n    # Task 4: Uğurlu\
  \ auditdən sonra branch-ı main-ə merge etmək (WAP)\n    merge_to_main = BashOperator(\n\
  \        task_id='nessie_merge_to_main',\n        bash_command='nessie branch merge\
  \ dev_ingest_$(date +%Y%m%d) -b main --force'\n    )\n\n    # Task 5: Gold mart\
  \ cədvəllərini dbt ilə yeniləmək\n    build_gold_marts = BashOperator(\n       \
  \ task_id='dbt_run_gold_marts',\n        bash_command='dbt run --select marts.*\
  \ --target trino_main'\n    )\n\n    # Boru xəttinin asılılıq zənciri:\n    create_branch\
  \ >> ingest_spark >> audit_data >> merge_to_main >> build_gold_marts\n"
code_explanation:
  az: '* `create_branch`: İstehsalat (main) cədvəllərinə toxunmamaq üçün Nessie-də
    günün tarixi ilə təcrid olunmuş budaq açılır.

    * `ingest_spark`: Spark işi MS SQL-dən datanı çəkir və Iceberg formatında S3-ə
    yazır, kataloq kimi həmin budağı göstərir.

    * `audit_data`: `dbt test` vasitəsilə minlərlə sətir yoxlanılır. Əgər bircə dənə
    belə kritik xəta olarsa (məsələn, zərər məbləği mənfi çıxarsa), bu task qırmızı
    olur (Fail) və növbəti addım icra edilmir!

    * `merge_to_main`: Yalnız testlər yaşıl olduqda Nessie branch-ı main-ə birləşdirilir
    (Write-Audit-Publish bitir).

    * `build_gold_marts`: Trino üzərindən dbt vasitəsilə ən son analitik hesabatlar
    yenilənir.

    '
  en: '* `create_branch`: İstehsalat (main) cədvəllərinə toxunmamaq üçün Nessie-də
    günün tarixi ilə təcrid olunmuş budaq açılır.

