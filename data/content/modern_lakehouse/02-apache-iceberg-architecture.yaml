output_description:
  en: Displays the internal snapshot metadata table of an Apache Iceberg table showing
    exact commit timestamps, operations, and row metrics enabling Time Travel.
  az: Apache Iceberg cədvəlinin daxili snapshot tarixçəsini və Time Travel üçün istifadə
    olunan kommit göstəricilərini əks etdirən nəticə.
interview_question:
  question:
    en: What is Apache Iceberg, how does its metadata tree enable fast data skipping,
      and what is Hidden Partitioning?
    az: Apache Iceberg nədir, onun metadata ağacı məlumat atlamasını (data skipping)
      necə sürətləndirir və Gizli Partisiya (Hidden Partitioning) nədir?
  answer:
    en: '1. **What is Iceberg**: An open-source, high-performance table format for
      massive datasets on object storage (S3/MinIO), providing full ACID transactions,
      snapshot isolation, and engine-agnostic interoperability (Trino, Spark, Flink).

      2. **How Data Skipping Works**: Iceberg tracks tables using a 3-tier hierarchy
      (`Table Metadata` -> `Manifest List` -> `Manifest Files` -> `Data Files`). In
      manifest files, Iceberg records column-level upper and lower bounds (min/max
      values) for every Parquet file. When a query filters with a WHERE clause (e.g.
      `issue_date > ''2026-05-01''`), the query planner inspects the metadata tree
      and prunes irrelevant files before reading a single byte of actual data from
      object storage.

      3. **Hidden Partitioning**: In traditional systems like Hive, users had to explicitly
      know the directory structure and filter by artificial partition columns (e.g.
      `year=2026 AND month=10`). Iceberg abstracts partitioning: users filter on natural
      business timestamps, and Iceberg automatically maps queries to the correct partition
      files. Furthermore, if partition granularity evolves (e.g. from daily to hourly),
      existing queries continue working without breaking (**Partition Evolution**).

      '
    az: '1. **Iceberg Nədir**: Obyekt saxlancındakı (S3/MinIO) böyük məlumatlar üçün
      tam ACID tranzaksiyaları, snapshot izolyasiyasını və bütün mühərriklərlə (Trino,
      Spark) uyğunluğu təmin edən açıq cədvəl formatıdır.

      2. **Data Skipping Necə İşləyir**: Iceberg 3-təbəqəli metadata ağacından istifadə
      edir (`Metadata` $\rightarrow$ `Manifest List` $\rightarrow$ `Manifest Files`
      $\rightarrow$ `Parquet Faylları`). Manifest fayllarında hər bir Parquet faylının
      içindəki sütunların ən kiçik və ən böyük (min/max) qiymətləri qeyd olunur. `WHERE
      issue_date > ''2026-05-01''` sorğusu gəldikdə, mühərrik diskdəki Parquet fayllarını
      oxumazdan əvvəl bu metadata-ya baxır və uyğun olmayan faylları oxumadan atır
      (90%+ fayl atlanır).

      3. **Gizli Partisiya (Hidden Partitioning)**: Köhnə sistemlərdə istifadəçi S3
      qovluq strukturunu bilməyə məcbur idi (`WHERE year=2026 AND month=10`). Iceberg-də
      isə istifadəçi sadəcə real biznes sütununu (`issue_date`) sorğulayır; partisiya
      hesablamasını Iceberg arxa planda özü həll edir. Əgər gələcəkdə partisiya qaydası
      dəyişsə, köhnə sorğular pozulmur (**Partition Evolution**).

      '
  interviewer_tips:
    en: Differentiate between an open table format (Iceberg, Delta Lake) and a query
      engine (Trino, Spark). Iceberg structures the data and metadata; Trino executes
      the distributed SQL computation.
    az: 'Cədvəl formatı (Iceberg) ilə sorğu mühərriki (Trino) arasındakı fərqi mütləq
      aydın ifadə edin: Iceberg metadata və faylları nizamlayır, Trino isə paylanmış
      SQL hesablamasını icra edir.'
flashcards:
- front:
    en: Is Apache Iceberg a database engine or a table format?
    az: Apache Iceberg verilənlər bazası mühərrikidir, yoxsa cədvəl formatı?
  back:
    en: It is a table format. It does not execute queries itself; engines like Trino,
      Spark, and Flink read and write Iceberg tables.
    az: O, cədvəl formatıdır. Sorğuları özü icra etmir; Trino, Spark və Flink kimi
      mühərriklər Iceberg cədvəllərini oxuyub yazır.
- front:
    en: What are the three tiers in the Apache Iceberg metadata hierarchy?
    az: Apache Iceberg metadata iyerarxiyasının üç təbəqəsi hansılardır?
  back:
    en: 1. Table Metadata (metadata.json). 2. Manifest List (snap-*.avro). 3. Manifest
      Files (*.avro listing data files with min/max column stats).
    az: 1. Cədvəl Metadata faylı (metadata.json). 2. Manifest Siyahısı (snap-*.avro).
      3. Manifest Faylları (*.avro - min/max statistikalı Parquet siyahısı).
- front:
    en: How does Apache Iceberg achieve Time Travel?
    az: Apache Iceberg Zaman Səyahətini (Time Travel) necə təmin edir?
  back:
    en: Every write creates an immutable snapshot. By referencing historical snapshot
      IDs or timestamps, users can query the table exactly as it existed in the past.
    az: Hər yazılış dəyişməz bir snapshot yaradır. Keçmiş snapshot ID və ya tarixlərə
      istinad edərək cədvəlin keçmiş halını dəqiq sorğulamaq mümkündür.
- front:
    en: What is Hidden Partitioning in Apache Iceberg?
    az: Apache Iceberg-də Gizli Partisiya (Hidden Partitioning) nədir?
  back:
    en: Users query natural timestamp columns without needing to know physical partition
      folder structures; Iceberg automatically prunes matching partitions.
    az: İstifadəçilər S3 qovluq strukturunu bilmədən birbaşa tarix sütununu sorğulayır;
      Iceberg arxa planda uyğun partisiya fayllarını özü tapır.
- front:
    en: Why should you never manually delete a Parquet file from S3 in an Iceberg
      table?
    az: Iceberg cədvəlindəki Parquet faylını nə üçün heç vaxt S3-dən əllə silmək olmaz?
  back:
    en: Because Iceberg's manifest files maintain strict pointers to that file; deleting
      it directly causes missing file exceptions and metadata corruption.
    az: Çünki Iceberg manifestləri həmin fayla dəqiq göstəricilər saxlayır; faylı
      əllə sildikdə metadata korlanır və cədvəl xəta verir.
