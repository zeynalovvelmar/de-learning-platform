output_description:
  en: Displays an aggregated analytical report generated directly from open Lakehouse
    Parquet storage via Trino and Nessie with high speed and zero data redundancy.
  az: Trino və Nessie vasitəsilə birbaşa açıq Lakehouse fayllarından 0.42 saniyəyə
    çıxarılan aqreqasiya edilmiş sığorta hesabatını göstərir.
interview_question:
  question:
    en: What is a Data Lakehouse, and why are enterprises moving from traditional
      Data Warehouses and raw Data Lakes to an open Lakehouse architecture?
    az: Data Lakehouse nədir və nə üçün şirkətlər ənənəvi Data Warehouse və sadə Data
      Lake əvəzinə açıq Lakehouse arxitekturasına keçirlər?
  answer:
    en: "1. **Definition**: A Data Lakehouse is a modern architecture that implements\
      \ data warehouse-grade structures, ACID transactional guarantees, and query\
      \ speed directly on top of low-cost, open cloud object storage (S3/MinIO).\n\
      2. **Why Enterprises Migrate**:\n   - **Eliminates Data Redundancy**: Traditionally,\
      \ data was dumped into a Data Lake, then an ETL pipeline copied it into an expensive\
      \ Data Warehouse (e.g. Teradata, Snowflake, MS SQL), duplicating storage and\
      \ creating synchronization lag. The Lakehouse provides a Single Source of Truth\
      \ where all tools (BI, SQL, ML) read from the same open files.\n   - **Cost\
      \ & Vendor Lock-in Freedom**: Companies avoid millions in proprietary database\
      \ licenses because storage is open-standard Parquet files managed by Apache\
      \ Iceberg and Nessie, queryable by any engine (Trino, Spark, Flink).\n   - **Supports\
      \ All Workloads**: Handles structured SQL reporting, streaming CDC, and unstructured\
      \ machine learning features from a unified platform.\n"
    az: "1. **Tərif**: Data Lakehouse ənənəvi Data Warehouse-un ACID etibarlılığını\
      \ və SQL sürətini, Data Lake-in ucuz obyekt saxlancı (S3/MinIO) üzərində birbaşa\
      \ təmin edən açıq arxitekturadır.\n2. **Şirkətlərin Keçid Səbəbləri**:\n   -\
      \ **Məlumat Təkrarlanmasını Sıfırlayır**: Əvvəllər məlumat əvvəlcə Data Lake-ə\
      \ tökülür, sonra ordan başqa bir ETL ilə bahalı Data Warehouse-a (məs. Teradata,\
      \ Oracle, MS SQL) kopyalanırdı. Bu həm ikiqat yaddaş xərci, həm də hesabatlarda\
      \ gecikmə yaradırdı. Lakehouse-da isə tək bir mərkəzi mənbə (Single Source of\
      \ Truth) var; həm BI analitikləri, həm də mühəndislər eyni fayllardan oxuyur.\n\
      \   - **Qapalı Lisenziyalardan Azadlıq**: Datanız şirkətin öz saxlancında açıq\
      \ standartlı Parquet formatında qalır; heç bir kommersiya bazasına asılılıq\
      \ (Vendor Lock-in) yaranmır.\n   - **Həm SQL, Həm ML Dəstəyi**: Eyni cədvəllər\
      \ üzərindən həm maliyyə hesabatları verilir, həm də süni intellekt və maşın\
      \ öyrənməsi modelləri birbaşa xam faylları oxuyur.\n"
  interviewer_tips:
    en: 'Emphasize the decoupling of compute and storage: storage is cheap Parquet
      on S3/MinIO (cents per GB), and compute (Trino/Spark) scales independently on
      demand without database vendor lock-in.'
    az: 'Hesablama və saxlancın ayrıldığını (decoupling) xüsusi vurğulayın: saxlanc
      S3/MinIO-da ucuz Parquet fayllarıdır, hesablama (Trino/Spark) isə ehtiyac olduqda
      müstəqil miqyaslanır və heç bir şirkətə lisenziya xərci ödənilmir.'
flashcards:
- front:
    en: What is the primary difference between a Data Warehouse, a Data Lake, and
      a Data Lakehouse?
    az: Data Warehouse, Data Lake və Data Lakehouse arasındakı əsas fərq nədir?
  back:
    en: DWH provides fast ACID SQL on expensive proprietary storage. A Data Lake provides
      cheap open storage but lacks ACID guarantees. A Lakehouse provides ACID transactions
      and fast SQL directly on cheap open storage.
    az: DWH bahalı qapalı bazada sürətli ACID SQL verir. Data Lake ucuz saxlanc təmin
      edir, lakin ACID etibarlılığı yoxdur. Lakehouse isə ucuz açıq saxlanc üzərində
      birbaşa ACID və sürətli SQL təmin edir.
- front:
    en: What are the four core layers of the modern open Lakehouse stack in Enterprise FinTech & Insurance?
    az: Müasir maliyyə və sığorta şirkətlərindəki müasir açıq Lakehouse arxitekturasının dörd əsas qatı hansılardır?
  back:
    en: '1. Storage: S3 / MinIO (Parquet). 2. Table Format: Apache Iceberg. 3. Catalog:
      Project Nessie. 4. Query Engine: Trino / Apache Spark / dbt.'
    az: '1. Saxlanc: S3 / MinIO (Parquet). 2. Cədvəl Formatı: Apache Iceberg. 3. Kataloq:
      Project Nessie. 4. Sorğu Mühərriki: Trino / Apache Spark / dbt.'
- front:
    en: What is the 'Data Swamp' problem in traditional Data Lakes?
    az: Ənənəvi Data Lake-lərdə 'Data Bataqlığı' (Data Swamp) problemi nədir?
  back:
    en: Without metadata governance and ACID controls, uncurated files accumulate
      with corrupt writes, duplicate records, and zero schema evolution, making data
      impossible to query reliably.
    az: Metadata idarəetməsi və ACID qaydaları olmadıqda, natamam fayllar və dublikatlar
      toplanır; nəticədə göl idarəolunmaz və etibarsız məlumat zibilliyinə çevrilir.
- front:
    en: Why is vendor lock-in eliminated in an open Lakehouse architecture?
    az: Açıq Lakehouse arxitekturasında 'Vendor Lock-in' (tək təchizatçıya asılılıq)
      necə aradan qalxır?
  back:
    en: Because data files are standard open-source Parquet, table metadata is Apache
      Iceberg, and any engine (Trino, Spark, Flink, DuckDB) can read and write to
      it.
    az: Çünki fayllar açıq standartlı Parquet formatında, metadata isə Apache Iceberg-dədir;
      Trino, Spark, Flink və DuckDB kimi istənilən mühərrik eyni cədvəli sərbəst oxuyub
      yaza bilir.
- front:
    en: What role does Trino play in a Data Lakehouse?
    az: Data Lakehouse-da Trino hansı rolu oynayır?
  back:
    en: Trino is a stateless, fast, distributed SQL query engine that queries Iceberg
      tables directly in object storage without moving data.
    az: Trino məlumatı başqa yerə köçürmədən, birbaşa obyekt saxlancındakı Iceberg
      cədvəllərini paylanmış şəkildə saniyələr içində sorğulayan sürətli SQL mühərrikidir.
