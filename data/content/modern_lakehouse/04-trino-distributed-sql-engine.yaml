id: 04-trino-distributed-sql-engine
order: 4
level: intermediate
title:
  az: Trino Nədir? Paylanmış SQL Sorğu Mühərriki və Data Federasiyası
  en: Trino Nədir? Paylanmış SQL Sorğu Mühərriki və Data Federasiyası
quick_recap:
  az: '- Trino (keçmiş PrestoSQL) nəhəng, açıq mənbəli paylanmış SQL sorğu mühərrikidir
    (distributed SQL query engine).

    - Trino məlumat bazası DEYİL — onun öz yaddaşı (storage) yoxdur; o, yalnız hesablama
    (compute) mühərrikidir.

    - Data Federasiyası: Fərqli sistemlərdəki datanı (məs. MS SQL-dəki müştərilər
    + Iceberg/S3-dəki zərərlər) tək bir SQL sorğusunda JOIN etməyə imkan verir.

    - Coordinator və Workers arxitekturası ilə işləyir; Spark-dan fərqli olaraq in-memory
    pipelined axınla işləyir və saniyələr içində cavab qaytarır.

    - İri sığorta və maliyyə şirkətlərində analitiklərin və dbt modellərinin Iceberg cədvəllərini yüksək
    sürətlə sorğulaması üçün əsas giriş qapısıdır.'
  en: '- Trino (keçmiş PrestoSQL) nəhəng, açıq mənbəli paylanmış SQL sorğu mühərrikidir
    (distributed SQL query engine).

    - Trino məlumat bazası DEYİL — onun öz yaddaşı (storage) yoxdur; o, yalnız hesablama
    (compute) mühərrikidir.

    - Data Federasiyası: Fərqli sistemlərdəki datanı (məs. MS SQL-dəki müştərilər
    + Iceberg/S3-dəki zərərlər) tək bir SQL sorğusunda JOIN etməyə imkan verir.

    - Coordinator və Workers arxitekturası ilə işləyir; Spark-dan fərqli olaraq in-memory
    pipelined axınla işləyir və saniyələr içində cavab qaytarır.

    - İri sığorta və maliyyə şirkətlərində analitiklərin və dbt modellərinin Iceberg cədvəllərini yüksək
    sürətlə sorğulaması üçün əsas giriş qapısıdır.'
explanation:
  az: "### Niyə Trino Yaradıldı? Tarixi Zərurət\nƏvvəllər şirkətlər Data Lake-də (Hadoop/HDFS)\
    \ saxlanılan terabaytlarla datanı sorğulamaq üçün **Apache Hive**-dan istifadə\
    \ edirdilər. Lakin Hive arxa planda hər SQL sorğusunu ağır **MapReduce** və ya\
    \ Spark batch işlərinə çevirir, aralıq nəticələri daima diskə yazırdı. Nəticədə\
    \ sadə bir hesabat sorğusu 15-30 dəqiqə çəkirdi.\n\nFacebook mühəndisləri analitiklərin\
    \ interaktiv, saniyələr çəkən SQL sorğuları icra edə bilməsi üçün **Presto**-nu\
    \ (indiki adı ilə **Trino**) yaratdılar. Trino-nun fəlsəfəsi sadədir: **Datanı\
    \ diskə yazma, RAM-da paralel emal et və dərhal nəticəni qaytar!**\n\n---\n\n\
    ### Trino-nun Əsas Arxitekturası: Coordinator və Workers\nTrino klasteri iki əsas\
    \ roldan ibarətdir:\n\n1. **Coordinator (Koordinator)**:\n   * İstifadəçidən (DBeaver,\
    \ BI alətləri, dbt) gələn SQL sorğusunu qəbul edir.\n   * SQL-i sintaktik təhlil\
    \ edir (parse), optimizasiya edir (Cost-Based Optimizer).\n   * Sorğunu kiçik\
    \ mərhələlərə (**Stages**) və tapşırıqlara (**Tasks/Splits**) bölərək Worker-lərə\
    \ paylayır.\n   * Worker-lərdən gələn yekun nəticəni toplayıb müştəriyə təqdim\
    \ edir.\n\n2. **Workers (İşçi Serverlər)**:\n   * Koordinatordan aldıqları tapşırıqları\
    \ paralel icra edirlər.\n   * Məlumat mənbələrinə (S3/Iceberg, PostgreSQL, MS\
    \ SQL) birbaşa qoşulub datanı oxuyurlar.\n   * Filterləmə, aqreqasiya və join\
    \ əməliyyatlarını yaddaşda (RAM) icra edib axın (streaming pipeline) şəklində\
    \ ötürürlər.\n   * **Stateless**: Klasterə asanlıqla yeni worker əlavə etmək və\
    \ ya söndürmək olar.\n\n---\n\n### Trino-nun Ən Böyük Super-Gücü: Data Federasiyası\
    \ (Connectors)\nƏnənəvi sistemlərdə iki fərqli bazadakı datanı birləşdirmək üçün\
    \ onları əvvəlcə ETL ilə eyni bazaya köçürmək lazım gəlirdi. Trino-da isə **Connectors**\
    \ (birləşdiricilər) mexanizmi var. \n\nTrino bir növ \"universal SQL tərcüməçisi\
    \ və körpüsü\"dür. Konfiqurasiya fayllarında kataloqları təyin edirsiniz:\n* `iceberg.properties`\
    \ -> MinIO/S3-dəki Iceberg cədvəllərinə baxır\n* `mssql.properties` -> Böyük sığorta və maliyyə şirkətlərinin\
    \ MS SQL əməliyyat bazasına baxır\n* `postgres.properties` -> CRM PostgreSQL bazasına\
    \ baxır\n\nVə siz tək bir SQL sorğusunda yazırsınız:\n```sql\nSELECT c.customer_name,\
    \ SUM(cl.claim_amount)\nFROM mssql.core_banking.customers c\nJOIN iceberg.analytics_lake.claims\
    \ cl ON c.customer_id = cl.customer_id\nGROUP BY c.customer_name;\n```\nHeç bir\
    \ məlumatı kopyalamadan Trino MS SQL-dən müştərini, S3-dən zərərləri oxuyur, öz\
    \ yaddaşında JOIN edir və sizə 1-2 saniyəyə cavab verir!\n\n---\n\n### Trino və\
    \ Apache Spark: Nə Zaman Hansı?\nİntern müsahibələrində ən çox verilən suallardan\
    \ biri: *\"Əgər Spark varsa, Trino nəyə lazımdır? Və ya əksinə?\"*\n\n| Xüsusiyyət\
    \ | Trino | Apache Spark |\n| :--- | :--- | :--- |\n| **Əsas Təyinatı** | İnteraktiv\
    \ SQL, BI hesabatlar, dbt analitikası | Ağır ETL/ELT, ML, streaming, kompleks\
    \ batch |\n| **İcra Modeli** | In-memory, pipelined streaming (çox sürətli) |\
    \ Resilient Distributed Dataset (RDD), stage-by-stage |\n| **Xətalara Dözümlülük**\
    \ | Standart rejimdə worker ölsə, sorğu ləğv edilir | Çox yüksək (node ölərsə\
    \ qalan hissəni yenidən hesablayır) |\n| **Yaddaş İstifadəsi** | Nəticə dərhal\
    \ axıdılır, az RAM buferi | Aralıq nəticələr üçün disk shuffle və geniş RAM |\n\
    | **Sığortadakı Yeri** | Analitiklərin ad-hoc sorğuları və dbt ilə Iceberg üzərində\
    \ sürətli modelləşdirmə | Gecəlik böyük həcmli xam loqların təmizlənib Lakehouse-a\
    \ yığılması |\n\n---\n\n### dbt + Trino Əməkdaşlığı\nMüasir Data Lakehouse-da\
    \ dbt transformasiyaları idarə edir. Lakin dbt özü məlumat emal etmir — o sadəcə\
    \ SQL kodunu icra mühərrikinə göndərir. \n`dbt-trino` adapteri vasitəsilə dbt\
    \ modeli Trino-ya göndərilir, Trino sorğunu Iceberg üzərində icra edir və yeni\
    \ `Gold` / `Silver` Iceberg cədvəlini yaradır!\n"
