code: "-- Trino CLI və ya DBeaver-də icra olunan Data Federation nümunəsi:\n-- MS\
  \ SQL-dəki agent məlumatları ilə Iceberg-dəki zərər ödənişlərini birləşdiririk\n\
  \n-- 1. Trino-da mövcud kataloqları yoxlayırıq\nSHOW CATALOGS;\n-- Nəticə: iceberg,\
  \ mssql, postgresql, system\n\n-- 2. Data Federation Sorğusu: \n--    Iceberg-dən\
  \ zərərlər cədvəlini, MS SQL-dən agent cədvəlini oxuyub birləşdiririk\nSELECT \n\
  \    a.agent_id,\n    a.agent_name,\n    a.branch_office,\n    COUNT(cl.claim_id)\
  \ AS total_claims,\n    ROUND(SUM(cl.claim_amount), 2) AS total_payout_azn\nFROM\
  \ mssql.dbo.insurance_agents a\nJOIN iceberg.lakehouse_claims.claims_data cl \n\
  \    ON a.agent_id = cl.registered_agent_id\nWHERE cl.claim_status = 'APPROVED'\n\
  \  AND cl.incident_date >= DATE '2026-01-01'\nGROUP BY a.agent_id, a.agent_name,\
  \ a.branch_office\nORDER BY total_payout_azn DESC\nLIMIT 5;\n\n-- 3. Trino sorğusunun\
  \ icra planını və Data Skipping statistikasını görmək:\nEXPLAIN ANALYZE\nSELECT\
  \ COUNT(*) FROM iceberg.lakehouse_claims.claims_data\nWHERE incident_date = DATE\
  \ '2026-10-15';\n"
code_explanation:
  az: '* `SHOW CATALOGS`: Trino-ya qoşulmuş bütün xarici mənbələri göstərir. Burada
    həm Iceberg, həm də MS SQL eyni anda aktivdir.

    * `mssql.dbo.insurance_agents`: MS SQL Server-dəki agent məlumatlarıdır. Trino
    birbaşa MS SQL-ə JDBC vasitəsilə sorğu atır.

    * `iceberg.lakehouse_claims.claims_data`: MinIO/S3 üzərindəki Apache Iceberg cədvəlidir.

    * `JOIN`: İki tamamilə fərqli fiziki maşında yerləşən cədvəl Trino worker-lərinin
    yaddaşında (RAM) birləşdirilir!

    * `EXPLAIN ANALYZE`: Trino-nun neçə sətir oxuduğunu, neçə saniyə çəkdiyini və
    Iceberg metadata sayəsində hansı faylları oxumayıb (data skipping) ötürdüyünü
    canlı göstərir.

    '
  en: '* `SHOW CATALOGS`: Trino-ya qoşulmuş bütün xarici mənbələri göstərir. Burada
    həm Iceberg, həm də MS SQL eyni anda aktivdir.

    * `mssql.dbo.insurance_agents`: MS SQL Server-dəki agent məlumatlarıdır. Trino
    birbaşa MS SQL-ə JDBC vasitəsilə sorğu atır.

    * `iceberg.lakehouse_claims.claims_data`: MinIO/S3 üzərindəki Apache Iceberg cədvəlidir.

    * `JOIN`: İki tamamilə fərqli fiziki maşında yerləşən cədvəl Trino worker-lərinin
    yaddaşında (RAM) birləşdirilir!

    * `EXPLAIN ANALYZE`: Trino-nun neçə sətir oxuduğunu, neçə saniyə çəkdiyini və
    Iceberg metadata sayəsində hansı faylları oxumayıb (data skipping) ötürdüyünü
    canlı göstərir.

    '
