interview_question:
  question:
    az: Trino (keçmiş Presto) nədir, onun memarlığı necə qurulub və o Apache Spark-dan
      nə ilə fərqlənir?
    en: Trino (keçmiş Presto) nədir, onun memarlığı necə qurulub və o Apache Spark-dan
      nə ilə fərqlənir?
  answer:
    az: "\"Trino açıq mənbəli, paylanmış və stateless SQL sorğu mühərrikidir. Onun\
      \ öz daxili saxlancı (storage) yoxdur; o, Iceberg, S3, MS SQL, PostgreSQL kimi\
      \ fərqli mənbələri `Connectors` vasitəsilə tək bir SQL sorğusunda birləşdirir\
      \ (Data Federation). \n\nMemarlığı **Coordinator** və çoxsaylı **Workers**-dən\
      \ ibarətdir. Koordinator SQL sorğusunu parse və optimizasiya edir, işi kiçik\
      \ splitlərə bölüb worker-lərə paylayır. Worker-lər mənbələrdən datanı paralel\
      \ oxuyur və yaddaşda (in-memory pipeline) emal edir.\n\nApache Spark ilə əsas\
      \ fərqi:\n1. **İcra modeli**: Spark xətalara qarşı yüksək dözümlü olmaq üçün\
      \ aralıq nəticələri tez-tez diskə yazır və shuffle edir (batch yönümlü). Trino\
      \ isə nəticəni diskə yazmır, RAM-da axınla ötürür.\n2. **İstifadə ssenarisi**:\
      \ Trino interaktiv analitika, BI alətləri və dbt SQL modelləri üçün nəzərdə\
      \ tutulub (sub-second / bir neçə saniyəlik cavablar). Spark isə ağır ETL/ELT,\
      \ böyük maşın öyrənməsi və streaming üçün idealdır.\""
    en: "\"Trino açıq mənbəli, paylanmış və stateless SQL sorğu mühərrikidir. Onun\
      \ öz daxili saxlancı (storage) yoxdur; o, Iceberg, S3, MS SQL, PostgreSQL kimi\
      \ fərqli mənbələri `Connectors` vasitəsilə tək bir SQL sorğusunda birləşdirir\
      \ (Data Federation). \n\nMemarlığı **Coordinator** və çoxsaylı **Workers**-dən\
      \ ibarətdir. Koordinator SQL sorğusunu parse və optimizasiya edir, işi kiçik\
      \ splitlərə bölüb worker-lərə paylayır. Worker-lər mənbələrdən datanı paralel\
      \ oxuyur və yaddaşda (in-memory pipeline) emal edir.\n\nApache Spark ilə əsas\
      \ fərqi:\n1. **İcra modeli**: Spark xətalara qarşı yüksək dözümlü olmaq üçün\
      \ aralıq nəticələri tez-tez diskə yazır və shuffle edir (batch yönümlü). Trino\
      \ isə nəticəni diskə yazmır, RAM-da axınla ötürür.\n2. **İstifadə ssenarisi**:\
      \ Trino interaktiv analitika, BI alətləri və dbt SQL modelləri üçün nəzərdə\
      \ tutulub (sub-second / bir neçə saniyəlik cavablar). Spark isə ağır ETL/ELT,\
      \ böyük maşın öyrənməsi və streaming üçün idealdır.\""
  interviewer_tips:
    az: '- Müsahibədə qeyd edin ki, Trino ''Stateless''-dir: yəni sabah klasterdə
      yük artarsa, asanlıqla yeni worker maşınları əlavə edib ümumi hesablama gücünü
      artıra bilərik.

      - ''Data Federation'' açar sözünü mütləq işlədin: şirkətdə həm MS SQL, həm də
      Data Lake varsa, Trino körpü rolunu oynayır.'
    en: '- Müsahibədə qeyd edin ki, Trino ''Stateless''-dir: yəni sabah klasterdə
      yük artarsa, asanlıqla yeni worker maşınları əlavə edib ümumi hesablama gücünü
      artıra bilərik.

      - ''Data Federation'' açar sözünü mütləq işlədin: şirkətdə həm MS SQL, həm də
      Data Lake varsa, Trino körpü rolunu oynayır.'
flashcards:
- front:
    az: Trino nədir və onun məlumat bazasından (Database) əsas fərqi nədir?
    en: Trino nədir və onun məlumat bazasından (Database) əsas fərqi nədir?
  back:
    az: Trino paylanmış SQL sorğu mühərrikidir. Fərqi odur ki, Trino-nun öz daxili
      yaddaşı (storage) yoxdur — o, yalnız kənar mənbələrdəki (Iceberg, S3, MS SQL,
      Postgres) datanı yaddaşda (RAM) emal edən hesablama təbəqəsidir.
    en: Trino paylanmış SQL sorğu mühərrikidir. Fərqi odur ki, Trino-nun öz daxili
      yaddaşı (storage) yoxdur — o, yalnız kənar mənbələrdəki (Iceberg, S3, MS SQL,
      Postgres) datanı yaddaşda (RAM) emal edən hesablama təbəqəsidir.
- front:
    az: Trino klasterində Coordinator və Worker rolları nədir?
    en: Trino klasterində Coordinator və Worker rolları nədir?
  back:
    az: 'Coordinator: SQL sorğusunu qəbul edir, optimallaşdırır və tapşırıqları bölür.
      Workers: Datanı kənar mənbələrdən paralel oxuyur, yaddaşda filter/join edir
      və nəticəni koordinatordan müştəriyə axıdır.'
    en: 'Coordinator: SQL sorğusunu qəbul edir, optimallaşdırır və tapşırıqları bölür.
      Workers: Datanı kənar mənbələrdən paralel oxuyur, yaddaşda filter/join edir
      və nəticəni koordinatordan müştəriyə axıdır.'
- front:
    az: Trino-da 'Data Federation' nə deməkdir?
    en: Trino-da 'Data Federation' nə deməkdir?
  back:
    az: Fərqli fiziki məlumat bazalarındakı (məsələn, MS SQL-dəki cədvəl ilə S3 Iceberg-dəki
      cədvəli) məlumatları heç bir ETL köçürməsi etmədən tək bir SQL sorğusunda birbaşa
      JOIN edə bilmək qabiliyyətidir.
    en: Fərqli fiziki məlumat bazalarındakı (məsələn, MS SQL-dəki cədvəl ilə S3 Iceberg-dəki
      cədvəli) məlumatları heç bir ETL köçürməsi etmədən tək bir SQL sorğusunda birbaşa
      JOIN edə bilmək qabiliyyətidir.
- front:
    az: Trino nə üçün Apache Hive-dan və bəzən Spark-dan daha sürətlidir?
    en: Trino nə üçün Apache Hive-dan və bəzən Spark-dan daha sürətlidir?
  back:
    az: Çünki Trino aralıq nəticələri diskə yazmır (no disk spooling); o, bütün məlumat
      axınını yaddaşdan-yaddaşa (in-memory pipelined execution) ötürür.
    en: Çünki Trino aralıq nəticələri diskə yazmır (no disk spooling); o, bütün məlumat
      axınını yaddaşdan-yaddaşa (in-memory pipelined execution) ötürür.
- front:
    az: Nə zaman Spark, nə zaman isə Trino seçilməlidir?
    en: Nə zaman Spark, nə zaman isə Trino seçilməlidir?
  back:
    az: Ağır gecəlik batch ETL, xətalara dözümlülük (fault tolerance) və maşın öyrənməsi
      üçün Spark seçilir. İnteraktiv BI hesabatları, sürətli ad-hoc SQL və dbt modelləşdirməsi
      üçün Trino seçilir.
    en: Ağır gecəlik batch ETL, xətalara dözümlülük (fault tolerance) və maşın öyrənməsi
      üçün Spark seçilir. İnteraktiv BI hesabatları, sürətli ad-hoc SQL və dbt modelləşdirməsi
      üçün Trino seçilir.
