what_it_does:
  az: '- Trino nəhəng həcmli data gölü (Data Lake) üzərində standart ANSI SQL sorğularını
    inanılmaz sürətlə icra edir.

    - Data kopyalamağa və ETL gözləməyə ehtiyac qalmadan müxtəlif verilənlər bazalarını
    (MS SQL, Postgres, Iceberg) federasiya edir.

    - Analitiklər və dbt üçün mərkəzləşdirilmiş sürətli hesablama təbəqəsi yaradır.'
