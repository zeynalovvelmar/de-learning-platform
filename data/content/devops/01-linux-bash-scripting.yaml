interview_question:
  question:
    en: "What does `set -euo pipefail` do at the top of a Bash script, and why is it considered a mandatory best practice in Data Engineering?"
    az: "Bash skriptinin başında yazılan `set -euo pipefail` nə edir və niyə Data Mühəndisliyində məcburi standart hesab olunur?"
  answer:
    en: "By default, Bash continues running even if commands fail or undefined variables are accessed. `set -euo pipefail` hardens the script: (1) `-e` exits immediately if any command returns a non-zero exit status; (2) `-u` treats unset variables as an error and exits, preventing catastrophic accidents like `rm -rf /$UNDEFINED_VAR`; (3) `-o pipefail` ensures that if any command in a pipeline (`cmd1 | cmd2 | cmd3`) fails, the entire pipeline returns that failure status rather than masked by the final command. In Data Engineering, this prevents corrupt, partial, or missing data from silently progressing into downstream production databases."
    az: "Susmaya görə Bash skriptində bir əmr xəta versə belə, icra dayanmır və sonrakı sətirlərə keçir. `set -euo pipefail` skripti gücləndirir: (1) `-e` hər hansı bir əmr xəta verdikdə skripti dərhal dayandırır; (2) `-u` boş (təyin olunmamış) dəyişəndən istifadə edildikdə xəta verir və `rm -rf /$DIR` kimi fəlakətli silinmələrin qarşısını alır; (3) `-o pipefail` pipe (`cmd1 | cmd2 | cmd3`) zəncirində əvvəlki əmrlərdən biri çöksə, bütün pipeline-ı xətalı elan edir. Data mühəndisliyində bu, natamam və ya xarab məlumatın səssizcə növbəti production bazalarına yazılmasının qarşısını alır."
  interviewer_tips:
    en: "Senior interviewers test your operational rigor with this question. Explaining each flag (`-e`, `-u`, `-o pipefail`) and mentioning 'silent data corruption' instantly sets you apart from junior candidates."
    az: "Müsahibəçilər sizin production ciddiyyətinizi bu sualla yoxlayır. Hər bayrağı (`-e`, `-u`, `-o pipefail`) ayrı-ayrı izah etmək və 'məlumatın səssiz korlanması' arqumentini gətirmək sizə yüksək xal qazandıracaq."
flashcards:
  - front:
      en: "What does the `-e` flag do in `set -e` in Bash?"
      az: "Bash-da `set -e` əmrindəki `-e` bayrağı nə edir?"
    back:
      en: "Instructs the shell to exit immediately if any command exits with a non-zero (error) status."
      az: "Hər hansı bir əmr sıfırdan fərqli (xəta) statusu ilə bitdikdə skriptin dərhal dayanmasını təmin edir."
  - front:
      en: "Why is `-o pipefail` critical when chaining commands with `|` (pipes)?"
      az: "Əmrləri `|` (pipe) ilə birləşdirərkən `-o pipefail` niyə həyati əhəmiyyət daşıyır?"
    back:
      en: "Without it, the exit status of the pipeline is only that of the last command, masking failures that occurred in earlier steps."
      az: "Bu olmadan yalnız ən sonuncu əmrin çıxış statusu yoxlanılır və əvvəlki mərhələlərdə baş verən xətalar gizli qalır."
  - front:
      en: "What are the standard file descriptor numbers for stdin, stdout, and stderr in Linux?"
      az: "Linux-da stdin, stdout və stderr üçün standart deskriptor nömrələri hansılardır?"
    back:
      en: "0 is stdin (standard input), 1 is stdout (standard output), and 2 is stderr (standard error)."
      az: "0 - stdin (giriş), 1 - stdout (çıxış), və 2 - stderr (xəta axını)."
  - front:
      en: "What is the difference between `>` and `>>` when redirecting command output to a file?"
      az: "Çıxışı fayla yönləndirərkən `>` ilə `>>` arasındakı fərq nədir?"
    back:
      en: "`>` overwrites the target file, while `>>` appends to the end of the file."
      az: "`>` hədəf faylın üzərinə yazır (təmizləyir), `>>` isə faylın sonuna əlavə edir."
  - front:
      en: "Which Linux command is best for real-time monitoring of actively written pipeline log files?"
      az: "Data pipeline-ının canlı yazılan loq fayllarını real vaxtda izləmək üçün ən yaxşı Linux əmri hansıdır?"
    back:
      en: "`tail -f <logfile>` (or `tail -n 100 -f <logfile>`)."
      az: "`tail -f <loq_faylı>` (və ya `tail -n 100 -f <loq_faylı>`)."
