output_description:
  en: "Demonstrates that Docker image layers contain zero plaintext secrets in history, and credentials inject safely at runtime via an external .env file."
  az: "Docker imicinin tarixçəsində heç bir şifrənin qalmadığını və məlumatların runtime zamanı xarici .env faylından təhlükəsiz oxunduğunu göstərir."
interview_question:
  question:
    en: "Why is it dangerous to pass secrets using `ENV` or `ARG` in a Dockerfile? How do you securely handle production credentials in containerized data pipelines?"
    az: "Dockerfile-da `ENV` və ya `ARG` ilə şifrələri ötürmək niyə təhlükəlidir? Konteynerləşdirilmiş data kəmərlərində istehsalat şifrələrini necə təhlükəsiz idarə edirsiniz?"
  answer:
    en: "Passing secrets via `ENV` or `ARG` bakes the plaintext secret into the Docker image's immutable metadata layers. Anyone with read access to the image can run `docker history --no-trunc <image>` or `docker inspect` and extract the cleartext secret immediately. Even deleting the variable in a subsequent `RUN` step does not remove it from the underlying layer. To handle secrets securely in production data pipelines: (1) Keep code completely credential-free using environment variable getters (`os.getenv()`); (2) In local environments, load credentials via `.env` files that are strictly excluded in `.gitignore`; (3) In production enterprise environments, use dedicated Secret Managers (such as AWS Secrets Manager, GCP Secret Manager, or HashiCorp Vault) or Kubernetes Secrets mounted in-memory into container volumes or injected dynamically at runtime."
    az: "Dockerfile-da `ENV` və ya `ARG` ilə şifrə yazdıqda, həmin gizli məlumat Docker imicinin dəyişməz laylarına daimi həkk olunur. Həmin imicə çıxışı olan hər kəs `docker history --no-trunc <imic>` və ya `docker inspect` əmrini işlədərək bütün şifrələri açıq şəkildə oxuya bilər. Sonrakı sətirlərdə dəyişəni silsəniz belə, əvvəlki laydan silinmir. İstehsalat kəmərlərində təhlükəsizliyi təmin etmək üçün: (1) Kodda heç vaxt şifrə saxlamayıb `os.getenv()` istifadə etmək; (2) Lokalda `.gitignore`-a salınmış `.env` faylından oxumaq; (3) İstehsalatda isə AWS Secrets Manager, GCP Secret Manager və ya HashiCorp Vault kimi peşəkar gizlilik idarəetmə sistemlərindən istifadə edərək şifrələri yalnız runtime zamanı yaddaşa (RAM) ötürmək lazımdır."
  interviewer_tips:
    en: "Mention `docker history --no-trunc` to prove you understand how Docker layer metadata exposes build-time variables. Emphasize cloud-native Secret Managers."
    az: "`docker history --no-trunc` əmrini qeyd etmək Docker laylarının daxili iş prinsipini və təhlükəsizlik boşluqlarını bildiyinizi tam sübut edir."
flashcards:
  - front:
      en: "Why is using `ENV DB_PASSWORD='...'` in a Dockerfile a critical security vulnerability?"
      az: "Dockerfile daxilində `ENV DB_PASSWORD='...'` yazmaq niyə kritik təhlükəsizlik boşluğudur?"
    back:
      en: "The secret is permanently baked into the image metadata and readable by anyone using `docker history`."
      az: "Şifrə imicin dəyişməz laylarına yazılır və `docker history` əmri ilə hər kəs tərəfindən açıq oxunur."
  - front:
      en: "What is the 12-Factor App rule regarding application configuration?"
      az: "Tətbiq konfiqurasiyası ilə bağlı 12-Factor App qaydası nədir?"
    back:
      en: "Strictly separate config from code and store configuration in environment variables."
      az: "Konfiqurasiyanı koddan tamamilə ayırmaq və onu mühit dəyişənlərində saxlamaq."
  - front:
      en: "Which file should ALWAYS contain `.env` to prevent credential leaks?"
      az: "Şifrə sızmasının qarşısını almaq üçün `.env` faylı HƏMİŞƏ hansı fayla əlavə olunmalıdır?"
    back:
      en: "The `.gitignore` file."
      az: "`.gitignore` faylına."
  - front:
      en: "What does the `--read-only` flag do when running a Docker container?"
      az: "Docker konteyneri işə salarkən `--read-only` bayrağı nə edir?"
    back:
      en: "Mounts the container's root filesystem as read-only, preventing malicious scripts or modifications from being written."
      az: "Fayl sistemini yalnız-oxunan rejimə salaraq zərərli proqramların daxilə fayl yazmasının qarşısını alır."
  - front:
      en: "Name three enterprise cloud secret management tools used for production data pipelines."
      az: "İstehsalat data kəmərlərində istifadə olunan 3 əsas bulud gizlilik idarəetmə (Secret Manager) alətinin adını çəkin."
    back:
      en: "AWS Secrets Manager, GCP Secret Manager, and HashiCorp Vault."
      az: "AWS Secrets Manager, GCP Secret Manager və HashiCorp Vault."
