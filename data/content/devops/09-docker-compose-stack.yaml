output_description:
  en: "Shows Docker Compose creating networks, volumes, waiting for PostgreSQL to become healthy, and cleanly running the dependent ETL worker."
  az: "Docker Compose-un şəbəkə və volume yaradaraq Postgres-in sağlamlaşmasını gözlədiyini və ardınca ETL worker-i xətasız işə saldığını göstərir."
interview_question:
  question:
    en: "Why is a naive `depends_on: - postgres` often insufficient in a Docker Compose file for Data Engineering pipelines, and how do you resolve it?"
    az: "Data pipeline-ları üçün Docker Compose faylında sadəcə `depends_on: - postgres` yazmaq niyə çox vaxt kifayət etmir və bunu necə həll edirsiniz?"
  answer:
    en: "A naive `depends_on: - postgres` only tells Docker Compose to wait for the PostgreSQL container to start its process (enter the RUNNING state). It does NOT wait for the PostgreSQL database engine to actually complete its internal startup scripts, initialize catalog tables, and listen for incoming connections on port 5432. As a result, dependent applications (like Airflow or an ETL script) attempt to connect too early and immediately crash with 'Connection Refused' errors. To resolve this, you must configure a `healthcheck` block on the database using a probe like `pg_isready -U user`, and expand `depends_on` to include `condition: service_healthy`. This forces Docker Compose to hold dependent services in queue until the database passes its healthcheck."
    az: "Sadəcə `depends_on: - postgres` yazmaq Docker-ə yalnız Postgres konteyner prosesinin başlamasını (RUNNING statusunu) gözləməyi tapşırır. Lakin prosesin başlaması bazanın dərhal sorğu qəbul etməyə hazır olması demək deyil! Postgres daxili fayllarını yoxlayarkən və konfiqurasiyanı yükləyərkən 5-10 saniyə vaxt aparır. Bu zaman asılı olan Airflow və ya ETL worker bazaya qoşulmağa cəhd edir və dərhal 'Connection Refused' xətası ilə çökür. Bunun düzgün həlli bazaya `healthcheck` bloku (`pg_isready` əmri ilə) əlavə etmək və `depends_on` daxilində `condition: service_healthy` təyin etməkdir. Bu zaman Docker Compose worker-i yalnız baza 100% sağlam cavab verdikdən sonra işə salır."
  interviewer_tips:
    en: "Explaining the race condition between 'container running' and 'application ready to accept TCP connections' proves senior-level systems engineering maturity."
    az: "'Konteynerin qalxması' ilə 'tətbiqin TCP sorğusu qəbul etməyə hazır olması' arasındakı fərqi izah etmək dərin sistem mühəndisliyi təcrübənizi sübut edir."
flashcards:
  - front:
      en: "What is the primary purpose of Docker Compose?"
      az: "Docker Compose-un əsas məqsədi nədir?"
    back:
      en: "To define, configure, and orchestrate multi-container Docker applications through a single declarative YAML file."
      az: "Çoxkonteynerli Docker tətbiqlərini tək bir deklarativ YAML faylı vasitəsilə bəyan edib idarə etmək."
  - front:
      en: "Why can `depends_on: [db]` fail without a healthcheck?"
      az: "`depends_on: [db]` healthcheck olmadan niyə uğursuz ola bilər?"
    back:
      en: "It only waits for the container process to start, not for the database inside to finish initializing and accept connections."
      az: "Çünki o yalnız konteyner prosesinin başlamasını gözləyir, daxildəki bazanın hazır olub sorğu qəbul etməsini gözləmir."
  - front:
      en: "What command stops containers and removes networks without deleting persistent volumes in Docker Compose?"
      az: "Docker Compose-da daimi volume-ları silmədən konteynerləri və şəbəkəni dayandırıb təmizləyən əmr hansıdır?"
    back:
      en: "`docker compose down`."
      az: "`docker compose down`."
  - front:
      en: "What command destroys all containers, networks, AND persistent volumes in Docker Compose?"
      az: "Docker Compose-da konteynerlər və şəbəkə ilə bərabər DAİMİ VOLUME-LARI DA tamamilə silən əmr hansıdır?"
    back:
      en: "`docker compose down -v`."
      az: "`docker compose down -v`."
  - front:
      en: "How do services defined within the same `docker-compose.yml` communicate with each other?"
      az: "Eyni `docker-compose.yml` faylında olan xidmətlər bir-biri ilə necə əlaqə qurur?"
    back:
      en: "Through the automatically created shared bridge network, using their service names as hostnames via internal DNS."
      az: "Avtomatik yaradılan ortaq şəbəkə vasitəsilə və xidmət adlarını host adı kimi istifadə edərək."
