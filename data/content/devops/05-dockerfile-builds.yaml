interview_question:
  question:
    en: "What is the difference between `ENTRYPOINT` and `CMD` in a Dockerfile? Why is combining them considered a best practice for Data Engineering workloads?"
    az: "Dockerfile-da `ENTRYPOINT` ilə `CMD` arasındakı fərq nədir? Niyə bu ikisini birləşdirmək Data Mühəndisliyi üçün ən yaxşı təcrübə hesab olunur?"
  answer:
    en: "`ENTRYPOINT` sets the fixed binary or command that will always be executed when the container starts. `CMD` provides the default arguments passed to that `ENTRYPOINT`. If you specify both `ENTRYPOINT ['python']` and `CMD ['src/main.py']`, running `docker run my_image` executes `python src/main.py`. However, an engineer or Airflow task can easily override the script by passing arguments at runtime: `docker run my_image src/backfill.py --date 2026-10-16`, which cleanly executes `python src/backfill.py --date 2026-10-16`. This gives your pipeline image maximum flexibility while preventing accidental execution of the wrong binary."
    az: "`ENTRYPOINT` konteyner açılan zaman mütləq işə düşəcək sabit proqramı (məs: `python`) təyin edir. `CMD` isə həmin proqrama ötürüləcək standart arqumentdir (məs: `src/main.py`). Əgər ikisini birlikdə `ENTRYPOINT ['python']` və `CMD ['src/main.py']` kimi yazsaq, `docker run my_image` əmri birbaşa `python src/main.py` işə salacaq. Əgər Airflow və ya mühəndis başqa bir skript işlətmək istəsə, terminaldan sadəcə `docker run my_image src/backfill.py` yazması kifayətdir və bu `python src/backfill.py` kimi icra olunacaq. Bu, imici həm çevik edir, həm də yanlış proqramın çağırılmasının qarşısını alır."
  interviewer_tips:
    en: "Demonstrate how `CMD` acts as the default argument list to `ENTRYPOINT`, and mention how CLI arguments cleanly override `CMD` without needing `--entrypoint` flags."
    az: "`CMD`-nin `ENTRYPOINT` üçün standart arqumentlər siyahısı olduğunu və CLI-dan ötürülən arqumentlərin yalnız `CMD`-ni əvəz etdiyini nümayiş etdirin."
flashcards:
  - front:
      en: "What is the purpose of `ENV PYTHONUNBUFFERED=1` in a Python Dockerfile?"
      az: "Python Dockerfile-ında `ENV PYTHONUNBUFFERED=1` parametrinin məqsədi nədir?"
    back:
      en: "It forces stdout and stderr to be flushed immediately, ensuring logs appear in real time in container logging."
      az: "Çıxış və xəta loqlarının buferlənmədən dərhal terminala və Docker loqlarına axmasını təmin edir."
  - front:
      en: "Why should you copy `requirements.txt` before copying the rest of your application code in a Dockerfile?"
      az: "Dockerfile-da niyə bütün koddan əvvəl yalnız `requirements.txt` faylını kopyalamalıyıq?"
    back:
      en: "To utilize Docker's layer cache so `pip install` only re-runs when dependencies actually change."
      az: "Docker-in keşindən istifadə etmək üçün; beləliklə `pip install` yalnız kitabxanalar dəyişəndə yenidən icra olunur."
  - front:
      en: "Why should you never run production containers as the default `root` user?"
      az: "İstehsalat konteynerlərini niyə heç vaxt standart `root` istifadəçisi kimi işlətmək olmaz?"
    back:
      en: "Security vulnerability: if an attacker compromises the container, they could potentially escape to host root."
      az: "Təhlükəsizlik boşluğu: əgər kimsə konteynerə hücum etsə, əsas serverə root hüququ ilə sıza bilər."
  - front:
      en: "What is the difference between `COPY` and `ADD` in a Dockerfile?"
      az: "Dockerfile-da `COPY` ilə `ADD` arasındakı fərq nədir?"
    back:
      en: "`COPY` strictly copies local files, whereas `ADD` can download remote URLs and automatically extract tarballs."
      az: "`COPY` yalnız yerli faylları köçürür; `ADD` isə həm də URL yükləyə və arxivləri (`tar`) aça bilir."
  - front:
      en: "How does `CMD` interact with `ENTRYPOINT` in a Dockerfile?"
      az: "Dockerfile-da `CMD` ilə `ENTRYPOINT` bir-biri ilə necə əlaqələnir?"
    back:
      en: "`ENTRYPOINT` defines the executable, and `CMD` supplies the default overridable parameters to it."
      az: "`ENTRYPOINT` icraçı proqramı, `CMD` isə ona ötürülən və dəyişdirilə bilən standart arqumentləri müəyyən edir."
