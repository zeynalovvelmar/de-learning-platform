interview_question:
  question:
    en: "What does an Exit Code 137 mean when investigating a failed data pipeline container in Docker or Kubernetes? How do you diagnose and fix it?"
    az: "Docker və ya Kubernetes-də sıradan çıxmış pipeline konteynerini yoxlayarkən 'Exit Code 137' nə deməkdir? Bunu necə araşdırıb həll edirsiniz?"
  answer:
    en: "Exit Code 137 means the container was abruptly terminated by a SIGKILL signal (128 + 9 = 137), almost universally caused by the Linux Kernel's Out-Of-Memory (OOM) Killer. The container exceeded its configured memory limit (e.g. attempting to load an unpartitioned 10GB dataset into a container limited to 2GB RAM). You diagnose this by running `docker inspect <container>` and checking `State.OOMKilled: true`, or checking `dmesg | grep -i oom`. You fix it by: (1) chunking/streaming the data payload (e.g. streaming processing or Spark partitioning), or (2) increasing the container's memory limit via `--memory` or Kubernetes pod resource limits."
    az: "Exit Code 137 konteynerin Linux Nüvəsinin OOM Killer (Out-Of-Memory) tərəfindən `SIGKILL` siqnalı ilə (128 + 9 = 137) məhv edildiyini bildirir. Bu o deməkdir ki, konteyner təyin edilmiş RAM limitini aşıb (məsələn: 2GB RAM limiti olan konteynerə 10GB-lıq böyük dataset yüklənməyə cəhd edilib). Bunu `docker inspect <ad>` edərək `OOMKilled: true` olub-olmaması ilə və ya `dmesg | grep -i oom` əmri ilə təsdiq edirsiniz. Həlli yolu: (1) datanı birbaşa yaddaşa yığmaq əvəzinə hissə-hissə (chunk/stream) emal etmək, və ya (2) konteynerə verilən RAM limitini (`--memory`) artırmaqdır."
  interviewer_tips:
    en: "Explaining the formula '128 + Signal 9 (SIGKILL) = 137' and mentioning the kernel OOM Killer immediately proves your deep infrastructure debugging experience."
    az: "'128 + Siqnal 9 (SIGKILL) = 137' riyazi məntiqini və Linux OOM Killer mexanizmini qeyd etmək müsahibədə sistem səviyyəli biliklərinizi nümayiş etdirir."
flashcards:
  - front:
      en: "What is the difference between `docker stop` and `docker kill`?"
      az: "`docker stop` ilə `docker kill` arasındakı fərq nədir?"
    back:
      en: "`stop` sends SIGTERM giving 10 seconds for graceful shutdown; `kill` sends SIGKILL terminating the process instantly."
      az: "`stop` konteynerə SIGTERM göndərib təhlükəsiz bağlanması üçün 10 saniyə verir; `kill` dərhal SIGKILL ilə prosesi kəsir."
  - front:
      en: "What does Exit Code 137 signify in Docker and Kubernetes?"
      az: "Docker və Kubernetes-də Exit Code 137 nəyi bildirir?"
    back:
      en: "Out-Of-Memory (OOM) Killed. The container exceeded its memory limit and was terminated by the Linux kernel."
      az: "Yaddaş Çatışmazlığı (OOM Killed). Konteyner ayrılmış RAM limitini aşıb və Linux nüvəsi tərəfindən dayandırılıb."
  - front:
      en: "What does the `-p 5432:5432` flag do in `docker run`?"
      az: "`docker run` əmrindəki `-p 5432:5432` bayrağı nə edir?"
    back:
      en: "Maps host port 5432 to container port 5432, enabling external applications to connect."
      az: "Əsas maşının 5432 portunu konteynerin 5432 portuna bağlayır və xarici tətbiqlərin qoşulmasını təmin edir."
  - front:
      en: "What command lets you enter an interactive shell inside a running container?"
      az: "Aktiv işləyən konteynerin içinə interaktiv terminal ilə daxil olmaq üçün hansı əmr istifadə olunur?"
    back:
      en: "`docker exec -it <container_name> bash` (or `sh`)."
      az: "`docker exec -it <konteyner_adı> bash` (və ya `sh`)."
  - front:
      en: "What does the `--rm` flag do when executing `docker run`?"
      az: "`docker run` icra edərkən `--rm` bayrağı nə işə yarayır?"
    back:
      en: "Automatically deletes the container and its temporary filesystem as soon as it exits, preventing disk clutter."
      az: "Konteyner işini bitirən kimi onu və müvəqqəti fayl sistemini avtomatik silərək diski təmiz saxlayır."
