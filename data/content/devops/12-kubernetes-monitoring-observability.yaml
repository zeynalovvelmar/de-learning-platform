interview_question:
  question:
    en: "What is the difference between a Kubernetes `Deployment`, a `StatefulSet`, and a `Job`? Which would you choose for Apache Kafka versus an ETL pipeline?"
    az: "Kubernetes-də `Deployment`, `StatefulSet` və `Job` arasındakı fərq nədir? Apache Kafka və bir ETL pipeline-ı üçün hansını seçərdiniz?"
  answer:
    en: "A `Deployment` manages stateless applications (like web APIs or Airflow webservers) where pods are completely interchangeable and can be replaced at any time with dynamic IP addresses. A `StatefulSet` manages stateful distributed applications (like Apache Kafka brokers or PostgreSQL), providing unique, stable network identifiers (e.g. `kafka-0`, `kafka-1`) and dedicated, persistent volume claims that reconnect to the exact same pod even after pod restarts. A `Job` is specifically designed for batch workloads that run to completion and terminate (like an ETL pipeline, Spark submit, or dbt model run). For Apache Kafka, you MUST use a `StatefulSet` to maintain partition log ownership and cluster quorum. For an ETL pipeline, you should use a `Job` (or `CronJob`) because it executes once, guarantees completion, and releases compute resources immediately upon finishing."
    az: "`Deployment` vəziyyətsiz (stateless) tətbiqlər üçündür (məs: Web API və ya Airflow Webserver). Buradakı podlar tamamilə əvəzolunandır və dinamik IP alırlar. `StatefulSet` isə stateful (vəziyyət saxlayan) paylanmış sistemlər üçündür (məs: Apache Kafka və ya PostgreSQL). Hər bir pod üçün unikal, sabit ad (`kafka-0`, `kafka-1`) və daimi disk volume-u təyin edir; pod başqa serverə köçsə belə, eyni diski yenidən götürür. `Job` isə işini bitirənə qədər işləyib sonra dayanan batch pipeline-ları üçündür (məs: ETL pipeline-ı, Spark işi, dbt modeli). Buna görə də Apache Kafka üçün mütləq `StatefulSet` seçilməlidir ki, topic partisiyaları və cluster quorumu qorunsun. ETL pipeline-ı üçün isə `Job` (və ya `CronJob`) seçilməlidir ki, iş bitən kimi kompüter resurslarını dərhal azad edib bulud xərcinə qənaət etsin."
  interviewer_tips:
    en: "Categorizing: Kafka -> StatefulSet (identity + storage); ETL Pipeline -> Job (run-to-completion) instantly demonstrates production-grade Kubernetes design capability."
    az: "Kafka -> StatefulSet (sabit şəbəkə və disk) və ETL -> Job (işi bitirib bağlanan) uyğunlaşdırmasını etmək production səviyyəli K8s memarlıq biliklərinizi sübut edir."
flashcards:
  - front:
      en: "What is the smallest deployable computing unit in Kubernetes?"
      az: "Kubernetes-də ən kiçik yerləşdirilə bilən hesablama vahidi nədir?"
    back:
      en: "A Pod (which encapsulates one or more co-located containers)."
      az: "Pod (bir və ya bir neçə ortaq konteyneri özündə birləşdirir)."
  - front:
      en: "Which Kubernetes workload controller is designed for batch ETL jobs that run to completion?"
      az: "İşini bitirənə qədər işləyib dayanan batch ETL pipeline-ları üçün hansı Kubernetes nəzarətçisi nəzərdə tutulub?"
    back:
      en: "A Kubernetes `Job` (or scheduled `CronJob`)."
      az: "Kubernetes `Job` (və ya cədvəl üzrə `CronJob`)."
  - front:
      en: "Why must Apache Kafka be deployed using a `StatefulSet` rather than a `Deployment`?"
      az: "Apache Kafka niyə `Deployment` əvəzinə mütləq `StatefulSet` ilə quraşdırılmalıdır?"
    back:
      en: "StatefulSets provide stable network hostnames (`kafka-0`) and attach dedicated persistent storage per replica."
      az: "Çünki StatefulSet hər pod üçün sabit şəbəkə adı (`kafka-0`) və ayrılmış daimi disk təmin edir."
  - front:
      en: "What is the function of Prometheus in a Data Platform?"
      az: "Data Platformasında Prometheus-un funksiyası nədir?"
    back:
      en: "It scrapes and stores time-series metrics (CPU, RAM, Kafka lag, pipeline run times) at regular intervals."
      az: "Müəyyən fasilələrlə zamana bağlı metrikaları (CPU, RAM, Kafka ləngiməsi, pipeline müddəti) toplayıb saxlayır."
  - front:
      en: "What is Grafana primarily used for in production pipeline monitoring?"
      az: "Production pipeline-larının monitorinqində Grafana əsasən nə üçün istifadə olunur?"
    back:
      en: "Visualizing time-series metrics through interactive dashboards and routing incident alerts to notification channels."
      az: "Metrikaları interaktiv vizual panellərdə göstərmək və xəta siqnallarını bildiriş kanallarına yönləndirmək üçün."
