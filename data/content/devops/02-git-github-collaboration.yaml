interview_question:
  question:
    en: "What is the difference between `git merge` and `git rebase`? When should a Data Engineer use one over the other?"
    az: "`git merge` ilə `git rebase` arasındakı fərq nədir? Data mühəndisi hansı halda hansını seçməlidir?"
  answer:
    en: "`git merge` integrates changes from one branch into another by creating a new 'merge commit', preserving the complete chronological history and branch topology. `git rebase` rewrites commit history by lifting the feature branch commits and reapplying them sequentially on top of the target branch, resulting in a clean, perfectly linear project history. As a Data Engineer, the best practice is to use `git rebase` on your local feature branch before opening a Pull Request so that your changes apply cleanly to the latest `main`. However, you should NEVER rebase a public or shared branch (such as `main`), because rewriting public history breaks collaboration for everyone else."
    az: "`git merge` iki budağı birləşdirərkən araya yeni bir 'merge commit' əlavə edir və commit-lərin yazıldığı dəqiq xronoloji vaxtı qoruyur. `git rebase` isə sizin budaqdakı commit-ləri götürür və hədəf budağın (`main`) ən sonuna ardıcıl yapışdıraraq tarixçəni yenidən yazır və tam xətti, təmiz bir loq yaradır. Data mühəndisi kimi ən düzgün təcrübə odur ki, PR açmazdan əvvəl öz lokal budağınızı `main`-ə rebase edəsiniz. Lakin heç vaxt ortaq, ictimai budaqlarda (`main` və ya `master`) rebase etmək olmaz, çünki ümumi tarixçəni dəyişmək digər komanda yoldaşlarının işini pozar."
  interviewer_tips:
    en: "Explicitly state the Golden Rule of Rebase: 'Never rebase public shared branches.' This immediately signals that you understand production Git etiquette."
    az: "Rebase-in qızıl qaydasını dilə gətirin: 'Heç vaxt hamının istifadə etdiyi ümumi budaqda rebase edilməz.' Bu sizin peşəkar komanda təcrübənizi sübut edir."
flashcards:
  - front:
      en: "What are the 3 main local working zones in Git?"
      az: "Git-də əsas 3 lokal iş zonası hansıdır?"
    back:
      en: "Working Directory, Staging Area (Index), and Local Repository (`.git`)."
      az: "İşçi Qovluq (Working Directory), Staging Sahəsi (Index) və Lokal Anbar (Repository)."
  - front:
      en: "What is the primary difference between `git merge` and `git rebase`?"
      az: "`git merge` ilə `git rebase` arasındakı əsas fərq nədir?"
    back:
      en: "Merge creates a new merge commit preserving branching history; rebase rewrites commits to create a linear history."
      az: "Merge budaqlanma tarixçəsini saxlayaraq yeni commit yaradır; rebase isə commit-ləri təzədən düzüb xətti tarixçə qurur."
  - front:
      en: "What is the Golden Rule of Git Rebase?"
      az: "Git Rebase əməliyyatının Qızıl Qaydası nədir?"
    back:
      en: "Never rebase a public or shared branch (like `main`), only rebase private local feature branches."
      az: "Heç vaxt ortaq və ya ictimai budaqları (`main`) rebase etməyin; yalnız öz lokal budaqlarınızı rebase edin."
  - front:
      en: "What should you NEVER commit to a Git repository in Data Engineering?"
      az: "Data mühəndisliyində Git anbarına QƏTİYYƏN nələri göndərmək olmaz?"
    back:
      en: "Credentials/secrets (`.env`, private keys) and large raw datasets (`*.csv`, `*.parquet`)."
      az: "Şifrələr/açar sözlər (`.env`, açar faylları) və böyük xammal data faylları (`*.csv`, `*.parquet`)."
  - front:
      en: "Which command cancels a broken commit and safely records a new opposite commit in Git history?"
      az: "Git tarixçəsində xətalı bir commit-i təhlükəsiz şəkildə ləğv edib əks commit yazan əmr hansıdır?"
    back:
      en: "`git revert <commit-hash>`."
      az: "`git revert <commit-kodu>`."
