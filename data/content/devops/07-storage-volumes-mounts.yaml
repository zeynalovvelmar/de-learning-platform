output_description:
  en: "Demonstrates deleting a database container and recreating it from scratch with zero data loss using Docker Named Volumes."
  az: "Konteynerin tamamilə silinməsinə baxmayaraq, Named Volume sayəsində bütün məlumatların heç bir itki olmadan bərpa edildiyini sübut edir."
interview_question:
  question:
    en: "What is the difference between a Docker Named Volume and a Bind Mount? When would you use each in a Data Engineering architecture?"
    az: "Docker Named Volume ilə Bind Mount arasındakı fərq nədir? Data Mühəndisliyi arxitekturasında hansını nə vaxt istifadə edərdiniz?"
  answer:
    en: "A Named Volume is managed entirely by Docker within a dedicated storage directory on the host (e.g. `/var/lib/docker/volumes/`). It is decoupled from the host directory structure, delivers optimal I/O performance, avoids host permission issues, and persists even when containers are removed. In Data Engineering, Named Volumes are mandatory for databases (PostgreSQL, ClickHouse, MinIO) and messaging systems (Kafka topic logs). A Bind Mount directly mounts a specific, user-defined path on the host machine into the container. It is best used during local development, such as mounting your local `./dags` folder into an Apache Airflow container so that DAG code changes reflect instantly without requiring an image rebuild."
    az: "Named Volume tamamilə Docker tərəfindən idarə olunan və əsas serverin xüsusi saxlanc sahəsində (`/var/lib/docker/volumes/`) yerləşən müstəqil disk vahididir. Əsas maşının fayl icazələrindən asılı deyil, yüksək I/O sürətinə malikdir və konteyner silinsə belə məlumatı qoruyur. Data Mühəndisliyində Named Volumes verilənlər bazaları (Postgres, ClickHouse, MinIO) və Kafka log faylları üçün məcburidir. Bind Mount isə kompüterinizdəki konkret bir qovluğu birbaşa konteynerə bağlayır. Bu ən çox lokal inkişaf (development) zamanı istifadə olunur; məsələn: lokal kompüterinizdəki `./dags` qovluğunu Airflow konteynerinə bağlamaqla siz Docker image-i yenidən qurmadan kodu yazan kimi Airflow-da dəyişikliyi dərhal görə bilərsiniz."
  interviewer_tips:
    en: "Highlight the specific mapping: Named Volumes -> Databases / State; Bind Mounts -> Live code editing / Configuration files. This clarity demonstrates practical operational experience."
    az: "Dəqiq təyinatı qeyd edin: Named Volume -> Verilənlər bazaları və data saxlanc; Bind Mount -> Canlı kod və konfiqurasiyalar."
flashcards:
  - front:
      en: "What happens to data stored in a container's writable layer when the container is deleted?"
      az: "Konteyner silindikdə onun daxili oxu-yazı layer-ində (layında) saxlanılan məlumatla nə baş verir?"
    back:
      en: "It is permanently deleted and lost because the writable layer is bound to the container's lifecycle."
      az: "Həmişəlik silinir və itir, çünki oxu-yazı layer-i yalnız konteynerin ömrünə bağlıdır."
  - front:
      en: "What is a Docker Named Volume?"
      az: "Docker Named Volume nədir?"
    back:
      en: "A Docker-managed persistent storage location on the host filesystem that survives container destruction."
      az: "Konteynerin silinməsindən asılı olmayan və Docker tərəfindən idarə edilən daimi saxlanc sahəsidir."
  - front:
      en: "What is a Docker Bind Mount?"
      az: "Docker Bind Mount nədir?"
    back:
      en: "Directly mounting an exact directory from the host machine into a container path."
      az: "Kompüterdəki konkret bir qovluğun birbaşa konteynerin daxili yoluna bağlanmasıdır."
  - front:
      en: "Which storage type is best for storing local Apache Airflow DAG files?"
      az: "Lokal Apache Airflow DAG fayllarını saxlamaq üçün ən yaxşı saxlanc növü hansıdır?"
    back:
      en: "Bind Mount, allowing real-time code edits on the host to reflect immediately inside the running container."
      az: "Bind Mount; beləliklə kompüterdə kodu dəyişən kimi dərhal işləyən konteynerdə əks olunur."
  - front:
      en: "Which command removes all unused Docker volumes to free disk space?"
      az: "İstifadə olunmayan bütün Docker volume-larını təmizləyib diskdə yer açan əmr hansıdır?"
    back:
      en: "`docker volume prune`."
      az: "`docker volume prune`."
