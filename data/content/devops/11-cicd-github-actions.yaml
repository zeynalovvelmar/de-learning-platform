interview_question:
  question:
    en: "What is CI/CD in the context of Data Engineering, and what automated checks should run before a Pull Request is allowed to merge into production?"
    az: "Data Mühəndisliyi kontekstində CI/CD nədir və bir Pull Request-in production-a birləşməsinə icazə verilməzdən əvvəl hansı avtomatlaşdırılmış yoxlamalar işləməlidir?"
  answer:
    en: "CI/CD in Data Engineering automates the validation, testing, packaging, and deployment of data pipelines (DAGs, Spark jobs, dbt models, and Dockerfiles). Before any Pull Request is permitted to merge into the production `main` branch, an automated CI pipeline (e.g. GitHub Actions or GitLab CI) should enforce four gates: (1) Linting & Formatting (`flake8`, `black`, `sqlfluff` for SQL formatting) to ensure syntax correctness; (2) Static Type Checking (`mypy`) to catch data type contract mismatches; (3) Unit and Integration Tests (`pytest`) testing transformation logic against deterministic mock datasets; and (4) Container Build and Vulnerability Scanning (`docker build` and `trivy`) to verify that Docker images build without dependency breakages and contain no critical CVE security vulnerabilities. Only when all status checks pass 100% does Branch Protection allow merging."
    az: "Data Mühəndisliyində CI/CD data pipeline-larının (Airflow DAG-ları, Spark işləri, dbt modelləri və Docker image-ləri) yoxlanmasını, test edilməsini və production-a çıxarılmasını avtomatlaşdıran sistemdir. Hər hansı bir Pull Request-in `main` budağına birləşməsinə icazə verilməzdən əvvəl avtomatlaşdırılmış CI pipeline-ı 4 əsas mərhələni yoxlamalıdır: (1) Formatlama və Sintaksis (`flake8`, `black`, və SQL üçün `sqlfluff`); (2) Statik Tip Yoxlaması (`mypy`) ilə tip səhvlərinin tapılması; (3) Vahid və İnteqrasiya Testləri (`pytest`) ilə data transformasiyalarının nümunə məlumatlar üzərində düzgün işlədiyinin təsdiqi; (4) Docker Qurulması və Təhlükəsizlik Skanı (`docker build` və `trivy`) ilə image-in asılılıqlarının salamat olduğunu və heç bir təhlükəsizlik boşluğu daşımadığını təsdiqləmək. Yalnız bütün bu yoxlamalar 100% yaşıl keçdikdən sonra GitHub Branch Protection kodun birləşməsinə icazə verir."
  interviewer_tips:
    en: "Mention `sqlfluff` for SQL linting and `trivy` for container CVE scanning alongside `pytest`. This proves you understand data-specific CI/CD beyond standard web development."
    az: "SQL kodlarının formatlanması üçün `sqlfluff` və Docker image skanı üçün `trivy` alətlərini qeyd etmək Data Mühəndisliyi üzrə yüksək səviyyəli DevOps bacarığınızı göstərir."
flashcards:
  - front:
      en: "What is the primary objective of Continuous Integration (CI) in Data Engineering?"
      az: "Data Mühəndisliyində Davamlı İnteqrasiyanın (CI) əsas məqsədi nədir?"
    back:
      en: "To automatically detect syntax bugs, broken dependencies, and test regressions before code merges into production."
      az: "Kod production-a getməzdən əvvəl sintaksis xətalarını, xarab asılılıqları və xətaları avtomatik aşkar etmək."
  - front:
      en: "Where are GitHub Actions workflows configured in a repository?"
      az: "GitHub Actions konfiqurasiya faylları layihədə hansı qovluqda yerləşir?"
    back:
      en: "In the `.github/workflows/` directory as YAML files (e.g. `.github/workflows/ci.yml`)."
      az: "Layihənin `.github/workflows/` qovluğunda YAML faylları kimi (məs: `ci.yml`)."
  - front:
      en: "What is the purpose of Branch Protection rules in GitHub?"
      az: "GitHub-da Budaq Qorunma (Branch Protection) qaydalarının məqsədi nədir?"
    back:
      en: "To prevent direct pushes to `main` and require all CI checks to pass and PRs to be reviewed before merging."
      az: "`main` budağına birbaşa kod atılmasının qarşısını almaq və bütün CI testlərinin keçməsini məcburi etmək."
  - front:
      en: "Which popular Python tool is used for automated unit testing in data pipeline CI workflows?"
      az: "Data pipeline-larının CI proseslərində avtomatlaşdırılmış vahid testlər üçün hansı məşhur Python aləti istifadə olunur?"
    back:
      en: "`pytest`."
      az: "`pytest`."
  - front:
      en: "What tool is commonly used to automatically lint and enforce standard style in SQL models?"
      az: "SQL modellərində standart formatı və qaydaları avtomatik yoxlamaq üçün hansı məşhur linter istifadə olunur?"
    back:
      en: "`sqlfluff`."
      az: "`sqlfluff`."
