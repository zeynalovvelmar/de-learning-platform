output_description:
  en: "Shows the multi-stage build comparison, where the image drops from 1.78GB to 112MB by discarding build tools."
  az: "Kompilyatorları kənara atmaqla imicin həcminin 1.78 GB-dan 112 MB-a (15 dəfə) enməsini əks etdirən müqayisə."
interview_question:
  question:
    en: "What are Multi-Stage Builds in Docker, and why are they considered essential for production Data Engineering containers?"
    az: "Docker-də Multi-Stage Builds nədir və niyə istehsalat Data Mühəndisliyi konteynerləri üçün vacib hesab olunur?"
  answer:
    en: "Multi-Stage Builds allow you to use multiple `FROM` statements in a single Dockerfile, creating distinct build phases. Heavy development tools, build chains (`gcc`, `g++`, header packages), and build-time caches are confined to a 'builder' stage that compiles the application or Python wheels. The final production stage starts from a minimal runtime image and copies only the compiled binaries using `COPY --from=builder`. In Data Engineering, this is essential because libraries like `psycopg2`, `duckdb`, and `cryptography` require heavy C compilers to build. Without multi-stage builds, images bloat to 1.5GB+, causing severe network latency during Kubernetes pod scaling, inflating cloud storage costs, and introducing security vulnerabilities by leaving compilers in production."
    az: "Multi-Stage Builds bir Dockerfile içində bir neçə `FROM` istifadə edərək ayrı-ayrı mərhələlər yaratmağa imkan verən texnologiyadır. Ağır proqramlaşdırma alətləri, C kompilyatorları (`gcc`, `g++`, başlıq faylları) yalnız birinci 'builder' mərhələsində işlədilir və Python paketlərini binar formaya salır. Yekun istehsalat mərhələsi isə ən yüngül baza imicindən başlayır və `COPY --from=builder` ilə yalnız hazır binar faylları götürür. Data Mühəndisliyində bu vacibdir, çünki `psycopg2`, `duckdb` kimi kitabxanalar mütləq C kompilyasiyası tələb edir. Multi-stage olmasa, imiclər 1.5-2 GB-a qədər şişir, Kubernetes-də podların açılmasını ləngidir, bulud xərcini artırır və istehsalatda lazımsız kompilyator saxlamaqla təhlükəsizlik boşluğu yaradır."
  interviewer_tips:
    en: "Contrast Kubernetes pod startup latency with large vs small images. Pods that take 3 minutes to pull large images can cause SLA breaches in dynamic ETL workflows."
    az: "Böyük imiclərin Kubernetes-də podların açılmasını ləngitdiyini və bunun SLA pozuntularına səbəb olduğunu qeyd etmək real arxitektura təcrübənizi göstərir."
flashcards:
  - front:
      en: "What happens to Docker's build cache when a layer changes in a Dockerfile?"
      az: "Dockerfile-da bir lay dəyişdikdə Docker-in qurma keşi (build cache) ilə nə baş verir?"
    back:
      en: "The cache for that specific layer and ALL subsequent layers is invalidated and must be rebuilt."
      az: "Həmin layın və ondan sonrakı BÜTÜN sonrakı layların keşi ləğv edilir və sıfırdan yenidən qurulur."
  - front:
      en: "What is the primary benefit of Multi-Stage Docker builds?"
      az: "Multi-Stage Docker qurmalarının əsas üstünlüyü nədir?"
    back:
      en: "Isolating compilers and build tools to an intermediate stage, resulting in radically smaller, faster, and more secure production images."
      az: "Kompilyatorları müvəqqəti mərhələdə saxlayaraq yekun istehsalat imicini qat-qat kiçik, sürətli və təhlükəsiz etmək."
  - front:
      en: "How do you copy compiled artifacts from a previous stage named 'builder' in Dockerfile?"
      az: "Dockerfile-da 'builder' adlı əvvəlki mərhələdən hazır faylları necə kopyalayırlar?"
    back:
      en: "`COPY --from=builder <source_path> <destination_path>`."
      az: "`COPY --from=builder <mənbə_yol> <hədəf_yol>`."
  - front:
      en: "Why should you combine `apt-get update` and `apt-get install` into a single `RUN` instruction?"
      az: "Niyə `apt-get update` və `apt-get install` əmrlərini tək bir `RUN` daxilində birləşdirmək lazımdır?"
    back:
      en: "To ensure package lists are fresh and prevent stale cached package index layers from causing installation failures."
      az: "Paket siyahısının təzə olmasını təmin etmək və köhnə keşlənmiş indeks səbəbilə quraşdırma xətalarının qarşısını almaq üçün."
  - front:
      en: "What command should you run at the end of an `apt-get install` layer to reduce image size?"
      az: "İmicin ölçüsünü kiçiltmək üçün `apt-get install` layının sonunda hansı təmizləmə əmri yazılmalıdır?"
    back:
      en: "`rm -rf /var/lib/apt/lists/*`."
      az: "`rm -rf /var/lib/apt/lists/*`."
