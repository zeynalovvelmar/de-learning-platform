    │  • Installs gcc, g++, build-essential, libpq-dev to compile C-libraries│
    │  • Compilers remain stuck in the final image forever!                  │
    │  💥 Image Size: 1.8 GB! Slow Kubernetes pulls, high attack surface.    │
