output_description:
  en: "Demonstrates launching an isolated Python container in 0.4 seconds, strictly capped at 512MB RAM with sub-second startup."
  az: "512MB RAM limiti ilə təcrid olunmuş Python konteynerinin 0.4 saniyədə işə düşməsini və resurs göstəricilərini əks etdirir."
interview_question:
  question:
    en: "Explain the architectural difference between a Docker container and a Virtual Machine (VM). What Linux kernel primitives make containers possible?"
    az: "Docker konteyneri ilə Virtual Maşın (VM) arasındakı arxitektura fərqini izah edin. Hansı Linux nüvə (kernel) mexanizmləri konteynerləri mümkün edir?"
  answer:
    en: "A Virtual Machine virtualizes the entire hardware layer using a Hypervisor (e.g. VMware, KVM) to run independent, complete Guest Operating Systems. Each VM has its own kernel, consuming gigabytes of storage/RAM and taking minutes to boot. A Docker container virtualizes at the OS level by sharing the host machine's Linux Kernel. Containers are simply isolated processes that boot in milliseconds with near-zero overhead. The two fundamental Linux kernel primitives enabling containers are: (1) Namespaces, which provide isolation for processes (PID), network interfaces, mount points, and users; and (2) Control Groups (cgroups), which enforce hardware resource limits (CPU, memory, disk I/O, network bandwidth)."
    az: "Virtual Maşın Hypervisor (məs: VMware, KVM) vasitəsilə bütöv bir kompüter avadanlığını virtualizasiya edir və hər maşın üçün müstəqil Qonaq Əməliyyat Sistemi (Guest OS) qaldırır. Hər VM-in öz nüvəsi (kernel) olduğu üçün qiqabaytlarla yer tutur və açılması dəqiqələr çəkir. Docker konteyneri isə ƏS səviyyəsində işləyir və əsas serverin ortaq Linux nüvəsini bölüşür. Konteyner sadəcə təcrid olunmuş bir prosesdir və millisaniyələr ərzində açılır. Konteynerləri mümkün edən iki təməl Linux mexanizmi vardır: (1) Namespaces — prosesləri, şəbəkəni və fayl sistemini təcrid edərək konteynerin nəyi *görə bildiyini* tənzimləyir; (2) Control Groups (cgroups) — konteynerin nə qədər RAM, CPU və disk I/O *işlədə biləcəyini* məhdudlaşdırır."
  interviewer_tips:
    en: "Immediately naming 'Namespaces' for isolation and 'cgroups' for resource limiting guarantees a maximum rating on container architecture questions."
    az: "Görünüş təcridi üçün 'Namespaces' və resurs məhdudiyyəti üçün 'cgroups' terminlərini ilk cümlədə demək arxitektura biliklərinizi sübut edir."
flashcards:
  - front:
      en: "What is the primary architectural difference between Docker containers and Virtual Machines?"
      az: "Docker konteynerləri ilə Virtual Maşınlar (VM) arasındakı əsas arxitektur fərq nədir?"
    back:
      en: "Containers share the host OS kernel and virtualize at the OS layer, whereas VMs run a complete separate Guest OS via a Hypervisor."
      az: "Konteynerlər əsas serverin Linux nüvəsini bölüşür; VM-lər isə Hypervisor vasitəsilə ayrıca bütöv bir qonaq ƏS qaldırır."
  - front:
      en: "What role do Linux Namespaces play in Docker containers?"
      az: "Linux Namespaces mexanizmi Docker konteynerlərində hansı rolu oynayır?"
    back:
      en: "They provide process and environment isolation (PID, Network, Mount, IPC, User namespaces)."
      az: "Proseslərin, şəbəkənin və fayl sisteminin təcrid olunmasını (izolyasiyasını) təmin edir."
  - front:
      en: "What role do Linux Control Groups (cgroups) play in Docker?"
      az: "Linux Control Groups (cgroups) mexanizmi Docker-də nə işə yarayır?"
    back:
      en: "They enforce limits on hardware resource usage, such as maximum CPU, RAM, and I/O bandwidth."
      az: "Konteynerin istifadə edə biləcəyi maksimum CPU, RAM və I/O resurslarına limit qoyur."
  - front:
      en: "Why do Docker containers boot significantly faster than Virtual Machines?"
      az: "Docker konteynerləri Virtual Maşınlardan niyə qat-qat sürətlə işə düşür?"
    back:
      en: "Containers are just isolated processes that don't need to initialize virtual hardware or boot an OS kernel."
      az: "Çünki konteynerlər virtual avadanlıq və ya ƏS nüvəsi yükləmir, sadəcə izolasiya edilmiş proses kimi dərhal açılır."
  - front:
      en: "What problem does Docker fundamentally solve for data pipelines?"
      az: "Docker data kəmərləri üçün əsasən hansı problemi həll edir?"
    back:
      en: "The 'it works on my machine' dilemma, guaranteeing identical dependencies and execution across all environments."
      az: "'Mənim kompüterimdə işləyirdi' problemini aradan qaldıraraq kodun hər mühitdə eyni cür icra olunmasını təmin edir."
