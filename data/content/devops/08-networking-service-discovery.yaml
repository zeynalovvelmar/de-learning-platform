output_description:
  en: "Shows the Python client container resolving the database's container name 'warehouse-db' to its dynamic IP address 172.20.0.2 via internal DNS."
  az: "Python müştərisinin daxili DNS vasitəsilə 'warehouse-db' adını dərhal 172.20.0.2 dinamik IP ünvanına çevirdiyini göstərir."
interview_question:
  question:
    en: "Why is using a User-Defined Bridge network mandatory when orchestrating multiple data services with Docker, rather than using the default bridge network?"
    az: "Docker ilə bir neçə data servisini işlədərkən standart körpü (default bridge) əvəzinə Xüsusi Yaradılmış Körpü (User-Defined Bridge) şəbəkəsi niyə məcburidir?"
  answer:
    en: "On the default bridge network (`docker0`), Docker disables automatic DNS resolution; containers can only communicate with each other using raw IP addresses. In a data platform, container IP addresses are dynamic and change whenever containers are restarted or recreated during updates. On a User-Defined Bridge network (`docker network create`), Docker provides an automatic embedded DNS server where containers resolve each other by container name (e.g. `postgres:5432` or `kafka:9092`). This eliminates hardcoded IP addresses, ensures resilient service discovery, and isolates application network traffic from other unrelated containers on the host."
    az: "Standart körpü şəbəkəsində (`docker0`) Docker daxili avtomatik DNS xidmətini söndürür; konteynerlər bir-biri ilə yalnız birbaşa IP ünvanları vasitəsilə danışa bilir. Data platformasında isə konteynerlər hər yenidən başlayanda onların IP ünvanı dəyişir, bu isə pipeline-ların dayanmasına gətirib çıxarır. Xüsusi yaradılmış körpü şəbəkəsində (`docker network create`) Docker daxili DNS serverini aktivləşdirir və konteynerlər bir-birini adları vasitəsilə (`postgres:5432` və ya `kafka:9092`) dərhal tapır. Bu, kodda heç bir IP yazmamağa imkan verir, xidmətlərin aşkarlanmasını (service discovery) təmin edir və data şəbəkəsini digər konteynerlərdən təhlükəsiz şəkildə təcrid edir."
  interviewer_tips:
    en: "State clearly that 'Automatic DNS Resolution is only enabled on user-defined networks, NOT on the default bridge network.' Interviewers test this exact networking nuance."
    az: "'Avtomatik DNS yalnız xüsusi yaradılmış şəbəkələrdə işləyir, standart körpüdə işləmir' cümləsini dəqiq vurğulamaq şəbəkə biliklərinizi sübut edir."
flashcards:
  - front:
      en: "Why do containers on the default bridge network fail to communicate by container name?"
      az: "Standart körpü şəbəkəsində olan konteynerlər niyə bir-biri ilə ad vasitəsilə danışa bilmir?"
    back:
      en: "Docker disables automatic DNS resolution on the default bridge network; it only functions on user-defined networks."
      az: "Çünki Docker standart körpü şəbəkəsində avtomatik DNS xidmətini söndürür; bu yalnız xüsusi şəbəkələrdə aktiv olur."
  - front:
      en: "What command creates a custom Docker bridge network?"
      az: "Xüsusi Docker körpü şəbəkəsi yaradan əmr hansıdır?"
    back:
      en: "`docker network create <network_name>`."
      az: "`docker network create <şəbəkə_adı>`."
  - front:
      en: "What does the `host` network driver do in Docker?"
      az: "Docker-də `host` şəbəkə sürücüsü nə edir?"
    back:
      en: "Removes network isolation, binding the container directly to the host machine's physical network stack."
      az: "Şəbəkə təcridini ləğv edir və konteyneri birbaşa əsas maşının fiziki şəbəkə kartına bağlayır."
  - front:
      en: "What is the purpose of the `none` network driver?"
      az: "Docker-də `none` şəbəkə sürücüsünün məqsədi nədir?"
    back:
      en: "Completely disables all network access, providing an isolated, security-hardened execution sandbox."
      az: "Bütün şəbəkə çıxışını bağlayır və təhlükəsiz, tam qapalı icra mühiti təmin edir."
  - front:
      en: "How do two containers on a user-defined network discover each other?"
      az: "Xüsusi şəbəkədə olan iki konteyner bir-birini necə aşkar edir?"
    back:
      en: "Through Docker's embedded DNS server using the container name as the hostname (e.g. `http://kafka:9092`)."
      az: "Docker-in daxili DNS serveri vasitəsilə konteyner adını host kimi istifadə edərək (məs: `kafka:9092`)."
