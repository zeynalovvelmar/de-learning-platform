output_description:
  en: "Execution plan demonstrating the high-speed BroadcastHashJoin operator where the build-side table is distributed via BroadcastExchange."
  az: "Kiçik cədvəlin BroadcastExchange ilə paylandığını və birləşmənin BroadcastHashJoin ilə şafflsız baş verdiyini sübut edən icra planı."
what_it_does:
  en: "Demonstrates how to optimize distributed table joins using broadcast hints to prevent large table shuffles."
  az: "Böyük cədvəlin şaffl olunmasının qarşısını almaq üçün broadcast ipucundan istifadə edərək paylanmış birləşməni optimallaşdırmağı nümayiş etdirir."
real_world_use:
  en: "Star schema data warehouses: Fact tables (Billions of rows) joined with Dimension tables (Customers, Dates, Stores). Broadcasting dimension tables speeds up daily ETL jobs by hours."
  az: "Ulduz sxemli (Star Schema) data anbarlarında: Milyardlarla sətirli Fakt cədvəlini kiçik Dimensiya cədvəlləri (Tarix, Mağaza, Kateqoriya) ilə birləşdirəndə istifadə olunur və işi saatlarla sürətləndirir."
common_mistakes:
  en: |
    - **Forcing broadcast on a 50 GB table**: The Driver node MUST collect the entire broadcast table into its own RAM first. Broadcasting a 50GB table instantly crashes the Driver with an OutOfMemoryError.
    - **Not setting broadcast threshold appropriately**: If your dimension table is 25 MB, Spark's default 10 MB limit will trigger a slow Sort-Merge Join. You should either set `spark.sql.autoBroadcastJoinThreshold = 50 * 1024 * 1024` or use the `broadcast()` hint.
    - **Using broadcast join on Full Outer Joins**: Spark does not support Broadcast Hash Join for Full Outer Joins (both sides can have unmatched keys, requiring both sides to be shuffled).
  az: |
    - **50 GB-lıq cədvələ zorla broadcast tətbiq etmək**: Driver həmin cədvəli əvvəlcə öz RAM-ına çəkməlidir. 50 GB-lıq cədvəli broadcast etsəniz, Driver dərhal OOM ilə partlayacaq.
    - **Broadcast həddini artırmağı unutmaq**: Dimensiya cədvəliniz 25 MB-dırsa, Spark-ın susmaya görə 10 MB həddi onu yavaş Sort-Merge Join-ə salacaq. Həddi artırmaq və ya `broadcast()` yazmaq lazımdır.
    - **Full Outer Join-də broadcast gözləmək**: Spark Full Outer Join üçün Broadcast Hash Join dəstəkləmir, çünki hər iki tərəfdə uyğunlaşmayan açarlar qala bilər.
interview_question:
  question:
    en: "How does Broadcast Hash Join work under the hood, what is the default threshold, and what catastrophe occurs if you broadcast an oversized table?"
    az: "Broadcast Hash Join daxildə necə işləyir, susmaya görə hədd nə qədərdir və həddən artıq böyük cədvəli broadcast etdikdə hansı fəlakət baş verir?"
  answer:
    en: |
      1. **Internal Mechanics**:
         - **Step 1 (Driver Collect)**: The Driver node contacts executors to download the small table partitions, combines them into a single in-memory array on the Driver JVM, and constructs a serialized Hash Table.
         - **Step 2 (Peer-to-Peer Broadcast)**: The Driver uses BitTorrent-like peer-to-peer protocol to replicate this hash table into the memory of every single Executor in the cluster.
         - **Step 3 (Local Hash Lookup)**: Each executor streams its local partitions of the large table and performs instant $O(1)$ memory lookups against the local hash table. **Zero network shuffle on the large table!**
      2. **The Threshold**:
         - Governed by `spark.sql.autoBroadcastJoinThreshold`. The default is **10 MB** (`10485760` bytes). Set to `-1` to disable broadcast joins entirely.
      3. **The Catastrophe (Driver OOM)**:
         - Because Step 1 forces the Driver to collect the ENTIRE broadcast table into its own local heap, broadcasting a 20 GB table on a Driver with an 8 GB heap triggers an immediate, unrecoverable `java.lang.OutOfMemoryError: Java heap space` crash.
    az: |
      1. **Daxili Mexanizm**:
         - **1-ci Addım (Driver-ə Yığılma)**: Driver kiçik cədvəlin bütün hissələrini öz JVM yaddaşına çəkir və orada tək bir Hash Cədvəli qurur.
         - **2-ci Addım (Bütün Klasterə Yayılma)**: Driver BitTorrent bənzəri P2P protokolu ilə bu lüğəti klasterdəki hər bir Executor-un RAM yaddaşına kopyalayır.
         - **3-cü Addım (Lokal Axtarış)**: Hər bir executor özündə olan böyük cədvəl sətirlərini lokal lüğətlə $O(1)$ sürətində yoxlayır. **Böyük cədvəl üçün şəbəkə şafflı SIFIRDIR!**
      2. **Hədd (Threshold)**:
         - `spark.sql.autoBroadcastJoinThreshold` parametri ilə idarə olunur. Susmaya görə **10 MB**-dır. `-1` təyin etsəniz, broadcast tamamilə söndürülür.
      3. **Baş Verən Fəlakət (Driver OOM)**:
         - Çünki 1-ci addımda Driver bütün həmin cədvəli təkbaşına öz yaddaşına yükləməyə məcburdur. 8 GB yaddaşı olan Driver-ə 20 GB-lıq cədvəli broadcast etsəniz, dərhal `java.lang.OutOfMemoryError: Java heap space` xətası ilə bütün kəmər çökəcək.
  interviewer_tips:
    en: "Emphasize that the broadcast table is serialized on the DRIVER first. Mentioning 'Driver OOM risk during collect' is the hallmark of an engineer who has real production battle scars."
    az: "Müsahibədə vurğulayın ki, cədvəl əvvəlcə DRIVER-ə çəkilir. 'Böyük cədvəli broadcast etdikdə Driver OOM olar' demək real istehsalat təcrübəsinə malik olduğunuzu göstərən ən vacib siqnaldır."
flashcards:
  - front:
      en: "What is the primary performance benefit of a Broadcast Hash Join (BHJ)?"
      az: "Broadcast Hash Join (BHJ) strategiyasının ən böyük performans üstünlüyü nədir?"
    back:
      en: "It completely eliminates the expensive network shuffle on the large table."
      az: "Böyük cədvəl üzərindəki baha başa gələn şəbəkə şafflını (shuffle) tamamilə aradan qaldırır."
  - front:
      en: "What is the default table size threshold for automatic broadcast joins in Spark?"
      az: "Spark-da cədvəllərin avtomatik broadcast edilməsi üçün susmaya görə ölçü həddi neçədir?"
    back:
      en: "10 MB (configured via `spark.sql.autoBroadcastJoinThreshold`)."
      az: "10 MB (`spark.sql.autoBroadcastJoinThreshold` konfiqurasiyası ilə təyin olunur)."
  - front:
      en: "Why does broadcasting an excessively large table crash the Spark Driver?"
      az: "Həddən artıq böyük cədvəli broadcast etmək nə üçün Spark Driver-i çökdürür?"
    back:
      en: "Because the Driver must collect the entire table into its local JVM memory before broadcasting to executors."
      az: "Çünki Driver executor-lara paylamazdan əvvəl bütün cədvəli təkbaşına öz yerli JVM yaddaşına yükləməlidir."
  - front:
      en: "When does Spark use Sort-Merge Join (SMJ)?"
      az: "Spark nə vaxt Sort-Merge Join (SMJ) strategiyasından istifadə edir?"
    back:
      en: "When both joining tables are too large to fit into broadcast memory, requiring both to be shuffled and sorted by key."
      az: "Hər iki cədvəl broadcast üçün çox böyük olduqda; hər iki tərəf şəbəkədən şaffl olunur və açara görə sıralanır."
  - front:
      en: "How do you explicitly force a Broadcast Join in PySpark code?"
      az: "PySpark kodunda açıq şəkildə Broadcast Join-i necə məcbur edirsiniz?"
    back:
      en: "Using the `broadcast()` function: `df_large.join(broadcast(df_small), on='key')`."
      az: "`broadcast()` funksiyasını tətbiq edərək: `df_large.join(broadcast(df_small), on='key')`."
