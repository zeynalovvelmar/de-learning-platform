output_description:
  en: "Terminal output proving the visual difference between row_number, rank, and dense_rank on tie values, plus lag computation and Top-1 department extraction."
  az: "Eyni dəyərlərdə row_number, rank və dense_rank arasındakı fərqi, lag sütununu və hər şöbə üzrə top-1 işçinin seçilməsini göstərən terminal çıxışı."
what_it_does:
  en: "Demonstrates window partitioning, sorting, analytical ranking algorithms, previous-row value access, and the Top-N deduplication design pattern."
  az: "Pəncərə bölgüsünü, analitik dərəcələmə alqoritmlərini, əvvəlki sətrin oxunmasını və Top-N dublikat təmizlənməsi naxışını nümayiş etdirir."
real_world_use:
  en: "Deduplicating slowly changing dimension (SCD Type 1/2) records from CDC streams where only the latest updated timestamp per primary key must be retained."
  az: "CDC axınlarında dəyişən məlumatları (SCD) emal edərkən hər açar üzrə ən son zaman anına (timestamp) sahib qeydi seçib köhnə dublikatları təmizləmək üçün istifadə olunur."
common_mistakes:
  en: |
    - **Omitting `partitionBy()` on large DataFrames**: Forces all cluster data into a single partition on one executor, crashing the job with OOM.
    - **Confusing `rank()` with `dense_rank()`**: Using `rank()` when consecutive numbering is required causes subtle downstream logic bugs due to ranking gaps.
    - **Using unbounded window frames unnecessarily**: Specifying unbounded window frames for aggregates forces Spark to hold all history in executor memory.
  az: |
    - **Böyük cədvəldə `partitionBy()` yazmağı unutmaq**: Bütün klaster məlumatını tək bir partisiya və tək bir executor-a yığır və OOM çöküşünə səbəb olur.
    - **`rank()` ilə `dense_rank()`-ı səhv salmaq**: Ardıcıl sıra tələb olunan yerdə `rank()` işlətdikdə boşluqlar yaranır və hesabatları korlayır.
    - **Gərəksiz yerə sərhədsiz (unbounded) pəncərə çərçivəsi açmaq**: Yaddaşda lazımsız nəhəng tarixçə saxlayaraq RAM-ı doldurur.
interview_question:
  question:
    en: "How does Spark execute Window functions across a distributed cluster, and what catastrophe occurs if you define a window with `Window.orderBy(...)` without specifying `.partitionBy(...)`?"
    az: "Spark paylanmış klasterdə Pəncərə Funksiyalarını (Window Functions) necə icra edir və `.partitionBy(...)` yazmadan yalnız `Window.orderBy(...)` təyin etdikdə hansı fəlakət baş verir?"
  answer:
    en: |
      1. **Distributed Window Execution**:
         - When you define `Window.partitionBy("key").orderBy("val")`, Spark hashes each record by `"key"` and performs a **Shuffle Exchange**.
         - All rows sharing the same partition key land on the exact same executor. That executor locally sorts the partition rows and iterates sequentially to calculate `row_number`, running aggregates, or lead/lag values.
      2. **The Catastrophe of Omitting `partitionBy()`**:
         - If an engineer writes `Window.orderBy("val")` without `partitionBy()`, Spark can no longer parallelize the calculation across keys.
         - To perform a single global order across the entire dataset, Spark's Catalyst optimizer moves **ALL partitions across the entire multi-terabyte dataset into a SINGLE partition (Partition 0)** on a single executor node!
         - The remaining 99% of your cluster cores sit idle, and that single executor suffers massive disk spills, extreme GC pauses, and inevitably crashes with `java.lang.OutOfMemoryError: Java heap space`.
    az: |
      1. **Paylanmış İcra Mexanizmi**:
         - `Window.partitionBy("key").orderBy("val")` yazdıqda Spark sətirləri açara görə heşləyir və **Şəbəkə Shuffle-ı (Exchange)** aparır.
         - Eyni açara sahib bütün sətirlər eyni executor-a toplanır. Həmin executor sətirləri öz daxilində sıralayır və ardıcıl oxuyaraq `row_number`, `lag` və ya hərəkətli cəmləri hesablayır.
      2. **`partitionBy()` Yazılmadıqda Baş Verən Fəlakət**:
         - Əgər mühəndis `partitionBy()` yazmadan birbaşa `Window.orderBy("val")` yazarsa, Spark artıq işi açarlar üzrə paralelləşdirə bilməz.
         - Qlobal ardıcıllığı təmin etmək üçün Catalyst bütün terabaytlarla məlumatın hamısını **TƏK BİR PARTİSİYAYA (Partisiya 0)** və tək bir executor-un yaddaşına yığmağa məcbur olur!
         - Klasterdəki digər 99% nüvələr boş qalır, həmin tək executor isə nəhəng diskə boşalma (spill) və dondurucu GC-dən sonra `java.lang.OutOfMemoryError: Java heap space` ilə çökür.
  interviewer_tips:
    en: "Explain that omitting partitionBy converts a distributed cluster back into a single slow machine. Always emphasize that partitionBy is the bridge that maintains distributed parallelism."
    az: "Müsahibədə deyin ki, partitionBy yazmamaq yüzlərlə maşından ibarət klasteri tək bir zəif kompüterə çevirmək deməkdir. Mütləq 'bütün məlumatın tək partisiya 0-a yığılması və OOM olması' izahını verin."
flashcards:
  - front:
      en: "What is the difference between `row_number()` and `rank()` in PySpark?"
      az: "PySpark-da `row_number()` ilə `rank()` arasındakı fərq nədir?"
    back:
      en: "`row_number()` assigns strictly unique sequential integers; `rank()` assigns identical numbers to ties and skips subsequent numbers."
      az: "`row_number()` qəti unikal ardıcıl rəqəmlər verir; `rank()` isə bərabər dəyərlərə eyni rəqəmi verir və növbəti nömrəni ötürür."
  - front:
      en: "What is the difference between `rank()` and `dense_rank()`?"
      az: "`rank()` ilə `dense_rank()` arasındakı fərq nədir?"
    back:
      en: "`rank()` leaves gaps after ties (e.g. 1, 2, 2, 4); `dense_rank()` leaves no gaps after ties (e.g. 1, 2, 2, 3)."
      az: "`rank()` bərabər dəyərlərdən sonra boşluq buraxır (1, 2, 2, 4); `dense_rank()` isə boşluq buraxmır (1, 2, 2, 3)."
  - front:
      en: "What happens if you define a PySpark Window without `.partitionBy()`?"
      az: "PySpark-da `.partitionBy()` olmadan Pəncərə təyin etsəniz nə baş verər?"
    back:
      en: "All dataset rows are collapsed into a single partition on a single executor, destroying parallelism and causing an OOM crash."
      az: "Bütün məlumat tək bir executor-da tək bir partisiyaya yığılır, paralellik məhv olur və OOM çöküşü baş verir."
  - front:
      en: "What function accesses the previous row's value inside a Window frame?"
      az: "Pəncərə çərçivəsində əvvəlki sətrin dəyərini oxumaq üçün hansı funksiya istifadə olunur?"
    back:
      en: "The `lag(column, offset)` function."
      az: "`lag(sutun, offset)` funksiyası."
  - front:
      en: "How is `row_number() == 1` used for deduplication in data engineering?"
      az: "Data mühəndisliyində `row_number() == 1` dublikatları silmək üçün necə istifadə olunur?"
    back:
      en: "By partitioning by business key, ordering by timestamp descending, and filtering rows where `row_num == 1`."
      az: "Biznes açarına görə bölüb, tarixə görə azalan sırada düzərək `row_num == 1` olan ən son sətirləri seçməklə."
