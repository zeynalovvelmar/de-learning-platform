  After unpersist:     is_cached = False
output_description:
  en: "Terminal execution benchmark measuring the 20x latency reduction when accessing in-memory cached DataFrames vs re-evaluating raw lineage."
  az: "Keşlənmiş DataFrame-ə müraciət edərkən icra müddətinin 20 dəfə azaldığını və unpersist ilə yaddaşın azad edilməsini göstərən terminal hesabatı."
what_it_does:
  en: "Demonstrates how to strategically cache DataFrames using StorageLevel, benchmark latency improvements, and safely release memory using unpersist."
  az: "DataFrame-ləri StorageLevel ilə strateji keşləməyi, performans sürətlənməsini ölçməyi və unpersist ilə yaddaşı təhlükəsiz azad etməyi nümayiş etdirir."
real_world_use:
  en: "Essential for machine learning model training loops and data quality validation jobs where a clean Silver-layer DataFrame is consumed by 5 different downstream analytical models."
  az: "Eyni təmizlənmiş Gümüş (Silver) cədvəlin həm hesabatlara, həm maşın öyrənməsi modellərinə, həm də maliyyə cədvəllərinə ayrı-ayrı göndərildiyi kəmərlərdə istifadə olunur."
common_mistakes:
  en: |
    - **Caching every single intermediate DataFrame**: Blindly caching everything clogs the Storage memory pool, forcing Spark to evict execution memory and causing severe GC thrashing. Only cache DataFrames that are reused multiple times.
    - **Forgetting to unpersist**: Leaving cached datasets alive across a long-running streaming or multi-job session causes silent memory leaks.
    - **Caching before filtering**: Always filter dirty and unneeded data FIRST, then cache the lean, curated dataset.
  az: |
    - **Hər xırda aralıq cədvəli kor-koranə keşləmək**: Yaddaşı doldurur, Spark-ı icra yaddaşını sıxışdırmağa məcbur edir və sistemi dondurur. Yalnız ən azı 2-3 dəfə təkrar istifadə olunan cədvəllər keşlənməlidir.
    - **`unpersist()` çağırmağı unutmaq**: Uzunmüddətli tətbiqlərdə yaddaş sızmasına (memory leak) səbəb olur.
    - **Filtrləmədən əvvəl keşləmək**: Həmişə əvvəlcə süzüb təmizləyin, sonra yığcam vəziyyətdə keşə göndərin.
interview_question:
  question:
    en: "What is the difference between `cache()` and `persist()`, and how do you diagnose and resolve Driver OutOfMemory vs Executor OutOfMemory errors?"
    az: "`cache()` ilə `persist()` arasındakı fərq nədir və Driver OOM ilə Executor OOM xətalarını necə diaqnostika və həll edirsiniz?"
  answer:
    en: |
      1. **`cache()` vs `persist()`**:
         - `cache()` is simply an alias for `persist(StorageLevel.MEMORY_AND_DISK)`.
         - `persist()` accepts a `StorageLevel` parameter allowing you to explicitly choose between storage tiers (`MEMORY_ONLY`, `MEMORY_AND_DISK`, `DISK_ONLY`, `_SER` serialized, and `_2` multi-node replication).
      2. **Driver OOM (Root Causes & Solutions)**:
         - *Cause*: Calling `.collect()`, `.toPandas()`, or broadcasting a table larger than the Driver's allocated JVM heap (`spark.driver.memory`).
         - *Solution*: Eliminate `.collect()`; use `.take(10)` for inspection; write output directly to storage; increase `--driver-memory` if heavy metadata operations are required.
      3. **Executor OOM (Root Causes & Solutions)**:
         - *Cause*: Large partition sizes, high degree of data skew (one executor receives 90% of the shuffle data), or too many cores per executor sharing heap space.
         - *Solution*: Increase `spark.sql.shuffle.partitions`; salt skewed join keys; tune `spark.executor.memory` and `spark.memory.fraction`; allocate no more than 4-5 cores per executor.
    az: |
      1. **`cache()` və `persist()` Fərqi**:
         - `cache()` sadəcə `persist(StorageLevel.MEMORY_AND_DISK)` əmrinin qısa formasıdır.
         - `persist()` isə xüsusi `StorageLevel` parametrini qəbul edir və yaddaş səviyyələrini (`MEMORY_ONLY`, `MEMORY_AND_DISK`, `DISK_ONLY`, `_SER` sıxılmış, `_2` iki nüsxəli) dəqiq seçməyə imkan verir.
      2. **Driver OOM (Səbəblər və Həllər)**:
         - *Səbəb*: `.collect()`, `.toPandas()` çağırmaq və ya Driver-in yaddaşından (`spark.driver.memory`) böyük cədvəli broadcast etmək.
         - *Həlli*: `.collect()` istifadəsini dayandırın; `.take(20)` işlədin; böyük nəticəni birbaşa fayla yazın; zərurət olduqda `--driver-memory` parametrini artırın.
      3. **Executor OOM (Səbəblər və Həllər)**:
         - *Səbəb*: Çox böyük partisiya ölçüləri, məlumat əyriliyi (data skew - bütün şaffl məlumatının tək bir maşına tökülməsi) və ya bir executor-a həddən artıq çox nüvənin verilməsi.
         - *Həlli*: Partisiya sayını artırın (`spark.sql.shuffle.partitions`); əyri açarları duzlayın (salting); hər executor-a 4-5 nüvə ayırın və `--executor-memory` həcmini artırın.
  interviewer_tips:
    en: "Structure your answer into Driver vs Executor failure domains. This demonstrates architectural maturity and proves you can triage production alerts in high-stakes environments."
    az: "Cavabınızı mütləq iki yerə bölün: Driver OOM və Executor OOM. Bu, sistemin arxitekturasını dərindən bildiyinizi və real istehsalat qəzalarını həll edə biləcəyinizi sübut edir."
flashcards:
  - front:
      en: "What storage level does `df.cache()` use by default in modern Apache Spark?"
      az: "Müasir Apache Spark-da `df.cache()` susmaya görə hansı saxlama dərəcəsindən (StorageLevel) istifadə edir?"
    back:
      en: "`StorageLevel.MEMORY_AND_DISK` (stores in RAM, spills excess partitions to local disk)."
      az: "`StorageLevel.MEMORY_AND_DISK` (RAM-da saxlayır, sığmayanı yerli diskə boşaldır)."
  - front:
      en: "When should you use `df.persist(StorageLevel.MEMORY_ONLY_SER)`?"
      az: "`df.persist(StorageLevel.MEMORY_ONLY_SER)` saxlama dərəcəsini nə vaxt seçməlisiniz?"
    back:
      en: "When memory is constrained; serialized bytes take 2x to 4x less RAM at the cost of slight CPU deserialization overhead."
      az: "Yaddaş məhdud olduqda; sıxılmış baytlar 2-4 dəfə az RAM tutur, əvəzində bir qədər CPU tələb edir."
  - front:
      en: "Why is calling `.collect()` on a multi-million row DataFrame dangerous?"
      az: "Milyonlarla sətri olan DataFrame-də `.collect()` çağırmaq nə üçün təhlükəlidir?"
    back:
      en: "It brings all distributed records into the single Driver node's JVM heap, causing an instant Driver OutOfMemoryError."
      az: "Bütün paylanmış sətirləri tək bir Driver maşınının JVM yaddaşına çəkir və Driver OOM ilə çökür."
  - front:
      en: "What should you always call when a cached DataFrame is no longer needed in a pipeline?"
      az: "Kəmərdə keşlənmiş DataFrame-ə artıq ehtiyac qalmadıqda mütləq hansı əmr çağırılmalıdır?"
    back:
      en: "`df.unpersist()` to free up RAM and disk blocks in the executor storage pool."
      az: "Yaddaşı və disk bloklarını azad etmək üçün `df.unpersist()` əmri."
  - front:
      en: "What are the two major memory regions in Spark's Unified Memory pool?"
      az: "Spark-ın Vahid Yaddaş (Unified Memory) hovuzunun iki əsas bölgəsi hansıdır?"
    back:
      en: "Execution Memory (shuffles, joins, sorts) and Storage Memory (cached data, broadcast variables)."
      az: "İcra Yaddaşı (şaffl, join, sort) və Saxlama Yaddaşı (keşlənmiş məlumatlar, broadcast dəyərlər)."
