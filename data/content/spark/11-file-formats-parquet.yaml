what_it_does:
  en: "Demonstrates partitioned Parquet writes and exposes how Spark eliminates massive storage I/O using Partition Pruning and Predicate Pushdown."
  az: "Partisiyalanmış Parquet yazılışını və Spark-ın Partition Pruning və Predicate Pushdown vasitəsilə disk I/O yükünü necə sıfırladığını nümayiş etdirir."
real_world_use:
  en: "The architecture behind Modern Data Lakes (AWS S3 + Athena/EMR, Azure ADLS + Databricks, Snowflake external tables). Querying petabyte-scale telemetry in seconds for fractions of a cent."
  az: "Müasir Data Lakehouse arxitekturasının təməlidir (AWS S3 + Athena, Azure Databricks, Google BigQuery). Petabaytlarla məlumatın saniyələr içində qəpik-quruşa sorğulanmasını təmin edir."
common_mistakes:
  en: |
    - **Storing multi-gigabyte production data as CSV or JSON**: Lacks column pruning, lacks compression, and cannot perform predicate pushdown, leading to 10x higher cloud storage and compute costs.
    - **Over-partitioning by high-cardinality columns**: Running `partitionBy("user_id")` or `partitionBy("timestamp")` creates millions of tiny sub-folders with 1 KB files, crippling cloud object storage performance. Only partition by low-cardinality keys like `year`, `month`, or `region`.
    - **Applying Python functions on filter columns**: Writing `.filter(my_python_func(col("year")) == 2024)` disables Predicate Pushdown completely because Spark cannot translate opaque Python bytecode into Parquet metadata filters.
  az: |
    - **İstehsalat məlumatlarını CSV və ya JSON-da saxlamaq**: Sütun kəsilməsi yoxdur, sıxılma zəifdir və predicate pushdown işləmir. Nəticədə bulud xərcləri 10 qat artır.
    - **Yüksək kardinallıqlı sütunlara görə bölmək (Over-partitioning)**: `partitionBy("user_id")` və ya dəqiq zamana görə bölmək milyonlarla mikroskopik qovluq və 1 KB-lıq fayl yaradır və S3-ü kilitləyir. Yalnız az unikal dəyəri olan sütunlara görə bölün (`year`, `month`, `region`).
    - **Süzgəc sütununda Python funksiyası çağırmaq**: `.filter(py_funksiyam(col("il")) == 2024)` yazdıqda Predicate Pushdown tamamilə sıradan çıxır, çünki Spark qaranlıq Python kodunu Parquet fayl filtrinə çevirə bilmir.
interview_question:
  question:
    en: "Why is Apache Parquet vastly superior to CSV for analytical querying, and what is the difference between Partition Pruning and Predicate Pushdown?"
    az: "Analitik sorğular üçün Apache Parquet nə üçün CSV-dən qat-qat üstündür və Partition Pruning ilə Predicate Pushdown arasındakı fərq nədir?"
  answer:
    en: |
      1. **Why Parquet Beats CSV**:
         - **Columnar Layout (Column Pruning)**: Parquet arranges data by columns rather than rows. If a query selects 3 out of 100 columns, only those exact column byte blocks are read from storage. CSV requires parsing every delimiter across every single row.
         - **High Compression Ratios**: Homogeneous data types in a column compress with specialized encoders (Run-Length Encoding, Dictionary Encoding, Bit-Packing, Snappy), shrinking disk usage by 75% to 90%.
         - **Embedded Schema & Metadata**: Parquet is self-describing, carrying schema definitions and min/max statistics in its binary footers.
      2. **Partition Pruning vs Predicate Pushdown**:
         - **Partition Pruning (Directory Level)**: Operates at the file system folder hierarchy. If data is partitioned by `year=2024/`, queries filtering on `year = 2024` skip traversing all other year directories entirely.
         - **Predicate Pushdown (File Internal Level)**: Operates inside individual Parquet files. Spark passes the filter condition (`temp > 25.0`) to the Parquet reader. The reader inspects the min/max statistics in the footer of each 128MB Row Group; if `max_temp < 25.0`, it skips decompressing and reading that entire row group from disk.
    az: |
      1. **Parquet Niyə CSV-dən Üstündür?**:
         - **Sütunlu Format (Column Pruning)**: Məlumatları sətir-sətir deyil, sütun-sütun saxlayır. 100 sütundan 3-ü seçilirsə, yalnız həmin 3 sütunun baytları diskdən oxunur. CSV isə hər bir sətri başdan-ayağa oxumağa məcburdur.
         - **Yüksək Sıxılma**: Eyni tipli məlumatlar yan-yana olduğu üçün xüsusi alqoritmlər (Snappy, Lüğət Kodlaşdırması) faylı 75%-90% kiçildir.
         - **Daxili Metadata**: Parquet öz sxemini və min/max statistikalarını faylın daxilində (footer) saxlayır.
      2. **Partition Pruning ilə Predicate Pushdown Arasındakı Fərq**:
         - **Partition Pruning (Qovluq Səviyyəsində)**: Fayl sistemi qovluqları səviyyəsində işləyir. Məlumat `year=2024/` qovluqlarına bölünübsə, `year = 2024` sorğusu digər bütün illərin qovluqlarına heç baş çəkmir.
         - **Predicate Pushdown (Faylın Daxili Səviyyəsində)**: Parquet faylının daxilində işləyir. Spark `temp > 25.0` şərtini birbaşa Parquet fayl oxuyucusuna ötürür. Oxuyucu hər 128MB-lıq Row Group-un sonundakı min/max statistikasına baxır; əgər `max_temp < 25.0`-dirsə, həmin bütöv bloku diskdən oxumadan kənara atır.
  interviewer_tips:
    en: "Draw the clear boundary: Partition Pruning skips directory paths on storage; Predicate Pushdown skips row groups inside the file using min/max footer metadata."
    az: "Mütləq aydın sərhəd qoyun: Partition Pruning qovluqları açmır; Predicate Pushdown isə faylın daxilindəki min/max footer statistikasına baxaraq sətir qruplarını oxumadan atır."
flashcards:
  - front:
      en: "What is the primary architectural difference between CSV and Parquet file formats?"
      az: "CSV ilə Parquet fayl formatları arasındakı ən əsas arxitektur fərq nədir?"
    back:
      en: "CSV is row-oriented text; Parquet is column-oriented binary with embedded metadata and compression."
      az: "CSV sətir yönümlü mətndir; Parquet isə daxilində metadata və sıxılma olan sütun yönümlü binar formatdır."
  - front:
      en: "What is 'Column Pruning' in Apache Spark?"
      az: "Apache Spark-da 'Column Pruning' nə deməkdir?"
    back:
      en: "The optimization where Spark reads only the specific byte offsets of referenced columns from storage, ignoring unselected columns."
      az: "Spark-ın diskdən yalnız sorğuda tələb olunan sütunların baytlarını oxuyub, qalan sütunları oxumadan atması optimallaşdırmasıdır."
  - front:
      en: "How does 'Predicate Pushdown' accelerate query performance?"
      az: "'Predicate Pushdown' sorğu performansını necə sürətləndirir?"
    back:
      en: "Pushes filter conditions into Parquet readers, using min/max footer metadata to skip entire 128MB row groups without reading them."
      az: "Filtr şərtlərini fayl oxuyucusuna ötürür və min/max statistikası ilə bütöv 128MB-lıq blokları oxumadan keçir."
  - front:
      en: "What key capability does Delta Lake add on top of Apache Parquet?"
      az: "Delta Lake Apache Parquet-in üzərinə hansı əsas üstünlüyü əlavə edir?"
    back:
      en: "ACID transactions with an undo/redo transaction log (`_delta_log`), Time Travel, and schema enforcement."
      az: "ACID tranzaksiyaları (`_delta_log` tranzaksiya jurnalı ilə), Zaman Səyahəti (Time Travel) və sxem qorunması."
  - front:
      en: "Why should you never partition a dataset by high-cardinality fields like `timestamp` or `user_id`?"
      az: "Nə üçün məlumatı `timestamp` və ya `user_id` kimi yüksək kardinallıqlı sahələrə görə partisiya etmək olmaz?"
    back:
      en: "It creates millions of microscopic sub-folders with tiny files, overwhelming storage metadata and crippling query performance."
      az: "Milyonlarla xırda qovluq və mikroskopik fayl yaradır, saxlanc sistemini yükləyir və sorğuları iflic edir."
