output_description:
  en: "Terminal execution plan comparing Exchange RoundRobinPartitioning in repartition vs the lightweight local Coalesce operator."
  az: "Repartition əmrindəki Exchange şəbəkə düyünü ilə Coalesce əmrindəki yüngül lokal birləşmənin icra planı müqayisəsi."
what_it_does:
  en: "Demonstrates how to inspect, increase, and decrease Spark partitions, proving that coalesce avoids network shuffling while repartition enforces uniformity."
  az: "Spark partisiyalarını yoxlamaq, artırmaq və azaltmağın yollarını göstərir; coalesce-in şəbəkəsiz işləməsini, repartition-un isə bərabər bölməsini nümayiş etdirir."
real_world_use:
  en: "Used right before writing files to cloud storage (S3 / ADLS / GCS). Using `coalesce(10)` reduces 200 tiny files into 10 properly sized 128MB Parquet files without network shuffle costs."
  az: "Bulud anbarına (S3, ADLS) fayl yazmazdan əvvəl tətbiq olunur. `coalesce(10)` yazmaqla 200 ədəd xırda fayl əvəzinə heç bir şəbəkə şafflı olmadan 10 ədəd təmiz 128MB-lıq Parquet faylı yaradılır."
common_mistakes:
  en: |
    - **Using `coalesce()` to increase partitions**: Calling `df.coalesce(100)` when you have 10 partitions does NOTHING. Spark silently ignores it and stays at 10. You MUST use `repartition()` to increase.
    - **Over-coalescing with `coalesce(1)` on large datasets**: Causes a single executor to become the bottleneck, causing an OutOfMemoryError or killing cluster parallelism.
    - **Leaving default 200 shuffle partitions for tiny datasets**: Results in 200 microscopic 5 KB files stored in S3, creating the infamous 'Small File Problem' for query engines.
  az: |
    - **Partisiya sayını artırmaq üçün `coalesce()` istifadə etmək**: 10 partisiya olan cədvəldə `coalesce(100)` yazsanız, Spark bunu səssizcə heçə sayır və say yenə 10 qalır. Artırmaq üçün mütləq `repartition()` yazılmalıdır.
    - **Böyük cədvəldə `coalesce(1)` yazmaq**: Bütün paralelliyi öldürür və tək bir maşını yükləyərək OOM xətasına səbəb olur.
    - **Kiçik məlumatlarda susmaya görə 200 partisiya saxlamaq**: S3-də 200 ədəd cırtdan 5 KB-lıq fayl yaradır və Data Lake-də məşhur 'Kiçik Fayl Problemi' (Small File Problem) törədir.
interview_question:
  question:
    en: "What is the structural and mechanical difference between `repartition()` and `coalesce()`, and why is `coalesce(1)` dangerous for large datasets?"
    az: "`repartition()` ilə `coalesce()` arasındakı struktur və mexaniki fərq nədir və böyük məlumatlarda `coalesce(1)` yazmaq nə üçün təhlükəlidir?"
  answer:
    en: |
      1. **Structural & Mechanical Differences**:
         - **`repartition(n)`**: Performs a **Full Network Shuffle** using Round-Robin or Hash partitioning. It redistributes data uniformly across the cluster. It can both **increase** and **decrease** partition counts.
         - **`coalesce(n)`**: Avoids a full shuffle by **merging adjacent partitions** residing on the same executor/worker node. It requires **zero network transfer**. It can **only decrease** partition counts.
      2. **The Danger of `coalesce(1)`**:
         - While engineers use `coalesce(1)` to write a single output CSV/Parquet file, Spark's Catalyst optimizer pushes the coalesce operator upstream.
         - As a result, the entire computation across preceding stages is forced down into a single executor thread! The remaining 99 executors sit idle, and that single executor will likely crash with an `OutOfMemoryError` (OOM) trying to buffer gigabytes of data.
    az: |
      1. **Struktur və Mexaniki Fərqlər**:
         - **`repartition(n)`**: **Tam Şəbəkə Şafflı** həyata keçirir. Bütün sətirləri klaster boyu bərabər paylayır. Partisiya sayını həm **artıra**, həm də **azalda** bilir.
         - **`coalesce(n)`**: Eyni serverdəki qonşu partisiyaları birləşdirir və **heç bir şəbəkə şafflı yaratmır**. YALNIZ partisiya sayını **azalda** bilir (artıra bilməz).
      2. **`coalesce(1)` Niyə Təhlükəlidir?**:
         - Tərtibatçılar tək bir fayl almaq üçün tez-tez `coalesce(1)` yazırlar. Lakin Catalyst optimallaşdırıcısı bu əmri kəmərdə yuxarıya çəkir.
         - Nəticədə bütün əvvəlki mərhələlər tək bir executor daxilində tək bir nüvədə işləməyə məcbur olur! Klasterdəki digər bütün maşınlar boş qalır və həmin tək maşın gigabaytlarla məlumatı həzm edə bilməyib `OutOfMemoryError` (OOM) ilə çökür.
  interviewer_tips:
    en: "Explicitly point out that coalesce cannot increase partitions, and explain that coalesce(1) kills upstream parallelism during write operations."
    az: "Mütləq qeyd edin ki, coalesce heç vaxt partisiya sayını artıra bilməz və coalesce(1) yazıldıqda bütün klasterin paralelliyi iflic olur."
flashcards:
  - front:
      en: "Can `coalesce()` be used to increase the number of partitions in a DataFrame?"
      az: "`coalesce()` funksiyası DataFrame-in partisiya sayını artırmaq üçün istifadə edilə bilərmi?"
    back:
      en: "No. `coalesce()` can only decrease partitions. To increase partitions, you must use `repartition()`."
      az: "Xeyr. `coalesce()` yalnız partisiya sayını azalda bilər. Artırmaq üçün mütləq `repartition()` istifadə edilməlidir."
  - front:
      en: "Why is `coalesce(N)` vastly faster than `repartition(N)` when decreasing partitions?"
      az: "Partisiyaları azaldarkən `coalesce(N)` nə üçün `repartition(N)`-dən qat-qat sürətlidir?"
    back:
      en: "Because it merges adjacent partitions locally without triggering an expensive full-cluster network shuffle."
      az: "Çünki baha başa gələn şəbəkə şafflı etmədən qonşu partisiyaları yerli serverdə birləşdirir."
  - front:
      en: "What is the recommended target partition size for Spark DataFrames in memory?"
      az: "Yaddaşda Spark DataFrame partisiyaları üçün tövsiyə olunan hədəf ölçü nə qədərdir?"
    back:
      en: "Between 100 MB and 200 MB per partition (uncompressed in RAM)."
      az: "Hər partisiya üçün sıxılmamış halda 100 MB ilə 200 MB arası."
  - front:
      en: "What happens if a dataset of 50 GB is written using `df.coalesce(1)`?"
      az: "50 GB-lıq məlumat `df.coalesce(1)` ilə fayla yazılarsa nə baş verir?"
    back:
      en: "All 50 GB must be processed by a single executor, destroying cluster parallelism and risking a fatal OutOfMemoryError."
      az: "Bütün 50 GB tək bir executor tərəfindən işlənməyə məcbur olur, bütün paralellik ölür və OOM çöküşü riski yaranır."
  - front:
      en: "What is the default value of `spark.sql.shuffle.partitions` in Apache Spark?"
      az: "Apache Spark-da `spark.sql.shuffle.partitions` parametrinin susmaya görə dəyəri neçədir?"
    back:
      en: "200. It should be tuned downwards for small datasets and upwards for multi-terabyte datasets."
      az: "200. Kiçik məlumatlarda aşağı salınmalı, böyük terabaytlıq məlumatlarda isə artırılmalıdır."
