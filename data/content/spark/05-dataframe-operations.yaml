what_it_does:
  en: "Teaches standard production PySpark data cleansing idioms: filtering anomalies, conditional transformations, null coalescing, and column projection."
  az: "Production-da ən çox istifadə olunan PySpark təmizləmə qaydalarını öyrədir: anomaliyaları süzmək, şərti dəyişikliklər, NULL idarəetməsi və sütun proyeksiyası."
real_world_use:
  en: "The Bronze-to-Silver curation stage in Medallion (Lakehouse) data architecture. Raw vendor JSON/CSV feeds are parsed, validated, and normalized before writing to Delta/Parquet."
  az: "Medallion (Lakehouse) arxitekturasında Bronze-dan Silver-ə (Bürüncdən Gümüşə) təmizlənmə mərhələsidir. Xam məlumatlar yoxlanılır, təmizlənir və anbara yazılır."
common_mistakes:
  en: |
    - **Chaining 50+ `.withColumn()` calls in a loop**: Creates a massive, deeply nested Catalyst logical plan tree that causes a `java.lang.StackOverflowError`.
    - **Using Python's standard `and` / `or` / `not` instead of bitwise `&` / `|` / `~`**: In PySpark, you MUST use `(col("a") > 1) & (col("b") < 5)`. Python boolean operators do not work on distributed column expressions and raise `ValueError`.
    - **Forgetting parentheses around boolean conditions**: `col("a") > 1 & col("b") < 5` fails because bitwise `&` has higher operator precedence than `>`. Always wrap each condition in parentheses: `(col("a") > 1) & (col("b") < 5)`.
  az: |
    - **Dövr daxilində 50+ `.withColumn()` zəncirləmək**: Nəhəng daxili plan ağacı yaradır və Catalyst-in `StackOverflowError` ilə çökməsinə səbəb olur.
    - **Python-un `and` / `or` sözlərini işlətmək**: PySpark-da mütləq bitwise `&` və `|` işlədilməlidir: `(col("a") > 1) & (col("b") < 5)`. Adi `and`/`or` xəta törədir.
    - **Şərtləri mötərizəyə almamaq**: `col("a") > 1 & col("b") < 5` xəta verir, çünki `&` işarəsi müqayisədən daha yüksək prioritetə malikdir. Hər bir şərt mütləq mötərizəyə alınmalıdır: `(...) & (...)`.
interview_question:
  question:
    en: "Why is repeatedly calling `.withColumn()` in a Python loop considered a severe anti-pattern in PySpark, and what is the performant alternative?"
    az: "PySpark-da dövr daxilində təkrar-təkrar `.withColumn()` çağırmaq nə üçün təhlükəli xəta (anti-pattern) hesab olunur və bunun optimal alternativi nədir?"
  answer:
    en: |
      1. **The Catalyst StackOverflow Problem**:
         - In PySpark, DataFrames are immutable. Every single invocation of `.withColumn()` does not mutate the existing DataFrame in-place; instead, it generates a brand new DataFrame and wraps the logical plan in an additional `Project` node in the Catalyst Abstract Syntax Tree (AST).
         - If a developer loops over 100 column transformations:
           `for c in columns: df = df.withColumn(c, ...)`
           This constructs a 100-level deeply nested tree of unary project nodes. When an action is called, Catalyst attempts to optimize this recursive tree and blows the JVM call stack, throwing a fatal `java.lang.StackOverflowError`.
      2. **The High-Performance Production Solution**:
         - Execute all column projections simultaneously inside a single `.select()` call using a list comprehension:
           ```python
           new_columns = [col(c).alias(c) for c in df.columns] + [new_expr1.alias("col1"), new_expr2.alias("col2")]
           df = df.select(*new_columns)
           ```
         - This generates a single, flat `Project` node with zero recursion, executing orders of magnitude faster.
    az: |
      1. **Catalyst StackOverflow Təhlükəsi**:
         - PySpark-da DataFrame-lər dəyişməzdir (immutable). Hər bir `.withColumn()` çağırışı mövcud cədvəli yerində dəyişmir; əvəzinə tam yeni DataFrame yaradır və Catalyst-in daxili sintaksis ağacına (AST) yeni bir `Project` düyünü əlavə edir.
         - Əgər tərtibatçı 100 sütun üçün dövr yazıb hər addımda `.withColumn()` çağırarsa:
           `for c in columns: df = df.withColumn(c, ...)`
           Ağacda 100 qat iç-içə keçmiş dərin rekurziya yaranır. Sonda aksiya çağırılanda Catalyst bu nəhəng ağacı təhlil edərkən JVM yaddaşı dolur və tətbiq `java.lang.StackOverflowError` ilə çökür.
      2. **Yüksək Performanslı Production Həlli**:
         - Bütün sütunları tək bir `.select()` çağırışı içində siyahı comprehension ilə eyni anda generasiya etmək:
           ```python
           new_cols = [col(c) for c in df.columns] + [hesablanan_ifade.alias("yeni_ad")]
           df = df.select(*new_cols)
           ```
         - Bu, ağacda cəmi TƏK BİR yastı `Project` düyünü yaradır və heç bir yaddaş/rekurziya problemi törətmir.
  interviewer_tips:
    en: "Top candidates always highlight 'Catalyst Analyzer StackOverflowError' due to nested Project nodes and demonstrate single-pass `.select(*projections)` as the senior remedy."
    az: "Müsahibədə dərhal 'Catalyst analizatorunda iç-içə Project düyünlərinin StackOverflowError yaratması'nı və həll yolu kimi tək bir `.select(*projections)` istifadəsini vurğulayın."
flashcards:
  - front:
      en: "Why must you use `&` and `|` instead of Python's `and` and `or` when filtering PySpark DataFrames?"
      az: "PySpark DataFrame-lərini süzərkən nə üçün `and`/`or` əvəzinə `&` və `|` işlədilməlidir?"
    back:
      en: "PySpark overrides bitwise operators `&` and `|` to build distributed column expressions; Python's `and`/`or` evaluate boolean truth values."
      az: "PySpark paylanmış sütun ifadələri qurmaq üçün `&` və `|` operatorlarını istifadə edir; Python-un `and`/`or` sözləri isə lokal məntiqi qiymətləndirir."
  - front:
      en: "Why must every condition in a PySpark boolean filter be wrapped in parentheses: `(col('a') > 1) & (col('b') < 5)`?"
      az: "Nə üçün PySpark-da hər bir şərt mütləq mötərizəyə alınmalıdır: `(col('a') > 1) & (col('b') < 5)`?"
    back:
      en: "In Python, the bitwise `&` operator has higher precedence than comparison operators like `>` and `<`."
      az: "Python-da `&` bit operatoru `>` və `<` müqayisələrindən daha yüksək icra prioritetinə malikdir."
  - front:
      en: "What does the PySpark `lit()` function do?"
      az: "PySpark-da `lit()` funksiyası nə işə yarayır?"
    back:
      en: "Wraps a literal Python scalar value (e.g. `lit(100)`, `lit('AZ')`) into a PySpark Column object."
      az: "Sadə Python dəyərini (məs. `lit(100)` və ya `lit('AZ')`) PySpark-ın Sütun (Column) obyektinə çevirir."
  - front:
      en: "What happens if you run a loop with 100 chained `.withColumn()` operations?"
      az: "100 ədəd ardıcıl `.withColumn()` olan dövr işlətdikdə nə baş verir?"
    back:
      en: "Catalyst builds a 100-level nested AST project tree that crashes the JVM with `java.lang.StackOverflowError`."
      az: "Catalyst daxildə 100 mərtəbəli iç-içə ağac qurur və JVM `java.lang.StackOverflowError` ilə çökür."
  - front:
      en: "What is the difference between `.drop()` and `.select()` in PySpark?"
      az: "PySpark-da `.drop()` ilə `.select()` arasındakı fərq nədir?"
    back:
      en: "`.drop()` removes specified columns keeping the rest; `.select()` explicitly projects only the specified columns discarding the rest."
      az: "`.drop()` qeyd olunan sütunları silib qalanları saxlayır; `.select()` isə yalnız göstərilən sütunları götürür, qalanlarını atır."
