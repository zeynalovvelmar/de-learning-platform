output_description:
  en: "Terminal output proving that transformations build instantly in 0.8ms, showing Catalyst's combined physical filter plan, and measuring the real execution time during the .count() action."
  az: "Transformasiyaların 0.8 millisaniyədə qurulduğunu, Catalyst-in filtrləri birləşdirməsini və yalnız .count() aksiyası zamanı real hesablamanın getdiyini göstərən terminal çıxışı."
what_it_does:
  en: "Demonstrates the distinct two-phase lifecycle of PySpark code: lazy DAG graph construction versus eager Action execution with query plan inspection."
  az: "PySpark kodunun iki mərhələli həyat dövrünü nümayiş etdirir: lazy DAG qrafının qurulması və fəal Aksiya çağırışı ilə icra planının təhlili."
real_world_use:
  en: "Allows data engineers to modularize complex multi-step ETL pipelines into clean, readable functions without suffering performance penalties, because Catalyst compiles the whole chain into a single optimized pass."
  az: "Mürəkkəb ETL pipeline-larını təmiz və oxunaqlı funksiyalara bölməyə imkan verir; çünki nə qədər çox transformasiya yazsanız da, Catalyst hamısını birləşdirib tək bir sürətli addımda icra edir."
common_mistakes:
  en: |
    - **Calling `.count()` or `.show()` repeatedly inside a loop**: Each action triggers the entire upstream DAG pipeline from scratch! If you have a loop running 10 times with a `.count()`, Spark reads and re-computes the raw data 10 times.
    - **Assuming code has executed when creating a DataFrame**: If you write `df.filter(...).write.parquet(...)`, the work only happens on the `.write` line.
    - **Using actions for simple debugging in production**: Sprinkling `df.show()` or `print(df.count())` inside production DAGs slows pipelines down massively.
  az: |
    - **Dövr daxilində təkrar-təkrar `.count()` və ya `.show()` çağırmaq**: Hər bir aksiya bütün əvvəlki pipeline-ı ən başdan təkrar icra edir! 10 dəfə `.count()` çağırsanız, Spark 10 dəfə bütün faylı sıfırdan oxuyub hesablayacaq.
    - **DataFrame yaradılan kimi məlumatın emal olunduğunu düşünmək**: İş yalnız aksiya (`.write`, `.show`) çağırılanda başlayır.
    - **Production kodunun arasına yoxlama üçün `df.show()` qoymaq**: Airflow pipeline-larının arasına `df.show()` qoymaq icra müddətini əsassız yerə dəfələrlə uzadır.
interview_question:
  question:
    en: "What is the difference between a Transformation and an Action in Spark, and what are the tangible benefits of Lazy Evaluation?"
    az: "Spark-da Transformasiya ilə Aksiya arasındakı fərq nədir və Lazy Evaluation-ın (Tənbəl Qiymətləndirmənin) təmin etdiyi real üstünlüklər nələrdir?"
  answer:
    en: |
      1. **Fundamental Difference**:
         - **Transformations** (`filter`, `select`, `groupBy`, `join`) are declarative operations that transform one RDD/DataFrame into another. They are **lazy** and execute 0 tasks until an action is called.
         - **Actions** (`count`, `show`, `collect`, `write`) trigger computation across the cluster, execute the compiled DAG, and return a scalar value or persist to disk.
      2. **The 3 Major Benefits of Lazy Evaluation**:
         - **Holistic Query Optimization**: Because Spark sees the full recipe before executing, the Catalyst optimizer can re-order operations, combine filters (Filter Fusion), push down filters to Parquet files (Predicate Pushdown), and eliminate unused columns (Column Pruning).
         - **Reduced Memory & I/O Overhead**: Prevents creating wasteful temporary intermediate tables in memory or on disk between steps.
         - **Fault Tolerance (Lineage Graph)**: If a worker node crashes mid-job, Spark doesn't have to restart from scratch; it inspects the DAG lineage and re-computes only the lost partition.
    az: |
      1. **Əsas Fərq**:
         - **Transformasiyalar** (`filter`, `select`, `groupBy`, `join`): Bir DataFrame-dən digərini yaradan əmrlərdir. **Lazy-dir (Tənbəldir)** və aksiya çağırılana qədər heç bir hesablama aparmır.
         - **Aksiyalar** (`count`, `show`, `collect`, `write`): Bütün DAG qrafını işə salır, tapşırıqları klasterdə icra edir və ya nəticəni qaytarır, ya da diskə yazır.
      2. **Lazy Evaluation-ın 3 Əsas Üstünlüyü**:
         - **Qlobal Sorğu Optimallaşdırması**: Spark bütün reseptə icradan əvvəl bütöv baxdığı üçün Catalyst filtrləri birləşdirir (Filter Fusion), lazımsız sətirləri fayldan oxumadan kəsir (Predicate Pushdown) və istifadə olunmayan sütunları atır (Column Pruning).
         - **Yaddaş və I/O Qənaəti**: Hər xırda addım üçün yaddaşda və ya diskdə aralıq cədvəllər yaratmır, məlumatı birbaşa axınla (pipelining) emal edir.
         - **Xətalara qarşı Yüksək Dözümlülük (Lineage)**: İcra zamanı bir maşın sıradan çıxarsa, bütün pipeline-ı təzədən başlatmağa ehtiyac qalmır; DAG lineage sayəsində yalnız həmin itirilmiş xırda partisiya yenidən hesablanır.
  interviewer_tips:
    en: "Always list the specific optimization techniques enabled by lazy evaluation: 'Predicate Pushdown', 'Column Pruning', and 'DAG fault-tolerant Lineage recovery'."
    az: "Müsahibədə sadəcə 'gec hesablayır' deməyin; mütləq Catalyst-in 'Predicate Pushdown', 'Column Pruning' optimallaşdırmalarını və 'DAG Lineage bərpası'nı sadalayın."
flashcards:
  - front:
      en: "What is a Transformation in Apache Spark?"
      az: "Apache Spark-da Transformasiya nədir?"
    back:
      en: "A lazy operation (e.g. `filter`, `select`) that creates a new DataFrame and records an instruction in the DAG without computing rows."
      az: "Yeni DataFrame yaradan və heç bir sətir hesablamadan DAG qrafına yeni addım əlavə edən lazy (tənbəl) əməliyyatdır."
  - front:
      en: "What is an Action in Apache Spark?"
      az: "Apache Spark-da Aksiya nədir?"
    back:
      en: "An eager operation (e.g. `count`, `show`, `write`) that triggers the execution of the entire DAG pipeline across the cluster."
      az: "Bütün DAG qrafının klasterdə icrasını başladan və nəticə qaytaran və ya diskə yazan fəal (eager) əməliyyatdır."
  - front:
      en: "What does DAG stand for and what does it represent in Spark?"
      az: "DAG nə deməkdir və Spark-da nəyi təmsil edir?"
    back:
      en: "Directed Acyclic Graph. A dependency graph representing the precise chain of transformation stages required to produce the final output."
      az: "Birtərəfli Dövrsüz Qraf (Directed Acyclic Graph). Son nəticəni almaq üçün lazım olan addımlar və mərhələlərin asılılıq xəritəsidir."
  - front:
      en: "How does Lazy Evaluation enable Predicate Pushdown?"
      az: "Lazy Evaluation (Tənbəl Qiymətləndirmə) Predicate Pushdown-a necə imkan yaradır?"
    back:
      en: "Because Spark plans before executing, it moves filter conditions directly down to the file scan stage to skip reading unneeded row groups."
      az: "İcradan əvvəl bütün planı gördüyü üçün süzgəcləri birbaşa fayl oxunması mərhələsinə endirərək lazımsız blokların oxunmasının qarşısını alır."
  - front:
      en: "Why should you never call `.count()` inside a loop in a production PySpark job?"
      az: "Nə üçün production PySpark kodunda dövr daxilində `.count()` çağırmaq olmaz?"
    back:
      en: "Because `.count()` is an action that forces the entire upstream DAG to re-compute from source on every iteration."
      az: "Çünki `.count()` bir aksiyadır və hər dövrdə bütün əvvəlki pipeline-ı ən başdan təkrar hesablamağa məcbur edir."
