output_description:
  en: "Full Catalyst Optimizer transition stages demonstrating parsed tree resolution, logical filter optimization, and the final physical plan with Tungsten Whole-Stage CodeGen markers."
  az: "Catalyst optimallaşdırıcısının bütün keçid mərhələlərini, məntiqi süzgəc optimallaşdırmasını və fiziki plandakı Tungsten kod generatoru ulduzlarını göstərən terminal çıxışı."
what_it_does:
  en: "Walks through the entire 4-phase Catalyst engine lifecycle, proving how PySpark and Spark SQL queries compile down to identical, highly optimized physical machine bytecode."
  az: "Catalyst mühərrikinin bütün 4 mərhələli həyat dövrünü nümayiş etdirir və PySpark ilə Spark SQL-in tam eyni fiziki maşın koduna çevrildiyini sübut edir."
real_world_use:
  en: "The primary tool used by senior data engineers during performance tuning. Inspecting `.explain()` reveals whether a join is using broadcast, whether filters are pushed to Parquet, and where expensive shuffles occur."
  az: "Senior data mühəndislərinin performans sazlama zamanı istifadə etdiyi ən əsas silahdır. `.explain()` sorğunun broadcast istifadə etdiyini, süzgəclərin diskə endiyini və şafflın harada olduğunu anında göstərir."
common_mistakes:
  en: |
    - **Assuming PySpark DataFrame API is faster than Spark SQL**: In Spark, both APIs compile down to the exact same Catalyst AST and generate identical physical bytecode. Write whichever is more readable!
    - **Using Python User-Defined Functions (UDFs) without need**: Standard Python UDFs break Whole-Stage Code Generation (Tungsten) because data must be serialized out of the JVM into a Python subprocess worker. Always prefer built-in Spark SQL functions or Pandas Vectorized UDFs (Arrow).
    - **Ignoring the asterisks in the physical plan**: The asterisk `*(1)` indicates Whole-Stage Codegen. If an operation lacks an asterisk, it is running in slow interpreted mode.
  az: |
    - **PySpark-ın Spark SQL-dən daha sürətli olduğunu zənn etmək**: Spark-da hər iki sintaksis Catalyst tərəfindən tam eyni daxili plana salınır və eyni sürətlə işləyir. Hansı daha oxunaqlıdırsa, onu yazın!
    - **Zərurət olmadan adi Python UDF (User Defined Function) yazmaq**: Adi Python UDF-ləri Tungsten optimallaşdırmasını məhv edir, çünki məlumat JVM-dən çıxıb Python prosesinə getməyə məcbur olur. Həmişə daxili Spark funksiyalarını və ya Pandas UDF (Arrow) istifadə edin.
    - **Plandakı ulduz işarələrinə fikir verməmək**: `*(1)` ulduz işarəsi Whole-Stage Codegen deməkdir. Ulduz olmayan addımlar yavaş interpretasiya rejimində işləyir.
interview_question:
  question:
    en: "What are the core phases of the Spark Catalyst Optimizer, what is Whole-Stage Code Generation (Project Tungsten), and why do Python UDFs severely degrade performance?"
    az: "Spark Catalyst Optimizer-in əsas mərhələləri hansılardır, Bütöv Mərhələli Kod Generasiyası (Project Tungsten) nədir və adi Python UDF-ləri nə üçün performansı kəskin şəkildə aşağı salır?"
  answer:
    en: |
      1. **The 4 Catalyst Optimizer Phases**:
         - **1. Analysis**: Resolves table and column identifiers against the Catalog/Metastore.
         - **2. Logical Optimization**: Applies rule-based heuristics (Filter Pushdown, Column Pruning, Boolean Simplification, Subquery Flattening).
         - **3. Physical Planning**: Generates candidate physical plans and selects the cheapest plan using cost estimates (e.g. Broadcast Hash Join vs Sort-Merge Join).
         - **4. Code Generation**: Compiles the physical plan into Java bytecode.
      2. **Whole-Stage Code Generation (Project Tungsten)**:
         - Eliminates traditional Volcano iterator model overhead (calling `.next()` for every row through virtual function dispatches).
         - Fuses entire transformation pipelines into a single tight loop that runs directly in CPU L1/L2 registers, operating at bare-metal C++ speed. Marked as `*(1)` in `.explain()`.
      3. **Why Python UDFs Degrade Performance**:
         - Standard `@udf` functions cannot be inspected or optimized by Catalyst.
         - For every single record, Spark must serialize the JVM memory object into bytes, pass it across an IPC socket to a Python worker subprocess, run the Python function, serialize the result, and pass it back to the JVM. This causes a massive serialization bottleneck and completely disables Tungsten Whole-Stage CodeGen!
    az: |
      1. **Catalyst-in 4 Mərhələsi**:
         - **1. Analiz**: Cədvəl və sütun adlarını Metastore kataloqu ilə tutuşdurub dəqiqləşdirir.
         - **2. Məntiqi Optimallaşdırma**: Qayda əsaslı heuristikaları tətbiq edir (Filter Pushdown, Column Pruning, Məntiqi Sadələşdirmə).
         - **3. Fiziki Planlama**: Xərc Əsaslı Model (CBM) ilə mümkün fiziki icra yollarını ölçür və ən ucuzunu seçir (məs. BHJ yoxsa SMJ).
         - **4. Kod Generasiyası**: Fiziki planı icra üçün xam Java baytkoduna çevirir.
      2. **Whole-Stage Code Generation (Project Tungsten)**:
         - Ənənəvi Volcano iterator modelinin (hər sətir üçün tək-tək `.next()` çağırmaq) əlavə xərcini aradan qaldırır.
         - Bütün mərhələni prosessorun (CPU) L1/L2 keş registrlərində işləyən tək bir sıx dövrə çevirir və C++ sürətində işləyir. Planda `*(1)` kimi işarələnir.
      3. **Adi Python UDF-ləri Niyə Performansı Korlayır?**:
         - Catalyst Python funksiyasının içinə baxa və optimallaşdıra bilmir.
         - Hər bir sətir üçün Spark məlumatı JVM-dən baytlara çevirib (serializasiya), daxili şəbəkə ilə Python prosesinə ötürməli, orada hesablama aparıb təzədən JVM-ə qaytarmalıdır. Bu nəhəng gecikmə yaradır və Tungsten bütöv kod generasiyasını tamamilə sıradan çıxarır!
  interviewer_tips:
    en: "Explain that PySpark and Spark SQL have zero performance difference because both compile to the same Catalyst plan. Mention the IPC socket serialization cost of Python UDFs and recommend PySpark built-in functions or Pandas Vectorized UDFs (PyArrow) instead."
    az: "Mütləq qeyd edin ki, PySpark ilə Spark SQL arasında performans fərqi SIFIRDIR, çünki ikisi də eyni Catalyst planına çevrilir. Python UDF-lərinin IPC serializasiya ziyanını və alternativ kimi PyArrow Pandas UDF-lərini tövsiyə edin."
flashcards:
  - front:
      en: "Is there a performance difference between writing queries in PySpark DataFrame API versus Spark SQL?"
      az: "Sorğunu PySpark DataFrame API ilə yazmaqla Spark SQL ilə yazmaq arasında performans fərqi varmı?"
    back:
      en: "No. Both APIs compile down into the exact same Catalyst Abstract Syntax Tree and generate identical physical bytecode."
      az: "Xeyr. Hər iki sintaksis Catalyst tərəfindən tam eyni sintaksis ağacına salınır və eyni fiziki baytkoda çevrilir."
  - front:
      en: "What does an asterisk `*(1)` before an operator in a Spark `.explain()` plan signify?"
      az: "Spark `.explain()` planında operatorun qarşısındakı ulduz `*(1)` işarəsi nəyi bildirir?"
    back:
      en: "It indicates that Whole-Stage Code Generation (Project Tungsten) is active, compiling operations into a tight CPU register loop."
      az: "Whole-Stage Code Generation (Tungsten) mexanizminin aktiv olduğunu və kodun CPU registrlərində sürətlə işlədiyini bildirir."
  - front:
      en: "What are the 4 main stages of the Spark Catalyst Optimizer?"
      az: "Spark Catalyst Optimizer-in 4 əsas mərhələsi hansılardır?"
    back:
      en: "1. Analysis, 2. Logical Optimization, 3. Physical Planning, 4. Code Generation."
      az: "1. Analiz, 2. Məntiqi Optimallaşdırma, 3. Fiziki Planlama, 4. Kod Generasiyası."
  - front:
      en: "Why do standard Python UDFs (`@udf`) cause a performance bottleneck in PySpark?"
      az: "Standart Python UDF-ləri (`@udf`) PySpark-da nə üçün ciddi performans darboğazı yaradır?"
    back:
      en: "They require expensive data serialization between the JVM and Python worker subprocesses and disable Whole-Stage CodeGen."
      az: "JVM ilə Python prosesləri arasında ağır serializasiya tələb edir və Tungsten Whole-Stage CodeGen-i söndürür."
  - front:
      en: "What is the high-performance alternative to standard Python UDFs in PySpark?"
      az: "PySpark-da standart Python UDF-lərinə yüksək performanslı alternativ nədir?"
    back:
      en: "Native PySpark SQL functions, or Vectorized Pandas UDFs powered by Apache Arrow."
      az: "Daxili PySpark SQL funksiyaları və ya Apache Arrow ilə işləyən Vektorlaşdırılmış Pandas UDF-ləri."
