output_description:
  en: "Terminal output generated by PySpark showing the distributed tabular DataFrame grid and the strongly typed schema tree."
  az: "PySpark tərəfindən ekrana çıxarılan paylanmış cədvəl formatı və tipləşdirilmiş sxem iyerarxiyası."
what_it_does:
  en: "Demonstrates how Spark initializes a cluster connection via SparkSession, establishes strongly typed schemas, and loads structured data into distributed memory."
  az: "Spark-ın SparkSession vasitəsilə klasterlə əlaqə qurmasını, dəqiq sxem təyin etməsini və strukturlaşdırılmış məlumatı paylanmış yaddaşa yükləməsini nümayiş etdirir."
real_world_use:
  en: "The foundation of all production PySpark jobs in Databricks, AWS EMR, or Google Cloud Dataproc. Every ETL ingestion pipeline starts with SparkSession initialization and schema loading."
  az: "Databricks, AWS EMR və ya Google Cloud Dataproc platformalarında işləyən bütün istehsalat PySpark kodlarının təməlidir. Hər bir ETL kəməri SparkSession başladılması ilə start götürür."
common_mistakes:
  en: |
    - **Using `inferSchema=True` on multi-gigabyte files**: Forces Spark to scan the entire raw dataset twice (once just to guess column types, then again to load data), doubling ingestion time.
    - **Creating multiple SparkSessions in one application**: Redundant and wastes JVM driver resources. Always reuse `SparkSession.builder.getOrCreate()`.
    - **Calling `.collect()` on large DataFrames**: Pulls all terabytes of data from all executors into the single Driver machine's memory, instantly causing an OutOfMemory (OOM) crash.
  az: |
    - **Böyük fayllarda `inferSchema=True` istifadə etmək**: Spark-ı bütün məlumatı iki dəfə oxumağa məcbur edir (biri tipləri təxmin etmək, ikincisi yükləmək üçün) və icra vaxtını ikiqat uzadır.
    - **Eyni proqramda bir neçə SparkSession yaratmaq**: Resursları israf edir. Həmişə mövcud sessiyanı götürən `.getOrCreate()` istifadə edilməlidir.
    - **Böyük cədvəldə `.collect()` çağırmaq**: Bütün klasterdəki terabaytlarla məlumatı tək bir Driver kompüterinin yaddaşına çəkir və dərhal OOM (Out Of Memory) çöküşü törədir.
interview_question:
  question:
    en: "Why is Apache Spark significantly faster than Hadoop MapReduce, and under what circumstances does Spark still spill data to disk?"
    az: "Apache Spark nə üçün Hadoop MapReduce-dan qat-qat sürətlidir və hansı vəziyyətlərdə Spark da məlumatları diskə yazmağa məcbur olur?"
  answer:
    en: |
      1. **In-Memory Pipelining vs Disk Spilling**: Hadoop MapReduce enforces a strict two-stage cycle (Map followed by Reduce), writing all intermediate state to HDFS disks between stages. In contrast, Spark constructs a Directed Acyclic Graph (DAG) and executes multi-step transformations entirely inside distributed RAM, minimizing disk I/O latency.
      2. **When Spark Still Touches Disk**:
         - **Shuffle Operations**: When data must be repartitioned across executors (e.g. wide joins, `groupByKey`, `reduceByKey`), Spark writes shuffle spill files to local executor scratch disks to prevent network deadlocks.
         - **Memory Pressure (Spill-to-Disk)**: When partition sizes exceed the executor's allocated execution memory (`spark.memory.fraction`), Spark gracefully spills the overflow partitions to disk to prevent an immediate JVM OutOfMemoryError.
         - **Explicit Persistence**: When developers configure caching with storage levels like `MEMORY_AND_DISK`.
    az: |
      1. **RAM-da Boru Xətti vs Diskə Yazılma**: Hadoop MapReduce hər addımdan (Map və Reduce) sonra bütün aralıq məlumatları HDFS disklərinə yazmağa məcburdur. Spark isə Birtərəfli Dövrsüz Qraf (DAG) qurur və mərhələləri disklərə müraciət etmədən birbaşa paylanmış RAM daxilində konveyer kimi icra edir.
      2. **Spark-ın Diskə Yazmağa Məcbur Olduğu Hallar**:
         - **Şəbəkə Şafflı (Shuffle)**: Məlumatlar executor-lar arasında yenidən paylananda (məsələn, böyük `join` və ya `groupBy`), Spark aralıq şaffl fayllarını executor-un yerli diskinə yazır.
         - **Yaddaş Çatışmazlığı (Memory Spill)**: Bir partisiya executor-a ayrılmış RAM yaddaşından böyük olduqda, prosesin çökməməsi (OOM olmaması) üçün Spark artıq qalan hissəni avtomatik diskə boşaldır (spill to disk).
         - **Açıq Keşləmə (Persistence)**: Tərtibatçı `MEMORY_AND_DISK` kimi xüsusi saxlama dərəcəsi seçdikdə.
  interviewer_tips:
    en: "Mentioning that Spark uses RAM is standard. To impress the interviewer, explicitly mention 'DAG execution pipeline' and the two exact scenarios where Spark writes to disk: 'Shuffle persistence' and 'Memory Spill-to-Disk'."
    az: "Spark-ın RAM istifadə etdiyini demək sıravi cavabdır. Senior təəssüratı yaratmaq üçün mütləq 'DAG boru kəməri' və Spark-ın diskə yazdığı iki dəqiq halı qeyd edin: 'Şaffl zamanı aralıq yazılma' və 'Yaddaş dolduqda diskə boşalma (Memory Spill)'."
flashcards:
  - front:
      en: "What is the primary architectural difference between Hadoop MapReduce and Apache Spark?"
      az: "Hadoop MapReduce ilə Apache Spark arasındakı ən əsas arxitektur fərq nədir?"
    back:
      en: "MapReduce writes intermediate results to disk after every step; Spark executes transformations in distributed RAM memory."
      az: "MapReduce hər addımdan sonra aralıq nəticələri diskə yazır; Spark isə transformasiyaları paylanmış RAM yaddaşında icra edir."
  - front:
      en: "What is the entry point for programming in modern Spark (Spark 2.0+)?"
      az: "Müasir Spark-da (Spark 2.0+) proqramlaşdırma üçün əsas vahid giriş nöqtəsi nədir?"
    back:
      en: "The `SparkSession` class (instantiated with `SparkSession.builder...getOrCreate()`)."
      az: "`SparkSession` sinfi (`SparkSession.builder...getOrCreate()` vasitəsilə başladılır)."
  - front:
      en: "Why is `inferSchema=True` an antipattern in production data pipelines?"
      az: "İstehsalat data kəmərlərində `inferSchema=True` niyə səhv (antipattern) hesab edilir?"
    back:
      en: "It scans the entire dataset an extra time to infer data types, doubling ingestion latency on large files."
      az: "Məlumat tiplərini tapmaq üçün bütün faylı əlavə bir dəfə oxuyur və böyük fayllarda emal vaxtını ikiqat uzadır."
  - front:
      en: "What dangerous error occurs if you call `.collect()` on a multi-terabyte DataFrame?"
      az: "Çox terabaytlıq bir DataFrame-də `.collect()` çağırıldıqda hansı təhlükəli xəta baş verir?"
    back:
      en: "Driver OutOfMemoryError (OOM) because all distributed data is pulled into the single Driver node's RAM."
      az: "Driver OutOfMemoryError (OOM) çöküşü; çünki bütün paylanmış məlumat tək bir Driver maşınının RAM-ına yüklənir."
  - front:
      en: "What does 'Spill-to-Disk' mean in Apache Spark?"
      az: "Apache Spark-da 'Spill-to-Disk' nə deməkdir?"
    back:
      en: "When partition data exceeds allocated executor RAM, Spark writes the excess to local disk to avoid crashing with OOM."
      az: "Partisiya executor-un RAM yaddaşına sığmadıqda, Spark prosesin çökməməsi üçün artıq məlumatı müvəqqəti diskə yazır."
