what_it_does:
  en: "Exposes Spark's distributed runtime configuration, showing how the Driver coordinates core allocation and registers with the cluster manager."
  az: "Spark-ın paylanmış iş mühiti konfiqurasiyasını aşkar edir və Driver-in nüvə yuvalarını necə əlaqələndirdiyini nümayiş etdirir."
real_world_use:
  en: "Tuning `spark-submit` memory and core flags (`--executor-memory 16G --executor-cores 4 --num-executors 20`) to eliminate cluster resource contention and maximize pipeline throughput."
  az: "Airflow və ya Databricks kəmərlərində `spark-submit` parametrlərini (`--executor-memory`, `--num-executors`) düzgün təyin edərək resurs xərclərini minimuma endirmək və sürəti artırmaq."
common_mistakes:
  en: |
    - **Allocating too many cores per executor (e.g. `--executor-cores 16`)**: Causes severe JVM garbage collection (GC) pauses because huge heaps take seconds to clean. Best practice is 4 to 5 cores per executor.
    - **Allocating 1 core per executor**: Loses in-process JVM multithreading benefits and floods the cluster manager with hundreds of small container requests.
    - **Running long production jobs in Client Mode**: Any laptop sleep, VPN disconnect, or network blip aborts the multi-hour batch job.
  az: |
    - **Bir executor-a həddən artıq çox nüvə vermək (məs. 16 core)**: Nəhəng JVM yaddaşı səbəbindən Zibil Təmizləmə (Garbage Collection - GC) dondurmalarına səbəb olur. Ən ideal qızıl qayda hər executor-a 4-5 nüvə verməkdir.
    - **Hər executor-a cəmi 1 nüvə vermək**: Çoxlu kiçik konteyner yaradaraq klaster menecerini həddindən artıq yükləyir və ortaq yaddaş üstünlüyünü itirir.
    - **İstehsalat işlərini Client Mode-da işlətmək**: Şəbəkənin 1 saniyəlik kəsilməsi və ya kompüterin yuxuya getməsi saatlarla davam edən kəməri yarımçıq məhv edir.
interview_question:
  question:
    en: "What is the difference between Driver and Executor, and what happens to the Spark job if either one crashes?"
    az: "Driver ilə Executor arasındakı fərq nədir və onlardan biri sıradan çıxarsa (crush olarsa) Spark işində nə baş verər?"
  answer:
    en: |
      1. **Driver vs Executor Roles**:
         - **Driver**: The master controller. Maintains SparkSession, creates execution plans (DAG), submits tasks to executors, and tracks status. Does not process data partitions directly.
         - **Executor**: Worker agents residing on worker nodes. Executes tasks on partitions of data assigned by the driver and stores cached RDDs/DataFrames in its local RAM.
      2. **Failure Handling (Fault Tolerance)**:
         - **If an Executor dies**: Spark is fully resilient! The Driver detects executor failure via heartbeat timeout. It requests a new executor container from the Cluster Manager, reads RDD lineage from the DAG, and automatically reschedules the lost tasks on the new executor. The overall job survives without failing!
         - **If the Driver dies**: The job terminates immediately with failure, because the entire execution DAG, metadata, and task coordination state reside only in the Driver's memory. In cluster mode, the cluster manager can restart the driver from scratch if `--supervise` or restart policy is configured.
    az: |
      1. **Rollar Arasındakı Fərq**:
         - **Driver**: Baş komandirdir. SparkSession saxlayır, DAG planı qurur, tapşırıqları executor-lara paylayır və nəticələri izləyir. Cədvəllərin sətirlərini birbaşa emal etmir.
         - **Executor**: Fəhlə agentlərdir. Driver-in göndərdiyi tapşırıqları verilənlərin müvafiq partisiya sətirləri üzərində icra edir və keşlənmiş məlumatları öz RAM-ında saxlayır.
      2. **Xəta Baş Verdikdə Nə Olur? (Fault Tolerance)**:
         - **Executor ölərsə**: Spark tam dözümlüdür! Driver nəbzin (heartbeat) kəsildiyini görür, Klaster Menecerindən təzə executor istəyir və DAG qrafındakı nəsil şəcərəsi (lineage) sayəsində itirilmiş tapşırıqları yenidən hesablayır. Kəmər ÇÖKMÜR və davam edir!
         - **Driver ölərsə**: Bütün iş dərhal ÇÖKÜR! Çünki bütün DAG planı, tapşırıqların cari vəziyyəti və koordinasiya mərkəzi yalnız Driver-in yaddaşında yaşayır. Klaster rejimində yalnız xüsusi avtomatik yenidən başlatma konfiqurasiyası (`--supervise`) varsa, kəmər ən başdan təkrar başladılır.
  interviewer_tips:
    en: "This is a classic #1 interview question. Highlight 'Executor loss is recoverable via DAG lineage; Driver loss is fatal to the running job unless cluster supervisor restarts the entire application'."
    az: "Bu, texniki müsahibələrin #1 klassik sualıdır. Mütləq 'Executor öldükdə DAG lineage sayəsində avtomatik bərpa olunur; Driver öldükdə isə beyin öldüyü üçün bütün iş dərhal məhv olur' fərqini qeyd edin."
flashcards:
  - front:
      en: "What are the core responsibilities of the Spark Driver?"
      az: "Spark Driver-in əsas öhdəlikləri hansılardır?"
    back:
      en: "Maintains SparkSession, builds DAG execution plans, translates code into stages/tasks, and schedules tasks onto executors."
      az: "SparkSession-u saxlayır, DAG icra planını qurur, kodu mərhələ və tapşırıqlara bölür və işi executor-lara planlayır."
  - front:
      en: "What happens if a single Spark Executor process crashes during a job?"
      az: "İş zamanı tək bir Spark Executor prosesi qəzaya uğrayarsa nə baş verir?"
    back:
      en: "The Driver detects the heartbeat loss, provisions a replacement executor, and recalculates the lost partition tasks using lineage."
      az: "Driver nəbz itkisini aşkar edir, təzə executor tələb edir və DAG şəcərəsi sayəsində itirilmiş tapşırıqları yenidən hesablayır."
  - front:
      en: "What is the key difference between Client Mode and Cluster Mode deploy?"
      az: "Client Mode ilə Cluster Mode işə salınması arasındakı əsas fərq nədir?"
    back:
      en: "In Client Mode, Driver runs on the submission machine; in Cluster Mode, Driver runs securely inside a worker node on the cluster."
      az: "Client rejimində Driver kodu göndərən lokal kompüterdə işləyir; Cluster rejimində isə klaster daxilindəki bir worker maşında işləyir."
  - front:
      en: "Why is giving 16+ CPU cores to a single executor considered a bad practice?"
      az: "Tək bir executor-a 16+ CPU nüvəsi vermək nə üçün səhv hesab olunur?"
    back:
      en: "Huge JVM heap sizes cause excessive Garbage Collection (GC) pauses that freeze executor execution."
      az: "Nəhəng JVM yaddaşı yaradır və Zibil Təmizləyici (GC) dondurmaları executor-un işini saniyələrlə iflic edir."
  - front:
      en: "What is the recommended number of CPU cores per executor in production?"
      az: "İstehsalatda hər bir executor üçün tövsiyə olunan ən optimal CPU nüvə sayı neçədir?"
    back:
      en: "4 to 5 cores per executor (optimal balance for HDFS throughput and low GC overhead)."
      az: "Hər executor üçün 4-5 nüvə (yüksək I/O ötürücülüyü və aşağı GC gecikməsi üçün ən ideal balansdır)."
