output_description:
  en: "Terminal output proving how an initial 9,000-row skewed key was distributed evenly into 4 ~2,250 sub-buckets before calculating final totals."
  az: "9,000 sətirlik əyri açarın 4 ədəd ~2,250 sətirlik bərabər alt buferə bölündüyünü və yekun cəmin dəqiq hesablandığını göstərən terminal çıxışı."
what_it_does:
  en: "Demonstrates the two-stage Salting pattern to distribute high-cardinality or hot-key skewed workloads across all available cluster cores."
  az: "Həddən artıq böyük olan tək açarları bütün klaster nüvələrinə bərabər bölmək üçün iki mərhələli Salting (Duzlama) naxışını nümayiş etdirir."
real_world_use:
  en: "Fixing production ETL pipelines where 70% of web analytics traffic is generated by search engine crawlers (Googlebot) or where e-commerce transaction tables are dominated by a handful of mega-sellers."
  az: "Real data pipeline-larında veb loqların 70%-nin axtarış botlarına (Googlebot) aid olduğu və ya ödənişlərin böyük hissəsinin bir neçə nəhəng korporativ müştəriyə aid olduğu hallarda klasterin donmasının qarşısını almaq üçün istifadə olunur."
common_mistakes:
  en: |
    - **Salting all keys unnecessarily**: Adding salts to already uniform keys adds unnecessary shuffle and aggregation overhead. Apply salting only to the known skewed hot keys (or join conditions).
    - **Choosing too small a salt bucket**: If a key has 100 million rows, salting with `0..1` (2 buckets) still leaves 50 million rows per partition. Match salt buckets to available cluster cores.
    - **Ignoring Adaptive Query Execution (AQE)**: In Spark 3.0+, enabling `spark.sql.adaptive.skewJoin.enabled = true` allows Spark to automatically detect and split skewed join partitions at runtime!
  az: |
    - **Bütün açarları kor-koranə duzlamaq**: Onsuz da bərabər paylanmış kiçik açarları duzlamaq əlavə shuffle və vaxt itkisidir. Duzlama yalnız problemli nəhəng açarlara tətbiq edilməlidir.
    - **Duz sayını çox kiçik seçmək**: 100 milyon sətirli açarı cəmi 2 yerə bölsəniz, yenə hərəyə 50 milyon düşəcək. Duz sayını klasterin nüvələrinə uyğun seçin (məs. 16, 32).
    - **Spark 3.0+ AQE funksiyasını unutmaq**: Müasir Spark-da `spark.sql.adaptive.skewJoin.enabled = true` qoyduqda Spark birləşmələrdəki əyri açarları iş vaxtı avtomatik aşkar edib parçalaya bilir!
interview_question:
  question:
    en: "What is Data Skew in Apache Spark, how do you diagnose it in the Spark UI, and how does the Salting technique resolve it?"
    az: "Apache Spark-da Data Skew (Data Əyriliyi) nədir, Spark UI-da bunu necə aşkar edirsiniz və Duzlama (Salting) texnikası bunu necə aradan qaldırır?"
  answer:
    en: |
      1. **What is Data Skew?**:
         - Data Skew occurs when data is partitioned unevenly across the cluster based on a key (e.g., `NULL` values, dominant categories, or power users).
         - Because Spark partitions by `hash(key) % num_partitions`, all records with that dominant key land on a **single executor core**.
      2. **Diagnosis in Spark UI**:
         - In the **Stages Tab**, look at the **Task Metrics Distribution Table** (Min, 25th percentile, Median, 75th percentile, Max).
         - If the Median task runtime is **2 seconds**, but the Max task runtime is **45 minutes**, and the Max task has processed **10 GB of Shuffle Read** while other tasks processed **5 MB**, you have severe Data Skew! That long-running task is a **Straggler**.
      3. **The Salting Technique**:
         - Add a randomized integer suffix (`0 to K`) to the skewed key before the shuffle.
         - This splits the single monolithic hot-key into $K$ distinct sub-keys, distributing them across $K$ executors.
         - Perform Stage 1 partial aggregation, then strip the salt and perform a rapid Stage 2 final aggregation.
      4. **Modern Alternative (Spark 3.0+ AQE)**:
         - Enable Adaptive Query Execution (`spark.sql.adaptive.enabled = true` and `spark.sql.adaptive.skewJoin.enabled = true`). Spark monitors runtime shuffle partition sizes and automatically splits skewed partitions into smaller sub-tasks on the fly.
    az: |
      1. **Data Skew Nədir?**:
         - Məlumatların müəyyən bir açara görə (məsələn, `NULL` dəyərlər, 'Amazon' və ya aktiv istifadəçilər) klasterdə qeyri-bərabər paylanmasıdır.
         - Spark `hash(açar) % partisiya_sayı` düsturu ilə böldüyü üçün həmin nəhəng açara aid bütün sətirlər **tək bir executor nüvəsinə** toplanır.
      2. **Spark UI-da Diaqnostika**:
         - **Stages Vərəqindəki** tapşırıq statistika cədvəlinə (Min, Median, Max) baxırsınız.
         - Əgər Median (orta) tapşırıq müddəti **2 saniyə**, lakin Max (maksimum) tapşırıq müddəti **45 dəqiqədirsə**, və həmin tək tapşırıq digərləri 5 MB oxuduğu halda **10 GB Shuffle Read** edibsə, deməli sistemdə şiddətli Data Skew (data əyriliyi) var! Bu tapşırığa **Ləngiyən Tapşırıq (Straggler)** deyilir.
      3. **Duzlama (Salting) Texnikası**:
         - Əyri açarın sonuna təsadüfi rəqəm şəkilçisi (`0-dan K-ya qədər`) əlavə olunur.
         - Bu, nəhəng tək açarı $K$ sayda fərqli alt açara bölərək $K$ sayda executor-a paylayır.
         - 1-ci Mərhələdə lokal cəmlənir, sonra duz şəkilçisi silinərək 2-ci Mərhələdə sürətlə yekun cəm tapılır.
      4. **Müasir Alternativ (Spark 3.0+ AQE)**:
         - Adaptive Query Execution-u aktivləşdirmək (`spark.sql.adaptive.skewJoin.enabled = true`). Spark iş zamanı partisiya ölçülərini izləyir və əyri hissələri avtomatik xırda tapşırıqlara bölür.
  interviewer_tips:
    en: "Always mention how you spot skew in the Spark UI (Task Metrics Min vs Max duration disparity) and contrast manual Salting with Spark 3.0's automatic Adaptive Query Execution (AQE) skew join handling."
    az: "Mütləq Spark UI-da bunu necə gördüyünüzü (Task Metrics cədvəlində Median ilə Max arasındakı böyük fərq) və əl ilə Salting etməklə Spark 3.0-ın avtomatik AQE funksiyası arasındakı əlaqəni qeyd edin."
flashcards:
  - front:
      en: "What is a 'Straggler Task' in Apache Spark?"
      az: "Apache Spark-da 'Ləngiyən Tapşırıq' (Straggler Task) nədir?"
    back:
      en: "A single task in a stage that takes exponentially longer to finish than all other tasks due to data skew."
      az: "Data Skew (data əyriliyi) səbəbindən bir mərhələdəki digər tapşırıqlardan qat-qat gec başa çatan tək bir tapşırıqdır."
  - front:
      en: "How do you spot data skew in the Spark UI?"
      az: "Spark UI-da Data Skew-nu (data əyriliyini) hansı əlamətdən anlayırsınız?"
    back:
      en: "In the Stages task distribution summary, when Max duration and Max Shuffle Read are orders of magnitude higher than the Median."
      az: "Stages vərəqində Maksimum icra vaxtı və Shuffle Read həcmi Median (orta) göstəricidən dəfələrlə böyük olduqda."
  - front:
      en: "How does the Salting technique fix data skew during aggregation?"
      az: "Salting (Duzlama) texnikası aqreqasiya zamanı Data Skew-nu necə həll edir?"
    back:
      en: "Appends a random suffix (0..K) to skewed keys to distribute them across multiple executors for a 2-stage aggregation."
      az: "Əyri açarlara təsadüfi şəkilçi (0..K) əlavə edərək onları 2 mərhələli aqreqasiya üçün bir neçə executor-a paylayır."
  - front:
      en: "What feature in Spark 3.0+ automatically mitigates skewed joins at runtime?"
      az: "Spark 3.0+-da icra zamanı əyri birləşmələri avtomatik aradan qaldıran funksiya hansıdır?"
    back:
      en: "Adaptive Query Execution (AQE) with `spark.sql.adaptive.skewJoin.enabled = true`."
      az: "Adaptive Query Execution (AQE) və `spark.sql.adaptive.skewJoin.enabled = true` parametri."
  - front:
      en: "Why is a `NULL` key often the primary culprit behind data skew in data lakes?"
      az: "Data Lake-lərdə Data Skew-nun (data əyriliyinin) ən böyük səbəbi niyə tez-tez `NULL` açarlar olur?"
    back:
      en: "Because all millions of rows with `NULL` join/grouping keys hash to the exact same partition and land on a single executor."
      az: "Çünki açarı `NULL` olan milyonlarla sətir eyni heş dəyəri alır və hamısı tək bir executor-un boynuna düşür."
