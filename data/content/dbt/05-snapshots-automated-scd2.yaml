id: "05-snapshots-automated-scd2"
order: 5
level: "intermediate"
title:
  en: "dbt Snapshots: Automated Slowly Changing Dimensions (SCD Type 2)"
  az: "dbt Snapshots: Yavaş Dəyişən Ölçülərin (SCD Type 2) Avtomatlaşdırılması"
infographic:
  en: |
    ```text
    ┌────────────────────────────────────────────────────────────────────────┐
    │       HOW dbt SNAPSHOTS AUTOMATE SCD TYPE 2 POINT-IN-TIME HISTORY      │
    └────────────────────────────────────────────────────────────────────────┘
    Raw Source: Customer 101 changes status from 'BRONZE' to 'GOLD'

    dbt Automatically Manages the Target Snapshot Table:
    ┌─────────────┬──────────┬─────────────────────┬─────────────────────┐
    │ customer_id │ status   │ dbt_valid_from      │ dbt_valid_to        │
    ├─────────────┼──────────┼─────────────────────┼─────────────────────┤
    │ 101         │ BRONZE   │ 2024-01-01 00:00:00 │ 2026-10-16 12:00:00 │ (Closed row)
    │ 101         │ GOLD     │ 2026-10-16 12:00:00 │ NULL                │ (Active row)
    └─────────────┴──────────┴─────────────────────┴─────────────────────┘
    ✨ Zero manual MERGE statements! Zero manual timestamp tracking!
    ✨ Command: $ dbt snapshot
    ```
  az: |
    ```text
    ┌────────────────────────────────────────────────────────────────────────┐
    │       dbt SNAPSHOTS SCD TYPE 2 TARİXÇƏSİNİ NECƏ AVTOMATLAŞDIRIR?       │
    └────────────────────────────────────────────────────────────────────────┘
    Xam Mənbə: Müştəri 101 statusunu 'BRONZE'-dan 'GOLD'-a dəyişir

    dbt Hədəf Snapshot Cədvəlini Avtomatik İdarə Edir:
    ┌─────────────┬──────────┬─────────────────────┬─────────────────────┐
    │ customer_id │ status   │ dbt_valid_from      │ dbt_valid_to        │
    ├─────────────┼──────────┼─────────────────────┼─────────────────────┤
    │ 101         │ BRONZE   │ 2024-01-01 00:00:00 │ 2026-10-16 12:00:00 │ (Köhnə sətir bağlandı)
    │ 101         │ GOLD     │ 2026-10-16 12:00:00 │ NULL                │ (Aktiv cari sətir)
    └─────────────┴──────────┴─────────────────────┴─────────────────────┘
    ✨ Əllə 50 sətir mürəkkəb MERGE yazmaq yoxdur!
    ✨ İcra Komandası: $ dbt snapshot
    ```
explanation:
  en: |
    ### The Business Problem: Mutable Source Systems
    Most operational source databases (Postgres, MySQL) only store the *current* state of an entity.
    - If customer Alice changes her subscription plan or delivery address, the operational database overwrites the record (SCD Type 1).
    - As a Data Engineer, you must preserve historical point-in-time accuracy (SCD Type 2) so finance and marketing can analyze Alice's historical behavior accurately.
    - Traditionally, implementing SCD Type 2 required dozens of lines of error-prone SQL MERGE and update scripts. **dbt solves this with Snapshots.**

    ### How dbt Snapshots Work
    A snapshot is a mechanism that records changes to a mutable table over time.
    - Snapshots live in the `snapshots/` folder as `.sql` files.
    - You specify a `SELECT` statement and define two critical settings:
      1. **`unique_key`**: The primary key that identifies the entity (e.g. `customer_id`).
      2. **`strategy`**: How dbt detects that a record has changed.

    ### The 2 Snapshot Detection Strategies
    1. **`strategy='timestamp'` (Preferred)**:
       - Uses an `updated_at` column in the source table.
       - If `source.updated_at > snapshot.dbt_updated_at`, dbt knows the record was updated. It automatically closes the old row and inserts a new one.
    2. **`strategy='check'`**:
       - Used when the source table lacks an `updated_at` timestamp.
       - dbt computes a hash of the columns you specify: `check_cols: ['status', 'address', 'phone']` (or `check_cols: 'all'`).
       - If the checksum differs from the existing row, a change is registered.

    ### 4 Columns Automatically Added by dbt
    - **`dbt_scd_id`**: A unique surrogate key generated by hashing `unique_key` and `dbt_valid_from`.
    - **`dbt_updated_at`**: The timestamp when the record changed at the source.
    - **`dbt_valid_from`**: Timestamp when this version became active.
    - **`dbt_valid_to`**: Timestamp when this version was superseded. For the current active row, this is `NULL`.
  az: |
    ### Biznes Problemi: Dəyişən Mənbə Sistemləri
    İstehsalat sistemləri (Postgres, MySQL) adətən yalnız məlumatın *cari* vəziyyətini saxlayır.
    - Müştəri statusunu dəyişdikdə və ya başqa ünvana köçdükdə, baza köhnə məlumatın üzərinə yenisini yazır (SCD Type 1).
    - Lakin data mühəndisi tarixi hesabatları qorumaq üçün keçmiş vəziyyətləri (SCD Type 2) saxlamalıdır ki, keçmiş satışlar köhnə statusun adına yazılsın.
    - Əvvəllər bunu etmək üçün 50 sətirlik mürəkkəb MERGE və UPDATE skriptləri yazmaq lazım gəlirdi. **dbt bunu Snapshots ilə tək bir komandaya endirdi.**

    ### dbt Snapshots Necə İşləyir?
    Snapshot zaman keçdikcə mənbə cədvəldə baş verən dəyişiklikləri qeydə alan daxili dbt mexanizmidir.
    - `snapshots/` qovluğunda saxlanılır.
    - İçərisində adi `SELECT` sorğusu yazılır və 2 əsas parametr təyin edilir:
      1. **`unique_key`**: Müştərini və ya obyekti tanıdan açar sütun (məsələn: `customer_id`).
      2. **`strategy`**: dbt-nin dəyişikliyi necə aşkar edəcəyini göstərən strategiya.

    ### 2 Əsas Aşkarlama Strategiyası
    1. **`strategy='timestamp'` (Ən çox tövsiyə olunan)**:
       - Mənbə cədvəldəki `updated_at` sütunundan istifadə edir.
       - Əgər mənbədəki `updated_at` snapshot-dakı tarixdən təzədirsə, dbt başa düşür ki, məlumat dəyişib. Köhnə sətri bağlayır və yeni sətir açır.
    2. **`strategy='check'`**:
       - Mənbə cədvəldə `updated_at` sütunu **olmadıqda** istifadə edilir.
       - Sizin seçdiyiniz sütunların heşini (checksum) yoxlayır: `check_cols: ['status', 'unvan']`. Əgər dəyərlər dəyişibsə, yeni sətir yaradır.

    ### dbt-nin Cədvələ Avtomatik Əlavə Etdiyi 4 Sütun
    - **`dbt_scd_id`**: Surroqat açar (açar və tarixin heşi).
    - **`dbt_updated_at`**: Dəyişikliyin mənbədə baş verdiyi tarix.
    - **`dbt_valid_from`**: Bu versiyanın qüvvəyə mindiyi başlanğıc tarix.
    - **`dbt_valid_to`**: Bu versiyanın bitdiyi tarix. Hal-hazırda aktiv olan ən son sətir üçün bu sütun `NULL` olur.
quick_recap:
  en: "dbt Snapshots implement SCD Type 2 automatically, creating point-in-time historical records using either timestamp or column check strategies."
  az: "dbt Snapshots SCD Type 2 tarixçəsini timestamp və ya check strategiyaları ilə avtomatik quraraq keçmiş və cari vəziyyətləri qoruyur."
what_it_does:
  en: "Captures historical mutations of operational source tables over time without writing custom procedural MERGE statements."
  az: "Xüsusi MERGE skriptləri yazmadan mənbə cədvəllərindəki dəyişiklikləri zaman üzrə avtomatik qeydə alır."
real_world_use:
  en: "Tracking customer membership tiers, employee departments, and product catalog prices in financial Lakehouses."
  az: "Bank və ticarət platformalarında müştəri tariflərinin, işçilərin departamentlərinin və məhsul qiymətlərinin tarixi dəyişikliklərini izləmək."
common_mistakes:
  en: "Changing the `unique_key` or `strategy` of an active snapshot table in production, which corrupts the historical SCD2 timeline."
  az: "Canlı istehsalatda aktiv olan snapshot cədvəlinin `unique_key` və ya strategiyasını dəyişərək tarixi SCD2 xəttini korlamaq."
code: |
  -- =========================================================================
  -- PRODUCTION SNAPSHOT: snapshots/snap_customers.sql
  -- =========================================================================
  {% snapshot snap_customers %}

  {{
      config(
          target_schema='snapshots',
          unique_key='customer_id',
          strategy='timestamp',
          updated_at='updated_at',
          invalidate_hard_deletes=True
      )
  }}

  SELECT 
      customer_id,
      customer_name,
      membership_tier,
      city,
      updated_at
  FROM {{ source('postgres_raw', 'raw_customers') }}

  {% endsnapshot %}
code_explanation:
  en: |
    - **`{% snapshot %}`**: Special dbt Jinja block declaring an SCD Type 2 snapshot model.
    - **`strategy='timestamp'`**: Tells dbt to monitor the `updated_at` column for record updates.
    - **`invalidate_hard_deletes=True`**: If a row is deleted at the source database, dbt automatically sets `dbt_valid_to = CURRENT_TIMESTAMP()` rather than leaving it open forever.
  az: |
    - **`{% snapshot %}`**: SCD Type 2 snapshot modelini elan edən xüsusi dbt Jinja bloku.
    - **`strategy='timestamp'`**: dbt-yə dəyişiklikləri izləmək üçün `updated_at` sütununu müqayisə etməyi tapşırır.
    - **`invalidate_hard_deletes=True`**: Əgər mənbə bazada müştəri tamamilə silinərsə, dbt avtomatik olaraq həmin sətrin `dbt_valid_to` sütununa cari tarixi yazaraq onu bağlayır.
