  az: "`dbt snapshot` nəticəsi: müştəri 101 BRONZE-dan GOLD-a keçdikdə köhnə sətir bağlanır və yeni aktiv versiya (dbt_valid_to IS NULL) yaranır."
interview_question:
  question:
    en: "What are dbt Snapshots? How do they implement SCD Type 2, and what is the difference between the 'timestamp' and 'check' strategies?"
    az: "dbt Snapshots nədir? SCD Type 2-ni necə tətbiq edir və 'timestamp' ilə 'check' strategiyaları arasındakı fərq nədir?"
  answer:
    en: "dbt Snapshots are specialized models that implement Slowly Changing Dimensions Type 2 (SCD Type 2) to capture point-in-time historical mutations of mutable source tables. Instead of requiring engineers to write complex SQL MERGE and update scripts, dbt manages the table lifecycle automatically, appending metadata columns: `dbt_scd_id`, `dbt_updated_at`, `dbt_valid_from`, and `dbt_valid_to` (which is `NULL` for the active record). The two strategies differ in how they detect changes: (1) The **`timestamp` strategy** is the preferred and most efficient method; it relies on a reliable `updated_at` timestamp column in the source table. If the source `updated_at` is newer than `dbt_updated_at`, dbt triggers a row closure and insertion. (2) The **`check` strategy** is used when the source table lacks a reliable timestamp; dbt calculates a hash/checksum of specified columns (or all columns). If the hash differs between the source and snapshot, dbt registers a mutation and creates a new historical version."
    az: "dbt Snapshots dəyişən mənbə cədvəllərindəki məlumatların tarixi dəyişikliklərini qeydə almaq üçün Slowly Changing Dimensions Type 2 (SCD Type 2) arxitekturasını avtomatlaşdıran xüsusi modellərdir. Mühəndis əllə mürəkkəb MERGE və UPDATE skriptləri yazmaq əvəzinə, dbt cədvəlin idarəsini öz üzərinə götürür və 4 metadata sütunu əlavə edir: `dbt_scd_id`, `dbt_updated_at`, `dbt_valid_from` və `dbt_valid_to` (hazırda aktiv olan sətir üçün `NULL` qalır). İki aşkarlama strategiyası var: (1) **`timestamp` strategiyası**: Ən optimal metoddur və mənbə cədvəldəki `updated_at` sütununa əsaslanır. Mənbədəki tarix köhnə snapshot tarixindən böyük olduqda köhnə sətir bağlanır və təzəsi açılır. (2) **`check` strategiyası**: Mənbədə dəqiq `updated_at` sütunu **olmadıqda** istifadə olunur; dbt seçilmiş sütunların heşini (checksum) hesablayır. Heş dəyəri dəyişdikdə dbt yeni tarixi sətir əlavə edir."
  interviewer_tips:
    en: "Mention how to query the current active state: `SELECT * FROM snap_customers WHERE dbt_valid_to IS NULL`. This immediately proves you have used dbt snapshots in production."
    az: "Cari aktiv məlumatı necə oxuduğunuzu qeyd edin: `WHERE dbt_valid_to IS NULL`. Bu, dbt snapshot-ları real layihədə istifadə etdiyinizi dərhal sübut edir."
flashcards:
  - front:
      en: "What dimensional modeling design pattern do dbt Snapshots implement?"
      az: "dbt Snapshots hansı ölçülü modelləşdirmə dizayn modelini tətbiq edir?"
    back:
      en: "Slowly Changing Dimensions Type 2 (SCD Type 2)."
      az: "Slowly Changing Dimensions Type 2 (SCD Type 2 - Yavaş Dəyişən Ölçülər)."
  - front:
      en: "What indicates that a record in a dbt snapshot table is the current, active version?"
      az: "dbt snapshot cədvəlindəki sətrin cari, ən son aktiv versiya olduğunu nə göstərir?"
    back:
      en: "The `dbt_valid_to` column is `NULL`."
      az: "`dbt_valid_to` sütununun `NULL` olması."
  - front:
      en: "When should you use the `check` strategy instead of `timestamp` in a dbt snapshot?"
      az: "dbt snapshot-da nə vaxt `timestamp` yerinə `check` strategiyası istifadə edilməlidir?"
    back:
      en: "When the source table does not have a reliable `updated_at` timestamp column."
      az: "Mənbə cədvəldə etibarlı bir `updated_at` zaman damğası sütunu mövcud olmadıqda."
  - front:
      en: "What CLI command executes snapshot models in dbt?"
      az: "dbt-də snapshot modellərini hansı terminal komandası icra edir?"
    back:
      en: "`dbt snapshot`."
      az: "`dbt snapshot`."
  - front:
      en: "What does setting `invalidate_hard_deletes=True` do in a snapshot config?"
      az: "Snapshot tənzimləməsində `invalidate_hard_deletes=True` nə edir?"
    back:
      en: "It closes active records (`dbt_valid_to = CURRENT_TIMESTAMP`) if the row is physically deleted from the source."
      az: "Əgər sətir mənbə bazadan fiziki olaraq silinərsə, dbt həmin sətri cari tarixlə bağlayır (`dbt_valid_to = CURRENT_TIMESTAMP`)."
