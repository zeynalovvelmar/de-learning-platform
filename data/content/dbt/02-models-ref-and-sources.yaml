output_description:
  en: "Demonstrates dbt respecting the dependency DAG: `stg_orders` is executed and committed first, followed immediately by `fct_orders`."
  az: "dbt-nin asılılıq xəritəsinə (DAG) riayət etməsini göstərir: əvvəlcə `stg_orders` icra olunur, yalnız o bitdikdən sonra `fct_orders` başlayır."
interview_question:
  question:
    en: "What is the difference between ref() and source() in dbt, and what happens if an engineer writes hardcoded table names in SQL queries instead?"
    az: "dbt-də ref() və source() arasındakı fərq nədir və əgər mühəndis SQL sorğusunda cədvəl adını əllə (hardcoded) yazarsa nə baş verər?"
  answer:
    en: "In dbt, `source()` is used to reference raw, unmanaged tables loaded into the warehouse by external tools (e.g. Fivetran, Airbyte), declared centrally in a YAML file. In contrast, `ref()` is used to reference other dbt models created within the project. The `ref()` function is the backbone of dbt: it automatically builds the Directed Acyclic Graph (DAG) that dictates model execution order, enables concurrent execution across threads, and dynamically interpolates the correct database and schema depending on environment (dev vs prod). If an engineer hardcodes table names (e.g. `SELECT * FROM prod_db.raw_orders`), three critical failures occur: (1) dbt cannot detect the dependency, causing downstream models to run prematurely and fail; (2) testing in development will query or accidentally overwrite production data; and (3) environment migration becomes impossible without manually editing every SQL file."
    az: "dbt-də `source()` kənar alətlər (Fivetran, Airbyte) tərəfindən anbara yüklənən və YAML faylında elan olunan xam cədvəllərə istinad etmək üçündür. `ref()` isə dbt layihəsi daxilində yaradılmış digər modellərə istinad edir. `ref()` funksiyası dbt-nin onurğa sütunudur: o, layihənin asılılıq xəritəsini (DAG) avtomatik qurur, icra ardıcıllığını təmin edir, paralel işləməyə imkan verir və işlədiyiniz mühitə (`dev` və ya `prod`) uyğun düzgün baza ünvanını dinamik təyin edir. Əgər mühəndis cədvəl adını koda birbaşa əllə yazarsa (`SELECT * FROM prod_db.orders`), 3 ciddi problem yaranır: (1) dbt cədvəllər arasındakı əlaqəni görə bilmir və asılı model əvvəlki bitməmiş işə düşüb xəta verir; (2) mühəndis dev mühitində test edərkən səhvən canlı prod məlumatını oxuyur və ya dəyişir; (3) layihəni başqa mühitə köçürəndə hər faylı əllə dəyişmək məcburiyyəti yaranır."
  interviewer_tips:
    en: "Emphasize DAG construction and environment isolation. Mention that without ref(), parallel thread execution (`--threads`) cannot know which models are safe to run concurrently."
    az: "DAG qurulmasını və mühit təcridini (dev vs prod) mütləq vurğulayın. ref() olmasa dbt-nin hansı modellərin paralel işləyə biləcəyini təyin edə bilməyəcəyini qeyd edin."
flashcards:
  - front:
      en: "What is the primary purpose of the `{{ ref('model_name') }}` function in dbt?"
      az: "dbt-də `{{ ref('model_name') }}` funksiyasının əsas məqsədi nədir?"
    back:
      en: "To dynamically reference other dbt models and automatically build the project dependency DAG."
      az: "Digər dbt modellərinə dinamik istinad etmək və layihənin asılılıq qrafını (DAG) avtomatik qurmaq."
  - front:
      en: "How does `{{ source('source_name', 'table_name') }}` differ from `ref()`?"
      az: "`{{ source('source_name', 'table_name') }}` funksiyası `ref()`-dən nə ilə fərqlənir?"
    back:
      en: "source() points to raw ingested external tables defined in YAML; ref() points to models built by dbt."
      az: "source() YAML-da təyin edilmiş xam xarici cədvəllərə, ref() isə dbt-nin öz qurduğu modellərə istinad edir."
  - front:
      en: "Why is hardcoding schema and table names strictly forbidden in dbt?"
      az: "dbt-də sxem və cədvəl adlarını birbaşa (hardcoded) yazmaq nə üçün qadağandır?"
    back:
      en: "It breaks the dependency DAG, prevents parallel model runs, and risks corrupting production data in dev."
      az: "Asılılıq xəritəsini qırır, paralel icranı əngəlləyir və dev mühitində canlı prod məlumatını korlamaq riski yaradır."
  - front:
      en: "How does `ref()` support multi-environment deployment (dev vs prod)?"
      az: "`ref()` funksiyası çoxmühitli (dev və prod) tətbiqi necə təmin edir?"
    back:
      en: "It automatically interpolates the developer's sandbox schema in dev, and production schema in prod, with zero code changes."
      az: "Koda heç bir əl vurmadan dev mühitində şəxsi test sxemini, prod-da isə əsas canlı sxemi avtomatik təyin edir."
  - front:
      en: "What data structure does dbt generate to manage model execution order?"
      az: "dbt model icra ardıcıllığını idarə etmək üçün hansı məlumat strukturunu qurur?"
    back:
      en: "A Directed Acyclic Graph (DAG)."
      az: "İstiqamətləndirilmiş Dövrəsiz Qraf (DAG - Directed Acyclic Graph)."
