interview_question:
  question:
    en: "What is dbt (data build tool), what stage of the ELT pipeline does it handle, and why do engineers write only SELECT queries in dbt?"
    az: "dbt (data build tool) nədir, ELT boru kəmərinin hansı mərhələsinə cavabdehdir və mühəndislər dbt-də nə üçün yalnız SELECT sorğuları yazırlar?"
  answer:
    en: "dbt is an open-source transformation framework that enables data engineers and analysts to transform, test, and document data directly inside cloud data warehouses using SQL and software engineering best practices. It strictly handles the 'T' (Transform) in ELT; it does not extract or load raw data. Engineers write only `SELECT` queries because dbt automatically handles the DDL (Data Definition Language) and DML boilerplate behind the scenes. When you execute `dbt run`, dbt wraps your `SELECT` query in `CREATE TABLE AS SELECT` or `CREATE VIEW AS SELECT` statements tailored to your specific database adapter (Snowflake, BigQuery, Postgres). This decouples pure business transformation logic from database administrative boilerplate, guarantees idempotent execution, and enforces Git version control."
    az: "dbt data mühəndislərinə və analitiklərə bulud anbarlarının daxilindəki məlumatları SQL və proqram mühəndisliyi prinsipləri (Git, testlər) ilə çevirməyə, test etməyə və sənədləşdirməyə imkan verən transformasiya alətidir. O, ELT kəmərinin sırf 'T' (Transform) mərhələsinə cavabdehdir; xam məlumatı bazadan çıxarmır və ya yükləmir. Mühəndislərin yalnız `SELECT` yazmasının səbəbi dbt-nin bütün DDL və DML şablonlarını arxa planda avtomatlaşdırmasıdır. `dbt run` verdikdə, dbt sizin `SELECT` sorğunuzu hədəf bazanın (Snowflake, BigQuery) dialektinə uyğun `CREATE TABLE AS SELECT` və ya `CREATE VIEW` əmrlərinə bürüyür. Bu, biznes məntiqini inzibati cədvəl idarəetməsindən ayırır və prosesi idempotent (təkrar icra edilə bilən) edir."
  interviewer_tips:
    en: "Make sure to emphasize that dbt does NOT move data over the network—it pushes down SQL execution directly into the cloud warehouse's compute engine."
    az: "dbt-nin məlumatı şəbəkə üzərindən özünə çəkmədiyini, hesablama yükünü birbaşa bulud anbarının (Snowflake/BigQuery) öz mühərrikinə yönləndirdiyini (Pushdown Execution) mütləq qeyd edin."
flashcards:
  - front:
      en: "What part of the ELT pipeline does dbt handle?"
      az: "dbt ELT boru kəmərinin hansı hissəsinə cavabdehdir?"
    back:
      en: "Exclusively the 'T' (Transform) stage inside the cloud data warehouse."
      az: "Yalnız bulud verilənlər anbarının daxilindəki 'T' (Transformasiya) mərhələsinə."
  - front:
      en: "Why do engineers only write SELECT statements in dbt model files?"
      az: "Mühəndislər dbt model fayllarında nə üçün yalnız SELECT sorğuları yazırlar?"
    back:
      en: "dbt automatically wraps the SELECT query in the appropriate DDL (CREATE VIEW or CREATE TABLE AS)."
      az: "dbt həmin SELECT sorğusunu arxa planda avtomatik olaraq CREATE VIEW və ya CREATE TABLE DDL əmrinə çevirir."
  - front:
      en: "What is the purpose of the `dbt_project.yml` file?"
      az: "`dbt_project.yml` faylının əsas məqsədi nədir?"
    back:
      en: "It defines project configurations, model paths, variable scopes, and default materializations."
      az: "Layihə parametrlərini, model qovluqlarını, dəyişənləri və ilkin materializasiya qaydalarını təyin edir."
  - front:
      en: "Where does `profiles.yml` live, and why is it kept out of Git?"
      az: "`profiles.yml` harada saxlanılır və nə üçün Git repozitoriyasından kənarda tutulur?"
    back:
      en: "In `~/.dbt/profiles.yml`; it contains sensitive database passwords and credentials that must never be exposed."
      az: "`~/.dbt/profiles.yml` qovluğunda; heç vaxt aşkar edilməməli olan məxfi baza parollarını saxladığı üçün."
  - front:
      en: "Does dbt move data across external servers to transform it?"
      az: "dbt məlumatı çevirmək üçün kənar serverlərə köçürürmü?"
    back:
      en: "No. It pushes all transformations down into the warehouse's distributed SQL engine in-place."
      az: "Xeyr. Bütün transformasiyaları anbarın öz daxili paylanmış SQL mühərrikində yerində icra edir."
