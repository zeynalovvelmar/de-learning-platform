explanation:
  en: |
    ### 1. What are dbt Seeds?
    Seeds are CSV files located in your project's `seeds/` directory (e.g. `seeds/country_codes.csv`).
    - Running **`dbt seed`** loads the CSV into your data warehouse as a physical table.
    - Other models can immediately query it using **`{{ ref('country_codes') }}`**.
    - **The Golden Rule**: Seeds are for **small, rarely changing lookup data** (under a few thousand rows) like country code mappings, currency symbols, or tax rates.
    - **CRITICAL PITFALL**: Never use seeds for raw event logs or large datasets! Seeds are tracked in Git, and Git repositories should never contain large, high-frequency data files.

    ### 2. The Official 3-Tier Layering Standard
    In production, dumping all SQL models into a single flat directory is a recipe for chaos. The dbt community strictly enforces a 3-tier architectural standard:
    1. **`models/staging/` (Prefix: `stg_`)**:
       - 1-to-1 relationship with source tables.
       - Clean column names (`id` -> `order_id`), cast data types, handle nulls, and filter deleted records.
       - **Never join multiple sources in staging.**
       - Materialized as **`view`**.
    2. **`models/intermediate/` (Prefix: `int_`)**:
       - Contains intermediate joins and complex business logic shared across multiple marts.
       - Materialized as **`view`** or **`ephemeral`**.
    3. **`models/marts/` (Prefix: `fct_` for facts, `dim_` for dimensions)**:
       - The analytical layer consumed by BI tools (Power BI, Tableau) and analysts.
       - Modeled according to Kimball dimensional modeling principles.
       - Materialized as **`table`** or **`incremental`**.

    ### 3. Automated Documentation & Visual Lineage (`dbt docs`)
    Maintaining data dictionaries in stale Confluence pages or Excel sheets always fails. dbt automates documentation:
    - You write descriptions inside your `schema.yml` files.
    - Run **`$ dbt docs generate`**: dbt inspects your project, connects to the warehouse to fetch column metadata, and builds a static documentation package.
    - Run **`$ dbt docs serve`**: Launches a local web server hosting a searchable data catalog with an **interactive visual Lineage Graph (DAG)** showing every upstream and downstream dependency!
  az: |
    ### 1. dbt Seeds Nədir?
    Seeds layihənin `seeds/` qovluğunda saxlanılan kiçik CSV fayllarıdır (məsələn: `seeds/country_codes.csv`).
    - **`dbt seed`** komandasını verdikdə, dbt həmin CSV faylını verilənlər anbarında fiziki cədvələ çevirir.
    - Digər dbt modellərində onu adi model kimi **`{{ ref('country_codes') }}`** ilə çağırmaq mümkündür.
    - **Qızıl Qayda**: Seeds yalnız **kiçik və nadir hallarda dəyişən statik məlumatlar** üçündür (ölkə kodları, valyuta simvolları, filial nömrələri).
    - **TƏHLÜKƏLİ SƏHV**: Heç vaxt böyük tranzaksiya fayllarını seeds qovluğuna qoymayın! Seeds Git-də saxlanılır, Git isə böyük data fayllarını saxlamaq üçün deyil.

    ### 2. Rəsmi 3 Laylı Qovluq Standartı
    Production mühitində bütün SQL fayllarını qarışıq şəkildə eyni qovluğa atmaq xaos yaradır. dbt cəmiyyəti rəsmi olaraq 3 mərhələli lay standartını tətbiq edir:
    1. **`models/staging/` (`stg_` prefiksi ilə)**:
       - Xam cədvəllərlə 1-ə 1 əlaqədə olur.
       - Sütun adlarını təmizləyir (`id` əvəzinə `customer_id`), tipləri düzəldir, kiçik filtrlər tətbiq edir.
       - **Staging layında heç vaxt başqa cədvəllərlə ağır JOIN edilmir.**
       - Materializasiyası: **`view`**.
    2. **`models/intermediate/` (`int_` prefiksi ilə)**:
       - Bir neçə fərqli staging cədvəlinin birləşdirilməsi və təkrar istifadə olunan mürəkkəb biznes məntiqi burada saxlanılır.
       - Materializasiyası: **`view`** və ya **`ephemeral`**.
    3. **`models/marts/` (`fct_` faktlar və `dim_` ölçülər üçün)**:
       - BI panellərinin (Power BI, Tableau) və biznes analitiklərin birbaşa qoşulduğu son lay.
       - Kimball Star Schema prinsipləri ilə qurulur.
       - Materializasiyası: **`table`** və ya **`incremental`**.

    ### 3. Avtomatlaşdırılmış Sənədləşdirmə və Data Lineage (`dbt docs`)
    Excel və ya Word fayllarında cədvəl lüğəti saxlamaq həmişə köhnəlir və unudulur. dbt bunu tam avtomatlaşdırır:
    - Siz `schema.yml` faylında sütun və cədvəllərə `description` (izah) yazırsınız.
    - **`$ dbt docs generate`**: dbt anbara qoşulub bütün metadata məlumatlarını toplayır və sənədləşdirmə paketini yaradır.
    - **`$ dbt docs serve`**: Kompyuterdə lokal veb server açır. Burada axtarış paneli, bütün sütunların izahı və ən əsası məlumatın haradan gəlib hara getdiyini göstərən **canlı interaktiv Data Lineage (DAG) qrafikası** təqdim olunur!
quick_recap:
  en: "Seeds load static CSVs via `dbt seed`. Projects follow a 3-tier structure (staging -> intermediate -> marts), and `dbt docs serve` hosts an interactive lineage and data catalog."
  az: "Seeds `dbt seed` ilə kiçik statik CSV-ləri anbara yükləyir. Layihələr 3 laylı struktur izləyir (staging -> intermediate -> marts) və `dbt docs` canlı lineage qrafı təqdim edir."
what_it_does:
  en: "Organizes modular SQL codebases into standardized architectural tiers and automatically generates searchable data catalogs and visual lineage graphs."
  az: "Modulyar SQL layihələrini standart memarlıq laylarına bölür və avtomatik axtarışlı data kataloqu və vizual əlaqə xəritəsi (DAG) yaradır."
real_world_use:
  en: "Used by analytics engineering teams to onboard new analysts via self-serve dbt docs catalogs and maintain clean staging-to-mart pipelines."
  az: "Data komandaları yeni qoşulan mühəndislərə sistemləri dbt docs ilə tanıdır və nizamlı staging-marts pipeline-larını idarə edir."
common_mistakes:
  en: "Committing multi-megabyte CSV files into seeds; performing complex multi-table joins inside staging models instead of marts."
  az: "Böyük meqabaytlıq məlumat fayllarını seeds-ə yükləmək; staging cədvəllərinin içində ağır çoxcədvəlli JOIN-lər etmək."
code: |
  -- =========================================================================
  -- 1. SEED FILE: seeds/country_mappings.csv
  -- =========================================================================
  /*
  country_code,country_name,region
  AZ,Azerbaijan,EMEA
  TR,Turkey,EMEA
  US,United States,AMER
  GB,United Kingdom,EMEA
  */

  -- Run command: $ dbt seed

  -- =========================================================================
  -- 2. USING SEED IN A MART MODEL: models/marts/dim_customers.sql
  -- =========================================================================
  WITH customers AS (
      SELECT * FROM {{ ref('stg_customers') }}
  ),
  country_lookup AS (
      -- Seeds are referenced just like normal models using ref()!
      SELECT * FROM {{ ref('country_mappings') }}
  )
  SELECT 
      c.customer_id,
      c.customer_name,
      c.country_code,
      COALESCE(l.country_name, 'Unknown') AS country_name,
      COALESCE(l.region, 'Unknown') AS sales_region
  FROM customers c
  LEFT JOIN country_lookup l ON c.country_code = l.country_code;

  -- =========================================================================
  -- 3. DOCUMENTING IN models/marts/schema.yml
  -- =========================================================================
  /*
  version: 2
  models:
    - name: dim_customers
      description: "Conformed customer dimension enriched with ISO country regions."
      columns:
        - name: customer_id
          description: "Primary key for customer entity."
          tests: [unique, not_null]
        - name: sales_region
          description: "Geographic region (EMEA, AMER, APAC) mapped from seed."
  */
code_explanation:
  en: |
    - **Seed Reference**: `{{ ref('country_mappings') }}` queries the seed table seamlessly just like any regular SQL model.
    - **Clean Separation**: `stg_customers` cleans raw columns, while `dim_customers` handles the enrichment join with the country seed.
    - **Documentation Metadata**: Descriptions in `schema.yml` populate the auto-generated web catalog when running `dbt docs generate`.
  az: |
    - **Seed İstinadı**: `{{ ref('country_mappings') }}` funksiyası seed cədvəlini adi SQL modeli kimi rahatlıqla sorğulayır.
    - **Təmiz Ayrılıq**: `stg_customers` xam sütunları təmizləyir, `dim_customers` isə ölkə seed-i ilə zənginləşdirmə JOIN-ini icra edir.
    - **Sənədləşdirmə**: `schema.yml`-də yazılan izahlar `dbt docs generate` veriləndə avtomatik veb portala ötürülür.
