interview_question:
  question:
    en: "What are dbt Seeds and when should you use them? Explain the recommended directory layering structure (staging, intermediate, marts) in a production dbt project."
    az: "dbt Seeds nədir və nə vaxt istifadə olunmalıdır? Production dbt layihəsində tövsiyə olunan qovluq lay strukturu (staging, intermediate, marts) haqqında məlumat verin."
  answer:
    en: "dbt Seeds are static CSV files stored in the `seeds/` directory that dbt compiles into physical database tables using the `dbt seed` command. They can be referenced downstream using `ref('seed_name')`. Seeds should strictly be used for small, static lookup data that changes rarely (e.g. country codes, country ISO mappings, marketing channel taxonomy). They should never be used for large, high-volume, or dynamic transactional data because CSVs in seeds are checked into Git version control. In a production dbt project, models are structured into three distinct layers: (1) **`staging/` (prefix `stg_`)**: 1-to-1 with raw source tables, responsible for basic column renaming, type casting, and filtering deleted records. Staging models should never join other sources and are almost always materialized as `view`. (2) **`intermediate/` (prefix `int_`)**: Holds complex intermediate joins, window functions, and business logic that are shared across multiple downstream tables, materialized as `view` or `ephemeral`. (3) **`marts/` (prefix `fct_` or `dim_`)**: Business-facing Kimball fact and dimension tables optimized for BI tools and executive reporting, materialized as `table` or `incremental`."
    az: "dbt Seeds layihənin `seeds/` qovluğunda saxlanılan və `dbt seed` komandası ilə verilənlər anbarında cədvələ çevrilən statik CSV fayllarıdır. Digər modellərdə `ref('seed_adı')` ilə çağırıla bilər. Seeds yalnız nadir hallarda dəyişən kiçik arayış məlumatları üçün (məsələn: ölkə kodları, valyutalar, vergi dərəcələri) istifadə olunmalıdır. Seeds heç vaxt böyük və ya tez-tez yenilənən tranzaksiyalar üçün istifadə edilməməlidir, çünki bu CSV-lər Git repozitoriyasında saxlanılır. Production dbt layihələrində 3 laylı qovluq standartı tətbiq olunur: (1) **`staging/` (`stg_` prefiksi)**: Xam cədvəllərlə 1-ə 1 münasibətdədir; sütun adlarını təmizləyir, tipləri çevirir və yüngül filtrlər qoyur. Başqa cədvəllərlə JOIN edilmir və adətən `view` kimi qurulur. (2) **`intermediate/` (`int_` prefiksi)**: Bir neçə staging cədvəlinin birləşdirilməsi və ümumi köməkçi biznes hesablamaları üçün istifadə olunur; adətən `view` və ya `ephemeral` kimi qurulur. (3) **`marts/` (`fct_` və `dim_` prefiksləri)**: Kimball Star Schema əsasında qurulan, Power BI və hesabat sistemlərinin oxuduğu son biznes cədvəlləridir; `table` və ya `incremental` kimi materializasiya olunur."
  interviewer_tips:
    en: "Mention the '1-to-1 rule' for staging: each raw source table should have exactly one staging model. Multi-source joins belong in intermediate or marts."
    az: "Staging üçün '1-ə 1 qaydası'nı mütləq qeyd edin: hər xam mənbə cədvəli üçün layihədə yalnız 1 ədəd staging modeli olmalıdır. Cədvəllərin birləşdirilməsi intermediate və ya marts layına aiddir."
flashcards:
  - front:
      en: "What command compiles and loads CSV files in the `seeds/` folder into the database?"
      az: "`seeds/` qovluğundakı CSV fayllarını bazaya cədvəl kimi yükləmək üçün hansı komanda icra olunur?"
    back:
      en: "`dbt seed`."
      az: "`dbt seed`."
  - front:
      en: "Why should you NOT use dbt Seeds for large transactional datasets?"
      az: "Böyük tranzaksiya məlumatları üçün nə üçün dbt Seeds istifadə etmək OLMAZ?"
    back:
      en: "Seeds are committed directly into Git, making version control sluggish and blowing up repository storage."
      az: "Seed faylları birbaşa Git-də saxlanılır; böyük data Git repozitoriyasını həddindən artıq şişirdir və ləngidir."
  - front:
      en: "What is the primary role of the `staging/` layer in a dbt project?"
      az: "dbt layihəsində `staging/` layının əsas rolu nədir?"
    back:
      en: "To create a clean 1-to-1 representation of raw sources by standardizing column names and casting data types."
      az: "Sütun adlarını standartlaşdırmaq və tipləri çevirməklə xam mənbənin 1-ə 1 təmizlənmiş versiyasını yaratmaq."
  - front:
      en: "Should multiple tables be joined together inside a staging model?"
      az: "Staging modelinin daxilində bir neçə fərqli cədvəl bir-birinə JOIN edilməlidirmi?"
    back:
      en: "No. Staging models maintain strict 1-to-1 fidelity with raw sources; joins belong in intermediate or marts."
      az: "Xeyr. Staging xam mənbə ilə 1-ə 1 qalmalıdır; cədvəllərin birləşdirilməsi intermediate və ya marts layına aiddir."
  - front:
      en: "What command hosts the auto-generated dbt documentation and interactive Lineage DAG locally?"
      az: "Avtomatik yaradılmış dbt sənədləşdirməsini və interaktiv Lineage DAG qrafını lokalda açan komanda hansıdır?"
    back:
      en: "`dbt docs serve` (after running `dbt docs generate`)."
      az: "`dbt docs serve` (`dbt docs generate` icra edildikdən sonra)."
