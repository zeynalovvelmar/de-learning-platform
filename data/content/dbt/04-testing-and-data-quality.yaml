interview_question:
  question:
    en: "What are the differences between Generic tests and Singular tests in dbt? How does dbt determine if a Singular SQL test passes or fails?"
    az: "dbt-də Generic testlərlə Singular testlərin fərqi nədir? dbt fərdi (Singular) bir SQL testinin uğurla keçdiyini və ya xəta verdiyini necə müəyyən edir?"
  answer:
    en: "In dbt, tests are divided into Generic tests and Singular tests. **Generic tests** are reusable assertions declared in YAML files (`schema.yml`) under column definitions. dbt comes with four out-of-the-box generic tests: `unique` (no duplicate values), `not_null` (no null values), `accepted_values` (values must belong to an approved list), and `relationships` (foreign key integrity checks). **Singular tests** are custom SQL queries stored as `.sql` files inside the `tests/` directory to validate domain-specific business logic (e.g. validating that a discount never exceeds the total order value). dbt determines pass or fail for Singular tests using a simple, inverted assertion logic: the SQL query is written to **select failing records**. If the query returns **0 rows**, the test **PASSES** (no corrupt data was found). If the query returns **1 or more rows**, the test **FAILS**, and dbt reports the number of offending rows and logs their details for debugging."
    az: "dbt-də testlər Generic və Singular olaraq iki yerə bölünür. **Generic testlər** YAML faylında (`schema.yml`) sütun parametrləri kimi bəyan edilən təkrar istifadəyə yararlı testlərdir. dbt 4 standart generic test təqdim edir: `unique` (təkrar sətirlərin olmaması), `not_null` (boş dəyərlərin olmaması), `accepted_values` (dəyərlərin yalnız icazə verilən siyahıda olması) və `relationships` (xarici açar / referential integrity yoxlanışı). **Singular testlər** isə `tests/` qovluğunda yazılan xüsusi SQL sorğularıdır və unikal biznes qaydalarını yoxlayır (məsələn, müştərinin endirimi ümumi qiymətdən böyük ola bilməz). dbt-nin Singular testin keçib-keçmədiyini təyin etmə qaydası çox sadədir: SQL sorğusu **xətalı sətirləri tapmaq üçün** yazılır. Əgər sorğu **0 sətir** qaytararsa, test **UĞURLU (PASS)** sayılır. Əgər sorğu **1 və ya daha çox sətir** qaytararsa, dbt bunu xəta (**FAIL**) kimi qəbul edir və terminalda həmin sətirlərin sayını göstərir."
  interviewer_tips:
    en: "Mention `dbt build`: senior engineers use `dbt build` instead of running `dbt run` and `dbt test` separately, because `dbt build` tests models immediately and halts if an upstream model fails."
    az: "`dbt build` komandasını xüsusi vurğulayın: peşəkar mühəndislər `dbt run` və `dbt test`-i ayrı işlətmir, `dbt build` istifadə edir ki, ilkin modeldə test uğursuz olanda sonrakı modellər boş yerə hesablanmasın."
flashcards:
  - front:
      en: "What are the 4 built-in generic tests provided by dbt?"
      az: "dbt tərəfindən təqdim edilən 4 daxili generic test hansılardır?"
    back:
      en: "`unique`, `not_null`, `accepted_values`, and `relationships`."
      az: "`unique`, `not_null`, `accepted_values` və `relationships`."
  - front:
      en: "Where are generic tests configured in a dbt project?"
      az: "Generic testlər dbt layihəsində harada konfiqurasiya olunur?"
    back:
      en: "In YAML files (e.g. `schema.yml`) located inside the `models/` directory."
      az: "`models/` qovluğundakı YAML fayllarında (məsələn: `schema.yml`)."
  - front:
      en: "How does dbt evaluate whether a Singular SQL test passes or fails?"
      az: "dbt Singular SQL testinin keçib-keçmədiyini necə qiymətləndirir?"
    back:
      en: "0 rows returned = PASS. 1 or more rows returned = FAIL."
      az: "0 sətir qaytarılarsa = PASS (Uğurlu). 1 və ya daha çox sətir qaytarılarsa = FAIL (Xəta)."
  - front:
      en: "What does the `relationships` test verify in dbt?"
      az: "dbt-də `relationships` testi nəyi yoxlayır?"
    back:
      en: "Referential integrity (foreign keys): ensures values in one table exist in a referenced column of another table."
      az: "Xarici açar (Foreign Key) bütövlüyünü: bir cədvəldəki dəyərin digər cədvəldə mövcud olduğunu yoxlayır."
  - front:
      en: "What is the advantage of using `dbt build` over running `dbt run` and `dbt test` separately?"
      az: "`dbt run` və `dbt test`-i ayrı işlətməkdənsə `dbt build` istifadə etməyin üstünlüyü nədir?"
    back:
      en: "It executes models and tests in DAG dependency order, instantly halting downstream runs if an upstream test fails."
      az: "Modelləri və testləri DAG ardıcıllığı ilə icra edir və ilkin test xəta verdikdə sonrakı işləri dərhal dayandırır."
