output_description:
  en: "Displays the automated Data Quality test output validating uniqueness, null limits, value ranges, and freshness before allowing data into Gold tables."
  az: "Məlumatın Gold cədvəlinə keçməsinə icazə verilməzdən əvvəl unkallıq, NULL faizi və təzəliyin uğurla yoxlanıldığını göstərən audit nəticəsi."
interview_question:
  question:
    en: "What is Data Observability, and how does it differ from traditional software monitoring? Describe the 'Circuit Breaker' pattern in modern data pipelines."
    az: "Data Observability nədir və ənənəvi proqram təminatı monitorinqindən nə ilə fərqlənir? Müasir data boru kəmərlərində 'Circuit Breaker' (Qoruyucu dövrə) modelini təsvir edin."
  answer:
    en: "Traditional software monitoring tracks system health: CPU usage, memory utilization, network bandwidth, and HTTP status codes (200 OK vs 500 Error). However, a data pipeline can run with 100% CPU uptime and return 'Job Succeeded (Status 200)' while delivering 500,000 completely blank, corrupted, or duplicated rows. **Data Observability** monitors the health, integrity, and behavioral anomalies of the **data itself**, built on 5 core pillars: Freshness, Distribution, Volume, Schema, and Lineage. The **Circuit Breaker** pattern is an architectural fail-safe inspired by electrical breakers. When automated Data Quality tests (e.g. dbt tests, Great Expectations) detect an anomaly that violates predefined thresholds (such as primary key collisions, a spike in NULL values, or an 80% drop in normal record volume), the pipeline instantly 'trips' the circuit breaker: it halts execution, alerts engineers via Slack/PagerDuty, and diverts corrupted rows to an isolated quarantine table, preventing corrupted figures from ever reaching executive dashboards or production machine learning models."
    az: "Ənənəvi proqram monitorinqi sistemin texniki vəziyyətini izləyir: CPU, RAM istifadəsi və HTTP status kodları (200 OK və ya 500 Error). Lakin bir data pipeline 100% rəsmi olaraq 'Uğurla Bitdi (Success)' statusu ilə tamamlana bilər, amma əslində anbara 500,000 ədəd tamamilə boş (NULL) və ya təkrar sətir yazmış ola bilər. **Data Observability** sistemin deyil, birbaşa **məlumatın özünün** sağlamlığını və anomaliyalarını izləyir və 5 sütuna əsaslanır: Təzəlik (Freshness), Paylanma (Distribution), Həcm (Volume), Sxem dəyişikliyi (Schema) və Əlaqə xəritəsi (Lineage). **Circuit Breaker (Qoruyucu Dövrə)** elektrik sistemlərindəki avtomat qoruyuculardan ilhamlanan bir arxitektur təhlükəsizlik modelidir. Boru kəməri işləyərkən avtomatlaşdırılmış testlər (dbt test, Great Expectations) kritik bir qaydanın pozulduğunu (məsələn, açar təkrarlanması, NULL faizinin normadan çox olması və ya gündəlik həcmin 80% azalması) aşkar etdikdə, qoruyucu dövrə dərhal 'atır': proses saxlanılır, mühəndislərə xəbərdarlıq göndərilir və xətalı məlumatlar karantin cədvəlinə yönləndirilir. Nəticədə rəhbərliyin panellərinə və süni intellekt modellərinə yanlış məlumatın çatması 100% bloklanır."
  interviewer_tips:
    en: "Mention the danger of 'Silent Failures'—jobs that finish with exit code 0 but carry zero or garbage rows. Mention automated tools like Great Expectations, dbt tests, and OpenLineage."
    az: "'Silent Failures' (Səssiz Qəzalar) anlayışını xüsusi vurğulayın: işin 'yaşıl' bitməsi məlumatın düzgün olması demək deyil. Great Expectations, dbt testləri və OpenLineage alətlərini misal çəkin."
flashcards:
  - front:
      en: "What is Data Lineage?"
      az: "Data Lineage (Məlumatın Əlaqə Xəritəsi) nədir?"
    back:
      en: "The complete audit trail and dependency map tracing data from its origin sources through transformations to end-user dashboards."
      az: "Məlumatın ilkin mənbədən başlayaraq bütün transformasiyalardan keçib son hesabatlara qədərki tam audit və asılılıq xəritəsidir."
  - front:
      en: "What are the 5 pillars of Data Observability?"
      az: "Data Observability-nin 5 əsas sütunu hansılardır?"
    back:
      en: "Freshness, Distribution, Volume, Schema, and Lineage."
      az: "Təzəlik (Freshness), Paylanma (Distribution), Həcm (Volume), Sxem (Schema) və Lineage (Əlaqə)."
  - front:
      en: "What is the role of a 'Circuit Breaker' in a data pipeline?"
      az: "Data boru kəmərində 'Circuit Breaker' (Qoruyucu Dövrə) nə rol oynayır?"
    back:
      en: "To automatically halt the pipeline or quarantine data when quality thresholds fail, preventing bad data from contaminating Gold tables."
      az: "Keyfiyyət hədləri pozulduqda boru kəmərini dayandırmaq və ya məlumatı karantinə almaqla səhvlərin Gold cədvəllərinə keçməsini əngəlləmək."
  - front:
      en: "What is a 'Silent Failure' in data engineering?"
      az: "Data mühəndisliyində 'Silent Failure' (Səssiz Qəza) nədir?"
    back:
      en: "When an ETL job finishes with exit code 0 (success), but writes corrupted, duplicate, or zero rows into the warehouse."
      az: "Boru kəmərinin rəsmi olaraq uğurla (exit code 0) bitməsi, lakin anbara xətalı, boş və ya təkrar məlumat yazması vəziyyəti."
  - front:
      en: "What is Column-Level Lineage used for?"
      az: "Sütun Səviyyəli Lineage (Column-Level Lineage) nə üçün istifadə olunur?"
    back:
      en: "To trace the exact mathematical and relational origin of a specific column, and predict the blast radius before altering it."
      az: "Spesifik bir sütunun dəqiq riyazi və mənbə keçmişini izləmək və dəyişiklik etməzdən əvvəl təsir zonasını görmək üçün."
