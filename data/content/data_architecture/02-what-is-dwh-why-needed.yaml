  az: |
    ```text
    ┌────────────────────────────────────────────────────────────────────────┐
    │  ƏSAS PROBLEM: PƏRAKƏNDƏ MƏLUMAT VƏ ÇÖKƏN İSTEHSALAT BAZALARI          │
    └────────────────────────────────────────────────────────────────────────┘
    [PostgreSQL Sifariş]  [Salesforce CRM]  [Stripe Ödəniş]  [Google Analytics]
