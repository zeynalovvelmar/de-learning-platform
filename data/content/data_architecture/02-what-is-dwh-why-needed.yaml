output_description:
  en: "Displays unified customer records combining disparate CRM and Stripe financial data into a clean, standard data warehouse dimension."
  az: "Müxtəlif CRM və Stripe ödəniş sistemlərindən gələn pərakəndə məlumatların vahid DWH cədvəlində birləşdirilmiş nümunəsini göstərir."
interview_question:
  question:
    en: "Why does a modern enterprise need a Data Warehouse instead of simply running reporting queries on replica PostgreSQL databases?"
    az: "Müasir bir şirkət hesabatları PostgreSQL replika bazalarından oxumaq əvəzinə niyə mütləq Data Warehouse qurmalıdır?"
  answer:
    en: "While read replicas solve the problem of database CPU locking on production, they fail to solve the primary challenges of enterprise analytics: (1) Cross-System Integration: an enterprise has data scattered across dozens of disparate operational systems (Salesforce, Stripe, Google Ads, Zendesk, PostgreSQL); a replica only contains its own database's tables; (2) Data Modeling for Analytics: replicas maintain 3rd Normal Form (3NF) with dozens of normalized tables requiring complex multi-table JOINs, whereas a DWH uses Dimensional Modeling (Star Schema) optimized for fast analytical aggregations; (3) History Tracking: operational replicas only store the current state (updates overwrite old values), whereas a DWH tracks historical changes over time (SCD Type 2); and (4) Storage Optimization: replicas use row-oriented engines, whereas modern cloud DWHs (Snowflake, BigQuery) use columnar storage with heavy compression and column pruning."
    az: "Read-replica (yalnız-oxunan nüsxə) canlı bazanın kilitlənmə problemini həll etsə də, analitikanın əsas problemlərini həll edə bilmir: (1) Sistemlərarası İnteqrasiya: Şirkətin məlumatları onlarla fərqli xidmətdədir (Salesforce, Stripe, Google Ads, Zendesk, Postgres). Replika yalnız öz bazasını saxlayır, digər sistemlərlə birləşdirə bilmir; (2) Analitik Modelləşdirmə: Replikalar 3-cü Normal Formada (3NF) olur və bir hesabat üçün 15 cədvəli JOIN etmək lazımdır; DWH isə analitika üçün sadələşdirilmiş Star Schema istifadə edir; (3) Tarixçə İzləməsi: Replika yalnız ən son vəziyyəti saxlayır (dəyişəndə köhnə silinir); DWH isə illərlə olan dəyişikliklərin tarixçəsini (SCD Type 2) qoruyur; (4) Yaddaş Texnologiyası: Replikalar sətirli bazadır, müasir DWH-lar (Snowflake, BigQuery) isə analitikada 100 dəfə sürətli olan sütunlu (columnar) mühərriklərdir."
  interviewer_tips:
    en: "Never just say 'DWH is faster'. Mention the 4 architectural pillars: Cross-system integration, Star schema vs 3NF, Historical tracking (SCD), and Columnar vs Row engines."
    az: "Heç vaxt sadəcə 'DWH daha sürətlidir' deməyin. 4 əsas arxitektur arqumenti gətirin: Müxtəlif sistemlərin birləşməsi, Star Schema vs 3NF, Tarixçənin qorunması (SCD) və Sütunlu saxlanc."
flashcards:
  - front:
      en: "What are the 4 defining characteristics of a Data Warehouse according to Bill Inmon?"
      az: "Bill İnmona görə Data Warehouse-u müəyyən edən 4 əsas xüsusiyyət hansıdır?"
    back:
      en: "Subject-Oriented, Integrated, Non-Volatile, and Time-Variant."
      az: "Mövzu Yönümlü (Subject-Oriented), İnteqrasiyalı (Integrated), Dəyişməz (Non-Volatile) və Zamana Bağlı (Time-Variant)."
  - front:
      en: "Why does running heavy analytical queries on an operational OLTP database cause production downtime?"
      az: "Canlı OLTP bazasında ağır analitik sorğular işlətmək niyə istehsalatın dayanmasına səbəb olur?"
    back:
      en: "It exhausts CPU/memory and locks database tables, causing customer transactions and web requests to time out."
      az: "Prosessor və yaddaşı doldurur, cədvəlləri kilitləyir və müştərilərin sorğularının vaxtının bitməsinə (timeout) səbəb olur."
  - front:
      en: "Why is a PostgreSQL read replica not a complete substitute for a Data Warehouse?"
      az: "PostgreSQL read-replikası niyə Data Warehouse-u tam əvəz edə bilməz?"
    back:
      en: "It only stores data from one system, cannot integrate external SaaS sources (Salesforce/Stripe), lacks historical tracking, and is row-oriented."
      az: "Yalnız bir bazanın məlumatını saxlayır, digər xarici sistemləri (Stripe, CRM) birləşdirə bilmir, tarixçə saxlamır və sətirlidir."
  - front:
      en: "What does 'Non-Volatile' mean in the context of a Data Warehouse?"
      az: "Data Warehouse kontekstində 'Non-Volatile' (Dəyişməz) nə deməkdir?"
    back:
      en: "Data is never overwritten or deleted once loaded; new events and snapshots are appended to maintain history."
      az: "Məlumat anbara yazıldıqdan sonra heç vaxt silinmir və ya üzərinə yazılmır; tarixçə üçün daimi əlavə olunur."
  - front:
      en: "What is a 'Data Silo' and how does a Data Warehouse eliminate it?"
      az: "'Data Silo' (məlumat təcridi) nədir və DWH onu necə aradan qaldırır?"
    back:
      en: "Isolated data trapped inside independent applications. A DWH extracts and integrates them into a single centralized repository."
      az: "Ayrı-ayrı tətbiqlərdə ilişib qalmış təcrid olunmuş datadır. DWH onları vahid mərkəzə toplayaraq vahid həqiqət mənbəyi yaradır."
