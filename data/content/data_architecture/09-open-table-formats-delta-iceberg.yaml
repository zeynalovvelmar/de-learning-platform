output_description:
  en: "Demonstrates how Open Table Formats provide instant rollback and historical time-travel auditing alongside ACID upserts and in-place schema changes."
  az: "Açıq Cədvəl Formatlarının ACID yeniləmələri və ani sxem dəyişikliyi ilə yanaşı, keçmiş versiyalara necə sürətli audit və qayıdış təmin etdiyini nümayiş etdirir."
interview_question:
  question:
    en: "What is an Open Table Format (like Delta Lake or Apache Iceberg)? What limitations of raw Parquet on S3 does it solve, and how does Time Travel work under the hood?"
    az: "Açıq Cədvəl Formatı (Delta Lake və ya Apache Iceberg kimi) nədir? S3-dəki sadə Parquet fayllarının hansı məhdudiyyətlərini aradan qaldırır və Time Travel arxa planda necə işləyir?"
  answer:
    en: "An Open Table Format (OTF) is a metadata specification and management layer built on top of immutable columnar Parquet files stored in cloud object storage (S3, ADLS, GCS). While Parquet is a high-performance single-file storage format, raw Parquet directories lack ACID transactions, fail during concurrent writes, require costly O(N) S3 LIST operations to identify files, and cannot perform atomic row-level updates or deletes. Delta Lake and Apache Iceberg solve these challenges by introducing a centralized, ACID-compliant metadata catalog. In Delta Lake, every write appends a JSON commit log in `_delta_log/`; in Apache Iceberg, every write creates a new snapshot tree consisting of metadata, manifest lists, and manifest files. Under the hood, **Time Travel** works by referencing historical commit logs or snapshot manifests. Because Parquet data files are immutable, earlier files are never deleted when updates occur (until a maintenance job like `VACUUM` runs). When you query `VERSION AS OF 0`, the engine simply reads the snapshot manifest from that version and opens the exact set of Parquet files that were active at that timestamp."
    az: "Açıq Cədvəl Formatı (OTF) bulud obyekt anbarında (S3, ADLS, GCS) saxlanılan dəyişməz Parquet faylları üzərində qurulmuş metadata idarəetmə təbəqəsidir. Parquet tək fayl səviyyəsində əla format olsa da, bir qovluq Parquet faylında ACID tranzaksiyası yoxdur, eyni vaxtda yazan proseslər məlumatı korlayır, minlərlə faylı tapmaq üçün ləng S3 LIST əməliyyatı tələb olunur və bir sətirli UPDATE/DELETE etmək olmur. Delta Lake və Iceberg bunu həll etmək üçün mərkəzləşdirilmiş metadata jurnalı təqdim edir (Delta-da `_delta_log/*.json`, Iceberg-də isə snapshot metadata ağacı). **Time Travel** arxa planda belə işləyir: Parquet faylları dəyişməz (immutable) olduğu üçün yenilənmə zamanı köhnə fayllar dərhal silinmir (`VACUUM` işə düşənə qədər qalır). İstifadəçi `VERSION AS OF 0` sorğusu verdikdə, mühərrik sadəcə həmin versiyanın metadata faylını açır və həmin tarixdə aktiv olan Parquet fayllarının siyahısını oxuyur."
  interviewer_tips:
    en: "Distinguish between File Format (Parquet, ORC - byte layout within a file) and Table Format (Iceberg, Delta - tracking which files constitute a table). Mention VACUUM / snapshot expiration to show production cost-awareness."
    az: "Fayl Formatı (Parquet - tək fayl daxili bayt quruluşu) ilə Cədvəl Formatı (Iceberg, Delta - hansı faylların cədvələ aid olduğunu idarə edən sistem) arasındakı fərqi mütləq vurğulayın. VACUUM əməliyyatını xatırladaraq köhnə snapshot-ların saxlanc xərclərini idarə etməyi bildiyinizi göstərin."
flashcards:
  - front:
      en: "What is the difference between a File Format and an Open Table Format?"
      az: "Fayl Formatı ilə Açıq Cədvəl Formatı arasındakı fərq nədir?"
    back:
      en: "A File Format (Parquet) organizes bytes inside a single file; a Table Format (Delta/Iceberg) tracks files, schemas, and ACID commits across an entire table."
      az: "Fayl formatı (Parquet) tək fayl daxilindəki baytları təşkil edir; Cədvəl formatı (Delta/Iceberg) bütün cədvələ aid yüzlərlə faylı, sxemi və ACID kommitləri idarə edir."
  - front:
      en: "Why does raw Parquet on AWS S3 fail to provide ACID transactions?"
      az: "AWS S3 üzərindəki sadə Parquet faylları nə üçün ACID tranzaksiyalarını təmin edə bilmir?"
    back:
      en: "S3 is a key-value object store without multi-file atomic locks, meaning failed writes leave orphan files and concurrent writes collide."
      az: "S3 obyekt anbarıdır və atomik fayl kilidləməsi yoxdur; xəta baş verdikdə yarımçıq fayllar qalır və eyni vaxtda yazanlar bir-birini korlayır."
  - front:
      en: "How does Delta Lake track transaction history and state?"
      az: "Delta Lake tranzaksiya tarixçəsini və vəziyyətini necə izləyir?"
    back:
      en: "Through an ordered transaction log in `_delta_log/` containing atomic JSON commit files and Parquet checkpoints."
      az: "`_delta_log/` qovluğunda saxlanılan ardıcıl atomik JSON kommit faylları və Parquet checkpoint-ləri vasitəsilə."
  - front:
      en: "What is Apache Iceberg's Hidden Partitioning feature?"
      az: "Apache Iceberg-in Gizli Partisiya (Hidden Partitioning) xüsusiyyəti nədir?"
    back:
      en: "Users query natural date columns without specifying partition formulas; Iceberg automatically prunes partitions and supports partition evolution."
      az: "İstifadəçi fiziki partisiya qovluqlarını bilmədən birbaşa tarix sütununu sorğulayır; Iceberg partisiya kəsilməsini avtomatik idarə edir."
  - front:
      en: "How does Time Travel work in Delta Lake and Apache Iceberg?"
      az: "Delta Lake və Apache Iceberg-də Time Travel necə işləyir?"
    back:
      en: "By reading historical metadata snapshot logs that point to the immutable Parquet files that were active at that specific version or timestamp."
      az: "Həmin versiya və ya zaman damğasında aktiv olmuş dəyişməz Parquet fayllarına işarə edən tarixi metadata loqlarını oxumaqla."
