output_description:
  en: "Displays the captured change event emitted from the database transaction log to Kafka and replicated into the downstream Lakehouse table in near real-time."
  az: "Verilənlər bazası tranzaksiya loqundan tutulan, Kafka-ya ötürülən və saniyəaltı gecikmə ilə Lakehouse cədvəlinə replikasiya olunan CDC hadisəsini göstərir."
what_it_does:
  en: "Explains the architectural transition from scheduled batch polling to log-based Change Data Capture (CDC) streaming using Debezium and Kafka."
  az: "Periodik cədvəl skanlarından Debezium və Kafka əsaslı log-əsaslı Change Data Capture (CDC) axınlarına arxitektur keçidi izah edir."
real_world_use:
  en: "Standard enterprise data engineering pattern to synchronize operational databases (PostgreSQL, MySQL, Oracle) into analytics lakehouses (Delta Lake, Apache Iceberg) without production downtime."
  az: "İstehsalat bazalarını (Postgres, MySQL, Oracle) analitik lakehouse saxlancına (Delta, Iceberg) canlı sinxronizasiya etmək üçün qlobal sənaye standartıdır."
common_mistakes:
  en: |
    - **Relying on updated_at timestamps for CDC**: Misses hard deletes, fails when clocks drift, and triggers full table scans on source databases.
    - **Neglecting WAL disk retention on source databases**: If the CDC consumer fails and falls behind, the database may purge WAL segments or fill the disk, taking down the production database!
    - **Assuming CDC guarantees deduplication**: Network retries can cause duplicate events in Kafka; lakehouse ingestion engines must use idempotent upserts (`MERGE INTO`).
  az: |
    - **CDC üçün updated_at sütunlarına güvənmək**: Silinən sətirləri (hard delete) tamamilə itirir, saat fərqlərində xəta verir və istehsalat bazasında ağır skanlar yaradır.
    - **Mənbə bazada WAL disk həcmini nəzarətsiz qoymaq**: Əgər CDC oxuyucusu xarab olub geridə qalarsa, baza diski dolub bütün istehsalat sistemini çökdürə bilər!
    - **CDC-nin təkrar hadisə yaratmayacağını zənn etmək**: Şəbəkə təkrarı zamanı Kafka-ya eyni hadisə 2 dəfə düşə bilər; lakehouse-a yazarkən mütləq `MERGE INTO` (upsert) tətbiq olunmalıdır.
interview_question:
  question:
    en: "What is Change Data Capture (CDC), and why is log-based CDC far superior to query-based (polling) replication?"
    az: "Change Data Capture (CDC) nədir və log-əsaslı CDC nə üçün sorğu-əsaslı (polling) replikasiyadan qat-qat üstündür?"
  answer:
    en: |
      1. **Definition**: Change Data Capture (CDC) is a design pattern that identifies and captures state changes (inserts, updates, deletes) in a source database and delivers them in real time to downstream destinations.
      2. **Why Log-Based CDC Wins**:
         - **Zero Production Query Overhead**: It reads physical sequential transaction logs (PostgreSQL WAL, MySQL binlog) without running SQL queries, avoiding CPU contention, table locks, and index maintenance.
         - **Captures Hard Deletes**: Direct SQL queries cannot find rows that were deleted; transaction logs record every `DELETE` with the full pre-deletion row image.
         - **Complete Transaction Fidelity**: If a record changes from `PENDING -> PROCESSING -> COMPLETED` within seconds, hourly polling only observes the final state; log CDC captures every intermediate state change in strict chronological order.
    az: |
      1. **Tərif**: Change Data Capture (CDC) mənbə bazadakı bütün sətir dəyişikliklərini (insert, update, delete) anında tutub aşağı axın sistemlərinə (data lake, anbar) canlı çatdıran dizayn modelidir.
      2. **Log-Əsaslı CDC-nin Üstünlükləri**:
         - **İstehsalat Bazasına Sıfır Sorğu Yükü**: SQL sorğuları göndərmir, diskin ardıcıl fiziki ikili jurnalını (PostgreSQL WAL, MySQL binlog) oxuyur; heç bir cədvəl kilidi və ya CPU rəqabəti yaratmır.
         - **Fiziki Silinmələri (Hard Delete) Tutur**: Adi SQL sorğuları silinmiş sətri tapa bilmir; tranzaksiya loqu isə hər bir `DELETE` əməliyyatını sətrin silinməzdən əvvəlki bütün məlumatları ilə birlikdə qeydə alır.
         - **Tranzaksiya Ardıcıllığının Tamlığı**: Əgər sətir 1 dəqiqə içində `GÖZLƏMƏDƏ -> HAZIRLANIR -> ÇATDIRILDI` statuslarını keçirsə, periodik sorğu yalnız son vəziyyəti görür; log-əsaslı CDC isə bütün aralıq dəyişiklikləri xronoloji dəqiqliklə qoruyur.
  interviewer_tips:
    en: "Mention the 'Outbox Pattern' as the microservices standard for atomically updating a database and emitting an event to Kafka in a single local transaction, eliminating dual-write inconsistencies."
    az: "Mikroxidmətlərdə həm bazanı yeniləmək, həm də Kafka-ya hadisə göndərmək üçün 'Outbox Pattern' arxitekturasını (tək yerli tranzaksiya ilə dual-write problemini həll edən model) da qeyd edin."
flashcards:
  - front:
      en: "What is the primary difference between Batch Processing and Stream Processing?"
      az: "Batch (Dəstə) Emalı ilə Stream (Axın) Emalı arasındakı əsas fərq nədir?"
    back:
      en: "Batch processes bounded, historical data at scheduled intervals with high latency. Streaming processes unbounded continuous event streams in real time with sub-second latency."
      az: "Batch müəyyən edilmiş keçmiş məlumatı cədvəl üzrə yüksək gecikmə ilə emal edir. Streaming isə fasiləsiz axan hadisələri real vaxtda saniyəaltı gecikmə ilə emal edir."
  - front:
      en: "What is Change Data Capture (CDC)?"
      az: "Change Data Capture (CDC) nədir?"
    back:
      en: "A design pattern that detects row-level inserts, updates, and deletes in a source database and streams them in real time to downstream data platforms."
      az: "Mənbə bazadakı bütün sətir əlavə, yeniləmə və silinmələrini anında tutub real vaxtda data platformalarına çatdıran arxitektur modeldir."
  - front:
      en: "Why does query-based polling (SELECT WHERE updated_at > last_sync) fail to capture hard deletes?"
      az: "Sorğu-əsaslı toplama (SELECT WHERE updated_at > last_sync) fiziki silinmələri (hard delete) nə üçün tuta bilmir?"
    back:
      en: "Because hard-deleted rows no longer exist in the table; a SQL SELECT query has no row to evaluate and misses the deletion entirely."
      az: "Çünki fiziki silinən sətirlər artıq cədvəldə mövcud olmur; SQL sorğusunun oxuya biləcəyi heç bir sətir qalmır və silinmə tamamilə itir."
  - front:
      en: "How does log-based CDC (e.g. Debezium) extract data without impacting database query performance?"
      az: "Log-əsaslı CDC (məs. Debezium) baza sorğu performansına toxunmadan məlumatı necə çıxarır?"
    back:
      en: "By reading the database's sequential binary transaction log (PostgreSQL WAL, MySQL binlog) directly from disk without executing SQL queries."
      az: "SQL sorğusu icra etmədən, birbaşa diskdəki ardıcıl ikili tranzaksiya jurnalını (PostgreSQL WAL, MySQL binlog) replikasiya nüsxəsi kimi oxuyaraq."
  - front:
      en: "What is the Outbox Pattern in event-driven data architectures?"
      az: "Hadisə-əsaslı data arxitekturalarında Outbox Pattern nədir?"
    back:
      en: "A pattern where application changes and outgoing event messages are saved within the same atomic database transaction, guaranteed to be delivered to Kafka via CDC without dual-write bugs."
      az: "Tətbiq dəyişikliyi və xarici hadisə mesajının eyni lokal baza tranzaksiyasında Outbox cədvəlinə yazıldığı və CDC ilə Kafka-ya çatdırıldığı etibarlı arxitektur modeldir."
