output_description:
  en: "Displays the result of in-warehouse ELT transformation, where raw nested JSON payloads are flattened and enriched with business calculations using SQL."
  az: "Xam iç-içə JSON məlumatının bulud SQL daxilində necə cədvələ çevrildiyini və biznes endirimlərinin yerində necə hesablandığını göstərir."
interview_question:
  question:
    en: "Explain the fundamental differences between ETL and ELT. Why has ELT become the industry standard for modern data stacks, and what role does dbt play?"
    az: "ETL və ELT arasındakı fundamental fərqləri izah edin. Nə üçün ELT müasir data sistemlərində sənaye standartına çevrildi və bu prosesdə dbt-nin rolu nədir?"
  answer:
    en: "The core difference lies in where and when data transformations take place. In **ETL (Extract, Transform, Load)**, data is extracted from sources, transformed on a dedicated middle-tier server (e.g. Informatica, Spark, Python worker), and only the finalized, aggregated data is loaded into the warehouse. In **ELT (Extract, Load, Transform)**, raw data is immediately extracted and loaded directly into the cloud data warehouse or lakehouse (e.g. Snowflake, BigQuery, Databricks), and transformations are executed inside the warehouse using its distributed SQL engine. ELT became the standard due to three major paradigm shifts: (1) **Storage Economics**: Cloud storage costs collapsed to cents per GB, making it economical to preserve complete raw histories forever. (2) **Decoupled Compute & MPP Power**: Modern cloud warehouses scale compute independently on demand, performing transformations 10-100x faster than standalone ETL servers. (3) **Agility & Non-destructive Pipelines**: In ETL, if transformation logic had a bug, historical data was lost; in ELT, raw data is permanently preserved, allowing teams to refactor transformations and backfill data in minutes. In this modern stack, **dbt (data build tool)** is the standard transformation framework: it enables data engineers and analysts to write modular, version-controlled SQL `SELECT` statements with automated testing, documentation, and lineage graphs directly inside the warehouse."
    az: "Əsas fərq transformasiyanın harda və nə vaxt baş verməsindədir. **ETL-də** məlumat mənbədən çıxarılır, kənar bir serverdə (Informatica, Python) dəyişdirilir və yalnız yekun aqreqasiya olunmuş nəticə anbara yüklənir. **ELT-də** isə xam məlumat heç bir dəyişiklik edilmədən birbaşa bulud anbarına (Snowflake, BigQuery, Databricks) yüklənir və bütün transformasiyalar anbarın özünün güclü paylanmış SQL mühərriki ilə daxildə icra olunur. ELT-nin standart olmasının 3 səbəbi var: (1) **Saxlanc İqtisadiyyatı**: Bulud yaddaşı çox ucuzlaşdı, bütün tarixi xam məlumatı daimi saxlamaq sərfəli oldu. (2) **Ayrılmış Hesablama və MPP Gücü**: Müasir bulud anbarları tələb olunduqda yüzlərlə nüvə ayıraraq analitik transformasiyaları kənar serverlərdən qat-qat sürətli icra edir. (3) **Çeviklik və Geri Qayıtma**: ETL-də xəta olanda tarixi məlumat itirdi; ELT-də xam məlumat həmişə anbarda olduğu üçün düstur səhvini düzəldib keçmişi dəqiqələr içində yenidən hesablamaq mümkündür. Bu arxitekturada **dbt (data build tool)** transformasiya standartıdır: mühəndislərə anbar daxilində modulyar SQL modelləri qurmağa, testlər yazmağa və avtomatik data lineage yaratmağa imkan verir."
  interviewer_tips:
    en: "Mention the 'EtLT' hybrid (pre-masking PII before ELT ingestion) and how dbt transformed the data industry by turning SQL into software engineering (version control, CI/CD, tests)."
    az: "Məlumat təhlükəsizliyi üçün 'EtLT' modelini (yükləməzdən öncə PII məlumatlarının hash-lənməsi) və dbt-nin SQL-ə proqram təminatı mühəndisliyi prinsiplərini (Git, testlər, CI/CD) gətirdiyini qeyd edin."
flashcards:
  - front:
      en: "What does the abbreviation ELT stand for?"
      az: "ELT abreviaturasının açılışı nədir?"
    back:
      en: "Extract, Load, Transform."
      az: "Extract (Çıxar), Load (Yüklə), Transform (Çevir)."
  - front:
      en: "Where do data transformations occur in an ELT architecture?"
      az: "ELT arxitekturasında məlumat transformasiyaları harada baş verir?"
    back:
      en: "Directly inside the destination cloud data warehouse / lakehouse using its distributed SQL MPP engine."
      az: "Birbaşa hədəf bulud anbarının və ya lakehouse-un daxilində, onun paylanmış SQL mühərriki ilə."
  - front:
      en: "Why was traditional ETL preferred over ELT in the 1990s and 2000s?"
      az: "1990 və 2000-ci illərdə ənənəvi ETL nə üçün ELT-dən daha çox üstün tutulurdu?"
    back:
      en: "Disk storage and database compute licenses were extremely expensive, requiring data to be pre-aggregated before loading."
      az: "Yaddaş diskləri və baza lisenziyaları çox baha idi, buna görə məlumatı bazaya yükləməzdən əvvəl kiçiltmək tələb olunurdu."
  - front:
      en: "What is the primary benefit of loading raw data into the warehouse before transforming it?"
      az: "Məlumatı çevirməzdən əvvəl xam halda anbara yükləməyin əsas faydası nədir?"
    back:
      en: "Historical raw data is never lost, allowing easy backfills and model changes whenever business logic evolves."
      az: "Xam tarixçə heç vaxt itmir, biznes məntiqi dəyişdikdə keçmişi asanlıqla yenidən hesablamaq mümkündür."
  - front:
      en: "What is the 'EtLT' hybrid pattern used for in enterprise environments?"
      az: "Böyük şirkətlərdə 'EtLT' hibrid modelindən nə üçün istifadə olunur?"
    back:
      en: "To mask or hash sensitive PII (credit cards, passwords) before landing in the warehouse, followed by heavy SQL modeling inside."
      az: "Məxfi məlumatları (kart nömrələri, şifrələr) anbara yükləməzdən əvvəl gizlətmək (masking), sonra daxildə SQL modelləşdirməsi aparmaq üçün."
