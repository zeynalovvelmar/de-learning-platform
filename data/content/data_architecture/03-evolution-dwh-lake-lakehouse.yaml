interview_question:
  question:
    en: "What is a Data Lakehouse? What fundamental limitations of Generation 1 (Data Warehouses) and Generation 2 (Data Lakes) led to its adoption?"
    az: "Data Lakehouse nədir? 1-ci nəsil (Data Warehouse) və 2-ci nəsil (Data Lake) hansı təməl çatışmazlıqlarına görə bu arxitektura yarandı?"
  answer:
    en: "A Data Lakehouse is a modern data architecture that directly combines the flexibility, cost-efficiency, and unstructured data support of Data Lakes with the ACID transactions, schema enforcement, and high performance of Data Warehouses. It emerged because: (1) Generation 1 Data Warehouses were proprietary and tightly coupled compute to storage, making them too expensive for petabyte-scale storage, while being completely incapable of handling unstructured audio/image ML data; (2) Generation 2 Data Lakes solved cost by storing open files on commodity cloud storage (S3/GCS), but devolved into 'Data Swamps' characterized by a lack of ACID guarantees, partial write corruption, inability to perform `UPDATE`/`DELETE` for privacy laws (GDPR), and poor BI query performance. The Lakehouse implements an open transactional metadata layer (Delta Lake, Apache Iceberg, Apache Hudi) on top of open Parquet files, providing ACID transactions, Time Travel, and schema evolution on low-cost object storage without vendor lock-in."
    az: "Data Lakehouse Data Lake-in ucuz qiymətini, çevikliyini və açıq fayl formatlarını Data Warehouse-un ACID tranzaksiyaları, sxem qorunması və sürəti ilə birləşdirən müasir arxitekturadır. Onun yaranma səbəbləri: (1) 1-ci nəsil DWH-lar hesablama ilə yaddaşı bir-birinə bağladığı üçün petabaytlıq məlumatlar üçün həddindən artıq baha idi və ML üçün şəkil/səs kimi struktursuz faylları saxlaya bilmirdi; (2) 2-ci nəsil Data Lake-lər məlumatı ucuz S3/GCS anbarına tökərək xərci azaltsa da, 'Data Bataqlığına' (Data Swamp) çevrildi: ACID yox idi, kəmər yarıda qəza verəndə natamam fayllar qalırdı, GDPR üçün müştərini silmək (`DELETE`) mümkünsüz idi və BI hesabatları çox ləng işləyirdi. Lakehouse açıq Parquet fayllarının üzərinə tranzaksiya layı (Delta Lake, Apache Iceberg) əlavə edərək ucuz S3 saxlancında tam ACID, Zamanda Səyahət (Time Travel) və sxem qorunması təmin edir."
  interviewer_tips:
    en: "Use the term 'Two-tier architecture problem' (duplicating data from S3 Lake into Snowflake DWH). Explain that Lakehouse eliminates this dual-hop duplication."
    az: "'İkimərhələli arxitektura problemi' (datanı S3-dən anbara kopyalamaq məcburiyyəti) terminini işlədin və Lakehouse-un bu təkrarlanmanı aradan qaldırdığını vurğulayın."
flashcards:
  - front:
      en: "What was the primary limitation of 1st-generation Data Warehouses?"
      az: "1-ci nəsil Data Warehouse-ların əsas məhdudiyyəti nə idi?"
    back:
      en: "Coupled storage and compute making them expensive, and inability to store unstructured data for machine learning."
      az: "Yaddaş və prosessorun bir-birinə bağlı olması səbəbindən çox baha olması və struktursuz faylları saxlaya bilməməsi."
  - front:
      en: "What is a 'Data Swamp' in the context of Data Lakes?"
      az: "Data Lake kontekstində 'Data Bataqlığı' (Data Swamp) nə deməkdir?"
    back:
      en: "A neglected Data Lake containing uncurated, corrupted, or untracked data lacking ACID and schema governance."
      az: "ACID və sxem nəzarəti olmayan, natamam və zədəli fayllarla dolmuş yararsız Data Lake."
  - front:
      en: "What is a Data Lakehouse?"
      az: "Data Lakehouse nədir?"
    back:
      en: "An architecture combining the low cost of Data Lakes with the ACID reliability and speed of Data Warehouses."
      az: "Data Lake-in ucuz qiyməti ilə Data Warehouse-un ACID etibarlılığı və sürətini birləşdirən arxitektura."
  - front:
      en: "Name the three leading Open Table Formats that enable Lakehouse architectures."
      az: "Lakehouse arxitekturasını mümkün edən 3 əsas Açıq Cədvəl Formatının (Open Table Formats) adını çəkin."
    back:
      en: "Delta Lake, Apache Iceberg, and Apache Hudi."
      az: "Delta Lake, Apache Iceberg və Apache Hudi."
  - front:
      en: "What is 'Time Travel' in a Data Lakehouse table?"
      az: "Data Lakehouse cədvəlində 'Time Travel' (Zamanda Səyahət) nədir?"
    back:
      en: "The ability to query or restore historical snapshots of a table using transaction log versions or timestamps."
      az: "Tranzaksiya loqları sayəsində cədvəlin keçmiş tarixdəki vəziyyətini oxumaq və ya bərpa etmək imkanı."
