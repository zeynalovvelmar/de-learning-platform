output_description:
  en: "Displays the SCD Type 2 dimension state where Alice's relocation to London creates a new active version while preserving Baku history."
  az: "Ayselin Londona köçməsinin yeni aktiv versiya yaratdığını, eyni zamanda Bakı tarixçəsini qoruduğunu göstərən SCD Type 2 cədvəli."
interview_question:
  question:
    en: "What is a Slowly Changing Dimension (SCD)? Compare Type 1 vs Type 2 with an example, and explain what columns are required to implement Type 2."
    az: "Slowly Changing Dimension (SCD) nədir? Type 1 ilə Type 2-ni nümunə ilə müqayisə edin və Type 2 tətbiq etmək üçün hansı sütunların lazım olduğunu izah edin."
  answer:
    en: "A Slowly Changing Dimension (SCD) is a design pattern used in data warehousing to manage changes in descriptive dimension attributes over time (e.g., customer address, employee job title, product category). In SCD Type 1, the old value is simply overwritten with the new value in the existing row. No history is kept. While simple, it completely corrupts historical reporting because past transactions are retroactively reassigned to the new attribute value. In SCD Type 2, full historical lineage is preserved by inserting a brand new row whenever a tracked attribute changes, assigning it a new surrogate key. To implement SCD Type 2, three metadata columns are required: (1) `valid_from` (timestamp when this version became effective); (2) `valid_to` (timestamp when this version was superseded, using a high-water mark like '9999-12-31' for active rows); and (3) `is_current` (a boolean flag for fast filtering of current active records)."
    az: "Slowly Changing Dimension (SCD) verilənlər anbarında zaman keçdikcə ölçü məlumatlarında (müştəri ünvanı, əməkdaşın vəzifəsi) baş verən dəyişiklikləri idarə etmək üçün dizayn şablonudur. SCD Type 1-də köhnə məlumatın üzərinə birbaşa yeni məlumat yazılır. Tarixçə saxlanılmır. Bu çox sadə olsa da, tarixi hesabatları korlayır, çünki keçmiş satışlar yeni ünvanın adına yazılır. SCD Type 2-də isə dəyişiklik baş verəndə köhnə sətir saxlanılır və yeni bir sətir əlavə olunur (yeni surroqat açarla). SCD Type 2 tətbiq etmək üçün 3 metadata sütunu tələb olunur: (1) `valid_from` (bu versiyanın başladığı tarix); (2) `valid_to` (bu versiyanın bitdiyi tarix; aktiv sətir üçün '9999-12-31' yazılır); (3) `is_current` (ən son aktiv sətiri dərhal tapmaq üçün `TRUE`/`FALSE` bayrağı)."
  interviewer_tips:
    en: "Mention the 'Surrogate Key' mechanism: a customer has ONE natural business ID, but MULTIPLE surrogate keys in SCD Type 2. This proves you know how Fact tables link to specific historical versions."
    az: "Müştərinin 1 təbii ID-si, lakin SCD Type 2-də bir neçə Surroqat açarı olduğunu qeyd edin. Bu, fakt cədvəlinin həmin tarixdəki düzgün versiyaya necə bağlandığını bildiyinizi sübut edir."
flashcards:
  - front:
      en: "What is an SCD (Slowly Changing Dimension)?"
      az: "SCD (Slowly Changing Dimension) nədir?"
    back:
      en: "A design pattern used in data warehousing to manage and track changes to dimension attributes over time."
      az: "Zaman keçdikcə ölçü məlumatlarında baş verən dəyişiklikləri izləmək və idarə etmək üçün dizayn şablonudur."
  - front:
      en: "How does SCD Type 1 handle an attribute update?"
      az: "SCD Type 1 məlumat dəyişikliyini necə həll edir?"
    back:
      en: "It overwrites the existing value in place, keeping no historical record of the previous value."
      az: "Köhnə dəyərin üzərinə birbaşa yenisini yazır və əvvəlki dəyərin tarixçəsini saxlamır."
  - front:
      en: "How does SCD Type 2 preserve historical changes?"
      az: "SCD Type 2 tarixi dəyişiklikləri necə qoruyur?"
    back:
      en: "It closes the old record and inserts a brand new row with a new surrogate key and validity dates."
      az: "Köhnə sətri bağlayır və yeni surroqat açar və etibarlılıq tarixləri ilə təzə bir sətir əlavə edir."
  - front:
      en: "What 3 metadata tracking columns are standard in an SCD Type 2 table?"
      az: "SCD Type 2 cədvəlində hansı 3 standart metadata sütunu olur?"
    back:
      en: "`valid_from`, `valid_to`, and `is_current` (boolean flag)."
      az: "`valid_from`, `valid_to` və `is_current` (boolean bayraq)."
  - front:
      en: "What value is traditionally set in `valid_to` for an actively current SCD Type 2 record?"
      az: "Aktiv SCD Type 2 sətri üçün `valid_to` sütununa ənənəvi olaraq hansı dəyər yazılır?"
    back:
      en: "A future high-water mark timestamp, typically `'9999-12-31 23:59:59'` (or `NULL`)."
      az: "Gələcək maksimum zaman damğası, adətən `'9999-12-31 23:59:59'` (və ya `NULL`)."
