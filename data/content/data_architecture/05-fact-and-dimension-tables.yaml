output_description:
  en: "Displays safe aggregation of a semi-additive bank balance fact, evaluated at a single point-in-time across customer segments."
  az: "Semi-additive bank balansı faktının tək bir tarix pəncərəsində müştəri seqmentləri üzrə düzgün toplanmasını göstərir."
interview_question:
  question:
    en: "Explain the difference between Additive, Semi-Additive, and Non-Additive facts. Give a real-world example of each and explain how you handle a semi-additive measure in SQL."
    az: "Additive (tam cəmlənən), Semi-Additive (yarım-cəmlənən) və Non-Additive (cəmlənməyən) faktların fərqini izah edin. Hər birinə real nümunə verin və semi-additive faktı SQL-də necə idarə etdiyinizi göstərin."
  answer:
    en: "In dimensional modeling, facts are classified by how they can be mathematically aggregated across dimensions: (1) Additive Facts can be summed across all dimensions, including time (e.g. Sales Revenue, Quantity Sold); (2) Semi-Additive Facts can be summed across some dimensions (like Geography or Customer), but CANNOT be summed across the Time dimension (e.g. Bank Account Balances, Warehouse Inventory Stock). Summing your account balance across every day of the month yields an erroneous, massively inflated number; in SQL, you must handle semi-additive measures by filtering to the closing balance of a specific date or using window functions like `LAST_VALUE()`; (3) Non-Additive Facts cannot be summed across any dimension (e.g. Unit Price, Profit Margin Percentage, Currency Exchange Rates). To analyze non-additive metrics, you must calculate the underlying additive components independently (e.g. `SUM(profit) / SUM(revenue)`) rather than averaging or summing the ratios directly."
    az: "Ölçülü modelləşdirmədə faktlar ölçülər üzrə necə toplana biləcəyinə görə 3 yerə bölünür: (1) Additive Faktlar bütün ölçülər (o cümlədən Zaman) üzrə sadəcə `SUM()` edilə bilər (məsələn: Satış məbləği, Alınan say); (2) Semi-Additive Faktlar Müştəri və ya Şəhər üzrə toplana bilər, lakin Zaman üzrə CƏMLƏNƏ BİLMƏZ (məsələn: Bank hesabı balansı, Anbarda qalan məhsul sayı). Balansı ayın 30 günü üzrə cəmləmək mənasız və saxta bir rəqəm yaradır; SQL-də bunu idarə etmək üçün mütləq konkret bir tarix seçilməli (`WHERE date = '...'`) və ya `LAST_VALUE()` analitik pəncərə funksiyasından istifadə edilməlidir; (3) Non-Additive Faktlar heç bir ölçü üzrə toplana bilməz (məsələn: Vahid qiymət, Mənfəət marjası faizi, Valyuta məzənnəsi). Bu faizləri toplamaq riyazi səhvdir; bunları hesablamaq üçün surət və məxrəci ayrıca cəmləyib (`SUM(gəlir) / SUM(dövriyyə)`) bölmək lazımdır."
  interviewer_tips:
    en: "The bank account balance or warehouse inventory is the quintessential test for semi-additive facts. Mentioning `LAST_VALUE()` or closing snapshot tables proves you know how to query them properly."
    az: "Bank balansı və anbar stoku semi-additive faktların ən klassik nümunəsidir. SQL-də `LAST_VALUE()` pəncərə funksiyasını qeyd etmək müsahibədə mükəmməl təsir bağışlayır."
flashcards:
  - front:
      en: "What is an Additive Fact?"
      az: "Additive (Tam Cəmlənən) Fakt nədir?"
    back:
      en: "A numeric measure that can be meaningfully summed across all dimensions in the data warehouse (e.g. sales revenue)."
      az: "Verilənlər anbarındakı bütün ölçülər (zaman da daxil) üzrə cəmlənə bilən ədədi ölçüdür (məs: satış məbləği)."
  - front:
      en: "What is a Semi-Additive Fact? Give two examples."
      az: "Semi-Additive (Yarım-Cəmlənən) Fakt nədir? İki nümunə verin."
    back:
      en: "A measure that can be summed across some dimensions, but NOT across Time (e.g. bank account balance, warehouse inventory count)."
      az: "Bəzi ölçülər üzrə toplana bilən, lakin Zaman üzrə toplana BİLMƏYƏN fakt (məs: bank balansı, anbarda qalan məhsul sayı)."
  - front:
      en: "Why is Profit Margin Percentage considered a Non-Additive Fact?"
      az: "Mənfəət marjası faizi niyə Non-Additive (Cəmlənməyən) Fakt hesab olunur?"
    back:
      en: "Percentages cannot be directly summed; you must aggregate total profit and total revenue separately before dividing."
      az: "Faizləri birbaşa toplamaq riyazi səhvdir; ümumi gəlir və dövriyyəni ayrı toplayıb bir-birinə bölmək lazımdır."
  - front:
      en: "What is a Conformed Dimension in Kimball's Enterprise Bus Architecture?"
      az: "Kimball-un Enterprise Bus Arxitekturasında Conformed Dimension nədir?"
    back:
      en: "A single, standardized dimension table shared consistently across multiple different fact tables (e.g. `dim_date`, `dim_customer`)."
      az: "Bir neçə fərqli fakt cədvəli tərəfindən ortaq istifadə olunan tək, standartlaşdırılmış ölçü cədvəlidir (məs: `dim_date`)."
  - front:
      en: "What is a Factless Fact Table?"
      az: "Faktsız Fakt Cədvəli (Factless Fact Table) nədir?"
    back:
      en: "A fact table that contains no numeric measures, only foreign keys tracking occurrences of an event (e.g. student class attendance)."
      az: "Daxilində heç bir ədədi rəqəm olmayan, sadəcə bir hadisənin baş verdiyini izləyən xarici açarlar toplusu (məs: tələbə davamiyyəti)."
