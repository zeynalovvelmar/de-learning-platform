output_description:
  en: "Shows the data transformation lifecycle: 3 raw records in Bronze filtered to 2 unique records in Silver and summarized in 1 daily KPI row in Gold."
  az: "Məlumatın həyat dövrünü göstərir: Bronze-dakı 3 xam sətir Silver-də 2 təmizlənmiş sətirə çevrilir və Gold-da 1 gündəlik KPI sətrində xülasələnir."
interview_question:
  question:
    en: "Explain the Medallion Architecture (Bronze, Silver, Gold). Why do we need the Silver layer instead of jumping straight from Bronze to Gold?"
    az: "Medallion Arxitekturasını (Bronze, Silver, Gold) izah edin. Niyə Bronze-dan birbaşa Gold-a keçmək əvəzinə Silver qatına ehtiyacımız var?"
  answer:
    en: "Medallion Architecture organizes Lakehouse data into 3 logical tiers: Bronze (raw, append-only, immutable landing zone), Silver (cleansed, conformed, deduplicated enterprise single-source-of-truth), and Gold (aggregated, dimensional Star schema optimized for BI and ML). We cannot jump directly from Bronze to Gold for three critical engineering reasons: (1) **Code Reusability & Consistency**: Multiple downstream Gold marts (e.g., Marketing Mart, Finance Mart, Fraud Detection ML) require the same cleaned, deduplicated user and transaction tables. If each mart queried Bronze directly, business logic and cleaning rules would be duplicated across pipelines, leading to inconsistent numbers. (2) **Cost & Performance Efficiency**: Complex deduplication and JSON parsing is executed once during the Bronze->Silver hop rather than recomputed across dozens of separate Gold pipelines. (3) **Ad-Hoc Analysis & Exploration**: Data Analysts and Data Scientists need granular, row-level cleansed data for hypothesis testing; Gold tables are aggregated summaries that lack atomic row-level detail."
    az: "Medallion Arxitekturası Lakehouse məlumatlarını 3 məntiqi qata ayırır: Bronze (xam, append-only, dəyişməz qəbul qatı), Silver (təmizlənmiş, unifikasiya edilmiş, vahid həqiqət mənbəyi) və Gold (BI və ML üçün aqreqasiya edilmiş, Star Schema əsaslı biznes vitrini). Bronze-dan birbaşa Gold-a keçməməyimizin 3 əsas mühəndislik səbəbi var: (1) **Təkrar İstifadə və Uyğunluq**: Müxtəlif Gold vitrinləri (Marketinq, Maliyyə, Fırıldaqçılıq ML modeli) eyni təmizlənmiş tranzaksiya məlumatlarına ehtiyac duyur. Əgər hər kəs birbaşa Bronze-dan oxusa, təmizləmə və dedup məntiqləri hər pipeline-da təkrar yazılacaq və şöbələr arasında rəqəmlər fərqli çıxacaq. (2) **Hesablama Xərcləri və Performans**: Ağır JSON oxuma və dedup əməliyyatı Bronze->Silver keçidində cəmi bir dəfə icra olunur, onlarla Gold pipeline-da təkrar hesablanmır. (3) **Tədqiqat və Ad-hoc Sorğular**: Analitiklər və Data Scientist-lər dənəvər (row-level) təmiz məlumata baxmaq istəyirlər; Gold qatı isə yüksək aqreqasiyalı olduğu üçün atomik detalları gizlədir."
  interviewer_tips:
    en: "Emphasize that Bronze serves as the 'time-travel disaster recovery replay log', while Silver is the 'enterprise canonical model', and Gold is 'purpose-built marts'."
    az: "Bronze-un fəlakətlər zamanı bütün data pipeline-ı yenidən qurmaq üçün 'tarixi bərpa arxivi', Silver-in 'şirkətin vahid standart modeli', Gold-un isə 'spesifik biznes vitrini' olduğunu vurğulayın."
flashcards:
  - front:
      en: "What is the primary role of the Bronze layer in Medallion Architecture?"
      az: "Medallion Arxitekturasında Bronze təbəqəsinin əsas rolu nədir?"
    back:
      en: "To store raw, append-only, immutable data directly from source systems with metadata."
      az: "Mənbə sistemlərindən gələn xam məlumatı dəyişdirmədən, append-only və metadata ilə saxlamaq."
  - front:
      en: "What transformations occur when promoting data from Bronze to Silver?"
      az: "Məlumatı Bronze-dan Silver-ə keçirərkən hansı transformasiyalar icra olunur?"
    back:
      en: "Deduplication, type casting, schema validation, data cleansing, and entity resolution."
      az: "Təkrar sətirlərin silinməsi, tip çevrilmələri, sxem yoxlanışı və məlumatların təmizlənməsi."
  - front:
      en: "What data structures and schemas characterize the Gold layer?"
      az: "Gold təbəqəsini hansı məlumat strukturları və sxemlər xarakterizə edir?"
    back:
      en: "Kimball Star Schemas (Fact/Dim tables) and pre-aggregated business KPIs ready for BI dashboards."
      az: "BI hesabatları üçün hazır olan Kimball Star Schema (Fact/Dim cədvəlləri) və aqreqasiya edilmiş KPI-lar."
  - front:
      en: "Why is Bronze kept immutable and append-only?"
      az: "Bronze təbəqəsi nə üçün dəyişdirilməz (immutable) və yalnız əlavə olunan (append-only) saxlanılır?"
    back:
      en: "To allow full pipeline replays and recalculations whenever downstream transformation logic changes or bugs are found."
      az: "Aşağı axın transformasiya məntiqi dəyişdikdə və ya xəta aşkarlandıqda bütün pipeline-ı sıfırdan bərpa etmək üçün."
  - front:
      en: "Who are the primary consumers of the Silver vs Gold layers?"
      az: "Silver və Gold təbəqələrinin əsas istifadəçiləri kimlərdir?"
    back:
      en: "Silver is queried by data scientists and engineers; Gold is queried by BI dashboards, analysts, and business users."
      az: "Silver qatını data scientist-lər və mühəndislər, Gold qatını isə BI panelləri, analitiklər və biznes rəhbərləri sorğulayır."
