interview_question:
  question:
    en: "What is the difference between a Star Schema and a Snowflake Schema? Why is the Star Schema generally preferred in modern cloud data warehouses like Snowflake or BigQuery?"
    az: "Star Schema ilə Snowflake Schema arasındakı fərq nədir? Niyə müasir bulud anbarlarında (Snowflake, BigQuery) Star Schema daha üstün tutulur?"
  answer:
    en: "A Star Schema consists of a central fact table directly referencing denormalized dimension tables in a single hop. In contrast, a Snowflake Schema normalizes dimension tables into multiple related lookup tables (e.g., product -> subcategory -> category), creating a branching hierarchy. The Star Schema is overwhelmingly preferred in modern cloud data warehouses for three reasons: (1) Query Performance: Star schemas minimize the number of JOINs required to answer business questions, avoiding expensive hash joins across large distributed tables; (2) Simplicity for BI: Flat dimension tables make it trivial for business analysts and BI tools (Power BI, Looker) to navigate and build reports without traversing deep foreign key paths; and (3) Cloud Storage Economics: Storage is so cheap ($0.02/GB) and columnar compression is so efficient that the minor storage savings achieved by normalizing dimensions are negligible compared to the compute cost and developer friction of complex Snowflake schemas."
    az: "Star Schema-da (Ulduz Sxemi) mərkəzdə fakt cədvəli dayanır və denormallaşdırılmış tək laylı ölçü cədvəllərinə birbaşa (tək addımda) bağlanır. Snowflake Schema-da (Qar Dənəciyi Sxemi) isə ölçü cədvəlləri normallaşdırılaraq bir neçə kiçik alt cədvələ parçalanır (məhsul ➡️ alt kateqoriya ➡️ əsas kateqoriya). Müasir bulud anbarlarında Star Schema 3 əsas səbəbə görə seçilir: (1) Sorğu Sürəti: Star Schema JOIN-lərin sayını minimuma endirir və paylanmış klasterlərdə ağır Hash Join-lərin qarşısını alır; (2) Analitiklər üçün Sadəlik: Düz cədvəllər analitiklərin və BI alətlərinin (Power BI, Tableau) heç bir çətinlik çəkmədən hesabat qurmasını təmin edir; (3) Saxlancın Ucuzluğu: Bulud anbarı o qədər ucuzdur (1 GB cəmi 0.02 dollar) və sütunlu sıxılma o qədər güclüdür ki, cədvəlləri parçalamaqla əldə edilən cüzi disk qənaəti hesablama və kadr xərclərinin yanında heç nədir."
  interviewer_tips:
    en: "Explain that 'Cloud storage economics changed the paradigm': in the on-premise era disk was expensive, but in the modern cloud era compute and engineer time dominate."
    az: "'Bulud iqtisadiyyatı paradiqmanı dəyişdi' arqumentini gətirin: əvvəllər disk baha idi, indi isə hesablama gücü və mühəndis vaxtı bahadır."
flashcards:
  - front:
      en: "What is the defining structural characteristic of a Star Schema?"
      az: "Star Schema-nın (Ulduz Sxeminin) əsas struktur xüsusiyyəti nədir?"
    back:
      en: "A central fact table connected directly to flat, denormalized dimension tables in a single hop."
      az: "Mərkəzi fakt cədvəlinin birbaşa tək laylı, denormallaşdırılmış ölçü cədvəllərinə 1 addımda bağlanması."
  - front:
      en: "What is the defining structural characteristic of a Snowflake Schema?"
      az: "Snowflake Schema-nın (Qar Dənəciyi Sxeminin) əsas struktur xüsusiyyəti nədir?"
    back:
      en: "Dimension tables are normalized into branching sub-dimension lookup hierarchies."
      az: "Ölçü cədvəllərinin normallaşdırılaraq budaqlanan kiçik alt cədvəllərə parçalanması."
  - front:
      en: "What is the primary trade-off of a Snowflake Schema compared to a Star Schema?"
      az: "Star sxem ilə müqayisədə Snowflake sxeminin əsas mənfi cəhəti nədir?"
    back:
      en: "Slower query performance and higher SQL complexity due to multiple nested JOINs."
      az: "Çoxsaylı ardıcıl JOIN-lər səbəbindən sorğu sürətinin ləngiməsi və SQL kodunun mürəkkəbləşməsi."
  - front:
      en: "Why does the Star Schema produce faster query execution in cloud data warehouses?"
      az: "Star Schema bulud anbarlarında niyə daha sürətli icra olunur?"
    back:
      en: "It minimizes distributed table JOINs and allows columnar execution engines to scan denormalized flat data efficiently."
      az: "JOIN-lərin sayını azaldır və sütunlu mühərriklərin düz cədvəlləri maksimum sürətlə skan etməsinə şərait yaradır."
  - front:
      en: "Why is data redundancy in Star Schema dimension tables rarely a problem today?"
      az: "Star sxem ölçü cədvəllərindəki təkrarlanma bu gün niyə problem hesab olunmur?"
    back:
      en: "Cloud storage is extremely cheap, and columnar compression algorithms shrink repetitive text data by 80-90%."
      az: "Bulud saxlancı çox ucuzdur və sütunlu sıxılma təkrar olunan mətnləri 80-90% sıxaraq yer tutmağa qoymur."
