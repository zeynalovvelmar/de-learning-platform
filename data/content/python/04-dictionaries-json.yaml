id: "04-dictionaries-json"
order: 4
level: "junior"
title:
  en: "Dictionaries, Key-Value Lookups, and JSON"
  az: "Lüğətlər, Açar-Dəyər Cütləri və JSON"
quick_recap:
  en: "Dictionaries are hash tables mapping unique keys to values with O(1) average lookup complexity. In data engineering, semi-structured JSON from webhooks and APIs converts directly into Python dictionaries. Always prefer `dict.get(key, default)` over `dict[key]` to prevent KeyError crashes on optional fields."
  az: "Lüğətlər unikal açarları dəyərlərə bağlayan və O(1) orta axtarış sürəti verən hash cədvəlləridir. Data mühəndisliyində API və vebhook-lardan gələn yarı-strukturlu JSON qeydləri birbaşa Python lüğətinə çevrilir. Məcburi olmayan açarlarda KeyError xətasının qarşısını almaq üçün həmişə `dict.get(key, default)` istifadə edin."
explanation:
  en: |
    Think of a phonebook directory or indexed customer registry:
    Instead of scanning through a million entries one by one ($O(N)$), you flip directly to the customer's ID and retrieve their record instantly in constant time ($O(1)$).
    In Python, dictionaries (`dict`) represent this key-value pairing. Every web API payload (JSON) parses natively into nested dictionaries.

    ### Safe Access vs. Crashing Access:
    - `data["city"]`: If `"city"` is missing, Python immediately raises an unhandled `KeyError` that kills the entire pipeline job.
    - `data.get("city", "Unknown")`: If `"city"` is missing, Python gracefully returns `"Unknown"` (or `None` if no fallback provided).

    ### Useful Dictionary Operations:
    - `data.keys()`: Returns all keys.
    - `data.values()`: Returns all values.
    - `data.items()`: Returns pairs of `(key, value)` for iteration.
    - `data_a | data_b` (Python 3.9+): Merges two dictionaries.
  az: |
    Telefon kitabçasını və ya müştəri reyestrini təsəvvür edin:
    Müştərini tapmaq üçün 1 milyon ada tək-tək baxmaq ($O(N)$) əvəzinə, birbaşa müştərinin ID koduna baxıb məlumatı dərhal tək addımda ($O(1)$) tapırsınız.
    Python-da lüğətlər (`dict`) bu açar-dəyər münasibətini təmsil edir. Web API-lərindən gələn bütün JSON sənədləri Python-da lüğət kimi emal olunur.

    ### Təhlükəsiz vs. Təhlükəli Oxuma:
    - `data["seher"]`: Əgər `"seher"` açarı cədvəldə yoxdursa, Python dərhal `KeyError` verir və bütün boru kəməri dayanır.
    - `data.get("seher", "Naməlum")`: Əgər açar yoxdursa, proqram qəzaya uğramır, təhlükəsiz şəkildə ehtiyat dəyəri ("Naməlum") qaytarır.

    ### Əsas Lüğət Əməliyyatları:
    - `data.keys()`: Bütün açarları qaytarır.
    - `data.values()`: Bütün dəyərləri qaytarır.
    - `data.items()`: Dövrə üçün `(açar, dəyər)` cütlərini qaytarır.
    - `data_a | data_b` (Python 3.9+): İki lüğəti birləşdirir.
code: |
  # Raw user record arriving from an API JSON payload
  user_payload = {
      "user_id": 1042,
      "first_name": "Elmar",
      "email": "elmar@example.com",
      "country": None
  }

  # Accessing values safely
  user_id = user_payload["user_id"]
  role = user_payload.get("role", "customer")  # Missing key -> safe fallback!
  country = user_payload.get("country") or "Unknown"

  # Adding new metadata
  user_payload["is_active"] = True

  print(f"User {user_id}: {user_payload['first_name']} | Role: {role}")
  print(f"Effective Country: {country}")
  print(f"Keys present: {list(user_payload.keys())}")
what_it_does:
  en: "Demonstrates safe key lookups using .get() with fallback defaults, handling missing fields, and updating dictionary metadata."
  az: "Lüğətdən .get() ilə təhlükəsiz oxumanı, çatışmayan açarlara susmaya görə ehtiyat dəyər verməyi və lüğətə yeni açarlar əlavə etməyi göstərir."
real_world_use:
  en: "Parsing REST API JSON responses (e.g. Stripe webhooks, Salesforce CRM data) where optional fields may or may not exist across varying event versions."
  az: "Bütün REST API cavablarının (məs. Stripe ödənişləri, CRM sistemləri) emalında: fərqli hadisələrdə bəzi sahələr boş və ya mövcud olmaya bilər, buna görə .get() ilə qorunma standartdır."
common_mistakes:
  en: |
    - **Using square brackets data[key] without checking**: A missing key halts an entire multimillion-record ETL job with KeyError. Always use `.get(key, default)`.
    - **Using mutable objects as keys**: Dictionary keys must be hashable and immutable (strings, integers, tuples). You cannot use a list as a dictionary key (`TypeError: unhashable type: 'list'`).
    - **Confusing get() default when key exists with None value**: `d = {"x": None}; d.get("x", "default")` returns `None`, because the key actually exists! Use `d.get("x") or "default"` to catch both missing and falsy values.
  az: |
    - **data[key] ilə birbaşa oxumaq**: Olmayan tək bir açar milyonlarla sətirlik ETL kəmərini KeyError ilə dondurur. Həmişə `.get(key, default)` istifadə edin.
    - **Dəyişən tipləri açar kimi qoymağa çalışmaq**: Lüğət açarları mütləq hash oluna bilən və dəyişməz olmalıdır (str, int, tuple). Siyahını açar etmək olmaz (`TypeError: unhashable type`).
    - **Açarın olmaması ilə dəyərin None olması fərqi**: `d = {"x": None}` olduqda `d.get("x", "defolt")` `None` qaytarır, çünki açar mövcuddur. Həm yoxluğu, həm də None-ı tutmaq üçün `d.get("x") or "defolt"` yazın.
interview_question:
  question:
    en: "How does a Python dictionary achieve O(1) average lookup time under the hood?"
    az: "Python lüğəti arxa planda necə işləyir ki, axtarış sürəti orta hesabla O(1) sabit vaxt təşkil edir?"
  answer:
    en: |
      1. **Hash Table Data Structure**: A dictionary is implemented as a sparse hash table array of buckets.
      2. **Hash Function Computation**: When you lookup `d[key]`, Python computes `hash(key)` in O(1) time. The hash integer is masked with the array size to compute the exact index bucket where the value's pointer lives.
      3. **Direct Memory Jump**: Instead of iterating through keys ($O(N)$), Python jumps directly to the calculated memory index in $O(1)$ constant time. If hash collisions occur, Python resolves them using open addressing with pseudo-random perturbation.
    az: |
      1. **Hash Cədvəli Strukturu**: Lüğət arxa planda yaddaş qovluqlarından (buckets) ibarət seyrək hash cədvəli massividir.
      2. **Hash Funksiyasının Hesablanması**: Siz `d[key]` axtardıqda Python dərhal `hash(key)` dəyərini hesablayır. Bu rəqəm massivin ölçüsünə uyğunlaşdırılaraq dəyərin dəqiq yerləşdiyi indeks xanasını tapır.
      3. **Birbaşa Yaddaşa Keçid**: Bütün açarları tək-tək axtarmaq ($O(N)$) əvəzinə, Python birbaşa hesablanmış yaddaş indeksinə tullanır ($O(1)$). Toqquşmalar (hash collision) baş verdikdə isə Python daxili açıq ünvanlama alqoritmi ilə növbəti xananı təyin edir.
exercise:
  question:
    en: "Write a function `format_order_event(event_dict)` that takes a raw dictionary and extracts: 'id' from 'order_id' (assume always present), 'amount' from 'total_amount' as a float (defaulting to 0.0 if missing), and 'status' from 'status' lowercased (defaulting to 'pending' if missing). Return a dictionary `{'id': order_id, 'amount': total_amount, 'status': status}`."
    az: "Xam lüğəti qəbul edən və 'order_id' açarından 'id' çıxaran (həmişə mövcuddur), 'total_amount' açarından float kimi 'amount' çıxaran (yoxdursa 0.0), və 'status' açarından kiçik hərflərlə 'status' çıxaran (yoxdursa 'pending') `format_order_event(event_dict)` funksiyası yazın. Nəticəni `{'id': order_id, 'amount': total_amount, 'status': status}` lüğəti kimi qaytarın."
  starter_code: |
    def format_order_event(event_dict):
        # Kodu bura yazın
        pass
  hint:
    en: "Use `event_dict['order_id']`, `float(event_dict.get('total_amount', 0.0))`, and `event_dict.get('status', 'pending').lower()`."
    az: "`event_dict['order_id']`, `float(event_dict.get('total_amount', 0.0))` və `event_dict.get('status', 'pending').lower()` ifadələrindən istifadə edin."
  solution: |
    def format_order_event(event_dict):
        order_id = event_dict["order_id"]
        amount = float(event_dict.get("total_amount", 0.0))
        status = str(event_dict.get("status", "pending")).lower()
        return {
            "id": order_id,
            "amount": amount,
            "status": status
        }
  test_code: |
    ev1 = {"order_id": 501, "total_amount": 99.5, "status": "COMPLETED"}
    res1 = format_order_event(ev1)
    assert res1 == {"id": 501, "amount": 99.5, "status": "completed"}

    ev2 = {"order_id": 502}
    res2 = format_order_event(ev2)
    assert res2 == {"id": 502, "amount": 0.0, "status": "pending"}

flashcards:
  - front:
      en: "What is the average time complexity of looking up a key in a Python dictionary?"
      az: "Python lüğətində açarı axtarmağın orta vaxt mürəkkəbliyi nə qədərdir?"
    back:
      en: "O(1) constant time, thanks to the underlying hash table implementation."
      az: "O(1) sabit vaxt, çünki arxa planda hash cədvəli strukturundan istifadə olunur."
  - front:
      en: "What is the difference between `dict[key]` and `dict.get(key, default)`?"
      az: "`dict[key]` ilə `dict.get(key, default)` arasındakı fərq nədir?"
    back:
      en: "`dict[key]` throws a KeyError if the key is missing. `dict.get()` safely returns the fallback default value without crashing."
      az: "`dict[key]` açar olmadıqda KeyError xətası atır. `dict.get()` isə proqramı çökdürmədən ehtiyat defolt dəyəri qaytarır."
  - front:
      en: "Can a Python list be used as a dictionary key? Why or why not?"
      az: "Python siyahısı lüğətdə açar kimi istifadə edilə bilərmi? Niyə?"
    back:
      en: "No. Dictionary keys must be hashable and immutable (e.g. strings, numbers, tuples). Lists are mutable and unhashable."
      az: "Xeyr. Lüğət açarları mütləq hash oluna bilən və dəyişməz (str, int, tuple) olmalıdır. Siyahılar dəyişəndir və hash dəyəri yoxdur."
  - front:
      en: "How do you iterate through both keys and values of a dictionary simultaneously?"
      az: "Lüğətin həm açarlarını, həm də dəyərlərini eyni vaxtda necə dövrəyə almaq olar?"
    back:
      en: "Using the `.items()` method: `for key, value in my_dict.items():`."
      az: "`.items()` metodundan istifadə etməklə: `for açar, dəyər in luget.items():`."
  - front:
      en: "How do you merge two dictionaries d1 and d2 in Python 3.9+?"
      az: "Python 3.9+ versiyasında d1 və d2 lüğətlərini ən qısa yolla necə birləşdirmək olar?"
    back:
      en: "Using the merge operator `|`: `merged = d1 | d2`."
      az: "Birləşdirmə operatoru `|` ilə: `birlesmis = d1 | d2`."
